2"}, {"id": "MKT-011", "field": "phase", "old": "Launch", "new": "Phase 2", "reason": "Automation or dashboard enhancement; defer to Phase 2"}, {"id": "NFR-012", "field": "priority", "old": "Must", "new": "Should", "reason": "Quality or procurement goal; not a go-live blocker"}, {"id": "NFR-015", "field": "priority", "old": "Must", "new": "Should", "reason": "Quality or procurement goal; not a go-live blocker"}, {"id": "NFR-016", "field": "priority", "old": "Must", "new": "Should", "reason": "Quality or procurement goal; not a go-live blocker"}, {"id": "NFR-018", "field": "priority", "old": "Must", "new": "Should", "reason": "Quality or procurement goal; not a go-live blocker"}, {"id": "NFR-019", "field": "priority", "old": "Must", "new": "Should", "reason": "Quality or procurement goal; not a go-live blocker"}, {"id": "NFR-030", "field": "priority", "old": "Must", "new": "Should", "reason": "Quality or procurement goal; not a go-live blocker"}, {"id": "PAY-004", "field": "phase", "old": "Launch", "new": "Phase 2", "reason": "Not needed for US launch; defer to Phase 2"}, {"id": "PAY-018", "field": "phase", "old": "Launch", "new": "Phase 2", "reason": "Not needed for US launch; defer to Phase 2"}, {"id": "RPT-010", "field": "phase", "old": "Launch", "new": "Phase 2", "reason": "Automation or dashboard enhancement; defer to Phase 2"}, {"id": "SUB-004", "field": "priority", "old": "Must", "new": "Should", "reason": "Short activation delay tolerable; staff can fix"}, {"id": "SUB-010", "field": "phase", "old": "Launch", "new": "Phase 2", "reason": "Workaround exists; defer to Phase 2"}, {"id": "SUB-013", "field": "phase", "old": "Launch", "new": "Phase 2", "reason": "Workaround exists; defer to Phase 2"}, {"id": "SUB-021", "field": "phase", "old": "Launch", "new": "Phase 2", "reason": "Workaround exists; defer to Phase 2"}], "brd_rows": [["BR-001", "The programme shall deliver one coherent publishing operating model and technology ecosystem spanning author submission, CMS/editorial operations, public web, PWA, iOS, Android, print production, subscription, service, analytics, search, archive, audio, translation, AI, and multilingual capabilities. Creates a common commercial and operating outcome against which bidder scope and delivered value can be assessed. Executive sponsor; Publisher P1 / Must MVP", "INT-013"], ["BR-002", "Approved structured article content, metadata, and managed media assets shall form one authoritative source for digital and print reuse; Word, PDF, EPUB, and InDesign outputs shall not silently replace that source, and governed print-specific exceptions shall remain traceable. Creates a common commercial and operating outcome against which bidder scope and delivered value can be assessed. Publisher; Managing Editor P1 / Must MVP", "EDW-008, EDW-026"], ["BR-003", "Bidders shall price the common scope, map every requirement, state assumptions, identify optional items, disclose exclusions, and separate one-time from recurring costs. Creates a common commercial and operating outcome against which bidder scope and delivered value can be assessed. Procurement; Finance P1 / Must Procurement", "NFR-018"], ["BR-004", "The platform shall launch for the US, India, Philippines, Italy, Spain, and Malaysia without embedding country, language, currency, tax, privacy, or fulfilment rules in application code. Creates a common commercial and operating outcome against which bidder scope and delivered value can be assessed. Executive sponsor; Finance P1 / Must MVP", "LOC-009, CAT-003, PAY-011, PAY-018, PAY-019, DAM-006, FUL-006, NFR-029"], ["BR-005", "English shall be the launch language; the data model, UI, workflows, and APIs shall support later languages without re-platforming. Creates a common commercial and operating outcome against which bidder scope and delivered value can be assessed. Publisher; Language Editor P1 / Must MVP", "LOC-001, LOC-005, LOC-012"], ["BR-006", "AI may assist translation, search, recommendations, metadata, and reader questions, but publication and theological decisions shall remain attributable to authorized humans. Creates a common commercial and operating outcome against which bidder scope and delivered value can be assessed. Publisher; Theological Reviewer P1 / Must MVP", "AIX-001, AIX-005"], ["BR-007", "Core reader and staff journeys shall conform to WCAG 2.2 AA and include usability validation with older adults and assistive-technology users. Creates a common commercial and operating outcome against which bidder scope and delivered value can be assessed. Product Owner; Accessibility Lead P1 / Must MVP", "DON-019, DAM-004, RPT-012, NFR-021, NFR-022"], ["BR-008", "A unified entitlement ledger shall reconcile web, app-store, complimentary, institutional, gift, print, and bundle access. Creates a common commercial and operating outcome against which bidder scope and delivered value can be assessed. Subscription Admin; Finance P1 / Must MVP", "CDL-012, CDL-014, CDL-017, CAT-007, SUB-001, SUB-002, SUB-003, SUB-016, SUB-017, SUB-022, PAY-020, BKO-005, RPT-002, RPT-004, RPT-009, MIG-002, MIG-005, INT-005"], ["BR-009", "The transformation shall not disrupt issue planning, proofing, publisher approval, print-ready PDF production, or mailing cutoff operations. Creates a common commercial and operating outcome against which bidder scope and delivered value can be assessed. Publisher; Print Production P1 / Must MVP", "EDW-026, FUL-001, FUL-002, FUL-003, FUL-014, RPT-008, MIG-003, MIG-013"], ["BR-010", "Liguorian shall own and be able to export content, customer, subscription, analytics, configuration, and audit data in documented formats without vendor lock-in. Creates a common commercial and operating outcome against which bidder scope and delivered value can be assessed. System Administrator; Procurement P1 / Must MVP", "MIG-001, MIG-014, NFR-017, INT-001, INT-006, INT-011, INT-012"], ["BR-011", "Service levels, editorial turnaround, issue readiness, subscription health, reader engagement, and technology reliability shall be measurable from launch. Creates a common commercial and operating outcome against which bidder scope and delivered value can be assessed. Publisher; Analyst P1 / Must MVP", "FUL-012, FIN-015, RPT-001, RPT-002, RPT-003, RPT-005, RPT-007, RPT-008, RPT-010, INT-008"], ["BR-012", "MVP shall prioritize publishing, reading, subscription, print fulfilment, security, accessibility, and operational readiness; optional growth capabilities shall be independently deployable later. Creates a common commercial and operating outcome against which bidder scope and delivered value can be assessed. Executive sponsor; Product Owner P1 / Must Procurement", "FUL-009"], ["FR-001", "The public website and PWA shall provide accessible home, latest issue, topics, authors, archive, search, subscribe, sign-in, and support routes with configurable navigation. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Visitor; Content Admin P1 / Must MVP", "CDL-001"], ["FR-002", "The article reader shall render structured paragraphs, headings, lists, pull quotes, Scripture references, footnotes/endnotes, tables, sidebars, images, captions, audio, video, related content, paywall states, and rights notices across supported breakpoints. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Reader; Editor P1 / Must MVP", "CDL-002"], ["FR-003", "Readers shall control font size, line spacing, theme, and reading width; preferences shall persist locally and, when signed in, across devices. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Reader P1 / Must MVP", "IDN-015, CDL-003"], ["FR-004", "Registered users shall save articles and issues, organize saved items, remove them, and synchronize state across web and mobile. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Registered User P1 / Must MVP", "DSH-006, CDL-004"], ["FR-005", "Signed-in users shall view, clear, and disable reading history and resume an article at the last meaningful position. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Registered User P1 / Must MVP", "DSH-006, CDL-005"], ["FR-006", "Mobile apps and PWA shall allow entitled content to be saved for offline reading with clear storage, expiry, refresh, and removal behavior. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Digital Subscriber P1 / Must MVP", "CDL-006, NFR-030"], ["FR-007", "Entitled users shall download complete issues for offline use, see progress and size, retry failures, and remove downloads without losing bookmarks. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Digital Subscriber P1 / Must MVP", "CDL-007"], ["FR-008", "The reader shall offer accessible text-to-speech controls for eligible content, including play, pause, speed, sentence navigation, background continuation, and rights-based availability. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Reader P2 / Should Phase 2", "CDL-008"], ["FR-009", "The platform shall publish audio episodes and narrated articles with transcripts, chapters, playback position, speed control, and accessible controls. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Reader; Audio Producer P2 / Should Phase 2", "CDL-009"], ["FR-010", "Articles shall expose canonical, locale-aware share links with configurable excerpts, campaign attribution, and paywall-safe previews. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Reader; Marketing P1 / Must MVP", "CDL-010, CDL-015, SUB-003"], ["FR-011", "Users shall manage topic, author, issue, subscription, service, and editorial notifications by channel and locale with quiet-hour and consent controls. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Reader; Editorial User P1 / Must MVP", "DSH-007, CDL-011, SUB-007, MKT-004"], ["FR-012", "Users shall manage identity, name, email, locale, accessibility preferences, communication consent, password or passkey, linked accounts, and deletion requests. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Registered User P1 / Must MVP", "IDN-001, IDN-002, IDN-003, IDN-004, IDN-007, IDN-011, IDN-012, IDN-013, IDN-015, DSH-001, DSH-007, DSH-015, LOC-011, MKT-003"], ["FR-013", "A support centre shall provide searchable help, contact options, case submission, case status, subscription context, and service-agent notes with role restrictions. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Customer Service; Reader P1 / Must MVP", "DSH-014, FUL-010, BKO-001, BKO-008, BKO-009"], ["FR-014", "Authorized users shall capture ideas with owner, source, audience, theme, proposed issue, sensitivity, rights, and decision status. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Editor; Contributor P1 / Must MVP", "EDW-001"], ["FR-015", "Editors shall create assignments for internal or external contributors with brief, word count, content type, rights terms, issue, milestones, deadline, and required reviews. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Editor; Contributor P1 / Must MVP", "EDW-002"], ["FR-016", "Contributors shall submit unsolicited or future-issue proposals and manuscripts, accept terms, upload supporting files, and receive status updates without seeing internal notes. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Contributor; Editor P1 / Must MVP", "EDW-003, EDW-004"], ["FR-017", "Editors shall configure recurring columns, default authors, cadence, issue placeholders, template metadata, and substitute authors. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Columnist; Managing Editor P1 / Must MVP", "EDW-005"], ["FR-018", "The platform shall show issue, article, campaign, deadline, review, proof, and publication events in calendar and list views with filters and export. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Managing Editor; Marketing P1 / Must MVP", "EDW-006"], ["FR-019", "Administrators shall configure workflow states, allowed transitions, mandatory fields, role permissions, SLAs, reminders, escalations, delegation, and substitutes without code deployment. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Managing Editor; System Admin P1 / Must MVP", "EDW-007, EDW-025"], ["FR-020", "Editorial users shall create and edit structured content through an accessible visual block editor, use tracked revisions or equivalent change history, comment and annotate at text or asset level, and preserve authorship attribution without working directly in JSON, XML, HTML, or another technical source format. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Editor; Copy Editor; Author P1 / Must MVP", "EDW-008, EDW-009"], ["FR-021", "Users shall compare any two manuscript versions and identify additions, deletions, metadata changes, and reviewer decisions. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Editor; Author P1 / Must MVP", "EDW-010"], ["FR-022", "Copy, theological, language, legal or rights, and publisher reviews shall be separately assignable, record their outcomes, and block publication when configured as mandatory. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Theological Reviewer; Publisher P1 / Must MVP", "EDW-011"], ["FR-023", "Reviewers shall return content to a named owner with reasons, required changes, due date, and preserved review history; resubmission shall create a new immutable version. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Reviewer; Author P1 / Must MVP", "EDW-012"], ["FR-024", "Managing Editors shall assign approved content to issue sections, order stories, monitor completeness, and identify missing assets, approvals, rights, translation, or print elements. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Managing Editor P1 / Must MVP", "EDW-013"], ["FR-025", "Each article and issue shall display a computed readiness status based on configurable mandatory checks and permit only authorized override with reason. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Publisher; Managing Editor P1 / Must MVP", "EDW-014"], ["FR-026", "Authorized publishers shall schedule, preview, publish, unpublish, embargo, correct, and republish content by channel, country, language, and time zone. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Publisher; Content Admin P1 / Must MVP", "EDW-015"], ["FR-027", "Post-publication corrections shall retain prior versions, record reason and approver, optionally display a correction notice, and propagate to search and cached channels. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Publisher; Editor P1 / Must MVP", "EDW-016"], ["FR-028", "Users shall upload, version, search, license, crop, set focal points, generate and approve renditions, caption, credit, restrict, expire, archive, and reuse images, documents, audio, and video with duplicate detection while preserving the highest-quality approved original. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Content Admin; Editor P1 / Must MVP", "DAM-001, DAM-002, DAM-003, DAM-004, DAM-005"], ["FR-029", "The platform shall store territory, language, channel, date, contributor, reuse, and accessibility rights and prevent disallowed publication or download. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Publisher; Rights Admin P1 / Must MVP", "DAM-006, DAM-007, DAM-008"], ["FR-030", "Public author pages shall show approved biography, image, role, disclosure, social links, and content; contributor records shall separate private payment and tax data. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Author; Reader P1 / Must MVP", "DAM-009, DAM-010"], ["FR-031", "Authorized users shall manage topics, themes, series, content types, audiences, liturgical seasons, Scripture references, countries, and controlled synonyms with merge and redirect support. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Content Admin; Editor P1 / Must MVP", "DAM-011, DAM-012"], ["FR-032", "Readers shall browse archive by issue, date, author, topic, series, content type, and Scripture reference with clear digitization and rights status. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Reader; Archivist P1 / Must MVP", "CDL-020, CAT-008, MIG-010"], ["FR-033", "Search shall cover entitled full text and metadata; provide typeahead, spelling tolerance, filters, sort, result highlighting, zero-result guidance, and access-safe snippets. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Reader P1 / Must MVP", "CDL-021"], ["FR-034", "Phase 2 search shall combine lexical and vector retrieval, disclose semantic behavior, support exact-match mode, and prevent retrieval of unauthorized content. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Reader; Analyst P2 / Should Phase 2", "CDL-022, AIX-002, AIX-007"], ["FR-035", "Users shall search normalized book, chapter, and verse references and retrieve exact, overlapping, and related references using an approved canon and translation mapping. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Reader; Theological Reviewer P2 / Should Phase 2", "CDL-023"], ["FR-036", "Editors may curate related items and the platform may algorithmically recommend alternatives; editorial pins shall take precedence and reasons shall be observable. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Reader; Editor P1 / Must MVP", "CDL-024"], ["FR-037", "An entitled user shall ask questions over approved Liguorian content and receive grounded answers with linked citations, scope limits, uncertainty language, safety controls, feedback, and no claim of pastoral or professional authority. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Reader; Publisher P2 / Should Phase 2", "AIX-003, AIX-004, AIX-006, AIX-007"], ["FR-038", "Translators shall generate a machine-assisted draft from an approved source version, edit it, compare it to source, flag untranslatable terms, and submit it for human language and theological approval. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Translator; Language Editor P2 / Should Phase 2", "LOC-006"], ["FR-039", "When the source changes after translation, the platform shall identify affected translations, show the diff, suspend auto-publication, and require re-approval. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Language Editor; Publisher P2 / Should Phase 2", "LOC-007"], ["FR-040", "UI strings, transactional email, push copy, consent notices, and support content shall be versioned by locale with fallback and approval. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Language Editor; Marketing P2 / Should Phase 2", "LOC-008, CAT-011, BKO-009"], ["FR-041", "Authorized institutional administrators shall allocate seats or access ranges, invite members, remove access, view aggregate usage, and never view individual reading history unless lawfully and explicitly agreed. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Institutional Admin; Privacy Lead P2 / Should Phase 2", "IDN-010, CAT-013, BLK-001, BLK-004, BLK-009"], ["FR-042", "Purchasers shall buy a gift, select recipient and start date, add a message, receive confirmation, and allow recipient activation without exposing purchaser payment details. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Gift Purchaser; Recipient P1 / Must MVP", "DSH-005, GFT-001, GFT-004, GFT-005, GFT-006, GFT-007, FUL-011, RPT-006, MIG-006"], ["FR-043", "Marketing shall assemble approved campaign pages from governed components, apply offer eligibility and consent rules, preview by locale/device, and schedule publication. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Marketing; Content Admin P1 / Must MVP", "CAT-004, MKT-001"], ["FR-044", "A/B or multivariate tests shall require hypothesis, owner, audience, duration, privacy review, guardrails, exclusion from critical consent flows, and documented result. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Marketing; Analyst P3 / Could Phase 2", "MKT-012"], ["FR-045", "Authorized agents shall correct profile, address, subscription, fulfilment, and entitlement issues with reason codes, previewed effects, audit trail, and approval thresholds for financial impact. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Customer Service; Subscription Admin P1 / Must MVP", "IDN-009, SUB-011, SUB-014, SUB-015, SUB-024, PAY-014, BKO-001, BKO-002, BKO-003, BKO-004"], ["FR-046", "Authorized administrators shall import, validate, preview, approve, execute, reconcile, and reverse supported bulk content or subscription actions without silent partial success. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Content Admin; Subscription Admin P1 / Must MVP", "BLK-011, BKO-010"], ["FR-047", "Authorized users shall export filtered operational datasets in documented CSV/JSON formats and media packages with data dictionary, lineage, and access controls. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. System Admin; Analyst P1 / Must MVP", "FIN-006, BKO-011, RPT-011"], ["FR-048", "Authorized users shall search actor, record, action, date, system, before/after value, correlation ID, and reason across editorial, subscription, customer-service, and admin activity. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Auditor; System Admin P1 / Must MVP", "CAT-012, SUB-018, SUB-021, BKO-012, BKO-013"], ["FR-049", "Plans, paywalls, trials, workflow rules, notification templates, countries, locales, currencies, fulfilment cutoffs, and feature flags shall be controlled through validated configuration with approval and rollback. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. System Admin; Product Owner P1 / Must MVP", "CAT-001, CAT-002, CAT-003, CAT-004, CAT-005, CAT-006, CAT-012, DON-002, FUL-002, BKO-014, BKO-015"], ["FR-050", "Super Administrators shall manage tenants or brands if introduced, roles, integrations, secrets references, scheduled jobs, feature status, and support diagnostics without database access. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Super Administrator P1 / Must MVP", "IDN-008, BKO-006, BKO-015, BKO-016"], ["FR-051", "If commissioned payments are enabled, the platform shall record contract, approved amount, payee, milestone, tax-document status, approval, and export to finance without storing bank credentials in CMS. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Finance; Managing Editor P3 / Could Phase 2", "BKO-017"], ["FR-052", "If enabled, readers shall submit letters under moderation terms; editors shall review, redact private data, obtain publication consent, and publish selected letters with provenance. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Reader; Editor P3 / Could Phase 2", "EDW-024"], ["FR-053", "Authorized users shall create durable campaign and article QR destinations, change destinations without reprinting codes, and report scans without embedding personal data. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Print Production; Marketing P2 / Should Phase 2", "MKT-013"], ["FR-054", "Editors shall compose channel-specific social posts from approved content, schedule through approved integrations, capture final URLs, and avoid automatic publication of AI-generated copy without review. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Marketing; Editor P3 / Could Phase 2", "MKT-014"], ["FR-055", "The MVP shall not implement public comments, direct messaging, or reader-to-reader profiles; architecture shall not depend on these capabilities. Avoids moderation, safeguarding, misinformation, and harassment exposure before a staffed operating model exists. Publisher; Safeguarding Lead P3 / Won't MVP", "EDW-023"], ["FR-056", "Editors shall create and revise articles in an accessible visual interface that exposes the approved semantic block model, validation, version status, and publication readiness without requiring JSON, XML, HTML, CSS, or template-code editing. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Editor; Copy Editor; Managing Editor P1 / Must MVP", "EDW-008"], ["FR-057", "Editors shall import a Microsoft Word manuscript or paste Word content while preserving supported headings, emphasis, lists, footnotes/endnotes, and basic tables, stripping unsupported Word layout and styling, and presenting a reviewable conversion report before save. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Editor; Contributor P1 / Must MVP", "EDW-017"], ["FR-058", "Authorized users shall assign governed presentation types including Feature Article, Reflection, Interview, Editorial, Regular Column, and News/Commentary; each type shall apply approved responsive typography, spacing, image treatment, pull quotes, headings, sidebars, and related-content components without manual page layout. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Publisher; Design Lead; Editor P1 / Must MVP", "EDW-019"], ["FR-059", "Editors shall preview draft and scheduled articles in representative mobile, tablet, and web states, including locale, entitlement, theme, media, and accessibility settings, before publication. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Editor; Publisher; QA P1 / Must MVP", "EDW-020"], ["FR-060", "The article record shall provide permission-controlled digital-publication notes and print-production notes that are versioned, searchable, auditable, and excluded from public output unless explicitly mapped. Enables the stated user journey without manual shadow processes or channel-specific inconsistency. Editor; Print Production P1 / Must MVP", "EDW-021"], ["NFR-001", "Reader and subscription services shall achieve at least 99.9% monthly availability excluding approved maintenance; editorial/admin target shall be at least 99.5%. Makes service quality measurable and prevents functional completion from masking an unusable or unoperable platform. Operations; Product Owner P1 / Must MVP", "NFR-001, NFR-002"], ["NFR-002", "At the 75th percentile on agreed production traffic, public pages shall meet Core Web Vitals targets: LCP <=2.5 s, INP <=200 ms, and CLS <=0.1. Makes service quality measurable and prevents functional completion from masking an unusable or unoperable platform. Reader; Marketing P1 / Must MVP", "DON-019, NFR-003"], ["NFR-003", "Read APIs for content, entitlement, and search shall respond at p95 <=500 ms excluding third-party latency; search end-to-end shall be p95 <=2 s under agreed load. Makes service quality measurable and prevents functional completion from masking an unusable or unoperable platform. Reader; Operations P1 / Must MVP", "SUB-004, NFR-004, NFR-005"], ["NFR-004", "Supported mobile releases shall maintain >=99.5% crash-free sessions and collect privacy-safe crash diagnostics with release, device, OS, and trace context. Makes service quality measurable and prevents functional completion from masking an unusable or unoperable platform. Mobile Product Owner P1 / Must MVP", "NFR-031"], ["NFR-005", "The solution shall meet agreed peak load at 2x launch forecast and scale to 5x without redesign; bidder shall state tested concurrency, throughput, and bottlenecks. Makes service quality measurable and prevents functional completion from masking an unusable or unoperable platform. Solution Architect P1 / Must MVP", "NFR-006"], ["NFR-006", "Failure of recommendations, AI, analytics, email, push, or noncritical integrations shall not block entitled reading, editorial access, or checkout completion where safe. Makes service quality measurable and prevents functional completion from masking an unusable or unoperable platform. Operations; Product Owner P1 / Must MVP", "SUB-019, PAY-008, PAY-017, FUL-013, BKO-018, NFR-007, INT-003"], ["NFR-007", "Production transactional services shall support RPO <=15 minutes and RTO <=4 hours; content/DAM shall support RPO <=1 hour and RTO <=8 hours unless improved in the bid. Makes service quality measurable and prevents functional completion from masking an unusable or unoperable platform. Executive Sponsor; Operations P1 / Must MVP", "NFR-008, NFR-009"], ["NFR-008", "Encrypted backups shall follow 3-2-1 principles where practical, include immutable or isolated copies, and be restored in a documented test at least twice yearly. Makes service quality measurable and prevents functional completion from masking an unusable or unoperable platform. Operations; Security P1 / Must MVP", "NFR-010"], ["NFR-009", "Public web and staff portals shall support the current and previous two major versions of Chrome, Edge, Firefox, and Safari, with a documented exception process. Makes service quality measurable and prevents functional completion from masking an unusable or unoperable platform. Product Owner P1 / Must MVP", "NFR-011"], ["NFR-010", "At launch the apps shall support OS versions covering at least 95% of active target users, with a stated minimum, annual review, and accessible upgrade message. Makes service quality measurable and prevents functional completion from masking an unusable or unoperable platform. Mobile Product Owner P1 / Must MVP", "NFR-031"], ["NFR-011", "The codebase shall enforce modular boundaries, automated quality gates, dependency inventory, documented APIs, reproducible builds, and no unsupported runtime at go-live. Makes service quality measurable and prevents functional completion from masking an unusable or unoperable platform. Engineering Lead P1 / Must MVP", "PAY-003, NFR-012, NFR-026, INT-002, INT-007, INT-009"], ["NFR-012", "Services shall emit correlated logs, metrics, traces, business events, and synthetic journey checks with actionable alerts, runbooks, and data redaction. Makes service quality measurable and prevents functional completion from masking an unusable or unoperable platform. Operations; Security P1 / Must MVP", "RPT-010, NFR-013"], ["NFR-013", "No user-facing string shall be hard-coded in channel code; layouts shall tolerate at least 30% text expansion and Unicode without truncation. Makes service quality measurable and prevents functional completion from masking an unusable or unoperable platform. Language Editor; QA P1 / Must MVP", "LOC-003, LOC-004, NFR-015"], ["NFR-014", "Public content shall provide canonical URLs, metadata, structured data, XML sitemaps, robots control, redirects, social cards, and crawl-safe paywall behavior. Makes service quality measurable and prevents functional completion from masking an unusable or unoperable platform. Marketing; Content Admin P1 / Must MVP", "LOC-002, NFR-016"], ["NFR-015", "A complete export of content, assets, users, subscriptions, entitlements, audit, and configuration shall be producible in documented non-proprietary formats within 10 business days. Makes service quality measurable and prevents functional completion from masking an unusable or unoperable platform. Procurement; System Admin P1 / Must MVP", "IDN-014, BKO-011, NFR-017, INT-006"], ["NFR-016", "Bidders shall provide five-year total cost assumptions by environment, user, traffic, storage, search, AI usage, payment, tax, messaging, support, and exit activity. Makes service quality measurable and prevents functional completion from masking an unusable or unoperable platform. Finance; Procurement P1 / Must Procurement", "NFR-018"], ["NFR-017", "The structured authoring, import-review, media-selection, preview, and approval journeys shall be usable by representative Liguorian editorial staff without technical-format knowledge or recurring developer assistance. Makes service quality measurable and prevents functional completion from masking an unusable or unoperable platform. Managing Editor; Product Owner P1 / Must MVP", "EDW-022, NFR-019"], ["NFR-018", "Word ingestion and structured-content conversion shall be deterministic, observable, and loss-aware; unsupported content shall be surfaced for human disposition rather than silently discarded or flattened. Makes service quality measurable and prevents functional completion from masking an unusable or unoperable platform. Editor; QA; Data Steward P1 / Must MVP", "EDW-018, NFR-020"]], "actor_rows": [["System administrator", "Person who configures and operates the platform", 123], ["Subscriber", "Person who buys, renews, reads, downloads and shares", 101], ["Finance", "Staff who reconcile, report tax and issue receipts", 66], ["Donor", "Person who gives once, monthly or in honour of someone", 46], ["Editor", "Staff who author, edit and prepare content", 43], ["Customer service agent", "Liguori staff resolving customer issues", 38], ["Marketing", "Staff who build campaigns and communications", 37], ["Managing editor", "Staff who plan issues and own readiness", 21], ["Institutional administrator", "Parish, school or organisation administrator", 18], ["Gift buyer", "Person who pays for a subscription for someone else", 15], ["Publisher", "Approver of publication", 12], ["Development staff", "Development and mission staff who steward donors", 11], ["Gift recipient", "Person who redeems a gift subscription", 8], ["Contributor", "External or internal author submitting work", 7], ["Content administrator", "Staff who manage taxonomy, pages and configuration", 7], ["Mail house", "Supplier that prints and mails issues", 5], ["Theological reviewer", "Reviewer for doctrinal accuracy", 4], ["Copy editor", "Reviewer for language and style", 3], ["Reviewer", "Any assigned reviewer in the workflow", 3], ["Rights administrator", "Staff who record and enforce content rights", 3], ["Honouree", "Person in whose honour a tribute gift is made", 2], ["Print production", "Staff who prepare print-ready files", 2]], "issues": [["ISS-01", "Platform stability and security", "Critical", "Online payments completely disabled on subscriptions.liguori.org. CyberSource suspended after a JavaScript skimmer was injected into the payment page. All new subscriptions now require customers to phone in; no self-serve checkout.", "Wendy Barnes; Classic Informatics", "ACT-01", "Rebuild or patch the subscriptions site to remove infected JS and re-enable CyberSource securely.", "Phase E", "PAY, NFR, HST", "This is a card-skimmer injection, which under PCI DSS is a security incident, not a defect. Before any re-enable: establish the window of exposure, whether card data was captured, and whether the acquirer and CyberSource require a forensic investigator. Re-enabling payments on a .NET application whose source code nobody holds is the wrong move; put a provider-hosted checkout in front of it instead so no card field is ever served by the compromised application."], ["ISS-02", "Platform stability and security", "Critical", "No source code exists for subscriptions.liguori.org. Site was built in .NET around 2014 to 2015. Classic Informatics reports they cannot patch or extend it without a full rebuild. Any fix requires reverse engineering or a complete rewrite.", "Classic Informatics; Sreejith", "ACT-02", "Sreejith to attempt reverse engineering the .NET site using AI tools. Wendy to share server credentials and access details.", "Phase E", "HST, MIG, NFR", "Reverse engineering is worth doing to recover business rules and data structures, not to keep the application alive. Set the goal as a written specification of what the site currently does, so the rebuild does not lose a rule nobody remembers. Time-box it to two weeks. Do not let it become a route to patching a compromised application."], ["ISS-03", "Platform stability and security", "Critical", "McAfee and browser security tools actively flagging subscriptions.liguori.org as risky or malicious. Visible to customers before they reach the login page, causing abandonment. Site at risk of full blacklisting and takedown.", "Classic Informatics; Wendy Barnes", "ACT-03", "Immediate remediation of malicious JS on the site to clear security flags, before blacklisting escalates further.", "Phase E", "NFR, HST", "Removing the script is only half of it. Submit a review request to each blocklist (Google Safe Browsing, McAfee, Microsoft) once clean, or the warning persists for weeks after the fix. Until it clears, every marketing link to that domain loses traffic."], ["ISS-04", "Platform stability and security", "Critical", "Legacy Magento v1.8/1.9 database still used as the authentication store for subscriptions.liguori.org logins. Adobe has restricted access to this version. Cannot be decommissioned until the subscription portal is rebuilt or migrated.", "Wendy Barnes; Classic Informatics", "ACT-04", "Migration away from legacy Magento DB must be scoped into the rebuild plan. Wendy to pull current Magento DB extract and share with Sreejith and Classic Informatics.", "Phase 1a", "IDN, MIG, HST", "Magento 1 reached end of life in June 2020 and takes no security patches. An unpatched end-of-life database holding password hashes, on a host that has already been compromised, should be treated as exposed. Force a password reset for every account at identity cutover; do not migrate the old hashes and hope."], ["ISS-05", "Platform stability and security", "High", "PHP issue surfaced two to three days before the 23 October meeting. Caused cascading instability across hosted properties. Not yet fully resolved. Root cause under investigation by Classic Informatics.", "Classic Informatics", "ACT-05", "PHP resolution on Tuesday Classic Informatics meeting agenda. Confirm resolution steps and timeline.", "Phase E", "HST, NFR", "Cascading across properties means the hosting is shared, so one site can take down the others. That is an architecture fault, not a PHP fault, and the rebuild's separate accounts per environment (HST-002, HST-014) is the actual fix. In the meantime get the root cause in writing; an unresolved fault on a host that was already compromised may not be a coincidence."], ["ISS-06", "Customer experience and self-service", "High", "No single sign-on across four or more customer portals. Customers must maintain separate credentials for subscriptions.liguori.org (legacy Magento auth), liguori.org (Magento 2.x), subscribe.liguorian.org (THINK account) and Managing Scrupulosity (standalone). Each portal is a separate identity silo.", "Sreejith; Charles Kumar", "ACT-06", "Sreejith to design a unified ecosystem architecture covering all portals, product types and customer segments. Deliver draft framework Monday before Tuesday's call.", "Phase 1a", "IDN, CDL, DSH", "Identity is the first thing to build, not a feature added later. Every other consolidation (entitlement, dashboard, dedupe) depends on one account per person. Four silos also means four password-reset paths and four places a breach can start."], ["ISS-07", "Customer experience and self-service", "High", "Parishes (B2B) have no self-service portal. All bulk subscription orders, renewals and account changes require staff involvement via phone or email. Acumen manages parish accounts internally with no customer-facing interface.", "Charles Kumar; Chuck Healy", "ACT-07", "B2B web portal for parishes to be scoped into Phase 2 of the rebuild. Charles to define B2B requirements: what parishes need to self-manage.", "Phase 2", "BLK, IDN, DSH", "Agreed as Phase 2, with one exception. Parish accounts must be able to authenticate and read entitled content from Phase 1, even without self-service ordering, or the paywall will lock out the bulk customers on day one."], ["ISS-08", "Customer experience and self-service", "High", "Digital content delivered via Uberflip has no access controls. Subscription links are freely shareable; any subscriber can forward access to non-subscribers. No entitlement check at point of content consumption.", "Wendy Barnes; Chuck Healy", "ACT-08", "Migration to Issuu confirmed as strategic direction. Scope into rebuild plan with a concrete timeline. Issuu must enforce per-user auth before migration.", "Phase 1b", "CDL, DAM, IDN", "Confirm in writing that Issuu can enforce per-user entitlement against your identity provider before the migration is committed. If it cannot, you have swapped one open door for another, and the reader (TS-14) plus the entitlement service becomes the answer instead. Make that a contractual condition, not an assumption."], ["ISS-09", "Customer experience and self-service", "High", "Liguorian Digital Edition access policy conflict. Father Tom has been distributing the digital edition for free. Some subscribers continue paying for access others receive at no cost. No internal alignment on whether the digital edition should be paywalled, freemium or free.", "Charles Kumar; Wendy Barnes; Chuck Healy", "ACT-09", "Internal leadership meeting required to align on Liguorian digital access policy BEFORE any rebuild work starts on digital delivery. Charles to schedule.", "Phase E", "CDL, SUB, CAT", "This is the most expensive open item on the register and it costs nothing to fix. The entitlement service is the hinge of the whole platform; it cannot be specified until someone decides what a paying subscriber actually gets that a non-payer does not. Until then, Phase 1b content work is blocked and paying subscribers have a fair complaint. Treat the leadership decision as a gate, not an action."], ["ISS-10", "Data integrity and integration", "High", "Duplicate customer records across Acumen, Magento and THINK with no cross-system deduplication. All data flows are one-way only. An email address change in one system does not propagate to others; staff must manually update each system separately.", "Chuck Healy; Wendy Barnes", "ACT-10", "Assess CRM consolidation feasibility as part of the rebuild scope. Wendy to pull Magento DB extract to understand current account duplication volume.", "Phase 1a", "MIG, IDN, BKO", "Decide which system holds the golden customer record before any integration is built, and name it in the contract. The honest answer is probably none of the three; the new platform becomes the master and the others become subscribers to it. Get the duplication volume first, because it sets the migration effort and nobody can currently answer how many subscribers Liguori actually has."], ["ISS-11", "Data integrity and integration", "Medium", "B2B subscription records in Acumen do not sync to THINK. Parish accounts managed in Acumen for fulfilment but digital sub entitlements are in THINK; no bridge between the two systems for B2B customers.", "Chuck Healy", "ACT-11", "B2B integration path to THINK must be part of the rebuild architecture scope.", "Phase 1b", "BLK, INT, FUL", "This is the same root cause as ISS-10 and should not be solved twice. If the new platform becomes the customer and entitlement master, the Acumen to THINK bridge is not built at all; both become downstream of the new system. Building a bridge between two systems you intend to replace is money spent twice."], ["ISS-12", "Data integrity and integration", "Medium", "Hosting split across two AWS accounts (Wendy's web account versus Vivian's Acumen account) with no unified visibility. Two sites still on Rochen hosting pending migration. Domain registrars split across Network Solutions and GoDaddy.", "Wendy Barnes", "ACT-12", "Infrastructure consolidation to be scoped in rebuild plan. Wendy to complete Rochen migration and audit domain registrar fragmentation.", "Phase E", "HST, NFR, INT", "Accounts and domains held in individual people's names is a continuity risk independent of the rebuild: if one person is unreachable, Liguori cannot reach its own infrastructure. Move both AWS accounts and both registrar portfolios into L istrars under Liguori ownership with named administrators", "Digital access policy decided and minuted", "Subscriber count and duplication volume stated as a number"], "risks": ["Forensic obligations may be wider than expected once the exposure window is known", "The interim checkout needs a merchant account decision, which can take weeks", "The access policy meeting slips and blocks Phase 1b"], "needs": ["Server credentials and access, which Wendy is to supply", "Acquirer and CyberSource contact", "Leadership availability for one decision meeting"]}, {"tag": "Phase 0", "name": "Define", "window": "Months 1 to 4 early, 1 to 6 late, overlapping Phase E", "goal": "Decide what is being built, by whom, and on what contract.", "logic": "Unchanged in purpose, but Phase E now feeds it: the reverse-engineered specification, the real subscriber count and the access policy decision are all inputs the RFP previously lacked. Classic Informatics is scored as a bidder, not assumed as the builder.", "includes": ["Issue the RFP and score bids, with Classic Informatics assessed on the same scale as any other bidder (ISS-13)", "Confirm the stack direction already agreed: no .NET, Next.js and TypeScript, Python or Node services, AWS (ISS-13)", "Name the golden customer record system in the contract (ISS-10)", "Record whether Redemptio and Redacamy will share the identity provider, so Phase 1a does not design for four portals only (ISS-14)", "Confirm in writing that Issuu can enforce per-user entitlement before committing to the migration (ISS-08)"], "excluded": ["Build work", "Design beyond the architecture framework"], "exit": ["Vendor contracted", "Scope and budget agreed at gate G0", "Golden record named", "Issuu entitlement capability confirmed or the reader route chosen"], "risks": ["The incumbent is selected on familiarity rather than capability", "Phase E findings change the scope after bids are in"], "needs": ["Phase E outputs", "Liguori budget approval"]}, {"tag": "Phase 1a", ted, and the old estate is retired.", "logic": "Content access was previously bundled into the launch. The register shows why it deserves its own stage: Uberflip enforces nothing today (ISS-08) and the access policy itself was undecided (ISS-09). Building the paywall before the policy is decided wastes the work, so this stage starts only once Phase E has minuted the decision.", "includes": ["Entitlement check at the point of content consumption, so a forwarded link does not open paid content (ISS-08)", "Uberflip to Issuu migration with per-user authentication, or the PDF.js reader route if Issuu cannot enforce it (ISS-08)", "Apply the agreed digital access policy: paywalled, freemium or free (ISS-09)", "Gifts, donations and tribute giving", "Acumen and THINK receive customer and entitlement data from the new master rather than from each other (ISS-11)", "Final migration, reconciliation and cutover; retire the legacy site, the Magento login store and the interim checkout"], "excluded": ["Parish self-service portal", "Campaign tooling"], "exit": ["Forwarded links and expired entitlements are denied in every tested case", "Legacy site, Magento login store and interim checkout all retired", "Migration reconciled to the row", "Staff trained and runbooks handed over"], "risks": ["Cutover must avoid November to January and Lent", "Issuu may not support per-user entitlement, which changes the content delivery design late"], "needs": ["Access policy decision", "Issuu confirmation", "Trained Liguori staff"]}, {"tag": "Phase 2", "name": "Parishes, publishing and growth", "window": "Months 12 to 16 early, 17 to 24 late", "goal": "Serve the bulk customers directly and give editorial a real workflow.", "logic": "The parish portal (ISS-07) was already agreed for this stage, and it belongs here because it depends on identity and entitlement being settled first. Editorial workflow, translation, campaigns and the archive join it.", "includes": ["Parish and school self-service portal: function match(r){
  if(state.group!=="ALL"&&r.group!==state.group)return false;
  if(state.domain!=="ALL"&&r.domain!==state.domain)return false;
  if(state.pri&&r.priority!==state.pri)return false;
  if(state.phase&&r.phase!==state.phase)return false;
  if(state.type&&r.type!==state.type)return false;
  if(state.oi&&!r.open_items.includes(state.oi))return false;
  if(state.jr&&!r.journeys.includes(state.jr))return false;
  if(state.q){const t=(r.id+" "+r.title+" "+r.statement+" "+r.acceptance.join(" ")+" "+r.rationale+" "+r.phase_reason+" "+r.actors.join(" ")+" "+r.brd_ref.join(" ")).toLowerCase();return state.q.toLowerCase().split(/\s+/).every(w=>t.includes(w))}
  return true;
}

const TIER_L={must:"Paid, must",catch:"Free, with a catch",usage:"Pay per use",quote:"Quote needed",free:"Free",build:"Built by vendor"};
const TIER_O=["must","catch","usage","quote","free","build"];
const TIER_C={must:["var(--must)","var(--must-bg)"],catch:["var(--should)","var(--should-bg)"],free:["var(--could)","var(--could-bg)"],usage:["var(--info)","var(--info-bg)"],quote:["var(--q)","var(--q-bg)"],build:["var(--muted)","var(--soft)"]};

let scCost={};
function scCosts(v){
  const r={},g=(lo,hi,b)=>({lo,hi,conf:"G",basis:b||"My estimate, not a quote"});
  r["TS-02"]={lo:v.dev*20,hi:v.dev*20+100,conf:"C",basis:"$20 per seat, plus up to about $100 of usage over the credit (usage part is a guess)"};
  r["TS-10"]=v.cms==="free"?{lo:0,hi:0,conf:"C",basis:"Free plan, 20 seats maximum"}:{lo:v.ed*15,hi:v.ed*15,conf:"C",basis:"$15 per seat per month"};
  r["TS-11"]={lo:20,hi:60,conf:"L",basis:"From $20 to $30 verified; the upper end is a guess for a larger index"};
  r["TS-15"]={lo:20,hi:25,conf:"C",basis:"Pro, $20 billed annually or $25 monthly, up to 50,000 users"};
  const ex=Math.max(0,v.rev-40000)*.009;
  r["TS-17"]=v.bill==="recurly"?{lo:249+ex,hi:249+ex,conf:"L",basis:"$249 plus 0.9% above $40,000 of monthly billings (earlier research)"}:{lo:v.bill==="pelcro_lo"?450:800,hi:v.bill==="pelcro_lo"?450:800,conf:"G",basis:"Vendor-reported range $450 to $800"};
  r["TS-18"]={lo:90,hi:Math.max(90,v.rev*.005),conf:"L",basis:"From $90 or 0.5% (earlier research)"};
  const pm=v.mail<=10000?15:15+Math.ceil((v.mail-10000)/1000)*1.8;
  r["TS-21"]={lo:pm,hi:pm,conf:"C",basis:"Basic $15 for 10,000 emails, then $1.80 per 1,000"};
  r["TS-32"]={lo:29,hi:120,conf:"L",basis:"Sentry Team $26 to $29 verified; the CloudWatch part is a guess"};
  r["TS-05"]=g(0,300);r["TS-07"]=g(30,200);r["TS-09"]=g(5,50);r["TS-12"]=g(0,250);r["TS-13"]=g(20,320);r["TS-19"]=g(20,100);
  r["TS-20"]=g(0,800);r["TS-22"]=g(300,900);r["TS-23"]=g(100,300);r["TS-24"]=g(40,150);r["TS-25"]=g(10,60);r["TS-26"]=g(20,100);
  r["TS-28"]=g(30,150);r["TS-29"]=g(5,30);r["TS-30"]=g(20,120);r["TS-31"]=g(0,50);r["TS-35"]=g(50,300);r["TS-36"]=g(0,100);
  r["TS-38"]=g(0,500,"Usage-based; depends on the bake-off result");
  return r;
}
function scCalc(){
  const v=scIn;if(v.cms==="free"&&v.ed>20){v.cms="growth";$("#sc_cms").value="growth"}
  const C=scCost=scCosts(v),sum={C:[0,0],L:[0,0],G:[0,0]};
  ST.forEach(c=>{const x=C[c.id];if(!x||+c.phase.slice(-1)>v.scope)return;sum[x.conf][0]+=x.lo;sum[x.conf][1]+=x.hi});
  const lo=sum.C[0]+sum.L[0]+sum.G[0],hi=sum.C[1]+sum.L[1]+sum.G[1],fee=v.rev*.029+(v.rev/v.avg)*.30;
  $("#sc_main").innerHTML=scMoney(lo)+" to "+scMoney(hi)+`<small> a month, excluding card fees</small>`;
  $("#sc_year").textContent=`About ${scMoney(lo*12)} to ${scMoney(hi*12)} a year. Stripe card fees add about ${scMoney(fee)} a month at these billings (2.9% + $0.30, Likely), paid out of revenue.`;
  const mid=k=>(sum[k][0]+sum[k][1])/2,tot=mid("C")+mid("L")+mid("G")||1;
  $("#sc_bar").innerHTML=[["C","var(--could)"],["L","var(--info)"],["G","var(--q)"]].map(([k,c])=>`<i style="width:${mid(k)/tot*100}%;background:${c}"></i>`).join("");

}

const LAYER_G={"Experience":"g1","Application services":"g6","Content":"g3","Customers and money":"g2","Data and hosting":"g5","Security and reliability":"g8","Operations and finance":"g4","Insight":"g4","Later phases":"g7"};
function stackList(){
  const m=ST.filter(s=>(!sstate.layer||s.layer===sstate.layer)&&(!sstate.phase||s.phase===sstate.phase)&&(!sstate.status||s.status===sstate.status)&&(!sstate.tier||s.tier===sstate.tier)&&(!sstate.q||sstate.q.toLowerCase().split(/\s+/).every(w=>(s.name+" "+s.pick+" "+s.role+" "+s.alts.map(a=>a.name).join(" ")+" "+s.covers.join(" ")).toLowerCase().includes(w))));
  $("#scount").textContent=`${m.length} of ${ST.length} components`;
  const layers=[...new Set(ST.map(s=>s.layer))];let h="",n=0;
  layers.forEach(l=>{const lm=m.filter(s=>s.layer===l);if(!lm.length)return;n++;const gc=LAYER_G[l]||"g6";
    h+=`<div class="sub ${gc}" style="margin-top:22px"><b>L${layers.indexOf(l)+1}</b><span style="font-family:var(--serif);font-size:20px">${esc(l)}</span><i>${lm.length}</i></div><div class="grid2">`+lm.map(s=>`
     <div class="card cd ${gc}">
      <div class="hd"><span class="kick" style="color:var(--gc)">${s.id}</span><h3 style="margin:0">${esc(s.name)}</h3></div>
      <div><span class="pill ${statusCls(s.status)}">${esc(s.status)}</span> <span class="pill ph">${s.phase}</span> <span class="pill ph">${esc(s.conf)}</span> <span class="pill" style="${tierSt(s.tier)}">${TIER_L[s.tier]}</span></div>
      <div class="why">${esc(s.role)}</div>
      <div><h4>Recommended</h4><b>${s.url?ext(s.url,s.pick):esc(s.pick)}</b></div>
      <div><h4>Alternatives</h4>${s.alts.length?s.alts.map(a=>ext(a.url,a.name)).join(" · "):"None; built for Liguori"}</div>
      <div><h4>Why</h4><span class="why">${esc(s.why)}</span></div>
      <div><h4>How it is set up</h4><span class="why">${esc(s.config)}</span></div>
      <div class="sc-free"><h4>Free tier</h4><span class="why">${esc(s.free)} <span class="kick">[${s.fconf}]</span></span></div>
      <div><h4>Cost</h4>${(()=>{const x=scCost[s.id];const out=x&&+s.phase.slice(-1)>scIn.scope;return x?`<div class="scline"><b>${x.lo===x.hi?scMoney(x.lo):scMoney(x.lo)+" to "+scMoney(x.hi)} a month</b><span class="kick">${({C:"Verified",L:"Earlier research",G:"Guess"})[x.conf]}${out?", outside scope":""}</span></div><span class="why">${esc(x.basis)}</span>`:s.id==="TS-16"?`<div class="scline"><b>2.9% + $0.30 per card payment</b><span class="kick">Likely</span></div>`:`<div class="scline"><b>$0 licence fee</b></div>`})()}<span class="why" style="display:block;margin-top:3px">${esc(s.cost)}</span></div>
      <div><h4>Risk and mitigation</h4><span class="why">${esc(s.risk)}</span></div>
      <div><h4>Delivers requirements in</h4>${s.covers.map(d=>`<button class="chip" data-dom="${d}" type="button">${d}</button>`).join("")}</div>
     </div>`).join("")+`</div>`});
  $("#slist").innerHTML=h||`<div class="empty">No component matches these filters.</div>`;
}

    <div><h4>Requirements by domain</h4>${Object.entries(p.by_domain).map(([d,n])=>`<button class="chip" data-dp="${d}|${p.tag}" type="button">${d} ${n}</button>`).join("")}</div>
   </div>`).join("");

   <div class="note"><b>Honest flag.</b> Phase 1 is ${Math.round(100*EX.phases[0].count/R.length)}% of all requirements. That is what replacing a whole subscription system means, but it is also the schedule risk. Ask vendors to price it as 1a (identity, catalogue, subscriptions, checkout, donations) and 1b (gifts, institutions, fulfilment, finance, migration and cutover) with a separate gate for each. <b>Priority is judged inside its phase</b>: Phase 2 has only ${EX.phases[1].must} Must items because most of what it holds is valuable but not needed to switch off the old systems.</div>
   <div class="flow">${cards}</div>
   <h2 style="margin-top:26px">Splits I considered and rejected</h2>
   <div class="scroll"><table><thead><tr><th>Option</th><th>Why not</th></tr></thead><tbody>${EX.why_not.map(w=>`<tr><td><b>${esc(w[0])}</b></td><td>${esc(w[1])}</td></tr>`).join("")}</tbody></table></div>`;
  $("#p-phases").onclick=e=>{const o=e.target.closest("[data-oi]");if(o){openReq({oi:o.dataset.oi});return}const s=e.target.closest("[data-st]");if(s){sstate.q=ST.find(x=>x.id===s.dataset.st).name;go("stack");if($("#sq"))$("#sq").value=sstate.q;stackList();return}const d=e.target.closest("[data-dp]");if(d){const [dm,ph]=d.dataset.dp.split("|");openReq({domain:dm,group:dGroup[dm],phase:ph})}};

/* ---------- timeline ---------- */
function timeline(){
  const TL=EX.timeline, M=TL.months, ph={"Phase 0":"g6","Phase 1":"g1","Phase 2":"g3","Phase 3":"g8"};
  const cols=`230px repeat(${M},minmax(26px,1fr))`;
  const mlab=m=>{if(!tstart)return "M"+m;const d=new Date(tstart.y,tstart.m-1+m-1,1);return d.toLocaleString("en",{month:"short"})+" "+String(d.getFullYear()).slice(2)};
  let h=`<div class="gt" style="grid-template-columns:${cols}"><div class="h" style="text-align:left;padding-left:10px;position:sticky;left:0;z-index:2">Workstream (months from RFP issue)</div>`;
  for(let m=1;m<=M;m++)h+=`<div class="h">${tstart?(m%3===1?mlab(m):""):(m%2===1||m===M?m:"")}</div>`;
  TL.rows.forEach(r=>{
    h+=`<div class="l ${ph[r.phase]}"><b>${r.phase.toUpperCase()}</b>${esc(r.name)}</div>`;
    for(let m=1;m<=M;m++){
      const e=m>=r.lo[0]&&m<=r.lo[1], l=m>=r.hi[0]&&m<=r.hi[1];
      h+=`<div class="c ${ph[r.phase]}">${e?'<i class="bar1"></i>':""}${l?'<i class="bar2"></i>':""}</div>`;
    }
  });
  h+="</div>";
  const warn=(a,b)=>{if(!tstart)return "";const bad=[];for(let m=a;m<=b;m++){const d=new Date(tstart.y,tstart.m-1+m-1,1).getMonth();if(d>=10||d===0)bad.push(m)}return bad.length?` <span class="pill s-warn">includes Nov to Jan giving season</span>`:""};
  const gates=TL.gates.map(g=>{const mm=g[2].match(/\d+/g).map(Number);return `<tr><td><b>${g[0]}</b></td><td>${esc(g[1])}</td><td>${esc(g[2])}${tstart?`<br><span class="k">${mlab(mm[0])} to ${mlab(mm[1])}</span>${g[0]==="G1"?warn(mm[0],mm[1]):""}`:""}</td><td>${esc(g[3])}</td></tr>`}).join("");
  const rows=TL.rows.map(r=>`<tr><td><b>${r.id}</b></td><td>${r.phase}</td><td><b>${esc(r.name)}</b><br><span class="k">${esc(r.scope)}</span></td><td>Months ${r.lo[0]} to ${r.lo[1]}</td><td>Months ${r.hi[0]} to ${r.hi[1]}</td><td>${esc(r.basis)}</td></tr>`).join("");
  $("#p-timeline").innerHTML=`<div class="banner g8"><div class="num">8</div><div><div class="nm">Tentative timeline</div></div><div class="ct">Phase 0 to 3</div><div class="ds">Indicative ranges, not quotes. Early case (solid bar) and late case (outlined bar) per workstream.</div></div>
   <div class="note"><b>Basis, and how far to trust it.</b> ${esc(TL.notes[0])} ${esc(TL.notes[3])}</div>
   <div class="fixrow"><label>If the RFP is issued in <input type="month" id="tstart" value="${tstart?tstart.y+"-"+String(tstart.m).padStart(2,"0"):""}"></label><button class="link" id="tclr">Show months as numbers</button></div>
   <div class="gantt">${h}</div>
   <div class="legend" style="margin-top:8px"><span><b style="background:var(--fg)"></b>Early case</span><span><b style="background:var(--muted);opacity:.4"></b>Late case</span></div>
   <h2 style="margin-top:20px">Decision gates</h2><div class="scroll"><table><thead><tr><th>Gate</th><th>What it marks</th><th>When</th><th>Passes when</th></tr></thead><tbody>${gates}</tbody></table></div>
   <h2 style="margin-top:20px">Workstreams</h2><div class="scroll"><table style="min-width:900px"><thead><tr><th>ID</th><th>Phase</th><th>Workstream</th><th>Early case</th><th>Late case</th><th>Basis</th></tr></thead><tbody>${rows}</tbody></table></div>
   <h2 style="margin-top:20px">Assumptions</h2><div class="card"><ul style="margin:0;padding-left:18px">${TL.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul></div>`;
  $("#tstart").addEventListener("change",e=>{const v=e.target.value;tstart=v?{y:+v.slice(0,4),m:+v.slice(5,7)}:null;timeline()});
  $("#tclr").addEventListener("click",()=>{tstart=null;timeline()});
}
let tstart=null;

   <h2 style="margin-top:22px">Recommended components</h2><div class="fixrow">${ST.filter(s=>hostLayers.includes(s.layer)||["TS-02","TS-07","TS-22","TS-23","TS-24","TS-25","TS-26"].includes(s.id)).map(s=>`<button class="chip g5" data-st="${s.id}" type="button">${esc(s.name)}</button>`).join("")}</div>

/* ---------- theme bar ---------- */
function setTheme(t,save){
  const d=document.documentElement;
  d.dataset.theme=t;
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.t===t));
  if(save){try{localStorage.setItem("brs-theme",t)}catch(e){}}
}
document.querySelector(".seg").addEventListener("click",e=>{const b=e.target.closest("button");if(b)setTheme(b.dataset.t,true)});

if(t0!=="light"&&t0!=="dark")t0=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
setTheme(t0,false);

(function(){const h=location.hash.slice(1);
