card networks and state law.", "acceptance": ["A scan of the code repositories finds no live secrets.", "A key can be rotated without a service outage."], "priority": "Must", "phase": "Phase 1", "type": "Non-functional", "actors": ["System administrator"], "journeys": [], "brd_ref": [], "source": "Hosting gap review 26 Oct", "open_items": [], "notes": "", "phase_reason": "Hosting foundation, recovery and security must exist before any customer data is loaded.", "domain_name": "Hosting, servers and databases", "group": "G6"}, {"id": "HST-017", "domain": "HST", "title": "Capacity for seasonal peaks", "statement": "The system shall scale automatically to at least five times its normal daily peak load, covering Advent, Lent, year-end giving and campaign days, and shall alert before capacity limits are reached.", "rationale": "Giving and renewals cluster around a few dates. A site that fails on those dates is expensive to the mission.", "acceptance": ["A load test at five times normal peak keeps checkout and sign-in within response targets.", "Scaling happens without manual intervention."], "priority": "Must", "phase": "Phase 1", "type": "Non-functional", "actors": ["System administrator"], "journeys": [], "brd_ref": [], "source": "Hosting gap review 26 Oct", "open_items": [], "notes": "", "phase_reason": "Hosting foundation, recovery and security must exist before any customer data is loaded.", "domain_name": "Hosting, servers and databases", "group": "G6"}, {"id": "HST-018", "domain": "HST", "title": "Monitoring, alerting and on-call", "statement": "The system shall monitor availability, errors, payment failures and queue backlogs, alert a named on-call person for severe faults, and keep an incident record.", "rationale": "With no internal technology staff, detection and escalation must be designed, not assumed.", "acceptance": ["A forced fault raises an alert to the on-call person within 5 minutes.", "Every severity 1 incident has a written review within 5 working days."], "priority": "Must", "phase": "Phase 1", "type": "Non-functional", "actors": ["System administrator"], "journeys": [], "brd_ref": [], "source": "Hosting gap review 26 Oct", "open_items": [], "notes": "", "phase_reason": "Hosting foundation, recovery and security must exist before any customer data is loaded.", "domain_name": "Hosting, servers and databases", "group": "G6"}, {"id": "HST-019", "domain": "HST", "title": "Audit and application logs", "statement": "The system shall keep tamper-resistant logs of administrator actions, access to personal data and changes to money records, for a stated retention period.", "rationale": "Audit evidence is needed for finance, privacy requests and any security investigation.", "acceptance": ["An administrator change to a price or entitlement can be traced to the person, time and old and new values.", "Logs cannot be altered by the application administrators they record."], "priority": "Should", "phase": "Phase 1", "type": "Non-functional", "actors": ["System administrator"], "journeys": [], "brd_ref": [], "source": "Hosting gap review 26 Oct", "open_items": [], "notes": "", "phase_reason": "Hosting foundation, recovery and security must exist before any customer data is loaded.", "domain_name": "Hosting, servers and databases", "group": "G6"}, {"id": "HST-020", "domain": "HST", "title": "Cost visibility and limits", "statement": "The system shall tag every hosted resource to a component, show monthly cost per component to Liguori, and alert when spend passes agreed thresholds.", "rationale": "Usage-priced services can grow without anyone deciding. Liguori needs the number before the invoice.", "acceptance": ["A monthly cost report by component is delivered to Liguori finance.", "A budget alert fires in a test when spend crosses a threshold."], "priority": "Should", "phase": "Phase 1", "type": "Non-functional", "actors": ["Finance", "System administrator"], "journeys": [], "brd_ref": [], "source": "Hosting gap review 26 Oct", "open_items": [], "notes": "", "phase_reason": "Hosting foundation, recovery and security must exist before any customer data is loaded.", "domain_name": "Hosting, servers and databases", "group": "G6"}, {"id": "HST-021", "domain": "HST", "title": "Backup copies in a second region", "statement": "The system shall keep a copy of database backups and stored files in a second geographic region, outside the production account's ability to delete.", "rationale": "A single-region backup does not survive a regional outage or a compromised administrator account.", "acceptance": ["Backup copies exist in the second region and a restore from them is demonstrated.", "The production administrator account cannot delete the second region copies."], "priority": "Must", "phase": "Phase 1", "type": "Non-functional", "actors": ["System administrator"], "journeys": [], "brd_ref": [], "source": "Hosting gap review 26 Oct", "open_items": ["OI-06"], "notes": "", "phase_reason": "Hosting foundation, recovery and security must exist before any customer data is loaded.", "domain_name": "Hosting, servers and databases", "group": "G6"}, {"id": "HST-022", "domain": "HST", "title": "Regional failover rehearsal", "statement": "The system shall be able to resume service from a second region within the agreed recovery time, and Liguori shall see a rehearsal each year.", "rationale": "Backup copies are not a recovery plan until the steps have been run.", "acceptance": ["An annual rehearsal restores sign-in, reading and checkout in the second region within 4 hours.", "The rehearsal report lists gaps and owners."], "priority": "Should", "phase": "Phase 2", "type": "Non-functional", "actors": ["System administrator"], "journeys": [], "brd_ref": [], "source": "Hosting gap review 26 Oct", "open_items": ["OI-06"], "notes": "", "phase_reason": "Rehearsal needs a stable production service first.", "domain_name": "Hosting, servers and databases", "group": "G6"}, {"id": "HST-023", "domain": "HST", "title": "Protection of personal data outside production", "statement": "The system shall not copy production personal data into staging or development unless it has been masked or replaced with test data.", "rationale": "Test environments are less protected and more widely accessible.", "acceptance": ["A scan of staging finds no real email addresses, card details or donor names.", "The data refresh process applies masking and records that it ran."], "priority": "Must", "phase": "Phase 1", "type": "Non-functional", "actors": ["System administrator"], "journeys": [], "brd_ref": [], "source": "Hosting gap review 26 Oct", "open_items": [], "notes": "", "phase_reason": "Hosting foundation, recovery and security must exist before any customer data is loaded.", "domain_name": "Hosting, servers and databases", "group": "G6"}, {"id": "HST-024", "domain": "HST", "title": "Hosting exit and portability", "statement": "The system shall allow Liguori to obtain, at any time, a complete export of its data and the infrastructure code needed to run the platform elsewhere.", "rationale": "Vendor lock-in is the reason this rebuild is needed. The exit route has to be proved, not promised.", "acceptance": ["A full data export is produced in documented formats and checked for completeness.", "The infrastructure code is delivered to a repository Liguori owns."], "priority": "Must", "phase": "Phase 1", "type": "Constraint", "actors": ["Publisher", "System administrator"], "journeys": [], "brd_ref": [], "source": "Hosting gap review 26 Oct", "open_items": [], "notes": "", "phase_reason": "Hosting foundation, recovery and security must exist before any customer data is loaded.", "domain_name": "Hosting, servers and databases", "group": "G6"}, {"id": "HST-025", "domain": "HST", "title": "Additional regions by configuration", "statement": "The system shall allow a new hosting region or a country-specific data location to be added by configuration and deployment, without changing the application code.", "rationale": "India, the Philippines, Italy, Spain and Malaysia are planned markets with their own data rules.", "acceptance": ["A second region is deployed from the infrastructure code in a test with only configuration changes.", "Customers in a configured country have their data held in the configured location."], "priority": "Could", "phase": "Phase 3", "type": "Non-functional", "actors": ["System administrator"], "journeys": [], "brd_ref": [], "source": "Hosting gap review 26 Oct", "open_items": [], "notes": "", "phase_reason": "Applies when further markets are added.", "domain_name": "Hosting, servers and databases", "group": "G6"}, {"id": "NFR-001", "domain": "NFR", "title": "Reader and subscription availability", "statement": "The reader and subscription services shall achieve at least 99.9% availability each calendar month, excluding approved maintenance windows.", "rationale": "Readers and subscribers must be able to read and buy at any hour.", "acceptance": ["Measured availability from an external monitor is 99.9% or higher each month", "Approved maintenance windows are announced at least 5 business days ahead and stay under 4 hours a month", "A monthly availability report is delivered to Liguori"], "priority": "Must", "phase": "Phase 1", "type": "Non-functional", "actors": ["System administrator"], "journeys": [], "brd_ref": ["NFR-001"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Performance, security, accessibility and privacy are conditions of go-live.", "domain_name": "Non-functional requirements", "group": "G6"}, {"id": "NFR-002", "domain": "NFR", "title": "Editorial and admin availability", "statement": "The editorial and administrative services shall achieve at least 99.5% availability each calendar month.", "rationale": "Staff work during a narrower window and tolerate slightly more downtime than readers.", "acceptance": ["Measured availability is 99.5% or higher each month", "Planned work is scheduled outside production-week deadlines agreed with the managing editor"], "priority": "Must", "phase": "Phase 1", "type": "Non-functional", "actors": ["System administrator"], "journeys": [], "brd_ref": ["NFR-001"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Performance, security, accessibility and privacy are conditions of go-live.", "domain_name": "Non-functional requirements", "group": "G6"}, {"id": "NFR-003", "domain": "NFR", "title": "Page speed targets", "statement": "At the 75th percentile of real production traffic, public pages shall meet Largest Contentful Paint of 2.5 seconds or less, Interaction to Next Paint of 200 milliseconds or less and Cumulative Layout Shift of 0.1 or less.", "rationale": "Slow pages lose readers and rank lower in search.", "acceptance": ["Field data from real users confirms the three targets on home, article, subscribe and donate pages", "A lab test on a mid-range phone on a throttled 4G connection also passes", "Regression of any target blocks release"], "priority": "Must", "phase": "Phase 1", "type": "Non-functional", "actors": ["System administrator"], "journeys": [], "brd_ref": ["NFR-002"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Performance, security, accessibility and privacy are conditions of go-live.", "domain_name": "Non-functional requirements", "group": "G6"}, {"id": "NFR-004", "domain": "NFR", "title": "API response times", "statement": "Read APIs for content, entitlement and search shall respond within 500 milliseconds at the 95th percentile, excluding third-party latency, under agreed load.", "rationale": "Slow entitlement checks make every article feel slow.", "acceptance": ["Load test shows p95 of 500 ms or less for content, entitlement and search APIs at agreed peak", "Third-party time is measured separately and reported"], "priority": "Must", "phase": "Phase 1", "type": "Non-functional", "actors": ["System administrator"], "journeys": [], "brd_ref": ["NFR-003"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Performance, security, accessibility and privacy are conditions of go-live.", "domain_name": "Non-functional requirements", "group": "G6"}, {"id": "NFR-005", "domain": "NFR", "title": "Search response time", "statement": "Search shall return results end to end within 2 seconds at the 95th percentile under agreed load.", "rationale": "Search is a main way readers use the archive.", "acceptance": ["Load test shows end-to-end p95 of 2 seconds or less", "Typeahead suggestions return within 300 ms at p95"], "priority": "Should", "phase": "Phase 1", "type": "Non-functional", "actors": ["System administrator"], "journeys": [], "brd_ref": ["NFR-003"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Performance, security, accessibility and privacy are conditions of go-live.", "domain_name": "Non-functional requirements", "group": "G6"}, {"id": "NFR-006", "domain": "NFR", "title": "Peak load and scale headroom", "statement": "The solution shall meet the agreed peak load at 2 times the launch forecast and scale to 5 times without redesign, with tested concurrency, throughput and bottlenecks stated.", "rationale": "Issue releases, appeals and gift seasons create sharp traffic peaks.", "acceptance": ["Load test at 2x forecast passes all response-time targets", "Capacity plan shows scale to 5x by configuration, not redesign", "Peaks for a new issue release, Advent and Lent campaigns and year-end giving are included in the test profile"], "priority": "Must", "phase": "Phase 1", "type": "Non-functional", "actors": ["System administrator"], "journeys": [], "brd_ref": ["NFR-005"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Performance, security, accessibility and privacy are conditions of go-live.", "domain_name": "Non-functional requirements", "group": "G6"}, {"id": "NFR-007", "domain": "NFR", "title": "Graceful degradation", "statement": "The failure of recommendations, AI, analytics, email, push messaging or any other non-critical integration shall not block entitled reading, editorial access or checkout completion where it is safe to continue.", "rationale": "A fault in a minor service must not stop revenue or reading.", "acceptance": ["Fault injection on each non-critical service leaves reading and checkout working", "Failed outbound messages are queued and retried, not lost", "Users see a clear message only where a feature is unavailable"], "priority": "Must", "phase": "Phase 1", "type": "Non-functional", "actors": ["System administrator"], "journeys": ["J-01", "J-07"], "brd_ref": ["NFR-006"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Performance, security, accessibility and privacy are conditions of go-live.", "domain_name": "Non-functional requirements", "group": "G6"}, {"id": "NFR-008", "domain": "NFR", "title": "Transactional recovery targets", "statement": "Production transactional services shall support a recovery point objective of 15 minutes or less and a recovery time objective of 4 hours or less.", "rationale": "Subscription and donation records are the financial source of truth.", "acceptance": ["A recovery exercise restores transactional services with no more than 15 minutes of data loss", "Service returns within 4 hours of the declared incident start", "Exercise results are reported to Liguori"], "priority": "Must", "phase": "Phase 1", "type": "Non-functional", "actors": ["System administrator"], "journeys": [], "brd_ref": ["NFR-007"], "source": "Amended BRD", "open_items": ["OI-06"], "notes": "Default values taken from the amended BRD.", "phase_reason": "Performance, security, accessibility and privacy are conditions of go-live.", "domain_name": "Non-functional requirements", "group": "G6"}, {"id": "NFR-009", "domain": "NFR", "title": "Content recovery targets", "statement": "Content and media services shall support a recovery point objective of 1 hour or less and a recovery time objective of 8 hours or less.", "rationale": "Content changes are less frequent than transactions but must not be lost.", "acceptance": ["Content restore test recovers all items edited more than 1 hour before the incident", "Service returns within 8 hours"], "priority": "Must", "phase": "Phase 1", "type": "Non-functional", "actors": ["System administrator"], "journeys": [], "brd_ref": ["NFR-007"], "source": "Amended BRD", "open_items": ["OI-06"], "notes": "", "phase_reason": "Performance, security, accessibility and privacy are conditions of go-live.", "domain_name": "Non-functional requirements", "group": "G6"}, {"id": "NFR-010", "domain": "NFR", "title": "Backups and restore tests", "statement": "Backups shall be encrypted, follow the 3-2-1 principle where practical (three copies, two media types, one off-site), include at least one immutable or isolated copy, and be restored in a documented test at least twice a year.", "rationale": "An untested backup is not a backup.", "acceptance": ["Backup inventory lists every data store, frequency and retention", "Two restore tests a year are reported with time taken and result", "Data held only in third-party services is exported nightly to storage controlled by Liguori"], "priority": "Must", "phase": "Phase 1", "type": "Non-functional", "actors": ["System administrator"], "journeys": [], "brd_ref": ["NFR-008"], "source": "Amended BRD", "open_items": ["OI-06"], "notes": "", "phase_reason": "Performance, security, accessibility and privacy are conditions of go-live.", "domain_name": "Non-functional requirements", "group": "G6"}, {"id": "NFR-011", "domain": "NFR", "title": "Browser support", "statement": "The public site and staff portals shall support the current and previous two major versions of Chrome, Edge, Firefox and Safari, with a documented exception process.", "rationale": "Older readers often use older devices and browsers.", "acceptance": ["Automated and manual test passes on each supported browser at release", "Unsupported browser visitors see a clear, accessible message", "Exceptions are recorded with an approver"], "priority": "Must", "phase": "Phase 1", "type": "Non-functional", "actors": ["System administrator"], "journeys": [], "brd_ref": ["NFR-009"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Performance, security, accessibility and privacy are conditions of go-live.", "domain_name": "Non-functional requirements", "group": "G6"}, {"id": "NFR-012", "domain": "NFR", "title": "Code quality and maintainability", "statement": "The codebase shall enforce modular boundaries, automated quality gates, a dependency inventory, documented APIs and reproducible builds, with no unsupported runtime or framework at go-live.", "rationale": "Liguori has no internal engineers, so code must be maintainable by a successor vendor.", "acceptance": ["Build from a clean checkout produces an identical artifact", "Quality gates (tests, linting, dependency scan) run on every change", "Dependency inventory lists version and support end date for each component"], "priority": "Should", "phase": "Phase 1", "type": "Non-functional", "actors": ["System administrator"], "journeys": [], "brd_ref": ["NFR-011"], "source": "Amended BRD", "open_items": ["OI-07"], "notes": "", "phase_reason": "Performance, security, accessibility and privacy are conditions of go-live.", "domain_name": "Non-functional requirements", "group": "G6"}, {"id": "NFR-013", "domain": "NFR", "title": "Observability", "statement": "Services shall emit correlated logs, metrics, traces and business events with personal data redacted, synthetic journey checks, actionable alerts and runbooks.", "rationale": "Faults must be found by the operator, not by readers.", "acceptance": ["Synthetic checks run at least every 5 minutes for sign-in, subscribe, donate and read", "Each alert links to a runbook entry", "A request can be traced across services by one correlation id"], "priority": "Must", "phase": "Phase 1", "type": "Non-functional", "actors": ["System administrator"], "journeys": [], "brd_ref": ["NFR-012"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Performance, security, accessibility and privacy are conditions of go-live.", "domain_name": "Non-functional requirements", "group": "G6"}, {"id": "NFR-014", "domain": "NFR", "title": "Status page and incident communication", "statement": "The system shall provide a public status page and a documented incident process that notifies Liguori within 15 minutes of a severity 1 incident and publishes a written review within 5 business days.", "rationale": "Liguori staff must know about incidents before subscribers write in.", "acceptance": ["Status page shows live component status and history", "Severity definitions and contact tree are agreed before launch", "Post-incident reviews are delivered for every severity 1 and 2 incident"], "priority": "Should", "phase": "Phase 1", "type": "Operational", "actors": ["System administrator"], "journeys": [], "brd_ref": [], "source": "New (this BRS)", "open_items": ["OI-07"], "notes": "", "phase_reason": "Performance, security, accessibility and privacy are conditions of go-live.", "domain_name": "Non-functional requirements", "group": "G6"}, {"id": "NFR-015", "domain": "NFR", "title": "String externalisation and text expansion", "statement": "No user-facing string shall be hard-coded in channel code, and layouts shall tolerate at least 30% text expansion and full Unicode without truncation or overlap.", "rationale": "Spanish text is typically longer than English and later languages need room.", "acceptance": ["Automated scan finds zero hard-coded user-facing strings", "Pseudo-localisation test at +30% shows no clipped or overlapping text", "Names with accents and non-Latin characters save and display correctly"], "priority": "Should", "phase": "Phase 1", "type": "Non-functional", "actors": ["Editor"], "journeys": [], "brd_ref": ["NFR-013"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Performance, security, accessibility and privacy are conditions of go-live.", "domain_name": "Non-functional requirements", "group": "G6"}, {"id": "NFR-016", "domain": "NFR", "title": "Search engine optimisation", "statement": "Public content shall provide canonical URLs, page metadata, structured data, XML sitemaps, robots control, redirects, social share cards and paywall behaviour that search engines can crawl safely.", "rationale": "Organic discovery is a main route to new subscribers.", "acceptance": ["Every public page has a canonical URL and structured data that validates", "Sitemaps update within 1 hour of publication", "Paywalled articles expose a crawlable preview without exposing full text"], "priority": "Should", "phase": "Phase 1", "type": "Non-functional", "actors": ["Marketing"], "journeys": ["J-07"], "brd_ref": ["NFR-014"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Performance, security, accessibility and privacy are conditions of go-live.", "domain_name": "Non-functional requirements", "group": "G6"}, {"id": "NFR-017", "domain": "NFR", "title": "Complete data export", "statement": "A complete export of content, assets, users, subscriptions, entitlements, donations, audit logs and configuration shall be producible in documented non-proprietary formats within 10 business days of request, and Liguori shall own all of that data.", "rationale": "Liguori must be able to leave any vendor without losing its data.", "acceptance": ["Export test is performed before go-live and again annually", "Formats are CSV, JSON, or other open formats with a data dictionary", "Export is verified by restoring a sample into an independent system"], "priority": "Must", "phase": "Phase 1", "type": "Non-functional", "actors": ["Finance", "System administrator"], "journeys": [], "brd_ref": ["NFR-015", "BR-010"], "source": "Amended BRD", "open_items": ["OI-07"], "notes": "", "phase_reason": "Performance, security, accessibility and privacy are conditions of go-live.", "domain_name": "Non-functional requirements", "group": "G6"}, {"id": "NFR-018", "domain": "NFR", "title": "Five-year cost transparency", "statement": "Bidders shall state five-year total cost assumptions by environment, user, traffic, storage, search, AI usage, payment, tax, messaging, support and exit activity.", "rationale": "The cost of ownership, not the build price, decides value.", "acceptance": ["Cost model accompanies each bid with stated assumptions", "One-time and recurring costs are separated", "Exit costs are listed explicitly"], "priority": "Should", "phase": "Phase 1", "type": "Non-functional", "actors": ["Finance"], "journeys": [], "brd_ref": ["NFR-016", "BR-003"], "source": "Amended BRD", "open_items": ["OI-14"], "notes": "", "phase_reason": "Performance, security, accessibility and privacy are conditions of go-live.", "domain_name": "Non-functional requirements", "group": "G6"}, {"id": "NFR-019", "domain": "NFR", "title": "Authoring usability gate", "statement": "The authoring, import review, media selection, preview and approval journeys shall be usable by representative Liguori editorial staff without technical-format knowledge or recurring developer assistance.", "rationale": "Editors must run the publication without a developer.", "acceptance": ["Usability test with at least 5 Liguori editorial users completes each journey", "Task success is 90% or higher and no task needs developer help", "Findings are fixed or accepted by the managing editor before launch"], "priority": "Should", "phase": "Phase 2", "type": "Non-functional", "actors": ["Editor", "Managing editor"], "journeys": ["J-11"], "brd_ref": ["NFR-017"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Should-level with a workaround: Tied to the editorial workflow in Phase 2.", "domain_name": "Non-functional requirements", "group": "G6"}, {"id": "NFR-020", "domain": "NFR", "title": "Deterministic manuscript conversion", "statement": "Word ingestion and structured-content conversion shall be deterministic, observable and loss-aware, so that unsupported content is surfaced for human decision instead of silently discarded or flattened.", "rationale": "Silent loss of footnotes or formatting damages editorial trust.", "acceptance": ["The same input file always produces the same output", "Every conversion produces a report listing anything unsupported", "Test on at least 20 real Liguori manuscripts shows zero silent loss"], "priority": "Must", "phase": "Phase 1", "type": "Non-functional", "actors": ["Editor"], "journeys": ["J-11"], "brd_ref": ["NFR-018"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Performance, security, accessibility and privacy are conditions of go-live.", "domain_name": "Non-functional requirements", "group": "G6"}, {"id": "NFR-021", "domain": "NFR", "title": "Accessibility conformance", "statement": "All reader, subscriber, donor and staff journeys shall conform to WCAG 2.2 level AA.", "rationale": "The readership includes many older and disabled users, and US accessibility claims are common.", "acceptance": ["Automated scan reports zero critical failures on every release", "Manual audit of the top 15 journeys finds no AA failure", "An accessibility conformance report is delivered before launch and after each major release"], "priority": "Must", "phase": "Phase 1", "type": "Compliance", "actors": ["System administrator"], "journeys": [], "brd_ref": ["BR-007"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Performance, security, accessibility and privacy are conditions of go-live.", "domain_name": "Non-functional requirements", "group": "G6"}, {"id": "NFR-022", "domain": "NFR", "title": "Accessibility usability testing", "statement": "Core journeys shall be tested with older adults and with users of screen readers, magnification and voice control before launch.", "rationale": "Automated tools find only a part of real barriers.", "acceptance": ["At least 5 older adults and 3 assistive-technology users complete subscribe, donate and read journeys", "Blocking findings are fixed before launch", "Test report is delivered to Liguori"], "priority": "Must", "phase": "Phase 1", "type": "Compliance", "actors": ["Donor", "Subscriber"], "journeys": ["J-01", "J-04", "J-07"], "brd_ref": ["BR-007"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Performance, security, accessibility and privacy are conditions of go-live.", "domain_name": "Non-functional requirements", "group": "G6"}, {"id": "NFR-023", "domain": "NFR", "title": "Application security baseline", "statement": "The system shall be designed and tested against OWASP ASVS level 2, with a documented threat model for payments, identity and entitlement.", "rationale": "Payments and personal data make this a target.", "acceptance": ["ASVS level 2 checklist is completed with evidence", "Threat model is reviewed before build and after major changes", "No open critical or high finding at go-live"], "priority": "Must", "phase": "Phase 1", "type": "Compliance", "actors": ["System administrator"], "journeys": [], "brd_ref": [], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Performance, security, accessibility and privacy are conditions of go-live.", "domain_name": "Non-functional requirements", "group": "G6"}, {"id": "NFR-024", "domain": "NFR", "title": "Staff authentication and privileged access", "statement": "All staff and administrator accounts shall require multi-factor authentication, role-based least privilege, session timeouts and quarterly access review.", "rationale": "Staff accounts can change money and subscriber data.", "acceptance": ["MFA cannot be disabled for any staff account", "Access review is run every quarter and signed by Liguori", "Privileged actions are logged with user, time and reason"], "priority": "Must", "phase": "Phase 1", "type": "Compliance", "actors": ["System administrator"], "journeys": ["J-10"], "brd_ref": [], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Performance, security, accessibility and privacy are conditions of go-live.", "domain_name": "Non-functional requirements", "group": "G6"}, {"id": "NFR-025", "domain": "NFR", "title": "Encryption and secrets", "statement": "Personal and financial data shall be encrypted in transit (TLS 1.2 or higher) and at rest, and all keys, tokens and credentials shall be held in a managed secrets store and rotated at least annually.", "rationale": "Limits the damage of any single leak.", "acceptance": ["Scan shows no unencrypted endpoint or store", "No secret appears in source code or logs", "Rotation is evidenced for every secret each year"], "priority": "Must", "phase": "Phase 1", "type": "Compliance", "actors": ["System administrator"], "journeys": [], "brd_ref": [], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Performance, security, accessibility and privacy are conditions of go-live.", "domain_name": "Non-functional requirements", "group": "G6"}, {"id": "NFR-026", "domain": "NFR", "title": "Vulnerability management", "statement": "The system shall be scanned for vulnerabilities at least weekly and on every release, and critical findings shall be fixed within 7 days and high findings within 30 days.", "rationale": "Unpatched software caused the current exposure on the legacy estate.", "acceptance": ["Scan reports are retained and reviewed monthly", "Remediation times are measured and reported", "Dependencies past vendor support are replaced before go-live"], "priority": "Must", "phase": "Phase 1", "type": "Compliance", "actors": ["System administrator"], "journeys": [], "brd_ref": ["NFR-011"], "source": "Assessment", "open_items": [], "notes": "", "phase_reason": "Performance, security, accessibility and privacy are conditions of go-live.", "domain_name": "Non-functional requirements", "group": "G6"}, {"id": "NFR-027", "domain": "NFR", "title": "Penetration test", "statement": "An independent penetration test of the public site, accounts, checkout, donation and administrative areas shall be completed before launch and annually, and all critical and high findings shall be fixed before go-live.", "rationale": "Independent testing finds what internal teams miss.", "acceptance": ["Test is by a firm independent of the build vendor", "Report and fix evidence are given to Liguori", "Retest confirms closure of critical and high findings"], "priority": "Must", "phase": "Phase 1", "type": "Compliance", "actors": ["System administrator"], "journeys": [], "brd_ref": [], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Performance, security, accessibility and privacy are conditions of go-live.", "domain_name": "Non-functional requirements", "group": "G6"}, {"id": "NFR-028", "domain": "NFR", "title": "Web firewall and bot defence", "statement": "The public site shall sit behind a web application firewall with bot and rate controls that detect and block automated card testing, credential stuffing and scraping.", "rationale": "A card-testing attack already suspended the legacy payment gateway.", "acceptance": ["Rate limits apply to sign-in, checkout and donation endpoints", "Simulated card-testing traffic is blocked and alerts operators within 5 minutes", "Blocking does not stop assistive technology or normal users"], "priority": "Must", "phase": "Phase 1", "type": "Compliance", "actors": ["System administrator"], "journeys": ["J-01", "J-04"], "brd_ref": [], "source": "Assessment", "open_items": [], "notes": "", "phase_reason": "Performance, security, accessibility and privacy are conditions of go-live.", "domain_name": "Non-functional requirements", "group": "G6"}, {"id": "NFR-029", "domain": "NFR", "title": "Privacy rights and consent", "statement": "The system shall record consent, honour opt-outs, and complete verified access, correction and deletion requests under CCPA/CPRA and other applicable US state laws within 45 days, while keeping a design that can later meet GDPR.", "rationale": "Privacy law applies to US subscribers and donors in many states.", "acceptance": ["Consent is stored with time, wording version and channel", "A deletion request removes or anonymises personal data in all systems except records that must be retained, which are listed", "Retention periods are defined per data type and enforced automatically"], "priority": "Must", "phase": "Phase 1", "type": "Compliance", "actors": ["System administrator"], "journeys": ["J-08"], "brd_ref": ["BR-004"], "source": "New (this BRS)", "open_items": ["OI-02"], "notes": "", "phase_reason": "Performance, security, accessibility and privacy are conditions of go-live.", "domain_name": "Non-functional requirements", "group": "G6"}, {"id": "NFR-030", "domain": "NFR", "title": "PWA installation and offline behaviour", "statement": "The PWA shall be installable on supported phones and desktops, load its shell offline, show clear offline and reconnect states, and keep downloaded entitled content only for the allowed period.", "rationale": "Readers on weak connections need a dependable reading experience.", "acceptance": ["Install prompt works on current Android Chrome and iOS Safari home-screen add", "Offline shell and saved articles open without a connection", "Offline content expires when entitlement ends, within the agreed grace period"], "priority": "Should", "phase": "Phase 2", "type": "Non-functional", "actors": ["Subscriber"], "journeys": ["J-07"], "brd_ref": ["FR-006"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Should-level with a workaround: Offline behaviour follows offline reading (CDL-006, CDL-007).", "domain_name": "Non-functional requirements", "group": "G6"}, {"id": "NFR-031", "domain": "NFR", "title": "Native app stability and OS support", "statement": "When native apps are released, they shall maintain 99.5% or higher crash-free sessions with privacy-safe diagnostics, and support operating system versions covering at least 95% of active target users with an annual review.", "rationale": "Keeps the app standard measurable when Phase 2 begins.", "acceptance": ["Crash-free rate is reported per release", "Minimum OS version is documented with the coverage figure", "Older devices see an accessible upgrade message"], "priority": "Should", "phase": "Phase 3", "type": "Non-functional", "actors": ["System administrator"], "journeys": [], "brd_ref": ["NFR-004", "NFR-010"], "source": "Amended BRD", "open_items": ["OI-16"], "notes": "", "phase_reason": "Native apps follow a proven PWA (OI-16).", "domain_name": "Non-functional requirements", "group": "G6"}, {"id": "INT-001", "domain": "INT", "title": "Single named integration owner", "statement": "One named company shall be contractually accountable for every integration working end to end, including when the fault lies in another vendor's system, and one named Liguori person shall approve integration changes.", "rationale": "With a dozen or more vendors, unowned connections are the main operating risk.", "acceptance": ["Contract names the accountable company and its on-call contact", "Liguori approver is named in the operating agreement", "Accountability covers the whole chain from checkout to entitlement to fulfilment"], "priority": "Must", "phase": "Phase 1", "type": "Operational", "actors": ["System administrator"], "journeys": [], "brd_ref": ["BR-010"], "source": "Review Part 3", "open_items": ["OI-07"], "notes": "Default: build vendor with a 12-month managed service; SJPL holds acceptance authority.", "phase_reason": "Named integration ownership and exit rights are needed before vendors are contracted.", "domain_name": "Integration and operations ownership", "group": "G6"}, {"id": "INT-002", "domain": "INT", "title": "Integration register", "statement": "The system shall be supported by a live integration register listing every connection with source, destination, direction, trigger, data moved, owner, failure behaviour and alert route.", "rationale": "An undocumented connection cannot be supported.", "acceptance": ["Register is complete at go-live and reviewed monthly", "Each register entry links to its runbook", "Register is delivered to Liguori in an open format"], "priority": "Must", "phase": "Phase 1", "type": "Integration", "actors": ["System administrator"], "journeys": [], "brd_ref": ["NFR-011"], "source": "Review Part 3", "open_items": ["OI-07"], "notes": "", "phase_reason": "Named integration ownership and exit rights are needed before vendors are contracted.", "domain_name": "Integration and operations ownership", "group": "G6"}, {"id": "INT-003", "domain": "INT", "title": "Failure behaviour and alerting", "statement": "Each integration shall define and implement what happens when its partner is slow, down or returns an error, and shall alert the owner when failures cross agreed thresholds.", "rationale": "Silent failures between systems cause lost orders and wrong access.", "acceptance": ["Each integration is tested with partner down, slow and erroring", "Alerts reach the on-call contact within 5 minutes of threshold breach", "No failure leaves a paid customer without access for longer than the agreed recovery time"], "priority": "Must", "phase": "Phase 1", "type": "Integration", "actors": ["System administrator"], "journeys": [], "brd_ref": ["NFR-006"], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Named integration ownership and exit rights are needed before vendors are contracted.", "domain_name": "Integration and operations ownership", "group": "G6"}, {"id": "INT-004", "domain": "INT", "title": "Webhook idempotency, retry and order", "statement": "The system shall process every inbound event from payment, subscription, email and fulfilment partners exactly once in effect, using idempotency keys, signed-event verification, retries with back-off and safe handling of out-of-order delivery.", "rationale": "Duplicate or missed events create double access, double receipts or lost renewals.", "acceptance": ["Replaying the same event 10 times changes state once", "Events with invalid signatures are rejected and logged", "Out-of-order events produce the correct final state in test"], "priority": "Must", "phase": "Phase 1", "type": "Integration", "actors": ["System administrator"], "journeys": ["J-01", "J-04"], "brd_ref": [], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Named integration ownership and exit rights are needed before vendors are contracted.", "domain_name": "Integration and operations ownership", "group": "G6"}, {"id": "INT-005", "domain": "INT", "title": "Daily cross-system reconciliation", "statement": "The system shall reconcile payments, subscriptions, entitlements, donations and fulfilment lists across systems every day and report any difference to named owners.", "rationale": "Money and access must agree across systems.", "acceptance": ["Daily report lists matched and unmatched items", "Unmatched items older than 2 business days raise an alert", "Finance can see reconciliation history for the last 24 months"], "priority": "Must", "phase": "Phase 1", "type": "Integration", "actors": ["Finance", "System administrator"], "journeys": ["J-12"], "brd_ref": ["BR-008"], "source": "Review Part 3", "open_items": ["OI-01"], "notes": "", "phase_reason": "Named integration ownership and exit rights are needed before vendors are contracted.", "domain_name": "Integration and operations ownership", "group": "G6"}, {"id": "INT-006", "domain": "INT", "title": "Vendor exit and export rights", "statement": "Every contract for a component of the platform shall give Liguori the right to a complete export of its data in open formats and a documented exit plan, with exit assistance for at least 90 days.", "rationale": "Prevents lock-in to any single vendor.", "acceptance": ["Each vendor contract is checked against this clause before signature", "Exit plan names data, formats, timing and cost for each component", "Exit export has been tested once per major vendor before go-live"], "priority": "Must", "phase": "Phase 1", "type": "Operational", "actors": ["Finance"], "journeys": [], "brd_ref": ["BR-010", "NFR-015"], "source": "Amended BRD", "open_items": ["OI-14"], "notes": "", "phase_reason": "Named integration ownership and exit rights are needed before vendors are contracted.", "domain_name": "Integration and operations ownership", "group": "G6"}, {"id": "INT-007", "domain": "INT", "title": "Integration change control", "statement": "Changes to integrations, schemas, credentials or vendor versions shall follow documented change control with impact assessment, test evidence, approval and rollback plan.", "rationale": "Uncontrolled changes break connected systems.", "acceptance": ["Every production change has a ticket with approver and test evidence", "Emergency changes are reviewed within 2 business days", "Deprecation notices from partners are tracked to closure"], "priority": "Should", "phase": "Phase 1", "type": "Operational", "actors": ["System administrator"], "journeys": [], "brd_ref": ["NFR-011"], "source": "New (this BRS)", "open_items": ["OI-07"], "notes": "", "phase_reason": "Named integration ownership and exit rights are needed before vendors are contracted.", "domain_name": "Integration and operations ownership", "group": "G6"}, {"id": "INT-008", "domain": "INT", "title": "Service levels and remedies", "statement": "Service levels covering response, resolution, availability and reporting shall be written into the operating agreement with remedies for repeated misses.", "rationale": "Fully managed service needs measurable commitments.", "acceptance": ["Severity 1 response within 30 minutes at all hours and severity 2 within 2 hours in business hours", "Monthly service report delivered by the fifth business day", "Remedy applies after two consecutive misses"], "priority": "Must", "phase": "Phase 1", "type": "Operational", "actors": ["System administrator"], "journeys": [], "brd_ref": ["BR-011"], "source": "Review Part 3", "open_items": ["OI-07"], "notes": "", "phase_reason": "Named integration ownership and exit rights are needed before vendors are contracted.", "domain_name": "Integration and operations ownership", "group": "G6"}, {"id": "INT-009", "domain": "INT", "title": "API documentation and versioning", "statement": "Every internal and external API shall be documented in a machine-readable specification, versioned, and kept current with each release.", "rationale": "A successor vendor must be able to take over.", "acceptance": ["Specification is published and validated on each release", "Breaking changes require a new version and 90 days' notice to consumers", "Documentation is delivered to Liguori"], "priority": "Should", "phase": "Phase 1", "type": "Integration", "actors": ["System administrator"], "journeys": [], "brd_ref": ["NFR-011"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Named integration ownership and exit rights are needed before vendors are contracted.", "domain_name": "Integration and operations ownership", "group": "G6"}, {"id": "INT-010", "domain": "INT", "title": "Sandbox and test environments", "statement": "The system shall provide non-production environments, with each connected partner in test mode and anonymised data, for development, UAT and release rehearsal.", "rationale": "Safe testing prevents live errors and data exposure.", "acceptance": ["Production personal data is never copied unmasked into test", "Each partner integration can be tested end to end in the test environment", "Environments are refreshed before each UAT cycle"], "priority": "Should", "phase": "Phase 1", "type": "Operational", "actors": ["System administrator"], "journeys": [], "brd_ref": [], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Named integration ownership and exit rights are needed before vendors are contracted.", "domain_name": "Integration and operations ownership", "group": "G6"}, {"id": "INT-011", "domain": "INT", "title": "Portability and open standards", "statement": "Integrations and data models shall use open standards and documented interfaces where available, and shall not depend on proprietary formats that prevent replacing a component.", "rationale": "Lets Liguori replace one component without rebuilding the rest.", "acceptance": ["Replacement of a component is shown on paper for each major component with an effort estimate", "Configuration of each component is exported and stored by Liguori", "No custom code depends on a single vendor's private interface without an adapter layer"], "priority": "Should", "phase": "Phase 1", "type": "Integration", "actors": ["System administrator"], "journeys": [], "brd_ref": ["BR-010"], "source": "Amended BRD", "open_items": ["OI-14"], "notes": "", "phase_reason": "Named integration ownership and exit rights are needed before vendors are contracted.", "domain_name": "Integration and operations ownership", "group": "G6"}, {"id": "INT-012", "domain": "INT", "title": "Third-party risk review", "statement": "Each external vendor shall be reviewed before contract and every year for security certification, financial stability, data location and subprocessors, and credentials issued to them shall be rotated and revoked on exit.", "rationale": "Liguori asked for stable and credible vendors.", "acceptance": ["Review record exists for each vendor with a named approver", "Certifications (for example SOC 2 or ISO 27001) are held on file", "Access of departing vendors is revoked within 1 business day"], "priority": "Should", "phase": "Phase 2", "type": "Operational", "actors": ["Finance", "System administrator"], "journeys": [], "brd_ref": ["BR-010"], "source": "New (this BRS)", "open_items": ["OI-14"], "notes": "", "phase_reason": "Should-level with a workaround: A formal vendor risk review follows once vendors are chosen.", "domain_name": "Integration and operations ownership", "group": "G6"}, {"id": "INT-013", "domain": "INT", "title": "One unified publishing operating model", "statement": "The system shall deliver one coherent publishing operating model across author submission, editorial operations, public web and PWA, print production hand-off, subscription, donations, customer service and analytics, using one identity model, one entitlement ledger, one content master and one audit trail.", "rationale": "Separate tools for each step recreate the manual reconciliation and lost context that the current systems cause.", "acceptance": ["A traced example article moves from contributor submission to published web, PWA and print hand-off without re-keying content.", "One person identity links subscription, gift, donation and service history in a single view for a service agent.", "The audit search returns editorial, subscription and payment events for one customer or article from one interface."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["System administrator", "Managing editor", "Customer service agent"], "journeys": ["J-11", "J-10"], "brd_ref": ["BR-001"], "source": "Amended BRD", "open_items": ["OI-14"], "notes": "Acceptance is tested end to end during user acceptance testing, not per module.", "phase_reason": "Named integration ownership and exit rights are needed before vendors are contracted.", "domain_name": "Integration and operations ownership", "group": "G6"}], "changes": [{"id": "BKO-009", "field": "phase", "old": "Launch", "new": "Phase 2", "reason": "Convenience feature; not needed in first 90 days"}, {"id": "BKO-010", "field": "priority", "old": "Must", "new": "Should", "reason": "Workaround exists; not needed for go-live"}, {"id": "BKO-011", "field": "priority", "old": "Must", "new": "Should", "reason": "Workaround exists; not needed for go-live"},
