r attempts for 15 minutes."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Donor", "Subscriber"], "journeys": ["J-01", "J-04"], "brd_ref": [], "source": "RFP draft", "open_items": [], "notes": "", "phase_reason": "The suspended payment gateway is the urgent risk; checkout has to move first.", "domain_name": "Checkout and payments", "group": "G2"}, {"id": "PAY-013", "domain": "PAY", "title": "Duplicate charge prevention", "statement": "The system shall prevent duplicate charges from repeated clicks, page refreshes and retried network calls by making payment requests idempotent.", "rationale": "Double charges produce refunds, complaints and disputes.", "acceptance": ["Submitting the same order twice within 60 seconds creates one charge.", "A timeout followed by retry produces one order and one charge.", "Support can trace each charge to exactly one order."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["System administrator"], "journeys": ["J-01"], "brd_ref": [], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "The suspended payment gateway is the urgent risk; checkout has to move first.", "domain_name": "Checkout and payments", "group": "G2"}, {"id": "PAY-014", "domain": "PAY", "title": "Refunds", "statement": "The system shall let authorised agents issue full or partial refunds with a reason code, shall return funds to the original payment method, and shall update the order, entitlement and ledger export.", "rationale": "Refunds are a routine service action and must keep access and accounts consistent.", "acceptance": ["A full refund of an annual subscription ends or adjusts access as the agent selects, and records it.", "A partial refund records the amount and reason code.", "Refunds above a configured amount need a second approver."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Customer service agent", "Finance"], "journeys": ["J-10", "J-12"], "brd_ref": ["FR-045"], "source": "Amended BRD", "open_items": ["OI-01"], "notes": "", "phase_reason": "The suspended payment gateway is the urgent risk; checkout has to move first.", "domain_name": "Checkout and payments", "group": "G2"}, {"id": "PAY-015", "domain": "PAY", "title": "Chargeback and dispute handling", "statement": "The system shall record card disputes when notified, hold or adjust the related entitlement according to a configured rule, and assemble order evidence for submission before the deadline.", "rationale": "Disputes cost fees and, if ignored, are lost by default.", "acceptance": ["A dispute notification creates a case within 1 hour and alerts finance.", "The evidence pack includes order, delivery, sign-in and communication records.", "The dispute outcome updates the ledger export."], "priority": "Should", "phase": "Phase 1", "type": "Functional", "actors": ["Customer service agent", "Finance"], "journeys": ["J-12"], "brd_ref": [], "source": "Assessment", "open_items": ["OI-01"], "notes": "", "phase_reason": "The suspended payment gateway is the urgent risk; checkout has to move first.", "domain_name": "Checkout and payments", "group": "G2"}, {"id": "PAY-016", "domain": "PAY", "title": "Order confirmation and receipt", "statement": "The system shall email an order receipt within 5 minutes of payment showing items, amounts, tax, payment method brand and last four digits, and order number, in the buyer's language.", "rationale": "Buyers expect an immediate record, and finance needs a standard one.", "acceptance": ["95% of receipts arrive within 5 minutes.", "The receipt is available again from the dashboard Orders tab.", "The receipt is produced in English or Spanish according to the buyer's setting."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Donor", "Gift buyer", "Subscriber"], "journeys": ["J-01", "J-04"], "brd_ref": [], "source": "New (this BRS)", "open_items": ["OI-03"], "notes": "Donor tax receipts are specified separately in FIN.", "phase_reason": "The suspended payment gateway is the urgent risk; checkout has to move first.", "domain_name": "Checkout and payments", "group": "G2"}, {"id": "PAY-017", "domain": "PAY", "title": "Payment emergency switch and alerts", "statement": "The system shall let an authorised operator suspend new card payments in one action, without taking the rest of the site down, and shall alert operators to abnormal decline, attempt or refund rates.", "rationale": "Payments were turned off wholesale after the attack; Liguori needs a controlled switch and an early warning.", "acceptance": ["Suspending payments disables checkout and donation forms and shows a notice within 60 seconds while reading and account pages stay up.", "An alert fires when the decline rate exceeds a set threshold over 15 minutes.", "Resuming payments is logged with user and reason."], "priority": "Must", "phase": "Phase 1", "type": "Operational", "actors": ["System administrator"], "journeys": ["J-01", "J-04"], "brd_ref": ["NFR-006"], "source": "Assessment", "open_items": ["OI-07"], "notes": "", "phase_reason": "The suspended payment gateway is the urgent risk; checkout has to move first.", "domain_name": "Checkout and payments", "group": "G2"}, {"id": "PAY-018", "domain": "PAY", "title": "Country sales restrictions", "statement": "The system shall let administrators set the countries to which each product is sold and shall block checkout, with a clear message, for others.", "rationale": "The earlier fix included blocking countries Liguori does not sell to.", "acceptance": ["A product restricted to the US cannot be bought with a non-US billing or shipping country.", "Country lists are configuration, not code.", "Blocked attempts are counted and reported."], "priority": "Should", "phase": "Phase 3", "type": "Compliance", "actors": ["System administrator"], "journeys": ["J-01"], "brd_ref": ["BR-004"], "source": "Assessment", "open_items": [], "notes": "", "phase_reason": "Applies to markets beyond the US launch.", "domain_name": "Checkout and payments", "group": "G2"}, {"id": "PAY-019", "domain": "PAY", "title": "Payment methods and currencies by market", "statement": "The system shall configure accepted payment methods and currencies per market without code changes, so that other markets can be enabled later.", "rationale": "The BRD requires launching further countries without re-platforming.", "acceptance": ["Adding a market's currency and a local method is done in configuration and tested in a staging environment.", "The US launch uses US dollars and cards only, with wallets as in PAY-004.", "Amounts are shown in the buyer's currency with the correct rounding."], "priority": "Could", "phase": "Phase 3", "type": "Functional", "actors": ["System administrator"], "journeys": [], "brd_ref": ["BR-004"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Applies to markets beyond the US launch.", "domain_name": "Checkout and payments", "group": "G2"}, {"id": "PAY-020", "domain": "PAY", "title": "Reliable payment event handling", "statement": "The system shall process payment-provider notifications reliably, with signature checks, retries, duplicate protection and an operator view of failed events, so that orders and entitlements always match payments.", "rationale": "Lost or repeated notifications cause paid customers without access, or access without payment.", "acceptance": ["A notification delivered twice changes the order once.", "A notification that fails is retried for at least 72 hours and then listed for manual action.", "A daily check finds no paid order without an entitlement and no entitlement without payment."], "priority": "Should", "phase": "Phase 1", "type": "Integration", "actors": ["Finance", "System administrator"], "journeys": ["J-01", "J-12"], "brd_ref": ["BR-008"], "source": "New (this BRS)", "open_items": ["OI-07", "OI-14"], "notes": "", "phase_reason": "The suspended payment gateway is the urgent risk; checkout has to move first.", "domain_name": "Checkout and payments", "group": "G2"}, {"id": "DON-001", "domain": "DON", "title": "One-off donation", "statement": "The system shall let a visitor make a one-time donation from a public donation page in no more than three steps: amount, details, payment.", "rationale": "Today donation data lives only in the payment account; a simple form creates a usable donor record.", "acceptance": ["Given a visitor on the donation page, when they complete amount, details and payment, then the donation is recorded with donor, amount, date and fund", "A first-time donor completes the form in under 90 seconds on a mobile device in usability testing", "Declined payments show a specific message and keep the entered details"], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Donor"], "journeys": ["J-04"], "brd_ref": [], "source": "Transcript 23 Oct", "open_items": [], "notes": "", "phase_reason": "Donations share checkout and receipts with subscriptions, and recurring donors would otherwise stay on the old setup.", "domain_name": "Donations and tribute gifts", "group": "G2"}, {"id": "DON-002", "domain": "DON", "title": "Suggested and custom amounts", "statement": "The system shall offer configurable suggested amounts and a custom amount field, with a configurable minimum and maximum per fund.", "rationale": "Suggested amounts lift average gift and the limits block card-testing at small values.", "acceptance": ["Given suggested amounts are configured, then they display in the visitor's currency", "A custom amount below the minimum or above the maximum is rejected with a clear message", "Administrators change amounts without a code release"], "priority": "Should", "phase": "Phase 1", "type": "Functional", "actors": ["Donor", "System administrator"], "journeys": ["J-04"], "brd_ref": ["FR-049"], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Donations share checkout and receipts with subscriptions, and recurring donors would otherwise stay on the old setup.", "domain_name": "Donations and tribute gifts", "group": "G2"}, {"id": "DON-003", "domain": "DON", "title": "Donate without an account", "statement": "The system shall allow a donation without creating a password-protected account, and shall offer account creation after payment using the same email address.", "rationale": "Forcing registration lowers conversion on a donation page.", "acceptance": ["A visitor completes a donation without choosing a password", "After payment the confirmation page offers to create an account, which links the donation to that account", "Declining the offer leaves the donor record and receipt intact"], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Donor"], "journeys": ["J-04"], "brd_ref": [], "source": "Transcript 23 Oct", "open_items": [], "notes": "", "phase_reason": "Donations share checkout and receipts with subscriptions, and recurring donors would otherwise stay on the old setup.", "domain_name": "Donations and tribute gifts", "group": "G2"}, {"id": "DON-004", "domain": "DON", "title": "Set up a recurring donation", "statement": "The system shall allow a donor to create a recurring donation with a chosen frequency of monthly, quarterly or annual, an amount and a start date.", "rationale": "Recurring gifts are the most reliable donation income and are not captured today.", "acceptance": ["Given a donor selects monthly, then the first charge occurs on the chosen date and later charges on the same day each month", "For a start date of the 29th to 31st, the charge falls on the last day of shorter months", "The donor receives an email naming the amount, frequency, next charge date and how to change it"], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Donor"], "journeys": ["J-05"], "brd_ref": [], "source": "Transcript 23 Oct", "open_items": [], "notes": "", "phase_reason": "Donations share checkout and receipts with subscriptions, and recurring donors would otherwise stay on the old setup.", "domain_name": "Donations and tribute gifts", "group": "G2"}, {"id": "DON-005", "domain": "DON", "title": "Change recurring amount or frequency", "statement": "The system shall allow a donor to change the amount or frequency of an active recurring donation from the dashboard, effective from the next charge.", "rationale": "Donors who can adjust a gift cancel less.", "acceptance": ["Given an active recurring donation, when the donor changes the amount, then the next charge uses the new amount", "A change confirmation email states the new amount and next charge date", "The change is recorded in the audit log with actor and time"], "priority": "Should", "phase": "Phase 1", "type": "Functional", "actors": ["Donor"], "journeys": ["J-05"], "brd_ref": [], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Donations share checkout and receipts with subscriptions, and recurring donors would otherwise stay on the old setup.", "domain_name": "Donations and tribute gifts", "group": "G2"}, {"id": "DON-006", "domain": "DON", "title": "Pause or skip a recurring donation", "statement": "The system shall allow a donor to skip the next charge or pause a recurring donation for a chosen number of months up to 12, then resume automatically.", "rationale": "A pause keeps donors who face a short hardship.", "acceptance": ["Given a donor pauses for 3 months, then no charge occurs for 3 months and the schedule resumes on the following due date", "The dashboard shows the pause end date and a resume-now option", "A paused donation does not generate failed-payment notices"], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Donor"], "journeys": ["J-05"], "brd_ref": [], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Valuable but not needed to retire the old systems; a workaround exists in Phase 1.", "domain_name": "Donations and tribute gifts", "group": "G2"}, {"id": "DON-007", "domain": "DON", "title": "Cancel a recurring donation", "statement": "The system shall allow a donor to cancel a recurring donation in no more than two steps from the dashboard or an emailed link, and shall confirm the cancellation by email.", "rationale": "Easy cancellation is expected by donors and avoids disputes and chargebacks.", "acceptance": ["Given an active recurring donation, when the donor confirms cancellation, then no further charge is attempted", "A cancellation confirmation email is sent within 5 minutes", "Cancelling an account-less donation works through a signed emailed link that expires in 24 hours"], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Donor"], "journeys": ["J-05"], "brd_ref": [], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Donations share checkout and receipts with subscriptions, and recurring donors would otherwise stay on the old setup.", "domain_name": "Donations and tribute gifts", "group": "G2"}, {"id": "DON-008", "domain": "DON", "title": "Retry failed recurring payments", "statement": "The system shall retry a failed recurring donation on a configurable schedule (default three attempts over 14 days), notify the donor after each failure, and lapse the donation after the last failed attempt.", "rationale": "Failed cards are the largest avoidable loss in recurring giving.", "acceptance": ["Given a failed charge, then retries occur on days configured by an administrator", "Each failure sends an email with a secure link to update the card", "After the final failure the donation is marked lapsed and the donor and development staff are notified"], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Development staff", "Donor"], "journeys": ["J-05"], "brd_ref": [], "source": "Assessment", "open_items": [], "notes": "", "phase_reason": "Donations share checkout and receipts with subscriptions, and recurring donors would otherwise stay on the old setup.", "domain_name": "Donations and tribute gifts", "group": "G2"}, {"id": "DON-009", "domain": "DON", "title": "Card expiry reminders", "statement": "The system shall email a donor with a recurring donation at 30 and 7 days before the saved card expires, with a secure link to update it.", "rationale": "Reminders prevent avoidable failed charges.", "acceptance": ["Given a card expiring on a date, then emails send 30 and 7 days before", "A donor who updates the card stops further reminders", "Reminders are sent in the donor's saved language"], "priority": "Should", "phase": "Phase 1", "type": "Functional", "actors": ["Donor"], "journeys": ["J-05"], "brd_ref": [], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Donations share checkout and receipts with subscriptions, and recurring donors would otherwise stay on the old setup.", "domain_name": "Donations and tribute gifts", "group": "G2"}, {"id": "DON-010", "domain": "DON", "title": "Tribute gift capture", "statement": "The system shall let a donor mark a donation as given in honour or memory of a named person and capture the honouree's name, the occasion and, optionally, an email or postal address for notification.", "rationale": "Giving on behalf of others is a stated revenue stream and is currently unsupported.", "acceptance": ["Given a donor selects honour or memory, then the honouree name is required and contact details are optional", "The donor record links to the honouree record without making the honouree a donor", "Tribute fields are available on both one-off and recurring donations"], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Donor"], "journeys": ["J-06"], "brd_ref": [], "source": "Transcript 23 Oct", "open_items": ["OI-10"], "notes": "", "phase_reason": "Donations share checkout and receipts with subscriptions, and recurring donors would otherwise stay on the old setup.", "domain_name": "Donations and tribute gifts", "group": "G2"}, {"id": "DON-011", "domain": "DON", "title": "Honouree notification", "statement": "The system shall send the honouree a notification by email, printed card or both, as the donor chooses, using an approved template that names the donor unless the donor opts out.", "rationale": "The honouree notice is the distinguishing feature of a tribute gift.", "acceptance": ["Given a donor provides an honouree email, then the notification email is sent on the chosen date", "Given a postal address, then a card request is queued for the print process", "A donor who chooses to remain anonymous is not named in the notice"], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Donor", "Honouree"], "journeys": ["J-06"], "brd_ref": [], "source": "Transcript 23 Oct", "open_items": ["OI-10"], "notes": "Channels and card wording await OI-10.", "phase_reason": "Donations share checkout and receipts with subscriptions, and recurring donors would otherwise stay on the old setup.", "domain_name": "Donations and tribute gifts", "group": "G2"}, {"id": "DON-012", "domain": "DON", "title": "Never disclose amount to honouree", "statement": "The system shall never show the donation amount, payment details or receipt to the honouree in any notification, page or export available to them.", "rationale": "Disclosing the amount is a privacy and trust failure.", "acceptance": ["Inspection of every honouree-facing template and page shows no amount or payment data", "A test honouree who clicks any link in the notice sees no donation amount", "A security review confirms honouree links do not expose donor records"], "priority": "Must", "phase": "Phase 1", "type": "Compliance", "actors": ["Donor", "Honouree"], "journeys": ["J-06"], "brd_ref": [], "source": "New (this BRS)", "open_items": ["OI-10"], "notes": "", "phase_reason": "Donations share checkout and receipts with subscriptions, and recurring donors would otherwise stay on the old setup.", "domain_name": "Donations and tribute gifts", "group": "G2"}, {"id": "DON-013", "domain": "DON", "title": "Schedule tribute notification", "statement": "The system shall allow a donor to choose the date a tribute notification is sent, up to 12 months ahead, and to cancel or change it before it sends.", "rationale": "Donors time tributes to anniversaries and feast days.", "acceptance": ["Given a future send date, then the notification sends on that date in the honouree's time zone or a configured default", "The donor can edit or cancel before the send date from the dashboard", "A notice scheduled in the past sends immediately"], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Donor"], "journeys": ["J-06"], "brd_ref": [], "source": "New (this BRS)", "open_items": ["OI-10"], "notes": "", "phase_reason": "Should-level with a workaround: Tribute notices can be sent immediately; scheduling follows.", "domain_name": "Donations and tribute gifts", "group": "G2"}, {"id": "DON-014", "domain": "DON", "title": "Tribute personal message", "statement": "The system shall allow an optional personal message of up to 500 characters in a tribute notification, and shall screen it against a configurable block list before sending.", "rationale": "A message personalises the gift; screening protects the brand.", "acceptance": ["A 500-character message saves and displays; 501 characters is rejected", "A message containing a blocked term is held for staff review and the donor is told", "The final message is shown to the donor for confirmation before payment"], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Development staff", "Donor"], "journeys": ["J-06"], "brd_ref": [], "source": "New (this BRS)", "open_items": ["OI-10"], "notes": "", "phase_reason": "Should-level with a workaround: The tribute itself is Phase 1; a personal message follows.", "domain_name": "Donations and tribute gifts", "group": "G2"}, {"id": "DON-015", "domain": "DON", "title": "Donation designations and funds", "statement": "The system shall let administrators define funds and campaigns with name, description, active dates and goal, and let donors select one, with a default fund when none is chosen.", "rationale": "Restricted and campaign giving must be tracked for stewardship and accounting.", "acceptance": ["Given an active fund, then it appears on the donation page in the donor's language", "Every donation stores exactly one fund", "Retiring a fund hides it from new gifts but keeps history"], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Development staff", "System administrator"], "journeys": ["J-04", "J-13"], "brd_ref": [], "source": "New (this BRS)", "open_items": ["OI-01"], "notes": "", "phase_reason": "Donations share checkout and receipts with subscriptions, and recurring donors would otherwise stay on the old setup.", "domain_name": "Donations and tribute gifts", "group": "G2"}, {"id": "DON-016", "domain": "DON", "title": "Anonymous giving", "statement": "The system shall let a donor request that their name not be published or shared in any acknowledgement or report visible outside authorised staff.", "rationale": "Many donors give privately.", "acceptance": ["Given anonymous is selected, then public donor lists, tribute notices and campaign pages omit the name", "Authorised staff still see the donor identity for receipts and stewardship", "Anonymous status is stored on the donor record and applies to later gifts until changed"], "priority": "Should", "phase": "Phase 1", "type": "Functional", "actors": ["Donor"], "journeys": ["J-04"], "brd_ref": [], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Donations share checkout and receipts with subscriptions, and recurring donors would otherwise stay on the old setup.", "domain_name": "Donations and tribute gifts", "group": "G2"}, {"id": "DON-017", "domain": "DON", "title": "Donor record matching", "statement": "The system shall match each donation to an existing person record by email address, then name and postal address, and shall create a record only when no confident match exists.", "rationale": "Duplicates split giving history and break receipts.", "acceptance": ["Given a donor whose email already exists, then the donation attaches to that record", "Possible matches below the confidence threshold go to a staff review queue", "Merge actions keep the full history of both records and are audited"], "priority": "Should", "phase": "Phase 1", "type": "Data", "actors": ["Development staff"], "journeys": ["J-13"], "brd_ref": [], "source": "Transcript 23 Oct", "open_items": [], "notes": "", "phase_reason": "Donations share checkout and receipts with subscriptions, and recurring donors would otherwise stay on the old setup.", "domain_name": "Donations and tribute gifts", "group": "G2"}, {"id": "DON-018", "domain": "DON", "title": "Household linking", "statement": "The system shall let development staff link people into a household for combined giving history and a single annual statement, without merging their records.", "rationale": "Couples often give jointly and expect one statement.", "acceptance": ["Staff link two people into one household with a defined head", "The household giving total equals the sum of its members' gifts", "Unlinking restores separate statements from the next period"], "priority": "Could", "phase": "Phase 2", "type": "Functional", "actors": ["Development staff"], "journeys": ["J-13"], "brd_ref": [], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Valuable but not needed to retire the old systems; a workaround exists in Phase 1.", "domain_name": "Donations and tribute gifts", "group": "G2"}, {"id": "DON-019", "domain": "DON", "title": "Donation page performance and accessibility", "statement": "The system shall deliver the donation page and its form to WCAG 2.2 AA with a Largest Contentful Paint of 2.5 seconds or less at the 75th percentile on a mid-range mobile device.", "rationale": "The page is the revenue entry point and serves older readers.", "acceptance": ["An accessibility audit finds no WCAG 2.2 AA failures on the donation flow", "Field-measured LCP at p75 is 2.5 s or less over 30 days", "The form completes with keyboard only and a screen reader"], "priority": "Must", "phase": "Phase 1", "type": "Non-functional", "actors": ["Donor"], "journeys": ["J-04"], "brd_ref": ["NFR-002", "BR-007"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Donations share checkout and receipts with subscriptions, and recurring donors would otherwise stay on the old setup.", "domain_name": "Donations and tribute gifts", "group": "G2"}, {"id": "DON-020", "domain": "DON", "title": "Immediate donation acknowledgement", "statement": "The system shall display a confirmation page and email an acknowledgement within 60 seconds of a successful donation, stating the fund, frequency and that a tax receipt follows.", "rationale": "Donors expect instant reassurance.", "acceptance": ["Given a successful payment, then the confirmation page shows a reference number", "The acknowledgement email arrives within 60 seconds in 95% of cases", "The email is sent in the donor's language and contains no card data"], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Donor"], "journeys": ["J-04", "J-05"], "brd_ref": [], "source": "New (this BRS)", "open_items": ["OI-02"], "notes": "", "phase_reason": "Donations share checkout and receipts with subscriptions, and recurring donors would otherwise stay on the old setup.", "domain_name": "Donations and tribute gifts", "group": "G2"}, {"id": "EDW-001", "domain": "EDW", "title": "Idea capture", "statement": "The system shall let authorised users capture an editorial idea with owner, source, audience, theme, proposed issue, sensitivity, rights status and decision status.", "rationale": "Ideas currently live in email and spreadsheets and are lost or duplicated.", "acceptance": ["Given an editor, when an idea is saved, then all eight fields are stored and the idea appears in the idea list filtered by status.", "An idea cannot move to Approved without an owner and a decision status.", "Each idea shows its creator and creation date and its change history."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Editor", "Managing editor"], "journeys": ["J-11"], "brd_ref": ["FR-014"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Editorial workflow is the largest change for staff and touches print cut-offs, so it follows once the commerce platform is stable. Phase 1 keeps basic publishing only.", "domain_name": "Editorial workflow and authoring", "group": "G3"}, {"id": "EDW-002", "domain": "EDW", "title": "Contributor assignments", "statement": "The system shall let editors create an assignment for an internal or external contributor with brief, word count, content type, rights terms, target issue, milestones, deadline and required reviews.", "rationale": "Assignments must be traceable from brief to published article.", "acceptance": ["Given a new assignment, when it is sent, then the contributor sees brief, word count, deadline and rights terms.", "Milestone dates generate reminders per requirement EDW-025.", "An assignment records every change to deadline or word count with who and when."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Contributor", "Editor"], "journeys": ["J-11", "J-15"], "brd_ref": ["FR-015"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Editorial workflow is the largest change for staff and touches print cut-offs, so it follows once the commerce platform is stable. Phase 1 keeps basic publishing only.", "domain_name": "Editorial workflow and authoring", "group": "G3"}, {"id": "EDW-003", "domain": "EDW", "title": "Contributor submission portal", "statement": "The system shall let a contributor submit an unsolicited or future-issue proposal or manuscript, accept submission terms, and upload supporting files through a secure web portal.", "rationale": "Author submission is part of the unified publishing model and today runs through email.", "acceptance": ["Given a registered contributor, when a manuscript is submitted, then terms acceptance is recorded with date and version of the terms.", "Supporting files up to 100 MB each upload with a visible progress indicator and virus scan result.", "The submission receives a unique reference shown to the contributor."], "priority": "Must", "phase": "Phase 2", "type": "Functional", "actors": ["Contributor"], "journeys": ["J-15"], "brd_ref": ["FR-016"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Editorial workflow is the largest change for staff and touches print cut-offs, so it follows once the commerce platform is stable. Phase 1 keeps basic publishing only.", "domain_name": "Editorial workflow and authoring", "group": "G3"}, {"id": "EDW-004", "domain": "EDW", "title": "Contributor status visibility", "statement": "The system shall show a contributor the status of each submission and send status updates, without exposing internal notes, review comments marked internal, or other contributors' data.", "rationale": "Contributors need clarity without seeing internal editorial deliberation.", "acceptance": ["Given an internal note on a submission, when the contributor views it, then the note is not displayed or retrievable by any contributor-facing screen or API.", "A status change generates an email to the contributor within 5 minutes.", "A contributor can view only their own submissions."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Contributor", "Editor"], "journeys": ["J-15"], "brd_ref": ["FR-016"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Editorial workflow is the largest change for staff and touches print cut-offs, so it follows once the commerce platform is stable. Phase 1 keeps basic publishing only.", "domain_name": "Editorial workflow and authoring", "group": "G3"}, {"id": "EDW-005", "domain": "EDW", "title": "Recurring column setup", "statement": "The system shall let editors configure recurring columns with default author, cadence, issue placeholders, template metadata and substitute authors.", "rationale": "Regular columns repeat every issue and should not be rebuilt by hand.", "acceptance": ["Given a monthly column, when an issue is created, then a placeholder with the default author and template metadata is generated.", "A substitute author can be assigned for one issue without changing the default.", "Changing cadence updates future placeholders only."], "priority": "Could", "phase": "Phase 2", "type": "Functional", "actors": ["Editor", "Managing editor"], "journeys": ["J-11"], "brd_ref": ["FR-017"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Refinement of the editorial workflow; follows the core workflow in the same phase.", "domain_name": "Editorial workflow and authoring", "group": "G3"}, {"id": "EDW-006", "domain": "EDW", "title": "Editorial calendar", "statement": "The system shall show issue, article, campaign, deadline, review, proof and publication events in calendar and list views with filters and export.", "rationale": "The managing editor needs one view of what is due and what is late.", "acceptance": ["Calendar and list views show the same events and the same filters (issue, owner, status, date range).", "Export to CSV produces one row per event with ID, type, owner, due date and status.", "Overdue items are visibly flagged in both views."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Managing editor", "Marketing"], "journeys": ["J-11"], "brd_ref": ["FR-018"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Editorial workflow is the largest change for staff and touches print cut-offs, so it follows once the commerce platform is stable. Phase 1 keeps basic publishing only.", "domain_name": "Editorial workflow and authoring", "group": "G3"}, {"id": "EDW-007", "domain": "EDW", "title": "Configurable workflow", "statement": "The system shall let authorised administrators configure workflow states, allowed transitions, mandatory fields, role permissions, SLAs, delegation and substitutes without a code deployment.", "rationale": "Editorial process changes must not wait for a developer release.", "acceptance": ["Given an administrator, when a new state and transition are added, then they take effect for new items in the next session without redeployment.", "A transition is refused if a mandatory field is empty or the user lacks the role.", "Every workflow change is recorded in the audit log with before and after values."], "priority": "Must", "phase": "Phase 2", "type": "Functional", "actors": ["Managing editor", "System administrator"], "journeys": ["J-11"], "brd_ref": ["FR-019"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Editorial workflow is the largest change for staff and touches print cut-offs, so it follows once the commerce platform is stable. Phase 1 keeps basic publishing only.", "domain_name": "Editorial workflow and authoring", "group": "G3"}, {"id": "EDW-008", "domain": "EDW", "title": "Visual block editor", "statement": "The system shall provide an accessible visual editor that exposes the approved structured content blocks, validation, version status and publication readiness, without requiring editors to work in JSON, XML, HTML, CSS or template code.", "rationale": "Editors are not technical and the structured content model is the single source for digital and print.", "acceptance": ["Given a trained editor, when an article is written and saved, then no technical markup is shown or required at any step.", "Validation errors appear next to the offending block in plain language.", "The editor itself meets WCAG 2.2 AA when tested with a screen reader and keyboard only."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Copy editor", "Editor"], "journeys": ["J-11"], "brd_ref": ["FR-020", "FR-056", "BR-002"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Minimum authoring and publishing to keep content flowing from day one.", "domain_name": "Editorial workflow and authoring", "group": "G3"}, {"id": "EDW-009", "domain": "EDW", "title": "Revision history and comments", "statement": "The system shall keep tracked revisions or equivalent change history, support comments and annotations at text and asset level, and preserve authorship attribution for every change.", "rationale": "Reviewers must see who changed what and why.", "acceptance": ["Given an edit by a copy editor, when the article is viewed, then the change shows author, time and the text before and after.", "A comment can be attached to a selected text range or to an image and resolved by a named user.", "Authorship attribution is retained after publication and is not editable."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Contributor", "Copy editor", "Editor"], "journeys": ["J-11"], "brd_ref": ["FR-020"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Editorial workflow is the largest change for staff and touches print cut-offs, so it follows once the commerce platform is stable. Phase 1 keeps basic publishing only.", "domain_name": "Editorial workflow and authoring", "group": "G3"}, {"id": "EDW-010", "domain": "EDW", "title": "Version comparison", "statement": "The system shall let users compare any two versions of a manuscript and identify additions, deletions, metadata changes and reviewer decisions.", "rationale": "Reviewers and authors need to see exactly what changed between drafts.", "acceptance": ["Given versions 2 and 5, when compared, then additions and deletions are highlighted at word level.", "Metadata changes and reviewer decisions between the two versions are listed.", "The comparison can be opened without altering either version."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Contributor", "Editor", "Reviewer"], "journeys": ["J-11"], "brd_ref": ["FR-021"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Editorial workflow is the largest change for staff and touches print cut-offs, so it follows once the commerce platform is stable. Phase 1 keeps basic publishing only.", "domain_name": "Editorial workflow and authoring", "group": "G3"}, {"id": "EDW-011", "domain": "EDW", "title": "Separate mandatory reviews", "statement": "The system shall allow copy, theological, language, legal or rights, and publisher reviews to be assigned separately, to record their outcomes, and to block publication when a review is configured as mandatory.", "rationale": "Theological and rights approvals are controls, not suggestions.", "acceptance": ["Given a mandatory theological review that is not approved, when publication is attempted, then the system blocks it and names the missing review.", "Each review records reviewer, outcome, date and comments.", "Reviews can run in parallel or in sequence as configured."], "priority": "Must", "phase": "Phase 2", "type": "Functional", "actors": ["Publisher", "Reviewer", "Theological reviewer"], "journeys": ["J-11"], "brd_ref": ["FR-022"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Editorial workflow is the largest change for staff and touches print cut-offs, so it follows once the commerce platform is stable. Phase 1 keeps basic publishing only.", "domain_name": "Editorial workflow and authoring", "group": "G3"}, {"id": "EDW-012", "domain": "EDW", "title": "Return for changes", "statement": "The system shall let a reviewer return content to a named owner with reasons, required changes and a due date, preserve the review history, and create a new immutable version on resubmission.", "rationale": "Rework cycles must be traceable and prior versions must never be overwritten.", "acceptance": ["Given a returned article, when the owner resubmits, then a new version is created and the previous version stays unchanged and readable.", "The return message includes reason, required changes and due date.", "Review history lists every return and resubmission in order."], "priority": "Must", "phase": "Phase 2", "type": "Functional", "actors": ["Contributor", "Editor", "Reviewer"], "journeys": ["J-11"], "brd_ref": ["FR-023"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Editorial workflow is the largest change for staff and touches print cut-offs, so it follows once the commerce platform is stable. Phase 1 keeps basic publishing only.", "domain_name": "Editorial workflow and authoring", "group": "G3"}, {"id": "EDW-013", "domain": "EDW", "title": "Issue assembly", "statement": "The system shall let managing editors assign approved content to issue sections, order stories, and see what is missing in each issue including assets, approvals, rights, translations and print elements.", "rationale": "An issue is not ready until every dependency is visible.", "acceptance": ["Given an issue with a missing image, when the managing editor opens it, then the gap is listed with the responsible person.", "Stories can be reordered by drag and drop or by number and the order persists.", "Completeness is shown as a count of ready versus total items."], "priority": "Must", "phase": "Phase 2", "type": "Functional", "actors": ["Managing editor"], "journeys": ["J-11"], "brd_ref": ["FR-024"], "source": "Amended BRD", "open_items": ["OI-08"], "notes": "", "phase_reason": "Editorial workflow is the largest change for staff and touches print cut-offs, so it follows once the commerce platform is stable. Phase 1 keeps basic publishing only.", "domain_name": "Editorial workflow and authoring", "group": "G3"}, {"id": "EDW-014", "domain": "EDW", "title": "Readiness status", "statement": "The system shall compute a readiness status for each article and issue from configurable mandatory checks and allow an override only by an authorised role with a recorded reason.", "rationale": "Publishing decisions need an objective test.", "acceptance": ["Given any failed mandatory check, when readiness is computed, then the status is Not Ready and the failed checks are listed.", "An override requires an authorised role and a free-text reason, and appears in the audit log.", "Changing a check configuration recomputes readiness for open items within 5 minutes."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Managing editor", "Publisher"], "journeys": ["J-11"], "brd_ref": ["FR-025"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Editorial workflow is the largest change for staff and touches print cut-offs, so it follows once the commerce platform is stable. Phase 1 keeps basic publishing only.", "domain_name": "Editorial workflow and authoring", "group": "G3"}, {"id": "EDW-015", "domain": "EDW", "title": "Scheduled publishing", "statement": "The system shall let authorised publishers schedule, preview, publish, unpublish, embargo, correct and republish content by channel, country, language and time zone.", "rationale": "Content goes out on different dates to different audiences.", "acceptance": ["Given a scheduled article, when the time arrives in the chosen time zone, then it becomes visible to entitled readers within 60 seconds.", "An embargoed article is not retrievable by public pages, search, feeds or APIs before its release time.", "Unpublishing removes the article from public pages and search within 5 minutes."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Publisher"], "journeys": ["J-11"], "brd_ref": ["FR-026"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Minimum authoring and publishing to keep content flowing from day one.", "domain_name": "Editorial workflow and authoring", "group": "G3"}, {"id": "EDW-016", "domain": "EDW", "title": "Post-publication corrections", "statement": "The system shall retain the prior version of a corrected article, record reason and approver, optionally display a correction notice, and propagate the correction to search and cached channels.", "rationale": "Corrections are a trust and legal matter and must leave an audit trail.", "acceptance": ["Given a correction, when published, then the prior version remains retrievable by authorised staff.", "If the notice option is on, a visible correction notice appears on the article.", "Search results and cached pages show the corrected text within 10 minutes."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Editor", "Publisher"], "journeys": ["J-11"], "brd_ref": ["FR-027"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Minimum authoring and publishing to keep content flowing from day one.", "domain_name": "Editorial workflow and authoring", "group": "G3"}, {"id": "EDW-017", "domain": "EDW", "title": "Word manuscript import", "statement": "The system shall let editors import a Microsoft Word manuscript or paste Word content, preserving supported headings, emphasis, lists, footnotes, endnotes and basic tables, removing unsupported layout and styling, and presenting a reviewable conversion report before saving.", "rationale": "Most manuscripts arrive as Word files and retyping them is not acceptable.", "acceptance": ["Given a real Liguorian manuscript, when imported, then headings, emphasis, lists, footnotes and tables map to the structured blocks.", "A conversion report lists every element converted, altered or dropped before the editor accepts.", "Tested on at least 20 real manuscripts before acceptance with a documented pass rate."], "priority": "Must", "phase": "Phase 2", "type": "Functional", "actors": ["Contributor", "Editor"], "journeys": ["J-11", "J-15"], "brd_ref": ["FR-057"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Editorial workflow is the largest change for staff and touches print cut-offs, so it follows once the commerce platform is stable. Phase 1 keeps basic publishing only.", "domain_name": "Editorial workflow and authoring", "group": "G3"}, {"id": "EDW-018", "domain": "EDW", "title": "Lossless conversion reporting", "statement": "The system shall make Word-to-structured-content conversion deterministic and observable, and shall surface unsupported content for human decision rather than silently discarding or flattening it.", "rationale": "Silent loss of footnotes or quotations damages the work.", "acceptance": ["Importing the same file twice produces identical structured content.", "Every unsupported element appears in the conversion report with a required disposition (keep, convert manually, discard).", "Zero elements are lost without an entry in the report."], "priority": "Must", "phase": "Phase 2", "type": "Non-functional", "actors": ["Editor", "System administrator"], "journeys": ["J-11"], "brd_ref": ["NFR-018"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Editorial workflow is the largest change for staff and touches print cut-offs, so it follows once the commerce platform is stable. Phase 1 keeps basic publishing only.", "domain_name": "Editorial workflow and authoring", "group": "G3"}, {"id": "EDW-019", "domain": "EDW", "title": "Governed presentation types", "statement": "The system shall let authorised users assign a governed presentation type (Feature Article, Reflection, Interview, Editorial, Regular Column, News or Commentary) that applies approved responsive typography, spacing, image treatment, pull quotes, headings, sidebars and related-content components without manual page layout.", "rationale": "Consistent presentation without designer involvement for each article.", "acceptance": ["Given an article with type Interview, when published, then the Interview layout renders on mobile, tablet and desktop with no manual layout steps.", "Editors cannot alter typography or spacing outside the approved type.", "Changing the type re-renders the article without data loss."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Editor", "Publisher"], "journeys": ["J-11"], "brd_ref": ["FR-058"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Editorial workflow is the largest change for staff and touches print cut-offs, so it follows once the commerce platform is stable. Phase 1 keeps basic publishing only.", "domain_name": "Editorial workflow and authoring", "group": "G3"}, {"id": "EDW-020", "domain": "EDW", "title": "Multi-state editorial preview", "statement": "The system shall let editors preview draft and scheduled articles in representative mobile, tablet and web states, including locale, entitlement state, theme, media and accessibility settings, before publication.", "rationale": "Editors must see what a subscriber, a guest and a Spanish reader will see.", "acceptance": ["Given a draft, when previewed as Guest, then the paywall state shows exactly as readers see it.", "Preview supports mobile, tablet and desktop widths and light and dark themes.", "A preview link is accessible only to authorised staff and expires after 7 days."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Editor", "Publisher"], "journeys": ["J-11"], "brd_ref": ["FR-059"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Editorial workflow is the largest change for staff and touches print cut-offs, so it follows once the commerce platform is stable. Phase 1 keeps basic publishing only.", "domain_name": "Editorial workflow and authoring", "group": "G3"}, {"id": "EDW-021", "domain": "EDW", "title": "Digital and print production notes", "statement": "The system shall provide permission-controlled digital-publication notes and print-production notes on each article record that are versioned, searchable and auditable, and excluded from public output unless explicitly mapped.", "rationale": "Production staff pass instructions to each other and these must never leak to readers.", "acceptance": ["Given a print production note, when the article is published, then the note does not appear on any public page, feed or API.", "Notes record author and date for every edit and are searchable by authorised staff.", "Access to each note type is limited by role."], "priority": "Could", "phase": "Phase 2", "type": "Functional", "actors": ["Editor", "Print production"], "journeys": ["J-11"], "brd_ref": ["FR-060"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Refinement of the editorial workflow; follows the core workflow in the same phase.", "domain_name": "Editorial workflow and authoring", "group": "G3"}, {"id": "EDW-022", "domain": "EDW", "title": "Editorial usability gate", "statement": "The system shall pass a usability test in which representative Liguorian editorial staff complete authoring, import review, media selection, preview and approval journeys without technical-format knowledge or developer help.", "rationale": "Functional completeness is worthless if editors cannot use it.", "acceptance": ["At least 5 representative staff each complete all five journeys unassisted.", "Task success rate is at least 90% and any critical usability problem is fixed before launch.", "Results are documented and signed off by the managing editor."], "priority": "Must", "phase": "Phase 2", "type": "Non-functional", "actors": ["Editor", "Managing editor"], "journeys": ["J-11"], "brd_ref": ["NFR-017"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Editorial workflow is the largest change for staff and touches print cut-offs, so it follows once the commerce platform is stable. Phase 1 keeps basic publishing only.", "domain_name": "Editorial workflow and authoring", "group": "G3"}, {"id": "EDW-023", "domain": "EDW", "title": "No public comments at launch", "statement": "The system shall not provide public comments, direct messaging or reader-to-reader profiles at launch, and no other capability shall depend on them.", "rationale": "These features need moderation and safeguarding staff that do not yet exist.", "acceptance": ["No public comment, message or reader profile feature is present in the launch release.", "The architecture review confirms no launch feature depends on one.", "Any later introduction goes through a formal change request."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Publisher"], "journeys": [], "brd_ref": ["FR-055"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Minimum authoring and publishing to keep content flowing from day one.", "domain_name": "Editorial workflow and authoring", "group": "G3"}, {"id": "EDW-024", "domain": "EDW", "title": "Reader letters", "statement": "The system shall let readers submit letters under moderation terms, and let editors review, redact private data, obtain publication consent and publish selected letters with provenance.", "rationale": "A letters page is traditional but needs consent and privacy handling.", "acceptance": ["Given a submitted letter, when an editor redacts a name, then the original is kept privately and the published version shows the redaction.", "Publication requires recorded consent from the writer.", "Unpublished letters are never visible to the public."], "priority": "Could", "phase": "Phase 2", "type": "Functional", "actors": ["Editor"], "journeys": ["J-11"], "brd_ref": ["FR-052"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Refinement of the editorial workflow; follows the core workflow in the same phase.", "domain_name": "Editorial workflow and authoring", "group": "G3"}, {"id": "EDW-025", "domain": "EDW", "title": "Reminders and escalations", "statement": "The system shall send reminders and escalate overdue workflow tasks to a named substitute or manager using SLA rules configured by administrators.", "rationale": "Late reviews are the main cause of missed issue deadlines.", "acceptance": ["Given a review overdue by its SLA, when the escalation threshold is reached, then the substitute is notified and the item is flagged on the calendar.", "Reminder and escalation timings are configurable without code deployment.", "Every reminder and escalation is logged."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Managing editor", "System administrator"], "journeys": ["J-11"], "brd_ref": ["FR-019"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Refinement of the editorial workflow; follows the core workflow in the same phase.", "domain_name": "Editorial workflow and authoring", "group": "G3"}, {"id": "EDW-026", "domain": "EDW", "title": "Print handoff from structured content", "statement": "The system shall provide approved structured content, metadata and media to print production in a documented format so that print-ready output is produced from the same approved source as digital.", "rationale": "Print and digital must not diverge, and mailing cutoffs must not be disturbed.", "acceptance": ["Given an approved issue, when exported, then the package contains text, metadata, rendition-approved images and print notes in the documented format.", "A diff between exported text and published text shows no differences.", "The export completes within the print schedule agreed with the mail house."], "priority": "Should", "phase": "Phase 2", "type": "Integration", "actors": ["Managing editor", "Print production"], "journeys": ["J-11"], "brd_ref": ["BR-002", "BR-009"], "source": "Amended BRD", "open_items": ["OI-08"], "notes": "", "phase_reason": "Print handoff stays on the current process in Phase 1 to protect print deadlines; automation follows the workflow.", "domain_name": "Editorial workflow and authoring", "group": "G3"}, {"id": "DAM-001", "domain": "DAM", "title": "Media upload and originals", "statement": "The system shall let authorised users upload, version and search images, documents, audio and video and shall preserve the highest-quality approved original of every asset.", "rationale": "Print needs high resolution and web needs small files; the original must never be lost.", "acceptance": ["Given an upload, when saved, then the original file is stored unmodified with a checksum.", "Uploading a new version keeps earlier versions retrievable.", "Search finds assets by title, caption, credit, tag and date."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Content administrator", "Editor"], "journeys": ["J-11"], "brd_ref": ["FR-028"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Rights, accessibility text and privacy separation are legal or compliance duties from first publish.", "domain_name": "Media, rights and metadata", "group": "G3"}, {"id": "DAM-002", "domain": "DAM", "title": "Renditions and focal points", "statement": "The system shall let users crop, set focal points and generate and approve renditions for web, mobile and print.", "rationale": "Images must look right on every screen without manual re-cropping.", "acceptance": ["Given a focal point, when a rendition is generated at any aspect ratio, then the focal point stays inside the frame.", "Renditions are generated automatically and need approval before first use.", "Each rendition records the original it came from."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Content administrator", "Editor"], "journeys": ["J-11"], "brd_ref": ["FR-028"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Media management beyond rights and accessibility follows the editorial workflow it serves.", "domain_name": "Media, rights and metadata", "group": "G3"}, {"id": "DAM-003", "domain": "DAM", "title": "Duplicate detection", "statement": "The system shall detect likely duplicate assets at upload and warn the user before saving.", "rationale": "Duplicates waste storage and cause inconsistent rights records.", "acceptance": ["Given an identical file already stored, when uploaded, then a warning links to the existing asset.", "Near-duplicates above a configurable similarity threshold are flagged.", "The user can choose to reuse, replace or keep both."], "priority": "Could", "phase": "Phase 2", "type": "Functional", "actors": ["Content administrator"], "journeys": ["J-11"], "brd_ref": ["FR-028"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Media management beyond rights and accessibility follows the editorial workflow it serves.", "domain_name": "Media, rights and metadata", "group": "G3"}, {"id": "DAM-004", "domain": "DAM", "title": "Required captions, credits and alt text", "statement": "The system shall require caption, credit and alternative text on every image before it can be published, with a documented exception for decorative images.", "rationale": "Accessibility and attribution are legal and mission requirements.", "acceptance": ["Given an image without alt text, when included in an article, then readiness fails.", "Decorative images can be marked decorative with the reason recorded.", "Credit text appears with the image on every channel."], "priority": "Must", "phase": "Phase 1", "type": "Compliance", "actors": ["Editor"], "journeys": ["J-11"], "brd_ref": ["FR-028", "BR-007"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Rights, accessibility text and privacy separation are legal or compliance duties from first publish.", "domain_name": "Media, rights and metadata", "group": "G3"}, {"id": "DAM-005", "domain": "DAM", "title": "Media restriction, expiry and archive", "statement": "The system shall let authorised users restrict, expire, archive and reuse assets and shall show where each asset is used.", "rationale": "Licences end and assets must stop appearing.", "acceptance": ["Given an asset past its expiry date, when a page is built, then the asset is not served and the editor is notified.", "Archived assets stay retrievable by authorised staff but cannot be added to new articles.", "A usage list shows every article and issue using the asset."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Content administrator", "Editor"], "journeys": ["J-11"], "brd_ref": ["FR-028"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Media management beyond rights and accessibility follows the editorial workflow it serves.", "domain_name": "Media, rights and metadata", "group": "G3"}, {"id": "DAM-006", "domain": "DAM", "title": "Rights record", "statement": "The system shall store territory, language, channel, date, contributor, reuse and accessibility rights for each content item and asset.", "rationale": "Rights vary by country and channel and are not stored consistently today.", "acceptance": ["Given an asset, when its rights are viewed, then territory, language, channel, start date, end date and reuse terms are present.", "Rights can be set at item or asset level and inherited by renditions.", "Rights changes are recorded in the audit log."], "priority": "Must", "phase": "Phase 1", "type": "Data", "actors": ["Publisher", "Rights administrator"], "journeys": ["J-11"], "brd_ref": ["FR-029", "BR-004"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Rights, accessibility text and privacy separation are legal or compliance duties from first publish.", "domain_name": "Media, rights and metadata", "group": "G3"}, {"id": "DAM-007", "domain": "DAM", "title": "Rights enforcement", "statement": "The system shall prevent publication or download of any content or asset that the rights record disallows for the destination territory, language or channel.", "rationale": "Rights breaches create legal exposure.", "acceptance": ["Given an asset not cleared for a territory, when a reader in that territory requests the page, then the asset is withheld.", "Attempted publication of a disallowed item is blocked with the reason shown.", "Blocked attempts are logged."], "priority": "Must", "phase": "Phase 1", "type": "Compliance", "actors": ["Publisher", "Rights administrator"], "journeys": ["J-07", "J-11"], "brd_ref": ["FR-029"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Rights, accessibility text and privacy separation are legal or compliance duties from first publish.", "domain_name": "Media, rights and metadata", "group": "G3"}, {"id": "DAM-008", "domain": "DAM", "title": "Archive rights clearance", "statement": "The system shall record the rights and permission status of every digitised back-issue item and shall keep uncleared items out of public access until cleared.", "rationale": "Old issues include third-party material whose rights are unknown.", "acceptance": ["Given an archive item with status Uncleared, when a reader searches, then the item is not listed.", "Rights status can be bulk updated by an authorised administrator with a reason.", "A report lists archive items by rights status."], "priority": "Should", "phase": "Phase 2", "type": "Compliance", "actors": ["Rights administrator"], "journeys": ["J-14"], "brd_ref": ["FR-029"], "source": "New (this BRS)", "open_items": ["OI-12"], "notes": "", "phase_reason": "Media management beyond rights and accessibility follows the editorial workflow it serves.", "domain_name": "Media, rights and metadata", "group": "G3"}, {"id": "DAM-009", "domain": "DAM", "title": "Public author pages", "statement": "The system shall publish author pages showing approved biography, image, role, disclosure, social links and content, only after the author record is approved.", "rationale": "Readers expect to know who is writing.", "acceptance": ["Given an approved author, when the page is opened, then the biography, image, role and article list are displayed.", "An unapproved field is not displayed publicly.", "Author pages are available in each supported language where translated."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Editor", "Subscriber"], "journeys": ["J-07"], "brd_ref": ["FR-030"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Media management beyond rights and accessibility follows the editorial workflow it serves.", "domain_name": "Media, rights and metadata", "group": "G3"}, {"id": "DAM-010", "domain": "DAM", "title": "Contributor private data separation", "statement": "The system shall store contributor payment and tax data separately from public author data and restrict access to named finance roles.", "rationale": "Tax identifiers and bank details must not be exposed to editors or readers.", "acceptance": ["Given an editor account, when it opens a contributor record, then payment and tax fields are not visible.", "Access to the private data is logged.", "Private data is excluded from every public API and export unless explicitly authorised."], "priority": "Must", "phase": "Phase 1", "type": "Compliance", "actors": ["Editor", "Finance"], "journeys": ["J-12"], "brd_ref": ["FR-030"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Rights, accessibility text and privacy separation are legal or compliance duties from first publish.", "domain_name": "Media, rights and metadata", "group": "G3"}, {"id": "DAM-011", "domain": "DAM", "title": "Controlled taxonomy", "statement": "The system shall let authorised users manage topics, themes, series, content types, audiences, liturgical seasons, Scripture references, countries and languages as controlled lists.", "rationale": "Consistent tagging drives search, recommendations and reporting.", "acceptance": ["Given a new topic, when added, then it is available for tagging immediately.", "Terms have unique identifiers that do not change when labels are edited.", "Terms can carry labels in each supported language."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Content administrator", "Editor"], "journeys": ["J-11"], "brd_ref": ["FR-031"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Media management beyond rights and accessibility follows the editorial workflow it serves.", "domain_name": "Media, rights and metadata", "group": "G3"}, {"id": "DAM-012", "domain": "DAM", "title": "Term merge, synonyms and redirects", "statement": "The system shall support controlled synonyms and the merging of taxonomy terms, with redirects from retired terms to their replacements.", "rationale": "Taxonomies change and old links must continue to work.", "acceptance": ["Given two merged terms, when a reader opens the old term URL, then they are redirected to the surviving term.", "Items tagged with a merged term are retagged automatically.", "Synonyms are included in search matching."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Content administrator"], "journeys": ["J-11"], "brd_ref": ["FR-031"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Media management beyond rights and accessibility follows the editorial workflow it serves.", "domain_name": "Media, rights and metadata", "group": "G3"}, {"id": "MKT-001", "domain": "MKT", "title": "Governed campaign pages", "statement": "The system shall let Marketing assemble campaign pages from approved components, apply offer eligibility and consent rules, preview by language and device, and schedule publication.", "rationale": "Campaigns launch without developers and without breaking brand or consent rules.", "acceptance": ["Given Marketing builds a page from approved components, then it publishes at the scheduled time without engineering help.", "Given a component is not approved, then it cannot be added.", "Preview shows phone, tablet and desktop in both languages."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Marketing"], "journeys": ["J-01"], "brd_ref": ["FR-043"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Campaign tooling follows once there is live data; Phase 1 keeps the compliance and renewal basics.", "domain_name": "Marketing, campaigns and communications", "group": "G4"}, {"id": "MKT-002", "domain": "MKT", "title": "Offer eligibility rules", "statement": "The system shall apply offer rules for new, renewing, lapsed, gift and institutional customers, and shall prevent a customer receiving an offer they are not eligible for.", "rationale": "Stops discount abuse and confusing offers.", "acceptance": ["Given an offer limited to new subscribers, then an existing subscriber cannot redeem it.", "Given a lapsed subscriber, then the win-back offer is shown and the new-subscriber offer is not.", "Offer redemptions are reported by rule."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Marketing"], "journeys": ["J-01", "J-08"], "brd_ref": [], "source": "New (this BRS)", "open_items": ["OI-14"], "notes": "", "phase_reason": "Campaign tooling follows once there is live data; Phase 1 keeps the compliance and renewal basics.", "domain_name": "Marketing, campaigns and communications", "group": "G4"}, {"id": "MKT-003", "domain": "MKT", "title": "Consent capture and records", "statement": "The system shall record for each consent the person, channel, wording version, language, time and source, and shall keep the record for as long as the consent is relied upon.", "rationale": "Proof of consent is needed for email, texts and cookies.", "acceptance": ["Given a person opts in, then the record holds the five elements.", "Given a regulator request, then the consent history of one person is exported within 1 business day.", "Opt-in is never pre-ticked."], "priority": "Must", "phase": "Phase 1", "type": "Compliance", "actors": ["Marketing", "Subscriber"], "journeys": ["J-08"], "brd_ref": ["FR-012"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Consent, unsubscribe and CAN-SPAM duties apply from the first email sent.", "domain_name": "Marketing, campaigns and communications", "group": "G4"}, {"id": "MKT-004", "domain": "MKT", "title": "Preference centre and one-click unsubscribe", "statement": "The system shall provide a preference centre for topic, frequency, channel and language, and every marketing email shall contain a one-click unsubscribe.", "rationale": "Control over messages reduces complaints and unsubscribes from everything.", "acceptance": ["Given a recipient clicks unsubscribe, then no marketing email is sent to them from that moment and the request is honoured within 24 hours at the latest.", "Given a recipient opens the preference centre, then they can reduce frequency without leaving the list.", "Transactional messages are unaffected by marketing opt-out."], "priority": "Must", "phase": "Phase 1", "type": "Compliance", "actors": ["Donor", "Marketing", "Subscriber"], "journeys": ["J-08"], "brd_ref": ["FR-011"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Consent, unsubscribe and CAN-SPAM duties apply from the first email sent.", "domain_name": "Marketing, campaigns and communications", "group": "G4"}, {"id": "MKT-005", "domain": "MKT", "title": "CAN-SPAM compliance", "statement": "The system shall ensure every commercial email carries accurate sender details, a non-misleading subject line, Liguori's physical postal address and a working opt-out, and shall process opt-outs within the legal limit of 10 business days, with a target of 24 hours.", "rationale": "US law requires it and penalties are per email.", "acceptance": ["Given a sample of 100 campaign emails, then 100 carry sender, postal address and opt-out.", "Given an opt-out, then it is processed within 24 hours in 99 percent of cases and never later than 10 business days.", "Compliance checks run before any campaign sends."], "priority": "Must", "phase": "Phase 1", "type": "Compliance", "actors": ["Marketing"], "journeys": [], "brd_ref": [], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Consent, unsubscribe and CAN-SPAM duties apply from the first email sent.", "domain_name": "Marketing, campaigns and communications", "group": "G4"}, {"id": "MKT-006", "domain": "MKT", "title": "Separate transactional and marketing email", "statement": "The system shall send transactional email, such as receipts and password resets, through separate channels and sender identities from marketing email, so marketing problems do not block transactional delivery.", "rationale": "The RFP requires the separation.", "acceptance": ["Given the marketing channel is suspended, then a test receipt still delivers within 2 minutes.", "Transactional and marketing mail use different sending domains or sub-domains.", "Marketing content does not appear in transactional templates beyond permitted footer links."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Marketing", "System administrator"], "journeys": [], "brd_ref": [], "source": "RFP draft", "open_items": [], "notes": "", "phase_reason": "Consent, unsubscribe and CAN-SPAM duties apply from the first email sent.", "domain_name": "Marketing, campaigns and communications", "group": "G4"}, {"id": "MKT-007", "domain": "MKT", "title": "Email deliverability", "statement": "The system shall authenticate all sending domains with SPF, DKIM and DMARC, process bounces and complaints automatically, suppress addresses that bounce or complain, and keep the complaint rate below 0.1 percent.", "rationale": "Mailbox providers block senders with poor records.", "acceptance": ["DMARC alignment passes on all sending domains in a monthly test.", "Given a hard bounce, then the address is suppressed within 1 hour.", "Complaint rate is reported weekly and stays under 0.1 percent; breach triggers an alert."], "priority": "Should", "phase": "Phase 1", "type": "Non-functional", "actors": ["Marketing", "System administrator"], "journeys": [], "brd_ref": [], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Consent, unsubscribe and CAN-SPAM duties apply from the first email sent.", "domain_name": "Marketing, campaigns and communications", "group": "G4"}, {"id": "MKT-008", "domain": "MKT", "title": "Renewal reminder automation", "statement": "The system shall send renewal reminders on a schedule an administrator sets, for example 60, 30 and 7 days before expiry, on expiry day and after, stopping at once if the customer renews.", "rationale": "Renewals are the largest revenue line and are lost through inattention.", "acceptance": ["Given a subscription expiring in 30 days, then the reminder sequence starts and shows the correct price and expiry date.", "Given the customer renews, then no further reminder is sent.", "Reminders respect language preference and consent."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Marketing", "Subscriber"], "journeys": ["J-08"], "brd_ref": [], "source": "New (this BRS)", "open_items": ["OI-14"], "notes": "", "phase_reason": "Consent, unsubscribe and CAN-SPAM duties apply from the first email sent.", "domain_name": "Marketing, campaigns and communications", "group": "G4"}, {"id": "MKT-009", "domain": "MKT", "title": "Win-back campaigns", "statement": "The system shall identify lapsed subscribers at set intervals after expiry, send win-back messages with an eligible offer and suppress those who renew or opt out.", "rationale": "Lapsed readers are cheaper to regain than new ones.", "acceptance": ["Given a subscriber lapses for 30 days, then they enter the win-back sequence.", "Given they renew, then they leave it within 1 hour.", "Win-back results are reported by offer and message."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Marketing"], "journeys": ["J-08"], "brd_ref": [], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Valuable but not needed to retire the old systems; a workaround exists in Phase 1.", "domain_name": "Marketing, campaigns and communications", "group": "G4"}, {"id": "MKT-010", "domain": "MKT", "title": "Donor stewardship campaigns", "statement": "The system shall send a thank-you within 24 hours of every gift, mark anniversaries and lapses of recurring donors, and personalise messages by giving history, excluding donors who opted out.", "rationale": "Prompt thanks and care drive repeat giving.", "acceptance": ["Given a gift, then a thank-you is sent within 24 hours.", "Given a recurring donor reaches 12 months, then an anniversary message is sent once.", "Given a donor opts out, then no stewardship message is sent."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Development staff", "Donor"], "journeys": ["J-13", "J-05"], "brd_ref": [], "source": "New (this BRS)", "open_items": ["OI-02", "OI-10"], "notes": "", "phase_reason": "Valuable but not needed to retire the old systems; a workaround exists in Phase 1.", "domain_name": "Marketing, campaigns and communications", "group": "G4"}, {"id": "MKT-011", "domain": "MKT", "title": "Event-triggered customer journeys", "statement": "The system shall run triggered sequences for welcome, first issue, unredeemed gift reminders to the buyer and recipient, and failed-payment recovery, with each step editable by Marketing.", "rationale": "Timely messages complete journeys that would otherwise stall.", "acceptance": ["Given a gift is unredeemed 30 days after purchase, then the recipient receives a reminder and the buyer is told.", "Given a failed payment, then the recovery sequence starts within 1 hour.", "Journey steps can be edited without engineering."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Gift buyer", "Gift recipient", "Marketing"], "journeys": ["J-02", "J-03", "J-08"], "brd_ref": [], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Valuable but not needed to retire the old systems; a workaround exists in Phase 1.", "domain_name": "Marketing, campaigns and communications", "group": "G4"}, {"id": "MKT-012", "domain": "MKT", "title": "Controlled experiments", "statement": "The system shall require, for any A/B or multivariate test, a hypothesis, owner, audience, duration, privacy review and stopping rule, and shall exclude consent and payment screens from testing.", "rationale": "Experiments must not damage compliance or revenue.", "acceptance": ["Given a test without owner and hypothesis, then it cannot start.", "Given a consent screen, then it cannot be added to a test.", "Results are stored with the decision made."], "priority": "Could", "phase": "Phase 3", "type": "Functional", "actors": ["Marketing"], "journeys": [], "brd_ref": ["FR-044"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Experiments and scheduled social need stable traffic and a mature content process.", "domain_name": "Marketing, campaigns and communications", "group": "G4"}, {"id": "MKT-013", "domain": "MKT", "title": "Durable QR destinations", "statement": "The system shall create QR codes whose destination can be changed after printing, and report scans by campaign without storing personal data.", "rationale": "Print inserts and ads need codes that outlive a campaign.", "acceptance": ["Given a printed code, when the destination is changed, then the same code opens the new destination within 5 minutes.", "Scan reports include counts by campaign and day and no personal data."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Marketing"], "journeys": [], "brd_ref": ["FR-053"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Valuable but not needed to retire the old systems;
