sing]", "tier": "free", "free": "Existing Liguori licence. The platform only produces a journal file.", "fconf": "Certain"}, {"id": "TS-34", "layer": "Operations and finance", "name": "Mail-house exchange", "role": "Sends the print mailing list to the mail house and receives returns and claims.", "pick": "Secure file transfer or API, built by the delivery vendor", "url": "", "alts": [], "why": "The mail house is an external party with its own format. A scheduled export with a receipt check is the simplest dependable design.", "config": "Cut-off calendar; frozen list per issue; returned-mail file import (FUL).", "cost": "Build effort.", "risk": "Format and cut-off agreement with the mail house is a dependency (D-series).", "covers": ["FUL"], "phase": "Phase 1", "status": "Build", "conf": "[Likely]", "tier": "build", "free": "Built by the delivery vendor.", "fconf": "Certain"}, {"id": "TS-35", "layer": "Operations and finance", "name": "Support desk", "role": "Case handling for customer service with links to the customer record.", "pick": "Help desk product chosen with the vendor (HubSpot Service Hub, Zendesk or Help Scout)", "url": "https://www.helpscout.com", "alts": [{"name": "Zendesk", "url": "https://www.zendesk.com"}, {"name": "HubSpot Service Hub", "url": "https://www.hubspot.com/products/service"}, {"name": "Freshdesk", "url": "https://freshdesk.com"}], "why": "The agent console in the platform does the fixes; the desk only tracks the conversation. Do not buy a heavy product for a small team.", "config": "Customer record link; macros in English and Spanish.", "cost": "Per agent.", "risk": "Case history in a second system; keep key actions in the platform audit log.", "covers": ["BKO"], "phase": "Phase 2", "status": "Provisional", "conf": "[Guessing]", "tier": "quote", "free": "Not verified. Priced per agent. Phase 2.", "fconf": "Guessing"}, {"id": "TS-36", "layer": "Insight", "name": "Reporting and dashboards", "role": "Dashboards for circulation, renewals, donations and reconciliation.", "pick": "Metabase on the reporting copy", "url": "https://www.metabase.com", "alts": [{"name": "Looker Studio", "url": "https://lookerstudio.google.com"}, {"name": "Power BI", "url": "https://powerbi.microsoft.com"}, {"name": "Apache Superset", "url": "https://superset.apache.org"}], "why": "Open source with a hosted option, easy for non-technical staff and priced simply. Definitions come from the KPI dictionary.", "config": "Read-only to the reporting copy; scheduled email reports; row-level access.", "cost": "Hosted plan per user or self-run.", "risk": "Report sprawl; owner named for each dashboard.", "covers": ["RPT"], "phase": "Phase 1", "status": "Recommended", "conf": "[Likely]", "tier": "free", "free": "Open source when self-run on the reporting copy. A hosted plan is paid and unverified.", "fconf": "Likely"}, {"id": "TS-37", "layer": "Insight", "name": "Consent-aware analytics", "role": "Counts visits and reading without breaching consent rules.", "pick": "PostHog (privacy-configured)", "url": "https://posthog.com", "alts": [{"name": "Plausible", "url": "https://plausible.io"}, {"name": "Google Analytics 4", "url": "https://analytics.google.com"}, {"name": "Matomo", "url": "https://matomo.org"}], "why": "First-party and configurable for consent (RPT-012). Avoids sending reader behaviour to an advertising network.", "config": "Opt-in for non-essential tracking; no personal data in event properties.", "cost": "Usage-based.", "risk": "Consent banner wording needs legal review.", "covers": ["RPT", "MKT"], "phase": "Phase 2", "status": "Recommended", "conf": "[Likely]", "tier": "free", "free": "Free: 1M events, 5K session recordings, unlimited team members, and overage events are dropped rather than billed. Fits your scale. Phase 2.", "fconf": "Certain"}, {"id": "TS-38", "layer": "Later phases", "name": "Language model service", "role": "Answers questions grounded in approved Liguori content, with citations.", "pick": "A model provider reached through a cloud service; chosen by a bake-off. Anthropic Claude is one candidate (the author of this document is a Claude model, so score others equally)", "url": "https://www.anthropic.com", "alts": [{"name": "OpenAI", "url": "https://openai.com"}, {"name": "Google Gemini", "url": "https://deepmind.google/technologies/gemini/"}, {"name": "Meta Llama", "url": "https://www.llama.com"}], "why": "Governance matters more than model: approved sources only, abstain on weak evidence, labelled authority tiers (AIX).", "config": "Retrieval over the approved corpus; entitlement-aware; logging of prompts and answers.", "cost": "Usage-based.", "risk": "Hallucination on theological questions; mandatory abstention and reviewer workflow.", "covers": ["AIX"], "phase": "Phase 3", "status": "Later", "conf": "[Guessing]", "tier": "usage", "free": "Usage-based, decided by bake-off. Phase 3.", "fconf": "Likely"}, {"id": "TS-39", "layer": "Later phases", "name": "Vector retrieval", "role": "Finds passages by meaning for the AI features and semantic search.", "pick": "pgvector inside the primary database platform", "url": "https://github.com/pgvector/pgvector", "alts": [{"name": "Pinecone", "url": "https://www.pinecone.io"}, {"name": "Weaviate", "url": "https://weaviate.io"}, {"name": "Meilisearch hybrid search", "url": "https://www.meilisearch.com/docs/learn/ai_powered_search/getting_started_with_ai_search"}], "why": "One fewer system to run at this scale; moves out if volume grows.", "config": "Embeddings for approved content only; re-indexed on content change.", "cost": "Storage and compute within the database.", "risk": "Index growth; revisit at larger corpus sizes.", "covers": ["AIX", "CDL"], "phase": "Phase 3", "status": "Later", "conf": "[Likely]", "tier": "free", "free": "Open source extension inside the database you already pay for.", "fconf": "Certain"}, {"id": "TS-40", "layer": "Later phases", "name": "Native app wrapper", "role": "iOS and Android apps with app-store billing.", "pick": "React Native or a Capacitor wrapper around the PWA, decided at Phase 3", "url": "https://reactnative.dev", "alts": [{"name": "Capacitor", "url": "https://capacitorjs.com"}, {"name": "Flutter", "url": "https://flutter.dev"}], "why": "Not needed until the PWA is proven (OI-16). Store billing adds a separate receipt source into the entitlement ledger.", "config": "Shared API; store receipts validated server-side.", "cost": "Store fees apply to in-app sales.", "risk": "Store rules on subscriptions and donations differ; legal check before design.", "covers": ["NFR", "SUB"], "phase": "Phase 3", "status": "Later", "conf": "[Likely]", "tier": "usage", "free": "Developer accounts and store fees apply (around 15% to 30% of in-app sales). Phase 3.", "fconf": "Likely"}], "extras": {"groups": [{"id": "G1", "name": "Customer experience", "domains": ["IDN", "DSH", "LOC", "CDL"], "color": "#6b153f"}, {"id": "G2", "name": "Commerce and giving", "domains": ["CAT", "SUB", "GFT", "BLK", "PAY", "DON"], "color": "#b0306a"}, {"id": "G3", "name": "Editorial and content", "domains": ["EDW", "DAM"], "color": "#1f6f6b"}, {"id": "G4", "name": "Growth and AI", "domains": ["MKT", "AIX"], "color": "#9a6a00"}, {"id": "G5", "name": "Operations and finance", "domains": ["FUL", "FIN", "BKO", "RPT", "MIG"], "color": "#3b4a8f"}, {"id": "G6", "name": "Platform and hosting", "domains": ["HST", "NFR", "INT"], "color": "#4b5563"}, {"id": "G7", "name": "Tech stack", "domains": [], "color": "#3A0D27"}, {"id": "G8", "name": "Build phases", "domains": [], "color": "#c0562f"}], "envs": [["Production", "Live customers and money. Liguori-owned production account. Multi-zone database, CDN, firewall, 24 hour monitoring.", "Live payment account, live email domain, live search index", "Only the release pipeline deploys; humans have read access and break-glass access that is logged."], ["Staging", "Exact copy of production's shape at smaller size. Used for acceptance tests, load tests and restore rehearsals.", "Payment test mode, sandbox email, masked or synthetic data", "Supplier and Liguori testers. No real card or donor data (HST-023)."], ["Development and preview", "Short-lived environments for each change so reviewers see it before it is merged.", "Test mode everywhere, synthetic data", "Developers. Destroyed automatically after review."], ["Recovery region", "Second geographic region holding locked backup copies; a warm environment is added in Phase 2.", "Copies only until the Phase 2 rehearsal", "Liguori and security account only."]], "stores": [["Transactional database", "Customers, subscriptions, entitlements, orders, gifts, donations, audit trail", "Personal and financial", "Continuous, 35-day point-in-time, second-region copy", "Kept per finance and privacy rules", "Platform vendor operates, Liguori owns"], ["Cache", "Sessions and short-lived entitlement answers", "Personal (short-lived)", "Not backed up; rebuilt from the database", "Minutes", "Platform vendor"], ["Object storage", "Issues, PDFs, images, audio, exports, generated receipts, backups", "Content and personal (receipts)", "Versioned, second-region copy", "Per content and legal rules", "Platform vendor, Liguori owns"], ["Content system dataset", "Articles, issues, pages, authors, rights notes", "Public and unpublished drafts", "Provider backups plus scheduled export to Liguori storage", "Permanent", "CMS provider; Liguori owns the export"], ["Search index", "Searchable copy of content", "Derived", "Not backed up; rebuilt from the content system", "Rebuildable", "Search provider"], ["Payment provider", "Card numbers, payment tokens, payouts", "Card data (never stored by Liguori)", "Provider responsibility; reports exported monthly", "Per card network rules", "Payment provider"], ["CRM and marketing email", "Contact copy, consent state, campaign history", "Personal", "Provider backups; consent reconciled from the platform", "Per privacy rules", "Marketing"], ["Accounting ledger", "Journals, deferred revenue, tax", "Financial", "Ledger provider", "Statutory", "Liguori finance"], ["Reporting copy", "Replica and marts for reports", "Personal and financial (read only)", "Rebuilt from the primary", "Same as primary", "Platform vendor"]], "phases": [{"id": "P1", "name": "Replace and secure", "tag": "Phase 1", "goal": "Move every active subscriber, donor, gift and institution onto the new platform and switch off the old site, the Magento login store and the suspended payment path.", "logic": ["The unsupported site, the lost source code and the suspended gateway are the reasons for the programme. Anything that does not shorten that list can wait.", "Subscriptions, gifts and donations share checkout, identity, tax and receipts. Splitting them across phases would build that machinery twice, so they ship together.", "Parish and school accounts and open gifts already exist on the old system. Leaving them behind would keep the old system alive.", "Hosting, recovery and security come first because no customer data should be loaded into a platform that cannot be restored."], "includes": "Identity, catalogue, subscriptions and entitlements, gifts, institutional accounts, checkout and payments, one-off and recurring donations, tribute gifts, dashboard, reader and delivery, search, English and Spanish journeys, print fulfilment, tax and receipts, core back office, core reporting, migration, hosting foundation, security and compliance, basic publishing.", "excluded": "Full editorial workflow, translation of content, offline reading, campaign tooling, gift and engagement reports, archive migration, AI, native apps, other markets.", "retires": "Legacy subscription website; Magento login store; THINK web touchpoints; flipbook delivery; suspended payment path.", "exit": ["Every active subscriber, donor, open gift and institution is migrated and reconciled to the cent against the legacy records (MIG).", "A full month's finance close is produced from the new ledger export and accepted by Liguori finance.", "One complete issue cycle has reached the mail house from the new fulfilment list with no missed cut-off.", "A backup restore into a clean environment meets the 15 minute and 4 hour targets (HST-009, HST-010).", "Accessibility audit to WCAG 2.2 AA, independent penetration test and PCI SAQ A attestation are passed.", "English and Spanish versions of every purchase, donation, gift and account journey are accepted.", "The old site and login store are switched off with no renewal lapse above the agreed tolerance."], "risks": ["Largest phase by far. If vendors price it as one block, ask for a split into 1a (commerce and identity) and 1b (fulfilment, finance and cutover) with separate gates.", "Card tokens cannot be moved, so some renewals will need a prompt (R-01, OI-05).", "Print deadlines are untouched by design; editorial work is deliberately not changed in this phase."], "needs": "OI-01 ledger, OI-02 receipt entity, OI-03 sales tax states, OI-05 card tokens, OI-14 billing platform, OI-18 account ownership.", "count": 265, "must": 207, "by_domain": {"IDN": 11, "DSH": 14, "LOC": 8, "CDL": 14, "CAT": 9, "SUB": 19, "GFT": 9, "BLK": 7, "PAY": 16, "DON": 16, "EDW": 4, "DAM": 5, "MKT": 6, "FUL": 11, "FIN": 16, "BKO": 16, "RPT": 8, "MIG": 13, "HST": 23, "NFR": 28, "INT": 12}, "stack": ["TS-01", "TS-02", "TS-04", "TS-05", "TS-06", "TS-07", "TS-08", "TS-09", "TS-10", "TS-11", "TS-12", "TS-13", "TS-14", "TS-15", "TS-16", "TS-17", "TS-18", "TS-19", "TS-21", "TS-22", "TS-23", "TS-24", "TS-25", "TS-26", "TS-27", "TS-28", "TS-29", "TS-30", "TS-31", "TS-32", "TS-33", "TS-34", "TS-36"]}, {"id": "P2", "name": "Publish and grow", "tag": "Phase 2", "goal": "Replace how issues are planned, written, reviewed and translated, and add the tools that grow circulation and giving.", "logic": ["The editorial workflow is the biggest change for staff and touches print cut-offs. Doing it while customers are being migrated would put two risky changes on the same calendar.", "Campaign tools, reports on gifts and engagement, and offline reading only add value once there is live data and a stable platform.", "Translation of content depends on the editorial workflow it plugs into."], "includes": "Editorial calendar and workflow, contributor portal, review stages, issue assembly and print handoff, media library depth, translation workflow, offline reading, campaign pages and offers, stewardship and win-back journeys, richer reports, archive migration, further self-service and institutional tools, regional failover rehearsal.", "excluded": "AI, native apps, additional markets and languages.", "retires": "Manual editorial hand-offs by email and shared drives; remaining manual print preparation steps.", "exit": ["One full issue is planned, written, reviewed and handed to print entirely through the new workflow with no off-system step.", "Editors and the managing editor pass the usability gate (EDW-022, NFR-019) with representative staff.", "A Spanish edition of a sample issue is translated and approved in the workflow.", "The annual regional failover rehearsal meets the recovery time (HST-022).", "Campaign and consent records reconcile with the email platform."], "risks": ["Staff adoption, not technology, is the main risk; budget training and a parallel run.", "Print cut-offs: keep the old print preparation route available for the first issue."], "needs": "OI-04 report list, OI-17 phase acceptance.", "count": 92, "must": 10, "by_domain": {"IDN": 5, "DSH": 1, "LOC": 3, "CDL": 10, "CAT": 5, "SUB": 5, "GFT": 3, "BLK": 5, "PAY": 2, "DON": 4, "EDW": 22, "DAM": 7, "MKT": 6, "FUL": 2, "BKO": 3, "RPT": 4, "MIG": 1, "HST": 1, "NFR": 2, "INT": 1}, "stack": ["TS-03", "TS-20", "TS-35", "TS-37"]}, {"id": "P3", "name": "Extend and automate", "tag": "Phase 3", "goal": "Add AI assistance, native apps and further markets on the foundation already proven.", "logic": ["AI features need clean structured content, search and entitlement data, and governance in place. Starting earlier means indexing content that is still being migrated.", "Native apps are only worth their store fees and rules once the PWA proves demand (OI-16).", "New countries, payment methods and languages are configuration on a platform designed for it, but each needs local tax, privacy and address rules."], "includes": "Grounded question answering, hybrid and semantic search, assistive writing and review tools under governance, native iOS and Android apps, other-market payment methods and address rules, further languages, scheduled social posting and controlled experiments, additional regions.", "excluded": "Anything not in the register.", "retires": "None; this phase adds capability.", "exit": ["AI answers cite approved sources, abstain on weak evidence and respect entitlement in testing (AIX-003 to AIX-007).", "Native apps pass store review with billing and entitlement working end to end.", "A new market is added by configuration in a test (HST-025, LOC-012)."], "risks": ["Theological accuracy of AI output; human review stays mandatory.", "App-store billing rules for subscriptions and donations."], "needs": "OI-16 decision, AI governance owner named by Liguori.", "count": 19, "must": 0, "by_domain": {"LOC": 1, "PAY": 2, "MKT": 2, "AIX": 10, "FUL": 1, "BKO": 1, "HST": 1, "NFR": 1}, "stack": ["TS-38", "TS-39", "TS-40"]}], "why_not": [["Split by domain (identity first, then subscriptions, then donations)", "Checkout, tax, receipts and identity are shared. Building them for one domain and extending later duplicates work and delays retiring the old site."], ["Editorial workflow first", "It is the part staff will feel most and it does not remove any legacy risk. It would delay the payment and login replacements that matter most."], ["One big release", "Highest risk of all: migration, new editorial process and new payments on the same weekend. Rejected."], ["Donate page alone first", "Already planned as a separate build. Folded into Phase 1 so donors and subscribers share one identity and receipts."], ["Gifting in Phase 2", "Open gifts exist on the old system and must migrate. Liguori chose Phase 1; the extra build is small once checkout and entitlement exist."]], "timeline": {"rows": [{"id": "T0", "phase": "Phase 0", "name": "Mobilise: RFP, vendor demos, selection, contract, paid discovery", "scope": "Issue the RFP and common RFI, run live demos (OI-14 billing platform), choose one vendor, sign, then a paid discovery of four to six weeks that produces the architecture decision, delivery plan, migration sample and refined cost.", "lo": [1, 4], "hi": [1, 6], "basis": "Discovery length from the cost benchmark (4 to 6 weeks); selection and contracting time is my estimate [Guessing]."}, {"id": "T1", "phase": "Phase 1", "name": "Hosting and security foundation", "scope": "Owned cloud accounts, environments, pipeline, backups, monitoring (HST domain).", "lo": [5, 7], "hi": [7, 9], "basis": "Must precede any customer data load [Likely]."}, {"id": "T2", "phase": "Phase 1", "name": "1a: identity, catalogue, subscriptions, checkout, donations", "scope": "The commerce core: one identity, plans and prices, entitlement, payments, one-off and recurring giving, receipts.", "lo": [5, 9], "hi": [7, 13], "basis": "Largest single block; shares checkout, identity, tax and receipts [Likely]."}, {"id": "T3", "phase": "Phase 1", "name": "1b: gifts, institutions, fulfilment, finance, dashboard", "scope": "Gift purchase and redemption, parish and school accounts, print mailing list and cut-offs, ledger export, tax reports, customer dashboard.", "lo": [8, 11], "hi": [11, 16], "basis": "Overlaps 1a once the checkout and entitlement core is stable [Guessing]."}, {"id": "T4", "phase": "Phase 1", "name": "Migration rehearsals, independent testing, cutover", "scope": "Two or more full migration rehearsals reconciled to the cent; accessibility audit, penetration test and PCI SAQ A attestation; cutover and hypercare; switch off the old systems.", "lo": [9, 11], "hi": [13, 16], "basis": "Exit criteria of Phase 1 [Likely]."}, {"id": "T5", "phase": "Phase 2", "name": "Editorial workflow and authoring", "scope": "Planning, contributor portal, review stages, issue assembly, print handoff, usability gate with staff.", "lo": [12, 15], "hi": [17, 22], "basis": "Staff adoption drives length; parallel run for one issue [Guessing]."}, {"id": "T6", "phase": "Phase 2", "name": "Translation, offline reading, campaigns, reports, media library", "scope": "Content translation workflow, offline articles and issues, campaign pages and offers, stewardship journeys, richer reports.", "lo": [13, 16], "hi": [19, 24], "basis": "Follows live data and the editorial workflow [Guessing]."}, {"id": "T7", "phase": "Phase 2", "name": "Archive migration and regional failover rehearsal", "scope": "Back archive migrated and browsable; annual failover rehearsal passes the recovery time.", "lo": [14, 16], "hi": [20, 24], "basis": "Needs a stable production service [Likely]."}, {"id": "T8", "phase": "Phase 3", "name": "AI features under governance", "scope": "Grounded answers, hybrid search, writing and review assistants, citation checks.", "lo": [17, 22], "hi": [26, 34], "basis": "Gated on usage evidence and AI evaluation results, per the benchmark's expansion gate [Likely]."}, {"id": "T9", "phase": "Phase 3", "name": "Native apps and app-store billing", "scope": "iOS and Android apps with store receipts feeding the entitlement ledger (OI-16).", "lo": [17, 22], "hi": [25, 32], "basis": "Only if PWA demand justifies store fees and rules [Guessing]."}, {"id": "T10", "phase": "Phase 3", "name": "Further markets, languages and regions", "scope": "Country tax, payment methods, address rules, languages and regions by configuration.", "lo": [19, 22], "hi": [28, 34], "basis": "Each market needs local tax, privacy and address checks [Guessing]."}], "gates": [["G0", "Vendor contracted, discovery accepted", "Months 4 to 6", "Delivery plan, architecture decision and refined cost accepted by Liguori."], ["G1", "Phase 1 go-live and legacy switch-off", "Months 11 to 16", "All Phase 1 exit criteria passed (section 8.1)."], ["G2", "Phase 2 complete", "Months 16 to 24", "One full issue through the new editorial workflow; Phase 2 exit criteria passed."], ["G3", "Phase 3 complete", "Months 22 to 34", "AI, apps and new markets pass their own exit criteria."]], "notes": ["Basis: the cost and vendor benchmark gives an analyst planning range of 12 to 18 months for the recommended production platform (Phases 1 and 2) and 18 to 28 months for the global-plus-AI platform (adds Phase 3), counted from the start of the build. I split those ranges across phases myself, so the split is a guess [Guessing] even though the totals are grounded.", "Months are counted from the day the RFP is issued (month 1). Phase 0 adds 4 to 6 months before the build starts, so the full programme runs roughly 15 to 23 months to the end of Phase 2 and 22 to 34 months to the end of Phase 3.", "The early case assumes quick decisions on the open items, a vendor with a reusable publishing and subscription base, and no migration surprises. The late case assumes slow decisions, a custom build, and one failed migration rehearsal. Neither is a quote.", "Cutover timing matters more than the month number. Avoid cutting over from November to January (Advent and year-end giving) and in Lent; also avoid the week before a print mailing cut-off. If the early case lands in November, hold go-live to February or later [Likely].", "Everything here moves one-for-one with decision latency on the open items (OI-01, OI-02, OI-03, OI-05, OI-14, OI-18). Each month an item stays open pushes the dependent work out by about the same.", "Replace these ranges with vendor-quoted plans after the paid discovery. Do not use them for contracts or budgets."], "months": 34}}, "reqs": [{"id": "IDN-001", "domain": "IDN", "title": "Single customer identity", "statement": "The system shall give each person one customer identity that is used for subscriptions, gifts, donations, content access and support across all Liguori web properties.", "rationale": "Today accounts are fragmented across the subscription site, the shop and the call-centre system, so one person often has several.", "acceptance": ["Given a person who has bought a subscription and made a donation, when they sign in once, then both appear under the same account.", "No second identity record is created for a returning customer who signs in with a verified email address."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Donor", "Subscriber"], "journeys": ["J-01", "J-08"], "brd_ref": ["FR-012"], "source": "Transcript 23 Oct", "open_items": [], "notes": "", "phase_reason": "One identity is the base every other part needs; the old Magento login store cannot be retired without it.", "domain_name": "Identity and customer accounts", "group": "G1"}, {"id": "IDN-002", "domain": "IDN", "title": "Single sign-on across properties", "statement": "The system shall provide single sign-on so that a person signed in on one named Liguori property is signed in on the others without re-entering credentials.", "rationale": "The RFP names the subscription site plus four applications (Liguori.org, redacamy.org, redemptio.com, subscribe.Liguorian.org) that must share sign-in.", "acceptance": ["Given sign-in on property A, when the person opens property B in the same browser, then no credential prompt is shown.", "Signing out on one property ends the session on all within 60 seconds."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Donor", "Subscriber"], "journeys": ["J-08"], "brd_ref": ["FR-012"], "source": "RFP draft", "open_items": [], "notes": "", "phase_reason": "Should-level with a workaround: Only one web property is live at first.", "domain_name": "Identity and customer accounts", "group": "G1"}, {"id": "IDN-003", "domain": "IDN", "title": "Registration and email verification", "statement": "The system shall let a person register with an email address and password or passkey, and shall verify the email address before granting access to paid content or account changes.", "rationale": "Unverified accounts were exploited in the card-testing attack and create duplicate records.", "acceptance": ["Given a new registration, when the email link is not confirmed, then no entitlement or saved card can be attached.", "The verification link expires after 24 hours and can be re-sent."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Donor", "Subscriber"], "journeys": ["J-01"], "brd_ref": ["FR-012"], "source": "Assessment", "open_items": [], "notes": "", "phase_reason": "One identity is the base every other part needs; the old Magento login store cannot be retired without it.", "domain_name": "Identity and customer accounts", "group": "G1"}, {"id": "IDN-004", "domain": "IDN", "title": "Passkey and password sign-in", "statement": "The system shall support passkeys and passwords, enforce a password policy of at least 12 characters checked against known-breached lists, and never store passwords in reversible form.", "rationale": "Older readers still use passwords; passkeys reduce reset load and takeover risk.", "acceptance": ["A password found in a breached-password list is rejected at set and change.", "Stored credentials use a salted, slow, one-way hash; inspection of the data store shows no plain or reversible values."], "priority": "Must", "phase": "Phase 1", "type": "Compliance", "actors": ["Subscriber"], "journeys": ["J-08"], "brd_ref": ["FR-012"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "One identity is the base every other part needs; the old Magento login store cannot be retired without it.", "domain_name": "Identity and customer accounts", "group": "G1"}, {"id": "IDN-005", "domain": "IDN", "title": "Account recovery", "statement": "The system shall provide self-service password reset and account recovery by verified email, with rate limiting and a message that does not reveal whether an address is registered.", "rationale": "Support calls for lost logins are a routine cost; the reset flow must not leak account existence.", "acceptance": ["A reset request returns the same on-screen message for registered and unregistered addresses.", "More than 5 reset requests per address per hour are refused."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Subscriber"], "journeys": ["J-08"], "brd_ref": [], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "One identity is the base every other part needs; the old Magento login store cannot be retired without it.", "domain_name": "Identity and customer accounts", "group": "G1"}, {"id": "IDN-006", "domain": "IDN", "title": "Bot and card-testing defence at registration", "statement": "The system shall block automated account creation by combining rate limiting by address and device, bot detection, and email verification, and shall alert staff when registration or card-add volume exceeds a configured threshold.", "rationale": "Attackers created thousands of fake accounts to run stolen cards, and online payments were disabled as a result.", "acceptance": ["A scripted run of 1,000 registrations from one source is throttled after the configured limit and raises an alert.", "Registration works for a human tester using a screen reader without an inaccessible challenge."], "priority": "Must", "phase": "Phase 1", "type": "Compliance", "actors": ["System administrator"], "journeys": ["J-01"], "brd_ref": [], "source": "Assessment", "open_items": [], "notes": "", "phase_reason": "One identity is the base every other part needs; the old Magento login store cannot be retired without it.", "domain_name": "Identity and customer accounts", "group": "G1"}, {"id": "IDN-007", "domain": "IDN", "title": "Social sign-in as an option", "statement": "The system shall allow optional sign-in with Google and Apple accounts, linked to the same customer identity as email sign-in.", "rationale": "Legacy social sign-in via a deprecated provider is broken; modern providers cover most readers.", "acceptance": ["A person who signs in with a social account whose email matches an existing account is prompted to confirm and link, not given a new account.", "A linked social account can be unlinked without losing the customer record, provided another sign-in method remains."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Subscriber"], "journeys": ["J-01"], "brd_ref": ["FR-012"], "source": "Transcript 23 Oct", "open_items": [], "notes": "", "phase_reason": "Valuable but not needed to retire the old systems; a workaround exists in Phase 1.", "domain_name": "Identity and customer accounts", "group": "G1"}, {"id": "IDN-008", "domain": "IDN", "title": "Multi-factor authentication for staff", "statement": "The system shall require multi-factor authentication for every staff role and for any customer action that changes payment method, email address or password.", "rationale": "Staff accounts can refund, change addresses and export data, so they are the highest-value targets.", "acceptance": ["A staff sign-in without a second factor is refused.", "Changing the account email prompts a second factor before saving."], "priority": "Must", "phase": "Phase 1", "type": "Compliance", "actors": ["Customer service agent", "Editor", "Finance", "System administrator"], "journeys": ["J-10"], "brd_ref": ["FR-050"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "One identity is the base every other part needs; the old Magento login store cannot be retired without it.", "domain_name": "Identity and customer accounts", "group": "G1"}, {"id": "IDN-009", "domain": "IDN", "title": "Duplicate detection and merge", "statement": "The system shall detect likely duplicate customer records using name, postal address, email and phone, and shall let authorised agents merge them with a preview of what is kept, a reason code and an audit entry.", "rationale": "Parishes and individuals hold several accounts because the legacy systems do not check each other.", "acceptance": ["Given two records with the same normalised address and surname, when an agent opens one, then the likely duplicate is shown with a match reason.", "A merge can be reversed within 30 days and is logged with actor, time and before and after values."], "priority": "Should", "phase": "Phase 1", "type": "Functional", "actors": ["Customer service agent"], "journeys": ["J-10", "J-14"], "brd_ref": ["FR-045"], "source": "Transcript 23 Oct", "open_items": [], "notes": "", "phase_reason": "One identity is the base every other part needs; the old Magento login store cannot be retired without it.", "domain_name": "Identity and customer accounts", "group": "G1"}, {"id": "IDN-010", "domain": "IDN", "title": "Household and organisation accounts", "statement": "The system shall support person, household and organisation account types, with one organisation able to have several named contacts and one person able to belong to several organisations.", "rationale": "Parishes and schools buy and manage subscriptions through different staff over the years.", "acceptance": ["Given an organisation with three contacts, when one contact leaves, then the other two keep access and the history is unchanged.", "A person can switch between personal and organisation views after signing in."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Institutional administrator"], "journeys": ["J-09"], "brd_ref": ["FR-041"], "source": "Transcript 23 Oct", "open_items": ["OI-11"], "notes": "", "phase_reason": "Valuable but not needed to retire the old systems; a workaround exists in Phase 1.", "domain_name": "Identity and customer accounts", "group": "G1"}, {"id": "IDN-011", "domain": "IDN", "title": "Role-based access for customers", "statement": "The system shall assign customer roles (account owner, delegate, gift recipient, institutional administrator) with permissions that limit billing, address and cancellation actions to the right role.", "rationale": "A gift recipient must manage delivery but never the buyer's payment details.", "acceptance": ["A gift recipient cannot view the buyer's card, amount paid or billing address.", "A delegate with view-only access cannot cancel or change payment."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Gift recipient", "Institutional administrator", "Subscriber"], "journeys": ["J-03", "J-09"], "brd_ref": ["FR-012"], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Should-level with a workaround: Basic roles are enough until institutions are live in volume.", "domain_name": "Identity and customer accounts", "group": "G1"}, {"id": "IDN-012", "domain": "IDN", "title": "Session management", "statement": "The system shall expire idle sessions after a configurable period (default 30 minutes for staff, 30 days remembered for readers), and let a signed-in person view and end their other sessions.", "rationale": "Shared household devices and lost phones need a way to cut off access.", "acceptance": ["Staff sessions end after 30 idle minutes.", "Ending another session from the account page invalidates it within 60 seconds."], "priority": "Should", "phase": "Phase 1", "type": "Functional", "actors": ["Subscriber", "System administrator"], "journeys": ["J-08"], "brd_ref": ["FR-012"], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "One identity is the base every other part needs; the old Magento login store cannot be retired without it.", "domain_name": "Identity and customer accounts", "group": "G1"}, {"id": "IDN-013", "domain": "IDN", "title": "Communication consent capture", "statement": "The system shall record, per person and channel (email, SMS, postal, push), the consent given, the wording shown, the time and the source, and shall honour withdrawals within 24 hours.", "rationale": "Consent evidence is needed for email law and state privacy rules, and for Spanish and English notices.", "acceptance": ["The consent record shows the exact text version and locale presented.", "An unsubscribe click stops marketing email within 24 hours and is not undone by an import."], "priority": "Must", "phase": "Phase 1", "type": "Compliance", "actors": ["Donor", "Marketing", "Subscriber"], "journeys": ["J-08"], "brd_ref": ["FR-012"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "One identity is the base every other part needs; the old Magento login store cannot be retired without it.", "domain_name": "Identity and customer accounts", "group": "G1"}, {"id": "IDN-014", "domain": "IDN", "title": "Privacy rights requests", "statement": "The system shall let a person request access, correction, deletion and download of their data, shall verify identity before action, and shall track each request to completion within statutory deadlines.", "rationale": "State privacy laws give residents these rights, and the design must be ready for broader regimes.", "acceptance": ["A deletion request removes or anonymises personal data except records Liguori must keep for tax and audit, and the person is told which were kept and why.", "Each request shows a due date and status to staff."], "priority": "Must", "phase": "Phase 1", "type": "Compliance", "actors": ["Customer service agent", "Subscriber"], "journeys": ["J-08"], "brd_ref": ["NFR-015"], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "One identity is the base every other part needs; the old Magento login store cannot be retired without it.", "domain_name": "Identity and customer accounts", "group": "G1"}, {"id": "IDN-015", "domain": "IDN", "title": "Preferences and accessibility settings", "statement": "The system shall store language, text size, theme and accessibility preferences on the customer identity and apply them on every property and device.", "rationale": "Older readers need larger text and a consistent experience.", "acceptance": ["A person who sets Spanish and large text on a phone sees the same settings on the laptop after sign-in.", "Preferences are applied before first paint of the account pages."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Subscriber"], "journeys": ["J-08"], "brd_ref": ["FR-003", "FR-012"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Valuable but not needed to retire the old systems; a workaround exists in Phase 1.", "domain_name": "Identity and customer accounts", "group": "G1"}, {"id": "IDN-016", "domain": "IDN", "title": "Legacy login migration", "statement": "The system shall let existing subscribers sign in on first visit after cutover using their email, with either a verified import of their existing credential hash or a one-time email link to set a new password.", "rationale": "The legacy shop database holds the only login store and must be retired without locking out subscribers.", "acceptance": ["Given a migrated subscriber, when they enter their email, then they can sign in or set a password in under 3 minutes without calling support.", "No legacy password is ever written to logs or exports in readable form."], "priority": "Must", "phase": "Phase 1", "type": "Data", "actors": ["Subscriber"], "journeys": ["J-14"], "brd_ref": [], "source": "Assessment", "open_items": ["OI-09"], "notes": "Hash import may not be possible if the new identity product cannot accept the legacy format.", "phase_reason": "One identity is the base every other part needs; the old Magento login store cannot be retired without it.", "domain_name": "Identity and customer accounts", "group": "G1"}, {"id": "DSH-001", "domain": "DSH", "title": "Dashboard overview", "statement": "The system shall show a signed-in user a dashboard with their active subscriptions, next renewal, recent gifts and donations, and alerts needing action.", "rationale": "The dashboard is the customer's single place for everything.", "acceptance": ["Given a user with a subscription and a donation, then both appear on the first screen", "Alerts for expired cards, expiring subscriptions and failed payments appear at the top", "The dashboard loads in 2 seconds or less at p75"], "priority": "Should", "phase": "Phase 1", "type": "Functional", "actors": ["Donor", "Subscriber"], "journeys": ["J-08"], "brd_ref": ["FR-012"], "source": "Transcript 23 Oct", "open_items": [], "notes": "", "phase_reason": "Customers need self-service to manage what migrated, or call volume rises on day one.", "domain_name": "Customer dashboard", "group": "G1"}, {"id": "DSH-002", "domain": "DSH", "title": "Subscriptions tab", "statement": "The system shall list each subscription with product, status, term, next renewal date, delivery address and entitlement, and offer the actions allowed for its status.", "rationale": "Customers see their own status instead of calling the office.", "acceptance": ["Active, paused, expired and cancelled subscriptions each show the correct status", "Allowed actions (renew, pause, change, cancel) match the status", "An expired subscription shows an expired notice"], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Subscriber"], "journeys": ["J-08"], "brd_ref": [], "source": "RFP draft", "open_items": [], "notes": "", "phase_reason": "Customers need self-service to manage what migrated, or call volume rises on day one.", "domain_name": "Customer dashboard", "group": "G1"}, {"id": "DSH-003", "domain": "DSH", "title": "Orders tab", "statement": "The system shall list past orders with date, items, amount, tax, payment method (last four digits only) and status, with a link to each receipt.", "rationale": "Customers need proof of purchase.", "acceptance": ["Orders list newest first with search by date and item", "Only the last four card digits display", "Each order links to a downloadable receipt"], "priority": "Should", "phase": "Phase 1", "type": "Functional", "actors": ["Donor", "Subscriber"], "journeys": ["J-08"], "brd_ref": [], "source": "Transcript 23 Oct", "open_items": [], "notes": "", "phase_reason": "Customers need self-service to manage what migrated, or call volume rises on day one.", "domain_name": "Customer dashboard", "group": "G1"}, {"id": "DSH-004", "domain": "DSH", "title": "Donations tab", "statement": "The system shall list one-off and recurring donations with fund, amount, tribute details, receipt link and recurring controls, and shall show the annual statement for each year.", "rationale": "Donors manage giving in one place.", "acceptance": ["Recurring donations show next charge date and a change, pause and cancel control", "Tribute gifts show the honouree name, never the honouree's contact data to others", "Annual statements appear from 31 January for the prior year"], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Donor"], "journeys": ["J-05", "J-06"], "brd_ref": [], "source": "Transcript 23 Oct", "open_items": ["OI-02"], "notes": "", "phase_reason": "Customers need self-service to manage what migrated, or call volume rises on day one.", "domain_name": "Customer dashboard", "group": "G1"}, {"id": "DSH-005", "domain": "DSH", "title": "Gifts tab", "statement": "The system shall show gifts the user has bought, with recipient, start date, redemption status and a resend option, and gifts the user has received, with a redemption action.", "rationale": "Gift buyers need to see whether the gift was used.", "acceptance": ["A bought gift shows unredeemed, redeemed or expired status", "Resend sends the original recipient email and is limited to 3 times a day", "A received gift redeems in two steps"], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Gift buyer", "Gift recipient"], "journeys": ["J-02", "J-03"], "brd_ref": ["FR-042"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Customers need self-service to manage what migrated, or call volume rises on day one.", "domain_name": "Customer dashboard", "group": "G1"}, {"id": "DSH-006", "domain": "DSH", "title": "Content library tab", "statement": "The system shall list the user's entitled issues and articles, saved items and downloads, with reading position and a clear message for content outside their entitlement.", "rationale": "The library is where subscribers use what they paid for.", "acceptance": ["Entitled issues display with covers and latest first", "Saved items sync with the reading experience", "Content not covered by an entitlement shows how to unlock it"], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Subscriber"], "journeys": ["J-07"], "brd_ref": ["FR-004", "FR-005"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Customers need self-service to manage what migrated, or call volume rises on day one.", "domain_name": "Customer dashboard", "group": "G1"}, {"id": "DSH-007", "domain": "DSH", "title": "Profile and consent tab", "statement": "The system shall let a user edit name, email, language, accessibility preferences, password or passkey, linked sign-in accounts and communication consent by channel and topic, with a record of each consent change.", "rationale": "Privacy law and trust require user control.", "acceptance": ["Each consent change stores time, channel, wording version and source", "Unsubscribing from marketing keeps transactional notices", "Changing email requires verification of the new address"], "priority": "Must", "phase": "Phase 1", "type": "Compliance", "actors": ["Donor", "Subscriber"], "journeys": ["J-08"], "brd_ref": ["FR-011", "FR-012"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Customers need self-service to manage what migrated, or call volume rises on day one.", "domain_name": "Customer dashboard", "group": "G1"}, {"id": "DSH-008", "domain": "DSH", "title": "Self-service renewal", "statement": "The system shall let a subscriber renew from the dashboard in no more than three steps, with the renewal price shown before payment and the new term end date confirmed after.", "rationale": "Renewal is the main revenue event.", "acceptance": ["Given a subscription due in 60 days, then Renew is available", "The price shown matches the charge", "Entitlement extends within 60 seconds of payment"], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Subscriber"], "journeys": ["J-08"], "brd_ref": [], "source": "RFP draft", "open_items": [], "notes": "", "phase_reason": "Customers need self-service to manage what migrated, or call volume rises on day one.", "domain_name": "Customer dashboard", "group": "G1"}, {"id": "DSH-009", "domain": "DSH", "title": "Address change with validation", "statement": "The system shall let a subscriber change a delivery address, validate it against postal standards, suggest a corrected form, and apply it to future print issues from a stated issue date.", "rationale": "Bad addresses cause returned mail.", "acceptance": ["A mistyped address returns a suggested correction", "The dashboard states the first issue to use the new address", "Change is audited and sent to fulfilment within 15 minutes"], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Subscriber"], "journeys": ["J-08"], "brd_ref": [], "source": "Review Part 3", "open_items": ["OI-08"], "notes": "", "phase_reason": "Customers need self-service to manage what migrated, or call volume rises on day one.", "domain_name": "Customer dashboard", "group": "G1"}, {"id": "DSH-010", "domain": "DSH", "title": "Payment method update", "statement": "The system shall let a user add, replace or remove a stored payment method through a hosted secure form, and shall use the new method for the next charge.", "rationale": "Failed cards are the main cause of lapses.", "acceptance": ["Card entry occurs in a processor-hosted field and no card number reaches Liguori systems", "A replaced card is used on the next renewal", "Removal is blocked while it is the only method on an active auto-renewal"], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Donor", "Subscriber"], "journeys": ["J-08"], "brd_ref": [], "source": "Transcript 23 Oct", "open_items": [], "notes": "", "phase_reason": "Customers need self-service to manage what migrated, or call volume rises on day one.", "domain_name": "Customer dashboard", "group": "G1"}, {"id": "DSH-011", "domain": "DSH", "title": "Download receipts and invoices", "statement": "The system shall let a user download a PDF receipt or invoice for any order or donation, showing organisation details, tax and a unique number.", "rationale": "Customers use receipts for expenses and tax.", "acceptance": ["Each order and donation has a PDF within 60 seconds of completion", "PDF numbers are unique and sequential per series", "PDFs open and are readable with a screen reader"], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Donor", "Subscriber"], "journeys": ["J-08", "J-12"], "brd_ref": [], "source": "New (this BRS)", "open_items": ["OI-02"], "notes": "", "phase_reason": "Customers need self-service to manage what migrated, or call volume rises on day one.", "domain_name": "Customer dashboard", "group": "G1"}, {"id": "DSH-012", "domain": "DSH", "title": "Expiry and renewal notices", "statement": "The system shall show and email expiry notices at configurable intervals (default 60, 30 and 7 days before, and on expiry) and keep an expired notice visible until renewal.", "rationale": "Timely notices protect renewals.", "acceptance": ["Notices send at the configured days", "The expired notice stays on the dashboard until the user renews or dismisses it", "Notice text is correct for print, digital and bundle products"], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Subscriber"], "journeys": ["J-08"], "brd_ref": [], "source": "RFP draft", "open_items": [], "notes": "", "phase_reason": "Customers need self-service to manage what migrated, or call volume rises on day one.", "domain_name": "Customer dashboard", "group": "G1"}, {"id": "DSH-013", "domain": "DSH", "title": "Self-service lifecycle actions", "statement": "The system shall let a subscriber pause, change plan or cancel from the dashboard, show the effect on price and access before confirmation, and send a confirmation email.", "rationale": "Self-service cuts calls and removes surprise.", "acceptance": ["Each action shows its effect on price and end date before it applies", "Cancel keeps access until the paid term ends", "Confirmation email arrives within 5 minutes"], "priority": "Should", "phase": "Phase 1", "type": "Functional", "actors": ["Subscriber"], "journeys": ["J-08"], "brd_ref": [], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Customers need self-service to manage what migrated, or call volume rises on day one.", "domain_name": "Customer dashboard", "group": "G1"}, {"id": "DSH-014", "domain": "DSH", "title": "Help and contact from the dashboard", "statement": "The system shall provide search of help articles and a contact form from the dashboard that attaches the user's subscription context to a service case.", "rationale": "Cases arrive with context, saving agent time.", "acceptance": ["A submitted case shows the user's subscriptions and last order to the agent", "The user sees case status in the dashboard", "Help search returns results in the user's language"], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Customer service agent", "Subscriber"], "journeys": ["J-08", "J-10"], "brd_ref": ["FR-013"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Valuable but not needed to retire the old systems; a workaround exists in Phase 1.", "domain_name": "Customer dashboard", "group": "G1"}, {"id": "DSH-015", "domain": "DSH", "title": "Data export and deletion request", "statement": "The system shall let a user request an export of their personal data and a deletion of their account from the dashboard, and shall track each request to completion within the legal time limit.", "rationale": "US state privacy laws give these rights.", "acceptance": ["A request creates a tracked case with a due date no later than 45 days", "The export includes profile, orders, donations and consents in CSV or JSON", "Deletion retains only records the law requires, such as tax and receipts"], "priority": "Must", "phase": "Phase 1", "type": "Compliance", "actors": ["Donor", "Subscriber"], "journeys": ["J-08"], "brd_ref": ["FR-012"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Customers need self-service to manage what migrated, or call volume rises on day one.", "domain_name": "Customer dashboard", "group": "G1"}, {"id": "LOC-001", "domain": "LOC", "title": "English and Spanish at launch", "statement": "The system shall deliver interface text, content, products, email and notices in English and Spanish at launch, including separate English and Spanish product variants such as parish bulletins.", "rationale": "Liguori serves English and Spanish readers from day one.", "acceptance": ["Given a user selects Spanish, then every interface screen, email and notice they meet is in Spanish with no English fallback text on launch pages.", "Given parish bulletin products exist in both languages, then each is listed and sold as a separate product."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Donor", "Editor", "Subscriber"], "journeys": ["J-01", "J-07"], "brd_ref": ["BR-005"], "source": "Amended BRD", "open_items": [], "notes": "BRD names English as launch language; the client decision adds Spanish.", "phase_reason": "English and Spanish customer journeys are the launch market.", "domain_name": "Multilingual and localisation", "group": "G1"}, {"id": "LOC-002", "domain": "LOC", "title": "Language-aware address structure", "statement": "The system shall place the language in the page address, link each page to its other-language versions, and declare the canonical address and alternates for search engines.", "rationale": "Visitors and search engines reach the right language version.", "acceptance": ["Given an article exists in two languages, then each page links to the other and declares alternates.", "Given a visitor with a Spanish browser setting opens the home page, then Spanish is offered and the choice is remembered.", "No two language versions share the same address."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Marketing", "Subscriber"], "journeys": ["J-01"], "brd_ref": ["NFR-014"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "English and Spanish customer journeys are the launch market.", "domain_name": "Multilingual and localisation", "group": "G1"}, {"id": "LOC-003", "domain": "LOC", "title": "No hard-coded text", "statement": "The system shall hold all user-facing text outside the application code so it can be edited and translated without a software release.", "rationale": "Language changes and corrections must be cheap and quick.", "acceptance": ["Automated scan finds zero hard-coded user-facing strings in channel code.", "Given a text is edited in the translation tool, then it appears live within 10 minutes with no deployment."], "priority": "Must", "phase": "Phase 1", "type": "Non-functional", "actors": ["Editor", "System administrator"], "journeys": [], "brd_ref": ["NFR-013"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "English and Spanish customer journeys are the launch market.", "domain_name": "Multilingual and localisation", "group": "G1"}, {"id": "LOC-004", "domain": "LOC", "title": "Text expansion tolerance", "statement": "The system shall lay out screens, emails and printed forms so that text up to 30 percent longer than English fits without truncation, overlap or loss of function, and shall display all Unicode characters correctly.", "rationale": "Spanish and other languages run longer than English.", "acceptance": ["Given every screen is rendered with strings expanded by 30 percent, then no text is clipped and no control is hidden.", "Given text with accented and non-Latin characters, then it displays and sorts correctly."], "priority": "Should", "phase": "Phase 1", "type": "Non-functional", "actors": ["Editor", "Subscriber"], "journeys": [], "brd_ref": ["NFR-013"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "English and Spanish customer journeys are the launch market.", "domain_name": "Multilingual and localisation", "group": "G1"}, {"id": "LOC-005", "domain": "LOC", "title": "Linked language versions of content", "statement": "The system shall store each language version of an article as a record linked to its source, with its own status, reviewer and publication date, and shall show a defined fallback when a language version is missing.", "rationale": "Languages need independent review while staying connected.", "acceptance": ["Given an English article with no Spanish version, then a Spanish reader sees a stated fallback and an offer to read in English.", "Given a Spanish version is approved, then it publishes without changing the English one.", "Reports list articles missing a language version."], "priority": "Must", "phase": "Phase 2", "type": "Data", "actors": ["Editor", "Managing editor"], "journeys": ["J-11"], "brd_ref": ["BR-005"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Translation of content depends on the editorial workflow; Phase 1 delivers Spanish customer journeys only.", "domain_name": "Multilingual and localisation", "group": "G1"}, {"id": "LOC-006", "domain": "LOC", "title": "Translation workflow with human approval", "statement": "The system shall provide a translation task with side-by-side source and target text, terminology notes, flags for untranslatable terms, and separate language and theological approvals before a translation can publish.", "rationale": "Spanish content must be accurate and doctrinally sound.", "acceptance": ["Given a translation lacks the language approval, then it cannot be published.", "Given a term is flagged untranslatable, then it is kept as marked in the output.", "Every approval is recorded with person and date."], "priority": "Must", "phase": "Phase 2", "type": "Functional", "actors": ["Editor", "Managing editor"], "journeys": ["J-11"], "brd_ref": ["FR-038"], "source": "Amended BRD", "open_items": [], "notes": "Machine-assisted drafting is in AIX; this requirement is the human workflow.", "phase_reason": "Translation of content depends on the editorial workflow; Phase 1 delivers Spanish customer journeys only.", "domain_name": "Multilingual and localisation", "group": "G1"}, {"id": "LOC-007", "domain": "LOC", "title": "Source change flags translations", "statement": "The system shall detect when a source article changes after translation, show the differences, pause automatic publication of affected translations and require re-approval.", "rationale": "Translations must not silently drift from corrected source text.", "acceptance": ["Given a source paragraph is edited, then the linked Spanish version is flagged within 5 minutes with a difference view.", "Given a flagged translation, then it cannot be republished until re-approved.", "A report lists all flagged translations."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Editor"], "journeys": ["J-11"], "brd_ref": ["FR-039"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Translation of content depends on the editorial workflow; Phase 1 delivers Spanish customer journeys only.", "domain_name": "Multilingual and localisation", "group": "G1"}, {"id": "LOC-008", "domain": "LOC", "title": "Versioned messages by language", "statement": "The system shall keep user interface text, transactional email, push notices, consent notices and help content as versions by language, with approval, rollback and a defined fallback.", "rationale": "Legal and brand wording must be controlled in every language.", "acceptance": ["Given a consent notice is updated, then the previous version stays retrievable and the version shown to each user is recorded.", "Given a Spanish email template is missing, then the English template is sent and the gap is logged.", "Changes require approval by a named role."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Editor", "Marketing"], "journeys": ["J-08"], "brd_ref": ["FR-040"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "English and Spanish customer journeys are the launch market.", "domain_name": "Multilingual and localisation", "group": "G1"}, {"id": "LOC-009", "domain": "LOC", "title": "Country rules as configuration", "statement": "The system shall hold country, currency, tax, privacy, payment and fulfilment rules as configuration, so a new country is added without changing application code, with the United States and US dollars active at launch.", "rationale": "Other markets are planned and must not need a rebuild.", "acceptance": ["Given a test country is configured with its own currency and tax rate, then pricing and checkout reflect it without a software release.", "Given a country is inactive, then it does not appear in checkout options.", "Configuration changes are logged and reversible."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Finance", "System administrator"], "journeys": [], "brd_ref": ["BR-004"], "source": "Amended BRD", "open_items": ["OI-03"], "notes": "", "phase_reason": "English and Spanish customer journeys are the launch market.", "domain_name": "Multilingual and localisation", "group": "G1"}, {"id": "LOC-010", "domain": "LOC", "title": "Locale formatting", "statement": "The system shall format dates, times, numbers, currency and addresses according to the user's language and country.", "rationale": "Wrong formats cause errors in payments and deliveries.", "acceptance": ["Given Spanish and English users view the same date and price, then each sees their locale's format.", "Given an address entry form for the United States, then state and ZIP are required and validated."], "priority": "Should", "phase": "Phase 1", "type": "Functional", "actors": ["Donor", "Subscriber"], "journeys": ["J-01", "J-04"], "brd_ref": [], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "English and Spanish customer journeys are the launch market.", "domain_name": "Multilingual and localisation", "group": "G1"}, {"id": "LOC-011", "domain": "LOC", "title": "Language preference", "statement": "The system shall capture a user's preferred language at sign-up or first visit, store it on the account, and use it for emails, notifications, receipts and the dashboard.", "rationale": "Everything the user receives should arrive in the language they chose.", "acceptance": ["Given a user sets Spanish, then the next email, receipt and notification are in Spanish.", "Given the user changes the setting, then future messages switch with no more than one message in the old language."], "priority": "Should", "phase": "Phase 1", "type": "Functional", "actors": ["Donor", "Subscriber"], "journeys": ["J-08"], "brd_ref": ["FR-012"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "English and Spanish customer journeys are the launch market.", "domain_name": "Multilingual and localisation", "group": "G1"}, {"id": "LOC-012", "domain": "LOC", "title": "Adding a new language", "statement": "The system shall allow a third language to be added through configuration, translated text and content, with no change to the data model or application code.", "rationale": "This is the test that the system is multilingual by design.", "acceptance": ["Given a third language is added in a test environment, then interface, email and content can be published in it with zero code changes.", "The test is repeated before go-live and the evidence is filed."], "priority": "Should", "phase": "Phase 3", "type": "Non-functional", "actors": ["System administrator"], "journeys": [], "brd_ref": ["BR-005"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Adding further languages is for the post-US markets.", "domain_name": "Multilingual and localisation", "group": "G1"}, {"id": "CDL-001", "domain": "CDL", "title": "Public site routes and navigation", "statement": "The system shall provide public website and PWA routes for home, latest issue, topics, authors, archive, search, subscribe, donate, sign-in and help, with navigation that an administrator can change without a code release.", "rationale": "Visitors reach every revenue and reading journey from one consistent, maintainable structure.", "acceptance": ["Given a visitor on any page, when they open the main menu, then all ten routes are reachable in two taps or fewer.", "Given an administrator edits the menu, when they publish, then the change is live on web and PWA within 5 minutes with no deployment.", "Every route passes automated WCAG 2.2 AA checks."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Donor", "Marketing", "Subscriber"], "journeys": ["J-01", "J-07"], "brd_ref": ["FR-001"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Reading, sharing and access control are what subscribers pay for.", "domain_name": "Content reading and delivery", "group": "G1"}, {"id": "CDL-002", "domain": "CDL", "title": "Structured article rendering", "statement": "The system shall render structured articles with paragraphs, headings, lists, pull quotes, Scripture references, footnotes and endnotes, tables, sidebars, images with captions, audio, video, related content, paywall states and rights notices at phone, tablet and desktop widths.", "rationale": "Readers get the same editorial structure on every device without separate print-style layouts.", "acceptance": ["Given a test article containing every block type, when it is opened at 360, 768 and 1280 pixel widths, then all blocks render without overlap, clipping or horizontal scrolling.", "Given an article with a rights restriction, when it is viewed in a restricted territory, then the rights notice is shown and the restricted media is withheld."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Editor", "Subscriber"], "journeys": ["J-07"], "brd_ref": ["FR-002"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Reading, sharing and access control are what subscribers pay for.", "domain_name": "Content reading and delivery", "group": "G1"}, {"id": "CDL-003", "domain": "CDL", "title": "Reader display preferences", "statement": "The system shall let readers set font size, line spacing, colour theme and reading width, store the choice on the device, and, when signed in, store it on the account so it follows them to other devices.", "rationale": "Older readers need legible text on their own terms.", "acceptance": ["Given a reader changes font size to the largest setting, when the page reloads, then the setting is kept.", "Given a signed-in reader sets a theme on one device, when they sign in on another, then the same theme is applied within 10 seconds.", "At the largest font setting, no text is truncated and all controls remain usable."], "priority": "Should", "phase": "Phase 1", "type": "Functional", "actors": ["Subscriber"], "journeys": ["J-07"], "brd_ref": ["FR-003"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Reading, sharing and access control are what subscribers pay for.", "domain_name": "Content reading and delivery", "group": "G1"}, {"id": "CDL-004", "domain": "CDL", "title": "Saved articles and issues", "statement": "The system shall let registered users save articles and issues, group saved items into named collections, remove them, and see the same saved items on every signed-in device.", "rationale": "Readers return to what they chose without searching again.", "acceptance": ["Given a user saves an article on a phone, when they open the saved list on a laptop, then it appears within 10 seconds.", "Given a user removes a saved item, when they view collections, then it is gone on all devices.", "Given a saved item whose access has since expired, then it is listed with a clear renewal prompt and its content is not shown."], "priority": "Should", "phase": "Phase 1", "type": "Functional", "actors": ["Subscriber"], "journeys": ["J-07"], "brd_ref": ["FR-004"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Reading, sharing and access control are what subscribers pay for.", "domain_name": "Content reading and delivery", "group": "G1"}, {"id": "CDL-005", "domain": "CDL", "title": "Reading history and resume", "statement": "The system shall record reading history for signed-in users, let them view, clear and switch off history, and reopen an article at the last meaningful reading position.", "rationale": "Readers pick up where they stopped, and keep control of their data.", "acceptance": ["Given a user stops reading 60 percent through an article, when they reopen it, then it opens within 5 percent of that position.", "Given a user switches history off, when they read further articles, then no new history entries are stored.", "Given a user clears history, then all entries are deleted from the account within 24 hours."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Subscriber"], "journeys": ["J-07"], "brd_ref": ["FR-005"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Valuable but not needed to retire the old systems; a workaround exists in Phase 1.", "domain_name": "Content reading and delivery", "group": "G1"}, {"id": "CDL-006", "domain": "CDL", "title": "Offline article saving", "statement": "The system shall allow entitled users to save individual articles for offline reading in the PWA, showing storage used, an expiry date, a refresh action and a removal action for each saved article.", "rationale": "Readers in poor connectivity, such as retreats and rural parishes, still read what they paid for.", "acceptance": ["Given an entitled user saves an article, when the device is offline, then the article opens with text and images.", "Given a saved article passes its expiry date or the entitlement ends, when the device next goes online, then the offline copy is removed.", "The storage screen shows size per article and total storage used."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Subscriber"], "journeys": ["J-07"], "brd_ref": ["FR-006"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Offline reading is valuable but a workaround exists; it follows once online reading is proven.", "domain_name": "Content reading and delivery", "group": "G1"}, {"id": "CDL-007", "domain": "CDL", "title": "Offline issue download", "statement": "The system shall allow entitled users to download a complete issue for offline use in the PWA, showing progress and size, retrying failed parts automatically, and keeping bookmarks when a download is removed.", "rationale": "Whole-issue reading is the main behaviour of digital magazine subscribers.", "acceptance": ["Given an entitled user starts an issue download on a throttled 3G connection, when the connection drops, then the download resumes from where it stopped.", "Given the user removes the download, then their bookmarks and notes on that issue remain.", "Download progress and size are shown before and during the download."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Subscriber"], "journeys": ["J-07"], "brd_ref": ["FR-007"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Offline reading is valuable but a workaround exists; it follows once online reading is proven.", "domain_name": "Content reading and delivery", "group": "G1"}, {"id": "CDL-008", "domain": "CDL", "title": "Text-to-speech reading", "statement": "The system shall offer text-to-speech for eligible articles with play, pause, speed control, sentence-by-sentence navigation and continued playback when the screen is off, and shall hide it for content whose rights do not allow it.", "rationale": "Readers with low vision or reading fatigue can listen.", "acceptance": ["Given an eligible article, when the user presses play, then audio starts within 2 seconds and highlights the current sentence.", "Given an article flagged as no-audio for rights reasons, then the control is not shown.", "Speed can be set between 0.75x and 2x in at least five steps."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Subscriber"], "journeys": ["J-07"], "brd_ref": ["FR-008"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Valuable but not needed to retire the old systems; a workaround exists in Phase 1.", "domain_name": "Content reading and delivery", "group": "G1"}, {"id": "CDL-009", "domain": "CDL", "title": "Audio episodes and narrated articles", "statement": "The system shall publish audio episodes and narrated articles with transcripts, chapters, remembered playback position and speed control, using accessible controls.", "rationale": "Audio extends the product to commuting and prayer-time listening.", "acceptance": ["Given an episode with chapters, when the user selects a chapter, then playback jumps to it within 2 seconds.", "Every episode has a transcript that is searchable and readable on the same page.", "Given the user leaves an episode and returns, then playback resumes within 10 seconds of where they stopped."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Editor", "Subscriber"], "journeys": ["J-07"], "brd_ref": ["FR-009"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Valuable but not needed to retire the old systems; a workaround exists in Phase 1.", "domain_name": "Content reading and delivery", "group": "G1"}, {"id": "CDL-010", "domain": "CDL", "title": "Canonical share links", "statement": "The system shall give every article a canonical, language-aware share link with a configurable excerpt, optional campaign tags and a preview that is safe for non-subscribers.", "rationale": "Sharing is the cheapest way to reach new readers and must not give away paid content.", "acceptance": ["Given a user copies a share link, when it is pasted into a messaging app, then a preview with title, image and excerpt is shown and contains no text beyond the configured excerpt.", "Given a campaign tag is added, then visits through the link are attributed to it in reports.", "The link resolves to the same article regardless of the user's language, then serves the matching language version."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Marketing", "Subscriber"], "journeys": ["J-07"], "brd_ref": ["FR-010"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Reading, sharing and access control are what subscribers pay for.", "domain_name": "Content reading and delivery", "group": "G1"}, {"id": "CDL-011", "domain": "CDL", "title": "Notification preferences", "statement": "The system shall let users choose notifications by topic, author, issue, subscription, service and editorial category, by channel and language, with quiet hours and consent controls.", "rationale": "Notices that fit the reader's habits keep them subscribed.", "acceptance": ["Given a user turns off a channel, when an event for that channel occurs, then nothing is sent on it.", "Given quiet hours of 21:00 to 07:00 are set, then no push notification is delivered in that window.", "Every preference change is logged with a timestamp."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Subscriber"], "journeys": ["J-08"], "brd_ref": ["FR-011"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Should-level with a workaround: Notification preferences follow campaign tooling.", "domain_name": "Content reading and delivery", "group": "G1"}, {"id": "CDL-012", "domain": "CDL", "title": "Entitlement check on every content request", "statement": "The system shall check the requester's current entitlement for every request for protected content, including articles, issues, downloads, audio and video, at the moment of the request and not only at sign-in.", "rationale": "This is the control that makes sharing and expiry enforceable.", "acceptance": ["Given a subscriber whose access ends at 12:00, when they request protected content at 12:01, then access is denied.", "Given a request with a valid but unentitled session, then the response contains no protected content, including in page source and API responses.", "The decision is logged with user, item, time and result."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Subscriber", "System administrator"], "journeys": ["J-07"], "brd_ref": ["BR-008"], "source": "New (this BRS)", "open_items": ["OI-14"], "notes": "Replaces the open link sharing problem of the legacy digital publication platform.", "phase_reason": "Reading, sharing and access control are what subscribers pay for.", "domain_name": "Content reading and delivery", "group": "G1"}, {"id": "CDL-013", "domain": "CDL", "title": "Forwarded links fail for non-subscribers", "statement": "The system shall ensure that a link to protected content copied from a subscriber's browser shows a non-subscriber the preview and subscription options only, and never the protected content.", "rationale": "Today a subscriber can pass a flipbook link to anyone; the new system must close that.", "acceptance": ["Given a subscriber copies the address of an issue and sends it to a signed-out person, when it is opened, then only the preview and subscribe prompt appear.", "Given the link is opened by a signed-in user without entitlement, then the same result occurs.", "Link addresses contain no token that grants access by itself."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Marketing", "Subscriber"], "journeys": ["J-07"], "brd_ref": [], "source": "Transcript 23 Oct", "open_items": [], "notes": "Raised in the 23 Oct meeting; the legacy platform allows any link to be shared.", "phase_reason": "Reading, sharing and access control are what subscribers pay for.", "domain_name": "Content reading and delivery", "group": "G1"}, {"id": "CDL-014", "domain": "CDL", "title": "Access removal on expiry", "statement": "The system shall remove access to protected content when an entitlement ends, including web views, embedded players, issue links and offline copies, within 15 minutes for online access and at next connection for offline copies.", "rationale": "Expired subscribers must not keep content, as the RFP requires.", "acceptance": ["Given an entitlement expires, when the user reloads a protected page, then within 15 minutes the page shows the renewal prompt.", "Given an expired user with offline copies, when the device reconnects, then the copies are deleted.", "Embedded players for the user stop playing within 15 minutes."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Subscriber"], "journeys": ["J-07", "J-08"], "brd_ref": ["BR-008"], "source": "RFP draft", "open_items": [], "notes": "", "phase_reason": "Reading, sharing and access control are what subscribers pay for.", "domain_name": "Content reading and delivery", "group": "G1"}, {"id": "CDL-015", "domain": "CDL", "title": "Share article with conversion path", "statement": "The s
