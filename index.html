 a workaround exists in Phase 1.", "domain_name": "Marketing, campaigns and communications", "group": "G4"}, {"id": "MKT-014", "domain": "MKT", "title": "Scheduled social posts", "statement": "The system shall let editors compose social posts per channel from approved content, schedule them, record the final link, and require human review of any machine-written copy before publishing.", "rationale": "Social amplification of new issues should be efficient and safe.", "acceptance": ["Given a draft containing machine-written text, then it cannot be scheduled without a named reviewer's approval.", "Given a post is published, then its final link is stored against the article."], "priority": "Could", "phase": "Phase 3", "type": "Functional", "actors": ["Editor", "Marketing"], "journeys": [], "brd_ref": ["FR-054"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Experiments and scheduled social need stable traffic and a mature content process.", "domain_name": "Marketing, campaigns and communications", "group": "G4"}, {"id": "AIX-001", "domain": "AIX", "title": "AI governance and attribution", "statement": "The system shall record that every published piece of content and every theological decision was approved by an identified authorised human, and shall label any AI-generated text, and shall allow all AI features to be switched off without affecting reading, subscription or editorial functions.", "rationale": "Publication and theological judgement stay with accountable people.", "acceptance": ["Given any AI-assisted draft, when published, then the approving human is recorded and AI contribution is labelled.", "A single administrative control disables all AI features; reading, purchasing and publishing continue to work.", "Every AI interaction is logged with user, input, sources, model version and output."], "priority": "Should", "phase": "Phase 3", "type": "Compliance", "actors": ["Publisher", "System administrator"], "journeys": ["J-16"], "brd_ref": ["BR-006"], "source": "AI strategy", "open_items": [], "notes": "", "phase_reason": "AI features need the content, search and entitlement data of Phases 1 and 2, and governance in place first.", "domain_name": "AI-assisted features", "group": "G4"}, {"id": "AIX-002", "domain": "AIX", "title": "Hybrid archive search", "statement": "The system shall combine exact-term and meaning-based retrieval for archive search, disclose when semantic matching is used, offer an exact-match mode, and never retrieve content the user is not entitled to read.", "rationale": "Readers need to find ideas as well as words.", "acceptance": ["Given a query, when exact-match mode is on, then only literal matches are returned.", "Results indicate when they were found by meaning rather than by words.", "A non-subscriber never receives full text or snippets of paywalled articles."], "priority": "Could", "phase": "Phase 3", "type": "Functional", "actors": ["Subscriber"], "journeys": ["J-07", "J-16"], "brd_ref": ["FR-034"], "source": "AI strategy", "open_items": [], "notes": "", "phase_reason": "AI features need the content, search and entitlement data of Phases 1 and 2, and governance in place first.", "domain_name": "AI-assisted features", "group": "G4"}, {"id": "AIX-003", "domain": "AIX", "title": "Grounded question answering", "statement": "The system shall let an entitled user ask a question over approved Liguorian content and shall return an answer with claim-level citations linking to the sources, together with scope limits.", "rationale": "Readers want guidance but wrong answers are costly.", "acceptance": ["Given a question, when answered, then every substantive claim has a linked citation to an approved source.", "Citations appear next to the claim they support and open the cited passage.", "An answer without sufficient approved evidence is not produced (see AIX-004)."], "priority": "Could", "phase": "Phase 3", "type": "Functional", "actors": ["Subscriber"], "journeys": ["J-16"], "brd_ref": ["FR-037"], "source": "AI strategy", "open_items": [], "notes": "", "phase_reason": "AI features need the content, search and entitlement data of Phases 1 and 2, and governance in place first.", "domain_name": "AI-assisted features", "group": "G4"}, {"id": "AIX-004", "domain": "AIX", "title": "Abstention on weak evidence", "statement": "The system shall decline to give a substantive answer when retrieved approved evidence does not meet a defined threshold, and shall say so plainly and suggest related articles.", "rationale": "An honest no is better than a fluent mistake.", "acceptance": ["Given a question with no relevant approved sources, when asked, then the system declines and lists related reading.", "The evidence threshold is documented and configurable by administrators.", "At least 95% of an agreed set of out-of-scope test questions are declined."], "priority": "Should", "phase": "Phase 3", "type": "Functional", "actors": ["Subscriber"], "journeys": ["J-16"], "brd_ref": ["FR-037"], "source": "AI strategy", "open_items": [], "notes": "", "phase_reason": "AI features need the content, search and entitlement data of Phases 1 and 2, and governance in place first.", "domain_name": "AI-assisted features", "group": "G4"}, {"id": "AIX-005", "domain": "AIX", "title": "Authority tier labelling", "statement": "The system shall label every cited source with its authority tier (Approved Bible translation, Catechism, Magisterial documents, approved Redemptorist sources, Liguorian guidelines, Liguorian published content) and shall never present commentary as equal in authority to Scripture, the Catechism or Magisterial documents.", "rationale": "The six-tier hierarchy is a theological control.", "acceptance": ["Each citation shows its tier label and source details.", "Given a theological question, Tier 1 to 3 sources are shown before Tier 6 commentary when they exist.", "A Tier 6 article is never labelled as Scripture, Catechism or Magisterial teaching."], "priority": "Should", "phase": "Phase 3", "type": "Compliance", "actors": ["Subscriber", "Theological reviewer"], "journeys": ["J-16"], "brd_ref": ["BR-006"], "source": "AI strategy", "open_items": [], "notes": "", "phase_reason": "AI features need the content, search and entitlement data of Phases 1 and 2, and governance in place first.", "domain_name": "AI-assisted features", "group": "G4"}, {"id": "AIX-006", "domain": "AIX", "title": "Approved source corpus", "statement": "The system shall hold AI source material only as approved corpus objects carrying source ID, tier, rights status, permitted uses, language, edition, approver and approval date, and shall exclude unapproved or withdrawn objects from retrieval.", "rationale": "The AI is only as trustworthy as the corpus it reads.", "acceptance": ["Given a corpus object without an approver, when indexing runs, then it is not retrievable.", "Withdrawing a source removes it from answers within 24 hours.", "A report lists corpus objects by tier and approval status."], "priority": "Should", "phase": "Phase 3", "type": "Data", "actors": ["Content administrator", "Theological reviewer"], "journeys": ["J-16"], "brd_ref": ["FR-037"], "source": "AI strategy", "open_items": [], "notes": "", "phase_reason": "AI features need the content, search and entitlement data of Phases 1 and 2, and governance in place first.", "domain_name": "AI-assisted features", "group": "G4"}, {"id": "AIX-007", "domain": "AIX", "title": "Entitlement-aware AI", "statement": "The system shall apply the user's access rights to every AI retrieval and answer, so that paid content is used only for entitled users.", "rationale": "AI must not leak paid content.", "acceptance": ["Given a guest, when asking a question, then no paywalled full text appears in the answer or citations.", "Entitlement is checked at query time, not at index time.", "Access tests are included in the release test pack."], "priority": "Should", "phase": "Phase 3", "type": "Compliance", "actors": ["Subscriber"], "journeys": ["J-16"], "brd_ref": ["FR-034", "FR-037"], "source": "AI strategy", "open_items": [], "notes": "", "phase_reason": "AI features need the content, search and entitlement data of Phases 1 and 2, and governance in place first.", "domain_name": "AI-assisted features", "group": "G4"}, {"id": "AIX-008", "domain": "AIX", "title": "Editorial writing assistants", "statement": "The system shall offer editors reversible suggestions for house style, spelling, headlines, teasers, metadata and image alternative text, shown with reasons, with each change accepted or rejected by the editor and logged.", "rationale": "Assistance speeds editing but the editor decides.", "acceptance": ["Given a suggestion, when rejected, then the text is unchanged and the rejection is logged.", "Quotations, citations and names are never altered without explicit acceptance.", "Deterministic house-style rules run without AI and take precedence."], "priority": "Could", "phase": "Phase 3", "type": "Functional", "actors": ["Copy editor", "Editor"], "journeys": ["J-11"], "brd_ref": [], "source": "AI strategy", "open_items": [], "notes": "", "phase_reason": "AI features need the content, search and entitlement data of Phases 1 and 2, and governance in place first.", "domain_name": "AI-assisted features", "group": "G4"}, {"id": "AIX-009", "domain": "AIX", "title": "Theological review assistant", "statement": "The system shall flag possible doctrinal, terminology, quotation and citation concerns for the authorised theological reviewer, who always makes the decision.", "rationale": "Review time is scarce and flags help focus it.", "acceptance": ["Given a flagged passage, when the reviewer opens it, then the concern and the evidence are shown.", "No article is approved by AI output alone.", "Reviewer decisions are recorded with name and date."], "priority": "Could", "phase": "Phase 3", "type": "Functional", "actors": ["Theological reviewer"], "journeys": ["J-11"], "brd_ref": [], "source": "AI strategy", "open_items": [], "notes": "", "phase_reason": "AI features need the content, search and entitlement data of Phases 1 and 2, and governance in place first.", "domain_name": "AI-assisted features", "group": "G4"}, {"id": "AIX-010", "domain": "AIX", "title": "Citation verification", "statement": "The system shall check that each cited reference, quotation and link exists and supports the claim, and shall flag unsupported or partially supported citations before publication.", "rationale": "Bad citations erode trust.", "acceptance": ["Given a citation to a missing source, when checked, then it is blocked from publication.", "Partial support is flagged for editor decision.", "Deterministic checks (existence, format, working link) run before any AI-based check."], "priority": "Could", "phase": "Phase 3", "type": "Functional", "actors": ["Editor"], "journeys": ["J-11"], "brd_ref": [], "source": "AI strategy", "open_items": [], "notes": "", "phase_reason": "AI features need the content, search and entitlement data of Phases 1 and 2, and governance in place first.", "domain_name": "AI-assisted features", "group": "G4"}, {"id": "FUL-001", "domain": "FUL", "title": "Renewal-aware mailing list", "statement": "The system shall produce a mailing list for each print issue that contains every subscriber with a paid, active or gifted print entitlement on the issue's cut-off date, excluding lapsed, held and cancelled records.", "rationale": "Mail house copies must match paying subscribers without manual spreadsheet work.", "acceptance": ["Given 1,000 test subscribers in mixed states, the list contains exactly the records with an active print entitlement on the cut-off date", "Records in grace period follow the configured grace rule and are flagged in the file", "The list can be regenerated for any past issue and matches the original file"], "priority": "Must", "phase": "Phase 1", "type": "Integration", "actors": ["Finance", "Mail house", "System administrator"], "journeys": ["J-01", "J-08"], "brd_ref": ["BR-009"], "source": "Amended BRD", "open_items": ["OI-08"], "notes": "", "phase_reason": "Print subscribers must keep receiving issues; the mail house needs the same list on day one.", "domain_name": "Print fulfilment and mailing", "group": "G5"}, {"id": "FUL-002", "domain": "FUL", "title": "Issue cut-off date configuration", "statement": "The system shall let an authorised administrator define, per issue and per product, a mailing cut-off date and time that decides which subscription changes appear in that issue's list.", "rationale": "Print schedules change by issue and must not need a code release.", "acceptance": ["An administrator sets and changes a cut-off without a code change, with approval and rollback", "A change made after the cut-off applies to the next issue and the subscriber is told the first issue they will receive", "Cut-off changes appear in the audit log with actor and reason"], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Managing editor", "System administrator"], "journeys": ["J-08", "J-14"], "brd_ref": ["BR-009", "FR-049"], "source": "Amended BRD", "open_items": ["OI-08"], "notes": "", "phase_reason": "Print subscribers must keep receiving issues; the mail house needs the same list on day one.", "domain_name": "Print fulfilment and mailing", "group": "G5"}, {"id": "FUL-003", "domain": "FUL", "title": "Late change handling after freeze", "statement": "The system shall freeze each mailing list at the cut-off, record any later change as pending for the following issue, and allow an authorised agent to request a single-copy exception to the mail house.", "rationale": "Subscribers who move or renew just after the freeze still need a defined outcome.", "acceptance": ["A change made one minute after cut-off is not in the frozen file and is queued for the next issue", "An agent can raise a single-copy exception and the exception appears in the audit file", "The subscriber-facing confirmation names the first issue affected"], "priority": "Should", "phase": "Phase 1", "type": "Functional", "actors": ["Customer service agent", "Finance"], "journeys": ["J-08", "J-10"], "brd_ref": ["BR-009"], "source": "New (this BRS)", "open_items": ["OI-08"], "notes": "", "phase_reason": "Print subscribers must keep receiving issues; the mail house needs the same list on day one.", "domain_name": "Print fulfilment and mailing", "group": "G5"}, {"id": "FUL-004", "domain": "FUL", "title": "Address standardisation on entry", "statement": "The system shall validate and standardise every US postal address against a USPS CASS-certified reference at checkout, gift entry and every address edit, and shall offer the corrected address for confirmation.", "rationale": "Undeliverable addresses waste print and postage cost.", "acceptance": ["A mistyped street number returns a suggested corrected address within 2 seconds at the 95th percentile", "A subscriber can confirm the suggestion or keep the original address with a visible warning", "Unverified addresses are flagged in the record and counted in a report"], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Customer service agent", "Gift buyer", "Subscriber"], "journeys": ["J-01", "J-02", "J-08"], "brd_ref": [], "source": "New (this BRS)", "open_items": ["OI-08"], "notes": "", "phase_reason": "Print subscribers must keep receiving issues; the mail house needs the same list on day one.", "domain_name": "Print fulfilment and mailing", "group": "G5"}, {"id": "FUL-005", "domain": "FUL", "title": "Change-of-address update before print", "statement": "The system shall run a USPS NCOALink change-of-address check on the mailing list before each print run, apply moves automatically where permitted, and keep an audit record of each change.", "rationale": "Moved subscribers otherwise stop receiving issues and trigger complaints.", "acceptance": ["A test record with a known move is updated before the file is released", "Each automatic change stores old address, new address and run date", "Records that cannot be updated automatically appear on an exceptions list for an agent"], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Customer service agent", "Finance", "Mail house"], "journeys": ["J-08"], "brd_ref": [], "source": "New (this BRS)", "open_items": ["OI-08"], "notes": "Who runs the check (platform or mail house) is open.", "phase_reason": "Print subscribers must keep receiving issues; the mail house needs the same list on day one.", "domain_name": "Print fulfilment and mailing", "group": "G5"}, {"id": "FUL-006", "domain": "FUL", "title": "International address support", "statement": "The system shall accept, store and print postal addresses for countries outside the US using country-specific field layouts, and shall apply international postage rules from configuration.", "rationale": "Overseas subscribers and the BRD's later markets must not need code changes.", "acceptance": ["A subscriber enters a Philippine, Italian and Malaysian test address and each prints in the correct layout", "Country-specific postage or surcharge applies from configuration, not code", "Non-US addresses skip US-only validation but pass a configured completeness check"], "priority": "Should", "phase": "Phase 3", "type": "Functional", "actors": ["Customer service agent", "Subscriber"], "journeys": ["J-01", "J-08"], "brd_ref": ["BR-004"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Applies to markets beyond the US launch.", "domain_name": "Print fulfilment and mailing", "group": "G5"}, {"id": "FUL-007", "domain": "FUL", "title": "Returned mail handling", "statement": "The system shall let an authorised user record returned or undelivered copies against a subscriber, suspend further mailings after a configured number of returns, and notify the subscriber to confirm their address.", "rationale": "Repeated returns burn postage and signal an outdated address.", "acceptance": ["Recording a return with reason code removes the subscriber from the next list after the configured threshold", "The subscriber receives a prompt to confirm their address by email", "Reinstating the address restores the record to the next list"], "priority": "Should", "phase": "Phase 1", "type": "Functional", "actors": ["Customer service agent", "Mail house"], "journeys": ["J-08", "J-10"], "brd_ref": [], "source": "New (this BRS)", "open_items": ["OI-08"], "notes": "", "phase_reason": "Print subscribers must keep receiving issues; the mail house needs the same list on day one.", "domain_name": "Print fulfilment and mailing", "group": "G5"}, {"id": "FUL-008", "domain": "FUL", "title": "Holds and vacation stops", "statement": "The system shall allow a subscriber or agent to place a print subscription on hold for a chosen date range, exclude the held issues from mailing lists and either extend the term or credit the skipped issues as the plan rule says.", "rationale": "Readers who travel expect no lost copies and no lost value.", "acceptance": ["A hold from 1 July to 31 August removes the subscriber from lists dated in that range", "The term end date moves by the number of skipped issues, or a credit applies, as configured", "The hold is visible in the customer dashboard and the agent console"], "priority": "Should", "phase": "Phase 1", "type": "Functional", "actors": ["Customer service agent", "Subscriber"], "journeys": ["J-08", "J-10"], "brd_ref": [], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Print subscribers must keep receiving issues; the mail house needs the same list on day one.", "domain_name": "Print fulfilment and mailing", "group": "G5"}, {"id": "FUL-009", "domain": "FUL", "title": "Back-issue orders", "statement": "The system shall sell and fulfil individual back issues as print or digital items, show availability, and decrement stock on order.", "rationale": "Back-issue sales are a revenue stream carried in the BRD.", "acceptance": ["A back issue shows in-stock, low-stock or sold-out from the stock count", "An order creates a pick-and-ship record for print or immediate access for digital", "Sold-out print issues offer the digital edition if one exists"], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Customer service agent", "Subscriber"], "journeys": ["J-07"], "brd_ref": ["BR-012"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Valuable but not needed to retire the old systems; a workaround exists in Phase 1.", "domain_name": "Print fulfilment and mailing", "group": "G5"}, {"id": "FUL-010", "domain": "FUL", "title": "Missed and damaged copy claims", "statement": "The system shall let a subscriber report a missed or damaged copy through the dashboard or an agent, and shall create a replacement shipment request with reason code and a limit on replacements per term.", "rationale": "Claims are a routine service event and must be tracked, not handled by email.", "acceptance": ["A claim creates a case and a replacement request in one step", "The configured limit blocks further automatic replacements and routes the case to an agent", "Claim counts by issue appear in fulfilment reporting"], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Customer service agent", "Subscriber"], "journeys": ["J-08", "J-10"], "brd_ref": ["FR-013"], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Should-level with a workaround: Claims are handled by customer service by hand at first.", "domain_name": "Print fulfilment and mailing", "group": "G5"}, {"id": "FUL-011", "domain": "FUL", "title": "Gift and scheduled start in print", "statement": "The system shall start a gifted or scheduled print subscription with the first issue on or after the chosen start date and shall include the gift message card instruction in the mail house file where one was ordered.", "rationale": "Gift timing and messages are central to the gifting offer.", "acceptance": ["A gift with a start date of 1 March begins with the first issue whose cut-off is on or after that date", "The file carries the recipient address and a gift flag; the buyer's address is not exposed to the recipient", "Recipients with no valid address are flagged before cut-off"], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Finance", "Gift buyer", "Gift recipient"], "journeys": ["J-02", "J-03"], "brd_ref": ["FR-042"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Print subscribers must keep receiving issues; the mail house needs the same list on day one.", "domain_name": "Print fulfilment and mailing", "group": "G5"}, {"id": "FUL-012", "domain": "FUL", "title": "Fulfilment audit file and counts", "statement": "The system shall produce, for every mailing, an audit file with record count, checksum, run time and list definition, and shall reconcile the mail house's received count and mailed count against it.", "rationale": "Finance and circulation need proof of what was sent.", "acceptance": ["The audit file for a test run matches the file the mail house received", "A mismatch between sent and received counts raises an alert to the operations owner", "Audit files are retained for the period set in configuration"], "priority": "Must", "phase": "Phase 1", "type": "Operational", "actors": ["Finance", "Mail house", "System administrator"], "journeys": ["J-12"], "brd_ref": ["BR-011"], "source": "New (this BRS)", "open_items": ["OI-08", "OI-13"], "notes": "", "phase_reason": "Print subscribers must keep receiving issues; the mail house needs the same list on day one.", "domain_name": "Print fulfilment and mailing", "group": "G5"}, {"id": "FUL-013", "domain": "FUL", "title": "Secure transfer to mail house", "statement": "The system shall deliver mailing files to the mail house over an encrypted channel using a documented, schema-validated format, and shall retry and alert on failure.", "rationale": "Subscriber addresses are personal data and must not travel by email.", "acceptance": ["Files transfer over an encrypted connection with key-based authentication", "A file failing schema validation is not sent and raises an alert", "A failed transfer retries per configuration and alerts after the last retry"], "priority": "Must", "phase": "Phase 1", "type": "Integration", "actors": ["Mail house", "System administrator"], "journeys": ["J-14"], "brd_ref": ["NFR-006"], "source": "New (this BRS)", "open_items": ["OI-08"], "notes": "", "phase_reason": "Print subscribers must keep receiving issues; the mail house needs the same list on day one.", "domain_name": "Print fulfilment and mailing", "group": "G5"}, {"id": "FUL-014", "domain": "FUL", "title": "Print continuity through cutover", "statement": "The system shall support a documented cutover plan in which at least one full print cycle is produced from both the old and new list generation, compared, and signed off before the old process is retired.", "rationale": "The BRD forbids disruption to mailing cut-offs.", "acceptance": ["Two consecutive print cycles show zero unexplained differences between old and new lists", "A written rollback to the old process exists and has been rehearsed once", "Sign-off is recorded by the named Liguori approver"], "priority": "Must", "phase": "Phase 1", "type": "Operational", "actors": ["Finance", "Managing editor", "System administrator"], "journeys": ["J-14"], "brd_ref": ["BR-009"], "source": "Amended BRD", "open_items": ["OI-08", "OI-07"], "notes": "", "phase_reason": "Print subscribers must keep receiving issues; the mail house needs the same list on day one.", "domain_name": "Print fulfilment and mailing", "group": "G5"}, {"id": "FIN-001", "domain": "FIN", "title": "Product tax codes", "statement": "The system shall assign every sellable item a tax code (print subscription, digital subscription, bundle, gift, book, merchandise, donation) and shall apply no sales tax to items coded as donations.", "rationale": "Correct tax depends on how each product is classified.", "acceptance": ["Every catalogue item has a tax code before it can be published", "A donation line never carries sales tax", "Changing a code is audited and applies only to future orders"], "priority": "Must", "phase": "Phase 1", "type": "Compliance", "actors": ["Finance"], "journeys": ["J-12"], "brd_ref": [], "source": "Review Part 3", "open_items": ["OI-03"], "notes": "", "phase_reason": "Tax, receipts and ledger export must work from the first transaction.", "domain_name": "Tax, accounting and receipts", "group": "G5"}, {"id": "FIN-002", "domain": "FIN", "title": "Calculate sales tax at checkout", "statement": "The system shall calculate sales tax at checkout from product tax code and destination address, and show it as a separate line before the buyer pays.", "rationale": "US states tax print and digital products differently.", "acceptance": ["Given a taxable item and a destination in a configured state, then tax appears before payment", "Given an exempt item, then no tax line shows", "Calculated tax matches the tax engine's reference result in 100% of a 50-case test set"], "priority": "Must", "phase": "Phase 1", "type": "Compliance", "actors": ["Finance", "Subscriber"], "journeys": ["J-01", "J-12"], "brd_ref": [], "source": "Review Part 3", "open_items": ["OI-03"], "notes": "", "phase_reason": "Tax, receipts and ledger export must work from the first transaction.", "domain_name": "Tax, accounting and receipts", "group": "G5"}, {"id": "FIN-003", "domain": "FIN", "title": "Tax registrations by state", "statement": "The system shall let finance configure the states in which Liguori collects tax, with effective dates, and shall stop collecting where registration ends.", "rationale": "Collection is lawful only after registration.", "acceptance": ["Finance adds a state with an effective date and tax is collected from that date", "Orders to unregistered states carry no tax and are flagged for review", "Changes are audited"], "priority": "Must", "phase": "Phase 1", "type": "Compliance", "actors": ["Finance"], "journeys": ["J-12"], "brd_ref": [], "source": "Review Part 3", "open_items": ["OI-03"], "notes": "", "phase_reason": "Tax, receipts and ledger export must work from the first transaction.", "domain_name": "Tax, accounting and receipts", "group": "G5"}, {"id": "FIN-004", "domain": "FIN", "title": "Tax shown on receipts and invoices", "statement": "The system shall itemise tax by jurisdiction on every receipt and invoice and store the tax amount, rate and jurisdiction with each order line.", "rationale": "Itemised tax supports filing and audit.", "acceptance": ["A receipt for a taxable order lists tax by jurisdiction", "Order records store rate, amount and jurisdiction", "Stored values never change after the order completes"], "priority": "Must", "phase": "Phase 1", "type": "Compliance", "actors": ["Finance", "Subscriber"], "journeys": ["J-12"], "brd_ref": [], "source": "New (this BRS)", "open_items": ["OI-03"], "notes": "", "phase_reason": "Tax, receipts and ledger export must work from the first transaction.", "domain_name": "Tax, accounting and receipts", "group": "G5"}, {"id": "FIN-005", "domain": "FIN", "title": "Tax exemption certificates", "statement": "The system shall let an institutional buyer upload an exemption certificate, let finance approve it with an expiry date, and apply exemption to eligible orders until it expires.", "rationale": "Parishes and schools are often tax-exempt.", "acceptance": ["Given an approved certificate, then eligible orders carry no tax", "An expired certificate triggers a notice 30 days before and stops exemption on expiry", "Certificates are stored with access limited to finance"], "priority": "Should", "phase": "Phase 1", "type": "Compliance", "actors": ["Finance", "Institutional administrator"], "journeys": ["J-09", "J-12"], "brd_ref": [], "source": "New (this BRS)", "open_items": ["OI-03", "OI-11"], "notes": "", "phase_reason": "Tax, receipts and ledger export must work from the first transaction.", "domain_name": "Tax, accounting and receipts", "group": "G5"}, {"id": "FIN-006", "domain": "FIN", "title": "Tax filing report", "statement": "The system shall produce a report by state and period of taxable sales, exempt sales and tax collected, exportable as CSV.", "rationale": "Finance files returns from this data.", "acceptance": ["The report totals reconcile to the ledger within 0.01 USD", "Report runs for a month of 100,000 orders complete in under 5 minutes", "Output includes jurisdiction, rate and exemption reason"], "priority": "Should", "phase": "Phase 1", "type": "Operational", "actors": ["Finance"], "journeys": ["J-12"], "brd_ref": ["FR-047"], "source": "Review Part 3", "open_items": ["OI-03"], "notes": "", "phase_reason": "Tax, receipts and ledger export must work from the first transaction.", "domain_name": "Tax, accounting and receipts", "group": "G5"}, {"id": "FIN-007", "domain": "FIN", "title": "Deferred revenue schedule", "statement": "The system shall build a schedule that recognises subscription revenue evenly over the subscription term and holds unearned amounts as deferred revenue.", "rationale": "A 12-month subscription paid today is earned over 12 months.", "acceptance": ["Given a 12-month subscription at 120 USD, then 10 USD is recognised each month", "Cancellations and refunds adjust the schedule from the effective date", "Total deferred revenue at month end reconciles to the ledger"], "priority": "Must", "phase": "Phase 1", "type": "Operational", "actors": ["Finance"], "journeys": ["J-12"], "brd_ref": [], "source": "Review Part 3", "open_items": ["OI-01"], "notes": "Method is to be agreed with the auditor.", "phase_reason": "Tax, receipts and ledger export must work from the first transaction.", "domain_name": "Tax, accounting and receipts", "group": "G5"}, {"id": "FIN-008", "domain": "FIN", "title": "Journal export to the ledger", "statement": "The system shall export a balanced journal file for each period covering payments, refunds, fees, tax, deferred revenue and donations, in a documented format for the chosen accounting system.", "rationale": "Accounting is not built into the platform.", "acceptance": ["Each exported journal has debits equal to credits", "Donations, subscription revenue, books and tax map to separate accounts via a configurable table", "Re-exporting a closed period gives the same file"], "priority": "Must", "phase": "Phase 1", "type": "Integration", "actors": ["Finance"], "journeys": ["J-12"], "brd_ref": [], "source": "Review Part 3", "open_items": ["OI-01"], "notes": "", "phase_reason": "Tax, receipts and ledger export must work from the first transaction.", "domain_name": "Tax, accounting and receipts", "group": "G5"}, {"id": "FIN-009", "domain": "FIN", "title": "Reconcile payments to the ledger", "statement": "The system shall reconcile each payment processor payout to the underlying orders, fees and refunds and list unmatched items.", "rationale": "Unreconciled payouts hide errors and fraud.", "acceptance": ["A payout report matches its orders and fees to within 0.01 USD", "Unmatched items appear in a queue with age and amount", "Finance marks items resolved with a reason"], "priority": "Must", "phase": "Phase 1", "type": "Operational", "actors": ["Finance"], "journeys": ["J-12"], "brd_ref": [], "source": "Review Part 3", "open_items": ["OI-01"], "notes": "", "phase_reason": "Tax, receipts and ledger export must work from the first transaction.", "domain_name": "Tax, accounting and receipts", "group": "G5"}, {"id": "FIN-010", "domain": "FIN", "title": "Donor receipt at gift", "statement": "The system shall issue a written acknowledgement for every donation of 250 USD or more stating the amount, date, the organisation's name, and whether any goods or services were provided in return.", "rationale": "US donors need written acknowledgement to claim a deduction.", "acceptance": ["Given a gift of 250 USD or more, then the acknowledgement contains all four elements", "The receipt is available by email and in the dashboard within 24 hours", "Receipt wording is approved by finance before launch"], "priority": "Must", "phase": "Phase 1", "type": "Compliance", "actors": ["Donor", "Finance"], "journeys": ["J-04", "J-12"], "brd_ref": [], "source": "Review Part 3", "open_items": ["OI-02"], "notes": "Applies if the issuing entity is a US charity; confirm with the tax adviser.", "phase_reason": "Tax, receipts and ledger export must work from the first transaction.", "domain_name": "Tax, accounting and receipts", "group": "G5"}, {"id": "FIN-011", "domain": "FIN", "title": "Disclosure for gifts with a benefit", "statement": "The system shall, when a payment above 75 USD is partly a gift and partly a purchase, show the value of what was received and the deductible portion on the receipt.", "rationale": "Part-gift part-purchase payments need a good-faith value disclosure.", "acceptance": ["Given a combined donation and subscription, then the receipt lists the subscription value and the deductible amount separately", "Donation and purchase appear as separate order lines", "Valuation rules are configurable by finance"], "priority": "Must", "phase": "Phase 1", "type": "Compliance", "actors": ["Donor", "Finance"], "journeys": ["J-04", "J-12"], "brd_ref": [], "source": "Review Part 3", "open_items": ["OI-02"], "notes": "", "phase_reason": "Tax, receipts and ledger export must work from the first transaction.", "domain_name": "Tax, accounting and receipts", "group": "G5"}, {"id": "FIN-012", "domain": "FIN", "title": "Annual donor statement", "statement": "The system shall generate an annual giving statement per donor or household listing every gift, fund and total for the calendar year, available by 31 January.", "rationale": "Donors need one record for tax filing.", "acceptance": ["A statement totals all receipted gifts for the year for that donor", "Statements are downloadable from the dashboard and emailable", "Anonymous and tribute gifts appear correctly without exposing honourees' data"], "priority": "Must", "phase": "Phase 1", "type": "Compliance", "actors": ["Donor", "Finance"], "journeys": ["J-12", "J-13"], "brd_ref": [], "source": "Review Part 3", "open_items": ["OI-02"], "notes": "", "phase_reason": "Tax, receipts and ledger export must work from the first transaction.", "domain_name": "Tax, accounting and receipts", "group": "G5"}, {"id": "FIN-013", "domain": "FIN", "title": "Refund accounting", "statement": "The system shall record every refund with reason, approver, amount and original order, reverse tax and deferred revenue accordingly, and post the reversal in the next journal export.", "rationale": "Refunds must be traceable and correct the books.", "acceptance": ["A full refund reverses revenue, tax and any unrecognised deferred amount", "A refund over a configurable limit requires a second approver", "Each refund appears in the audit log"], "priority": "Must", "phase": "Phase 1", "type": "Operational", "actors": ["Customer service agent", "Finance"], "journeys": ["J-10", "J-12"], "brd_ref": [], "source": "New (this BRS)", "open_items": ["OI-01"], "notes": "", "phase_reason": "Tax, receipts and ledger export must work from the first transaction.", "domain_name": "Tax, accounting and receipts", "group": "G5"}, {"id": "FIN-014", "domain": "FIN", "title": "Disputes and chargebacks", "statement": "The system shall log each payment dispute with deadline, evidence and outcome, and alert finance at least 3 days before an evidence deadline.", "rationale": "Missed deadlines forfeit disputes.", "acceptance": ["Disputes from the payment processor create a case within 15 minutes", "An alert is sent 3 days before the deadline", "Outcome and fees post to the ledger"], "priority": "Should", "phase": "Phase 1", "type": "Operational", "actors": ["Finance"], "journ ustomer lookup", "statement": "The system shall let an authorised agent find a customer by name, email, phone, customer number or address and show all subscriptions, gifts, donations, orders, cases and entitlements in one view.", "rationale": "Agents currently work across several systems to answer one question.", "acceptance": ["Search by any listed field returns results within 2 seconds at the 95th percentile", "The record view shows active and inactive subscriptions, donations and open cases", "Results hide data the agent's role may not see"], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Customer service agent"], "journeys": ["J-10"], "brd_ref": ["FR-013", "FR-045"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Staff cannot run a platform they cannot support, correct or audit.", "domain_name": "Back office, service and administration", "group": "G5"}, {"id": "BKO-002", "domain": "BKO", "title": "Agent corrections with reason codes", "statement": "The system shall let an authorised agent correct profile, address, subscription, fulfilment and entitlement data, requiring a reason code, showing the effect before saving, and recording the change.", "rationale": "Corrections must be consistent and reviewable.", "acceptance": ["Saving without a reason code is blocked", "The preview shows the changes to billing, entitlement and next mailing", "Every change appears in the audit log with before and after values"], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Customer service agent"], "journeys": ["J-10"], "brd_ref": ["FR-045"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Staff cannot run a platform they cannot support, correct or audit.", "domain_name": "Back office, service and administration", "group": "G5"}, {"id": "BKO-003", "domain": "BKO", "title": "Act on behalf of a customer", "statement": "The system shall let an agent act in a customer's account only priority": "Should", "phase": "Phase 1", "type": "Functional", "actors": ["Customer service agent", "Finance"], "journeys": ["J-01", "J-04"], "brd_ref": [], "source": "Assessment", "open_items": [], "notes": "", "phase_reason": "Staff cannot run a platform they cannot support, correct or audit.", "domain_name": "Back office, service and administration", "group": "G5"}, {"id": "RPT-001", "domain": "RPT", "title": "Event taxonomy and KPI dictionary", "statement": "The system shall publish a controlled event taxonomy and a KPI dictionary that defines each measure, its formula, source system, owner and refresh cadence.", "rationale": "Measurement must be consistent from launch.", "acceptance": ["Every report field maps to a KPI definition", "Definitions are versioned and changes are approved", "A new event cannot be added without a taxonomy entry"], "priority": "Must", "phase": "Phase 1", "type": "Data", "actors": ["Managing editor", "System administrator"], "journeys": [], "brd_ref": ["BR-011"], "source": "Amended BRD", "open_items": ["OI-04"], "notes": "", "phase_reason": "Core numbers (subscribers, renewals, donations, reconciliation) are needed to prove migration and run the business.", "domain_name": "Reporting and analytics", "group": "G5"}, {"id": "RPT-002", "domain": "RPT", "title": "Active subscribers by plan", "statement": "The system shall report active subscribers by plan, product, channel, country and acquisition source, counting a subscriber as active when a paid, gifted or complimentary entitlement is valid on the report date.", "rationale": "The headline measure of subscription health.", "acceptance": ["The count reconciles to the entitlement ledger within 0.1 percent", "The report can be filtered by plan, country and date", "Refreshes at least daily"], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Finance", "Managing editor", "Marketing"], "journeys": ["J-12"], "brd_ref": ["BR-011", "BR-008"], "source": "Amended BRD", "open_items": ["OI-04"], "notes": "", "phase_reason": "Core numbers (subscribers, renewals, donations, reconciliation) are needed to prove migration and run the business.", "domain_name": "Reporting and analytics", "group": "G5"}, {"id": "RPT-003", "domain": "RPT", "title": "Renewal and churn", "statement": "The system shall report renewal rate, voluntary and involuntary churn and reasons for cancellation by cohort and plan.", "rationale": "Shows whether the base is growing.", "acceptance": ["Renewal rate equals renewed subscriptions divided by subscriptions due in the period", "Involuntary churn is separated from cancellations", "Cohort view shows 12 months of retention"], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Finance", "Marketing"], "journeys": ["J-08"], "brd_ref": ["BR-011"], "source": "Amended BRD", "open_items": ["OI-04"], "notes": "", "phase_reason": "Core numbers (subscribers, renewals, donations, reconciliation) are needed to prove migration and run the business.", "domain_name": "Reporting and analytics", "group": "G5"}, {"id": "RPT-004", "domain": "RPT", "title": "Failed-payment recovery", "statement": "The system shall report failed payments, recovery attempts, recovered amount and recovery rate by reason code and attempt number.", "rationale": "Payment failures are a major avoidable loss.", "acceptance": ["Report shows each retry step and outcome", "Recovered amount reconciles to payment records", "Refreshes at least daily"], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Customer service agent", "Finance"], "journeys": ["J-08", "J-12"], "brd_ref": ["BR-008"], "source": "New (this BRS)", "open_items": ["OI-04"], "notes": "", "phase_reason": "Core numbers (subscribers, renewals, donations, reconciliation) are needed to prove migration and run the business.", "domain_name": "Reporting and analytics", "group": "G5"}, {"id": "RPT-005", "domain": "RPT", "title": "Donation totals and retention", "statement": "The system shall report donations by type, campaign, fund, tribute flag, donor and period, with donor retention, upgrade and lapse measures.", "rationale": "Development staff need to steward donors and show results.", "acceptance": ["Totals match payment records and refunds", "Retention rate follows the stated formula and is filterable by cohort", "Tribute gifts are identified without exposing honouree data to roles that should not see it"], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Development staff", "Finance"], "journeys": ["J-13"], "brd_ref": ["BR-011"], "source": "New (this BRS)", "open_items": ["OI-04", "OI-02"], "notes": "", "phase_reason": "Core numbers (subscribers, renewals, donations, reconciliation) are needed to prove migration and run the business.", "domain_name": "Reporting and analytics", "group": "G5"}, {"id": "RPT-006", "domain": "RPT", "title": "Gift redemption", "statement": "The system shall report gifts sold, redeemed, unredeemed, expired and refunded, with days to redemption and recipient conversion to paid subscribers.", "rationale": "Unredeemed gifts are a liability and a follow-up opportunity.", "acceptance": ["Counts of sold equal redeemed plus unredeemed plus expired plus refunded", "Report lists unredeemed gifts approaching expiry", "Conversion rate defined in the KPI dictionary"], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Finance", "Marketing"], "journeys": ["J-02", "J-03"], "brd_ref": ["FR-042"], "source": "New (this BRS)", "open_items": ["OI-04"], "notes": "", "phase_reason": "Gift and engagement reports need live data to be useful.", "domain_name": "Reporting and analytics", "group": "G5"}, {"id": "RPT-007", "domain": "RPT", "title": "Content engagement", "statement": "The system shall report reads, completion, time spent, shares, saves, downloads and searches by article, issue, topic, author and locale, without recording identity beyond consented analytics.", "rationale": "Editors need evidence of what readers value.", "acceptance": ["Report shows top 20 articles by completion for any period", "Locale and entitlement type are filterable", "Data respects consent choices"], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Editor", "Managing editor"], "journeys": ["J-07", "J-11"], "brd_ref": ["BR-011"], "source": "Amended BRD", "open_items": ["OI-04"], "notes": "", "phase_reason": "Gift and engagement reports need live data to be useful.", "domain_name": "Reporting and analytics", "group": "G5"}, {"id": "RPT-008", "domain": "RPT", "title": "Circulation and fulfilment counts", "statement": "The system shall report print copies mailed, returned, replaced and held per issue and digital active readers, and reconcile mailed counts to the mail house file.", "rationale": "Circulation numbers feed planning and audits.", "acceptance": ["Mailed count equals audit file count", "Report covers any past issue", "Variance above a configured threshold raises an alert"], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Finance", "Managing editor"], "journeys": ["J-12"], "brd_ref": ["BR-009", "BR-011"], "source": "Amended BRD", "open_items": ["OI-04", "OI-13"], "notes": "", "phase_reason": "Core numbers (subscribers, renewals, donations, reconciliation) are needed to prove migration and run the business.", "domain_name": "Reporting and analytics", "group": "G5"}, {"id": "RPT-009", "domain": "RPT", "title": "Finance reconciliation report", "statement": "The system shall produce a daily and monthly reconciliation of orders, payments, refunds, taxes, donations and payouts against payment-processor settlements, listing every unmatched item.", "rationale": "Finance must close the month with confidence.", "acceptance": ["Totals by day match settlement reports or list differences", "Tax collected is shown by jurisdiction", "Unmatched items stay open until resolved by a named user"], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Finance"], "journeys": ["J-12"], "brd_ref": ["BR-008"], "source": "New (this BRS)", "open_items": ["OI-01", "OI-03", "OI-04"], "notes": "", "phase_reason": "Core numbers (subscribers, renewals, donations, reconciliation) are needed to prove migration and run the business.", "domain_name": "Reporting and analytics", "group": "G5"}, {"id": "RPT-010", "domain": "RPT", "title": "Service-level and readiness dashboard", "statement": "The system shall show editorial turnaround, issue readiness, support case ages, availability and key error rates against targets.", "rationale": "BR-011 requires these to be measurable from launch.", "acceptance": ["Each measure has a target and a status colour with a non-colour indicator", "Issue readiness shows the percentage of articles ready by due date", "Data is no more than 15 minutes old for availability measures"], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Managing editor", "System administrator"], "journeys": ["J-11"], "brd_ref": ["BR-011", "NFR-012"], "source": "Amended BRD", "open_items": ["OI-04"], "notes": "", "phase_reason": "Valuable but not needed to retire the old systems; a workaround exists in Phase 1.", "domain_name": "Reporting and analytics", "group": "G5"}, {"id": "RPT-011", "domain": "RPT", "title": "Report access, scheduling and export", "statement": "The system shall restrict each report by role, let users schedule delivery by email and export results as CSV, and record access to reports containing personal data.", "rationale": "Reporting must be controlled and convenient.", "acceptance": ["A user without the finance role cannot open the reconciliation report", "Scheduled reports run at the chosen time and deliver to named recipients", "Exports are logged"], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Development staff", "Finance"], "journeys": ["J-12", "J-13"], "brd_ref": ["FR-047"], "source": "New (this BRS)", "open_items": ["OI-04"], "notes": "", "phase_reason": "Should-level with a workaround: Standard reports are enough; scheduling and export follow.", "domain_name": "Reporting and analytics", "group": "G5"}, {"id": "RPT-012", "domain": "RPT", "title": "Analytics privacy and consent", "statement": "The system shall collect analytics only as allowed by the user's consent choice, honour opt-outs and global privacy signals, and provide reports on aggregated or pseudonymous data.", "rationale": "Privacy law and trust require it.", "acceptance": ["With analytics declined, no analytics identifiers are set", "Global Privacy Control signal is honoured for California users", "Personal-data reports are limited to named roles"], "priority": "Must", "phase": "Phase 1", "type": "Compliance", "actors": ["Marketing", "System administrator"], "journeys": ["J-07"], "brd_ref": ["BR-007"], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Core numbers (subscribers, renewals, donations, reconciliation) are needed to prove migration and run the business.", "domain_name": "Reporting and analytics", "group": "G5"}, {"id": "MIG-001", "domain": "MIG", "title": "Migration source inventory", "statement": "The system shall be preceded by a signed inventory of every legacy source to be migrated: THINK/MPS/Highwire subscriber records, Acumen account and order records, the Magento 1.8 customer login store, the Uberflip and Issuu archives, and the Managing Scrupulosity content.", "rationale": "The legacy estate is spread over several systems and no single list of what must move exists.", "acceptance": ["Inventory names each source, owner, record count, data fields, access method and export format", "Each source is marked migrate, archive or discard with a named approver", "Inventory is signed off before the first dry run starts"], "priority": "Must", "phase": "Phase 1", "type": "Data", "actors": ["Finance", "System administrator"], "journeys": ["J-14"], "brd_ref": ["BR-010"], "source": "Transcript 23 Oct", "open_items": ["OI-09"], "notes": "", "phase_reason": "Migration is how the old systems are retired; it is the exit gate for Phase 1.", "domain_name": "Data migration and cutover", "group": "G5"}, {"id": "MIG-002", "domain": "MIG", "title": "Subscriber and entitlement records", "statement": "The system shall import every active and lapsed-within-24-months subscriber from THINK/MPS/Highwire with plan, term, start date, expiry date, delivery format, language and status.", "rationale": "Subscribers must keep what they paid for without having to re-register.", "acceptance": ["Imported active subscriber count equals the source count after documented exclusions", "Every imported subscriber has plan, expiry and format populated; exceptions are listed, not dropped", "A sample of 200 records matches the source field by field"], "priority": "Must", "phase": "Phase 1", "type": "Data", "actors": ["System administrator"], "journeys": ["J-14"], "brd_ref": ["BR-008"], "source": "Transcript 23 Oct", "open_items": ["OI-09"], "notes": "Export format depends on the THINK contract exit terms.", "phase_reason": "Migration is how the old systems are retired; it is the exit gate for Phase 1.", "domain_name": "Data migration and cutover", "group": "G5"}, {"id": "MIG-003", "domain": "MIG", "title": "Print account and address records", "statement": "The system shall import print delivery accounts, addresses and order history from Acumen, linked to the correct subscriber or institution record.", "rationale": "Print delivery must continue uninterrupted through cutover.", "acceptance": ["Every active print subscriber has exactly one valid delivery address after import", "Addresses failing postal validation are reported with the source record id", "The first post-cutover mailing list matches the last pre-cutover list apart from documented changes"], "priority": "Must", "phase": "Phase 1", "type": "Data", "actors": ["Customer service agent", "System administrator"], "journeys": ["J-14"], "brd_ref": ["BR-009"], "source": "Transcript 23 Oct", "open_items": ["OI-08", "OI-09"], "notes": "", "phase_reason": "Migration is how the old systems are retired; it is the exit gate for Phase 1.", "domain_name": "Data migration and cutover", "group": "G5"}, {"id": "MIG-004", "domain": "MIG", "title": "Customer login records", "statement": "The system shall migrate customer login identities from the Magento 1.8 store so that existing customers can sign in to the new platform, using either verified password-hash import or a forced reset by email.", "rationale": "The old login store is a known security risk and cannot be kept running.", "acceptance": ["Each migrated customer can sign in or complete a reset on first attempt", "Hash import, if used, rehashes to the new standard at first successful login", "No plain-text password is ever stored or logged during migration", "Reset emails are sent in batches that keep the sending reputation intact"], "priority": "Must", "phase": "Phase 1", "type": "Data", "actors": ["System administrator"], "journeys": ["J-14", "J-08"], "brd_ref": [], "source": "Transcript 23 Oct", "open_items": [], "notes": "Hash import depends on the legacy algorithm being supported; otherwise reset is used.", "phase_reason": "Migration is how the old systems are retired; it is the exit gate for Phase 1.", "domain_name": "Data migration and cutover", "group": "G5"}, {"id": "MIG-005", "domain": "MIG", "title": "Entitlement preservation", "statement": "The system shall preserve each migrated subscriber's current entitlement and expiry date so that no subscriber loses access, or gains extra access, at cutover.", "rationale": "Silent access loss at cutover drives complaints and cancellations.", "acceptance": ["Entitlement check for 100% of sampled migrated subscribers returns the same result as the legacy system", "Subscribers with print, digital and bundle plans each show the correct entitlements", "Entitlement differences found in a dry run are logged and resolved before go-live"], "priority": "Must", "phase": "Phase 1", "type": "Data", "actors": ["Finance", "System administrator"], "journeys": ["J-14", "J-07"], "brd_ref": ["BR-008"], "source": "Assessment", "open_items": [], "notes": "", "phase_reason": "Migration is how the old systems are retired; it is the exit gate for Phase 1.", "domain_name": "Data migration and cutover", "group": "G5"}, {"id": "MIG-006", "domain": "MIG", "title": "Outstanding gift subscriptions", "statement": "The system shall migrate unredeemed and part-served gift subscriptions with their gift codes, recipients, start dates and remaining terms.", "rationale": "Gift buyers have paid for something that must still be honoured.", "acceptance": ["Every unredeemed gift code from the legacy system works once on the new platform", "Part-served gifts show the correct remaining term", "No gift code can be redeemed twice across old and new platforms"], "priority": "Must", "phase": "Phase 1", "type": "Data", "actors": ["Customer service agent", "System administrator"], "journeys": ["J-14", "J-03"], "brd_ref": ["FR-042"], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Migration is how the old systems are retired; it is the exit gate for Phase 1.", "domain_name": "Data migration and cutover", "group": "G5"}, {"id": "MIG-007", "domain": "MIG", "title": "Recurring donors and donation history", "statement": "The system shall migrate recurring donor schedules and complete donation history, including dates, amounts, designations and receipts issued.", "rationale": "Donors expect continuity, and annual statements need full-year history.", "acceptance": ["Every active recurring donor has a schedule with the correct amount and next date", "Migrated history totals equal the legacy totals per donor and per year", "A donor's annual statement for the year of cutover includes gifts from both systems"], "priority": "Must", "phase": "Phase 1", "type": "Data", "actors": ["Development staff", "Finance"], "journeys": ["J-14", "J-05", "J-12"], "brd_ref": [], "source": "New (this BRS)", "open_items": ["OI-02", "OI-05"], "notes": "", "phase_reason": "Migration is how the old systems are retired; it is the exit gate for Phase 1.", "domain_name": "Data migration and cutover", "group": "G5"}, {"id": "MIG-008", "domain": "MIG", "title": "Stored payment tokens", "statement": "The system shall carry over stored payment methods for subscribers and recurring donors by processor-to-processor token transfer where the legacy processor permits it, and otherwise shall prompt each affected customer to re-enter a payment method before the next charge.", "rationale": "Without a transfer, every subscriber must re-enter a card, and some will lapse.", "acceptance": ["Transfer feasibility is confirmed in writing by the legacy processor before build starts", "Transferred tokens are never exposed to Liguori systems in clear text", "If transfer is not possible, affected customers receive a staged request starting at least 60 days before their next charge, and lapse rate is tracked weekly"], "priority": "Must", "phase": "Phase 1", "type": "Data", "actors": ["Finance", "System administrator"], "journeys": ["J-14", "J-08", "J-05"], "brd_ref": [], "source": "Review Part 3", "open_items": ["OI-05"], "notes": "Default assumption: transfer is not possible.", "phase_reason": "Migration is how the old systems are retired; it is the exit gate for Phase 1.", "domain_name": "Data migration and cutover", "group": "G5"}, {"id": "MIG-009", "domain": "MIG", "title": "Duplicate detection and merge", "statement": "The system shall identify duplicate people and institutions across all migrated sources using agreed matching rules, and apply merges only after steward approval.", "rationale": "The same parish or person appears in several systems today, which inflates counts and causes duplicate mailings.", "acceptance": ["Matching rules (name, email, address, phone) are documented and tuned on a dry-run sample", "Every proposed merge shows both source records and requires steward approval", "Merges are reversible within 90 days and logged"], "priority": "Must", "phase": "Phase 1", "type": "Data", "actors": ["Customer service agent", "Development staff"], "journeys": ["J-14"], "brd_ref": [], "source": "Transcript 23 Oct", "open_items": [], "notes": "", "phase_reason": "Migration is how the old systems are retired; it is the exit gate for Phase 1.", "domain_name": "Data migration and cutover", "group": "G5"}, {"id": "MIG-010", "domain": "MIG", "title": "Archive migration", "statement": "The system shall migrate the Uberflip and Issuu archives into the content store as structured issues and articles, preserving issue, date, section, author and original page images, with a digitisation-quality flag on each item.", "rationale": "The archive is a core asset and must remain readable and searchable.", "acceptance": ["Every issue in the source inventory appears in the archive or on an exceptions list", "Each migrated article opens at its canonical URL with correct metadata", "Items without clean text are flagged and still viewable as page images"], "priority": "Should", "phase": "Phase 2", "type": "Data", "actors": ["Editor"], "journeys": ["J-14", "J-07"], "brd_ref": ["FR-032"], "source": "Amended BRD", "open_items": ["OI-12"], "notes": "", "phase_reason": "Should-level with a workaround: The back archive is migrated after current subscribers and content.", "domain_name": "Data migration and cutover", "group": "G5"}, {"id": "MIG-011", "domain": "MIG", "title": "Managing Scrupulosity content", "statement": "The system shall migrate the Managing Scrupulosity site content, or archive it with redirects, as decided by Liguori.", "rationale": "This content sits on a separate older site and is easy to lose in a cutover.", "acceptance": ["Decision to migrate or archive is recorded with an approver", "Migrated pages keep their URLs or redirect to equivalents", "Nothing from the old site is left publicly reachable without an owner"], "priority": "Should", "phase": "Phase 1", "type": "Data", "actors": ["Editor"], "journeys": ["J-14"], "brd_ref": [], "source": "Transcript 23 Oct", "open_items": ["OI-15"], "notes": "", "phase_reason": "Migration is how the old systems are retired; it is the exit gate for Phase 1.", "domain_name": "Data migration and cutover", "group": "G5"}, {"id": "MIG-012", "domain": "MIG", "title": "Dry runs and parallel run", "statement": "The system shall be migrated through at least two full dry runs on production-size data and a parallel run covering one complete billing and mailing cycle before cutover.", "rationale": "A single cutover with no rehearsal risks stopping subscriptions and mail.", "acceptance": ["Each dry run produces a written reconciliation report and a defect list", "Parallel run shows no unexplained difference in charges, entitlements or mailing lists", "Go or no-go criteria are agreed in advance and signed by Liguori"], "priority": "Must", "phase": "Phase 1", "type": "Operational", "actors": ["Finance", "System administrator"], "journeys": ["J-14"], "brd_ref": [], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Migration is how the old systems are retired; it is the exit gate for Phase 1.", "domain_name": "Data migration and cutover", "group": "G5"}, {"id": "MIG-013", "domain": "MIG", "title": "Cutover and rollback", "statement": "The system shall have a written, rehearsed cutover plan with a timed freeze window and a rollback that restores the legacy service within the agreed window if go-live criteria fail.", "rationale": "A failed cutover must not leave subscribers without service.", "acceptance": ["Cutover runbook lists every step, owner and duration", "Rollback is rehearsed once and completes within the agreed window", "Legacy systems stay read-only and recoverable for at least 90 days after cutover"], "priority": "Must", "phase": "Phase 1", "type": "Operational", "actors": ["System administrator"], "journeys": ["J-14"], "brd_ref": ["BR-009"], "source": "New (this BRS)", "open_items": ["OI-07"], "notes": "", "phase_reason": "Migration is how the old systems are retired; it is the exit gate for Phase 1.", "domain_name": "Data migration and cutover", "group": "G5"}, {"id": "MIG-014", "domain": "MIG", "title": "Reconciliation and data quality sign-off", "statement": "The system shall provide reconciliation reports comparing record counts, financial totals, entitlements and mailing lists between legacy and new platforms, and Liguori shall sign data quality before legacy systems are retired. Legacy URLs shall redirect to their new equivalents and the Magento 1.8 store shall be securely decommissioned and its data destroyed or archived under the agreed retention rule.", "rationale": "Sign-off proves nothing was lost, and decommissioning removes the largest known security exposure.", "acceptance": ["Reconciliation shows zero unexplained variance in counts, balances and entitlements", "95% or more of the top 1,000 legacy URLs by traffic redirect with a 301 to the right page", "Written confirmation of Magento 1.8 data destruction or encrypted archive is held by Liguori"], "priority": "Must", "phase": "Phase 1", "type": "Operational", "actors": ["Finance", "System administrator"], "journeys": ["J-14"], "brd_ref": ["BR-010"], "source": "Assessment", "open_items": [], "notes": "", "phase_reason": "Migration is how the old systems are retired; it is the exit gate for Phase 1.", "domain_name": "Data migration and cutover", "group": "G5"}, {"id": "HST-001", "domain": "HST", "title": "Separate environments", "statement": "The system shall run in three isolated environments (production, staging and development) with no shared databases, credentials or payment accounts between them.", "rationale": "A test that touches live customer or payment data is the most common cause of avoidable incidents.", "acceptance": ["Given a test purchase in staging, when it completes, then no record exists in production and no real card is charged.", "A credential issued for development is rejected by production."], "priority": "Must", "phase": "Phase 1", "type": "Non-functional", "actors": ["System administrator"], "journeys": [], "brd_ref": [], "source": "Hosting gap review 26 Oct", "open_items": [], "notes": "", "phase_reason": "Hosting foundation, recovery and security must exist before any customer data is loaded.", "domain_name": "Hosting, servers and databases", "group": "G6"}, {"id": "HST-002", "domain": "HST", "title": "United States hosting region", "statement": "The system shall store and process production customer data in data centres located in the United States, and shall record the location of every data store in a register held by Liguori.", "rationale": "US launch, state privacy law and donor expectations require a known location for personal data.", "acceptance": ["The data store register lists every store holding personal data with its region.", "No production personal data is found outside the stated region during a pre-launch audit."], "priority": "Must", "phase": "Phase 1", "type": "Non-functional", "actors": ["System administrator"], "journeys": [], "brd_ref": [], "source": "Hosting gap review 26 Oct", "open_items": [], "notes": "", "phase_reason": "Hosting foundation, recovery and security must exist before any customer data is loaded.", "domain_name": "Hosting, servers and databases", "group": "G6"}, {"id": "HST-003", "domain": "HST", "title": "Liguori owns the hosting accounts", "statement": "The system shall run in cloud and service accounts that are registered to Liguori, with Liguori holding the top-level administrative access and the supplier granted only the access it needs.", "rationale": "Liguori lost source code and control once before. Ownership of accounts is what makes a vendor change possible.", "acceptance": ["Liguori can show the account owner of each hosting, payment, search and content service.", "Removing a supplier's access does not stop the production service."], "priority": "Must", "phase": "Phase 1", "type": "Constraint", "actors": ["System administrator", "Publisher"], "journeys": [], "brd_ref": [], "source": "Hosting gap review 26 Oct", "open_items": ["OI-18"], "notes": "", "phase_reason": "Hosting foundation, recovery and security must exist before any customer data is loaded.", "domain_name": "Hosting, servers and databases", "group": "G6"}, {"id": "HST-004", "domain": "HST", "title": "Infrastructure defined as code", "statement": "The system shall define its servers, networks, databases and permissions in version-controlled code so that any environment can be rebuilt from that code.", "rationale": "Hand-built servers cannot be rebuilt or audited, and the knowledge leaves with the person who built them.", "acceptance": ["A new staging environment is created from the code with no manual configuration steps.", "Every infrastructure change is traceable to a reviewed change in the code repository."], "priority": "Must", "phase": "Phase 1", "type": "Non-functional", "actors": ["System administrator"], "journeys": [], "brd_ref": [], "source": "Hosting gap review 26 Oct", "open_items": [], "notes": "", "phase_reason": "Hosting foundation, recovery and security must exist before any customer data is loaded.", "domain_name": "Hosting, servers and databases", "group": "G6"}, {"id": "HST-005", "domain": "HST", "title": "Automated build, test and release", "statement": "The system shall build, test and release through an automated pipeline that blocks release when automated tests or security checks fail, and that can roll back a release.", "rationale": "Manual releases are slow, risky and hard to roll back on a payment platform.", "acceptance": ["A change with a failing test cannot be released to production.", "A faulty release is rolled back to the previous version within 15 minutes without data loss."], "priority": "Must", "phase": "Phase 1", "type": "Non-functional", "actors": ["System administrator"], "journeys": [], "brd_ref": [], "source": "Hosting gap review 26 Oct", "open_items": [], "notes": "", "phase_reason": "Hosting foundation, recovery and security must exist before any customer data is loaded.", "domain_name": "Hosting, servers and databases", "group": "G6"}, {"id": "HST-006", "domain": "HST", "title": "Releases without service interruption", "statement": "The system shall release routine changes to production without taking the reader site, sign-in or checkout offline.", "rationale": "Readers and donors use the platform around the clock, and giving peaks are time-bound.", "acceptance": ["A routine release is made while a synthetic purchase runs and the purchase completes.", "Any planned downtime is announced to customers at least 48 hours ahead and falls outside the stated peak giving periods."], "priority": "Should", "phase": "Phase 1", "type": "Non-functional", "actors": ["System administrator"], "journeys": [], "brd_ref": [], "source": "Hosting gap review 26 Oct", "open_items": [], "notes": "", "phase_reason": "Hosting foundation, recovery and security must exist before any customer data is loaded.", "domain_name": "Hosting, servers and databases", "group": "G6"}, {"id": "HST-007", "domain": "HST", "title": "Transactional database", "statement": "The system shall hold customers, subscriptions, orders, entitlements, donations and gifts in a relational database that guarantees completed transactions are not partly saved or lost.", "rationale": "Money and access rights need exact, consistent records. Content and search have looser needs and live elsewhere.", "acceptance": ["Given a failure during checkout, then either the whole order is recorded or none of it is.", "Two simultaneous attempts to redeem one gift code result in exactly one redemption."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["System administrator"], "journeys": [], "brd_ref": [], "source": "Hosting gap review 26 Oct", "open_items": [], "notes": "", "phase_reason": "Hosting foundation, recovery and security must exist before any customer data is loaded.", "domain_name": "Hosting, servers and databases", "group": "G6"}, {"id": "HST-008", "domain": "HST", "title": "Database resilience", "statement": "The system shall keep the transactional database available through the failure of a single server or data centre zone, with automatic failover.", "rationale": "The availability target of 99.9% cannot be met if one server is a single point of failure.", "acceptance": ["A forced failure of the primary database server restores service within 5 minutes without manual rebuild.", "No completed order is lost in the failover test."], "priority": "Must", "phase": "Phase 1", "type": "Non-functional", "actors": ["System administrator"], "journeys": [], "brd_ref": [], "source": "Hosting gap review 26 Oct", "open_items": ["OI-06"], "notes": "", "phase_reason": "Hosting foundation, recovery and security must exist before any customer data is loaded.", "domain_name": "Hosting, servers and databases", "group": "G6"}, {"id": "HST-009", "domain": "HST", "title": "Continuous backup and point-in-time recovery", "statement": "The system shall back up the transactional database continuously and shall restore it to any point in the previous 35 days, with no more than 15 minutes of data loss.", "rationale": "The agreed recovery target is 15 minutes of data loss. Point-in-time restore also protects against human error.", "acceptance": ["A restore to a chosen minute is performed and the data matches the source at that minute.", "The most recent restorable point is never more than 15 minutes old."], "priority": "Must", "phase": "Phase 1", "type": "Non-functional", "actors": ["System administrator"], "journeys": [], "brd_ref": [], "source": "Hosting gap review 26 Oct", "open_items": ["OI-06"], "notes": "", "phase_reason": "Hosting foundation, recovery and security must exist before any customer data is loaded.", "domain_name": "Hosting, servers and databases", "group": "G6"}, {"id": "HST-010", "domain": "HST", "title": "Restore rehearsal", "statement": "The system shall prove every quarter that backups restore, by restoring a copy into an isolated environment and checking record counts and a sample of transactions.", "rationale": "An untested backup is a hope. Rehearsal also measures the real restore time against the 4-hour target.", "acceptance": ["A dated restore report is held for each quarter.", "The measured restore time and data loss are within the agreed targets, or a corrective action is logged."], "priority": "Must", "phase": "Phase 1", "type": "Non-functional", "actors": ["System administrator"], "journeys": [], "brd_ref": [], "source": "Hosting gap review 26 Oct", "open_items": [], "notes": "", "phase_reason": "Hosting foundation, recovery and security must exist before any customer data is loaded.", "domain_name": "Hosting, servers and databases", "group": "G6"}, {"id": "HST-011", "domain": "HST", "title": "Reporting separated from live transactions", "statement": "The system shall serve reports and exports from a copy of the data so that heavy reporting cannot slow checkout, sign-in or reading.", "rationale": "A finance export or board report must never slow down a donation.", "acceptance": ["Running the largest standard report during a load test does not change checkout response times beyond agreed limits.", "Report data is no more than 15 minutes older than the live records unless the report states otherwise."], "priority": "Must", "phase": "Phase 1", "type": "Non-functional", "actors": ["System administrator"], "journeys": [], "brd_ref": [], "source": "Hosting gap review 26 Oct", "open_items": [], "notes": "", "phase_reason": "Hosting foundation, recovery and security must exist before any customer data is loaded.", "domain_name": "Hosting, servers and databases", "group": "G6"}, {"id": "HST-012", "domain": "HST", "title": "Media and document storage", "statement": "The system shall store publications, images, audio, video files and generated documents in durable object storage that keeps previous versions and is private by default.", "rationale": "Publications and receipts are the product. Loss or accidental public exposure are both unacceptable.", "acceptance": ["A deleted or overwritten file is recoverable for at least 30 days.", "A direct web address to a private file returns a denial unless it carries a valid short-lived access token."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["System administrator"], "journeys": [], "brd_ref": [], "source": "Hosting gap review 26 Oct", "open_items": [], "notes": "", "phase_reason": "Hosting foundation, recovery and security must exist before any customer data is loaded.", "domain_name": "Hosting, servers and databases", "group": "G6"}, {"id": "HST-013", "domain": "HST", "title": "Edge delivery and caching", "statement": "The system shall deliver public pages and media through a content delivery network, and shall never cache or share an entitled item with a person who has no entitlement.", "rationale": "Fast delivery matters for reading, but a cache that ignores access rules would leak paid content.", "acceptance": ["Given a cached subscriber article, when a non-subscriber requests the same address, then access is denied.", "Public pages load within the performance targets from United States locations."], "priority": "Must", "phase": "Phase 1", "type": "Non-functional", "actors": ["System administrator"], "journeys": [], "brd_ref": [], "source": "Hosting gap review 26 Oct", "open_items": [], "notes": "", "phase_reason": "Hosting foundation, recovery and security must exist before any customer data is loaded.", "domain_name": "Hosting, servers and databases", "group": "G6"}, {"id": "HST-014", "domain": "HST", "title": "Web application firewall and attack protection", "statement": "The system shall filter malicious traffic at the edge, limit repeated requests on sign-in, checkout and donation endpoints, and withstand a distributed flood of requests.", "rationale": "The previous payment gateway was suspended after a card-testing attack. Checkout is the target.", "acceptance": ["A scripted card-testing run against checkout is stopped by rate limits and logged.", "A simulated flood of requests leaves the reader site available."], "priority": "Must", "phase": "Phase 1", "type": "Non-functional", "actors": ["System administrator"], "journeys": [], "brd_ref": [], "source": "Hosting gap review 26 Oct", "open_items": [], "notes": "", "phase_reason": "Hosting foundation, recovery and security must exist before any customer data is loaded.", "domain_name": "Hosting, servers and databases", "group": "G6"}, {"id": "HST-015", "domain": "HST", "title": "Network isolation", "statement": "The system shall keep databases and internal services off the public internet and reachable only from approved application components.", "rationale": "A database that is reachable from the internet will eventually be found.", "acceptance": ["An external scan finds no open database or internal service port.", "Access to the database from outside the approved network fails."], "priority": "Must", "phase": "Phase 1", "type": "Non-functional", "actors": ["System administrator"], "journeys": [], "brd_ref": [], "source": "Hosting gap review 26 Oct", "open_items": [], "notes": "", "phase_reason": "Hosting foundation, recovery and security must exist before any customer data is loaded.", "domain_name": "Hosting, servers and databases", "group": "G6"}, {"id": "HST-016", "domain": "HST", "title": "Secrets and encryption keys", "statement": "The system shall hold passwords, API keys and encryption keys in a managed secrets store, never in code, and shall encrypt data at rest and in transit.", "rationale": "Keys in code are a standard breach cause. Encryption is a baseline expectation of
