ystem shall let a subscriber share an article by link, and when a non-subscriber opens it shall show the excerpt, then an offer to subscribe or sign in, with the shared article restored after purchase.", "rationale": "Shares become the lead source for new subscriptions.", "acceptance": ["Given a non-subscriber opens a shared link and completes a subscription, then they land on the shared article, now unlocked.", "The conversion funnel from shared-link visit to subscription is reported by campaign tag.", "Given the non-subscriber signs in with an existing subscription instead, then the article unlocks without a second login step."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Marketing", "Subscriber"], "journeys": ["J-01", "J-07"], "brd_ref": ["FR-010"], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Reading, sharing and access control are what subscribers pay for.", "domain_name": "Content reading and delivery", "group": "G1"}, {"id": "CDL-016", "domain": "CDL", "title": "Digital publication list and viewing rules", "statement": "The system shall show each subscriber a thumbnail list of the digital publications included in their subscription, open each in a reader, and apply per-product rules for view-only, download, print and share.", "rationale": "Products differ: some are view-only, such as Journey of Faith lessons, and some are downloadable.", "acceptance": ["Given a subscription that includes three publications, then three thumbnails are shown and no others.", "Given a product configured as view-only, then no download or print control is offered and downloads are blocked at the server.", "The per-product rules are changed by an administrator without a code release."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Institutional administrator", "Subscriber"], "journeys": ["J-07", "J-09"], "brd_ref": [], "source": "Transcript 23 Oct", "open_items": [], "notes": "", "phase_reason": "Reading, sharing and access control are what subscribers pay for.", "domain_name": "Content reading and delivery", "group": "G1"}, {"id": "CDL-017", "domain": "CDL", "title": "Watermarked PDF downloads", "statement": "The system shall let entitled users download permitted publications as PDF files marked on every page with the subscriber's email or account number and the download date.", "rationale": "Traceability discourages redistribution of paid files.", "acceptance": ["Given a subscriber downloads an issue, then each page carries their identifier and date, readable at normal zoom.", "Given a product is configured as not downloadable, then the download control is absent and a direct request is refused.", "Watermarking adds no more than 10 seconds for a 100-page issue."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Subscriber"], "journeys": ["J-07"], "brd_ref": ["BR-008"], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Reading, sharing and access control are what subscribers pay for.", "domain_name": "Content reading and delivery", "group": "G1"}, {"id": "CDL-018", "domain": "CDL", "title": "Download logging and limits", "statement": "The system shall log each download with user, item, time and address, limit downloads per user per day to a configurable number, and alert administrators on unusual volumes.", "rationale": "Abuse and account sharing become visible.", "acceptance": ["Given a user exceeds the daily limit, then further downloads are refused with a clear message.", "Given more than 20 downloads by one user in an hour, then an alert is raised to administrators within 5 minutes.", "Logs are searchable by user and item for 24 months."], "priority": "Should", "phase": "Phase 1", "type": "Operational", "actors": ["Customer service agent", "System administrator"], "journeys": ["J-07", "J-10"], "brd_ref": [], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Reading, sharing and access control are what subscribers pay for.", "domain_name": "Content reading and delivery", "group": "G1"}, {"id": "CDL-019", "domain": "CDL", "title": "Entitled video delivery", "statement": "The system shall stream video only to users entitled to that video, using time-limited addresses bound to the user and the Liguori domains, and shall support single-video subscriptions with a one-year term.", "rationale": "Video is sold per title and must not leak by copying a link.", "acceptance": ["Given a video address is copied and used after 10 minutes or from another account, then playback is refused.", "Given a customer holds a one-year subscription to one video, then they can watch that video only and not others.", "Given the subscription ends, then playback stops within 15 minutes."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Subscriber"], "journeys": ["J-07"], "brd_ref": [], "source": "RFP draft", "open_items": [], "notes": "", "phase_reason": "Reading, sharing and access control are what subscribers pay for.", "domain_name": "Content reading and delivery", "group": "G1"}, {"id": "CDL-020", "domain": "CDL", "title": "Archive browsing", "statement": "The system shall let readers browse the archive by issue, date, author, topic, series, content type and Scripture reference, showing for each item its digitisation and rights status.", "rationale": "Back issues are a core value of the subscription.", "acceptance": ["Given a reader selects a topic and a year, then results are filtered correctly and show rights status for each.", "Given an item is not yet digitised, then it is listed with that status and no broken link.", "Archive pages load within the Core Web Vitals targets in NFR-002."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Subscriber"], "journeys": ["J-07"], "brd_ref": ["FR-032"], "source": "Amended BRD", "open_items": ["OI-12"], "notes": "", "phase_reason": "Should-level with a workaround: Archive browsing follows archive migration.", "domain_name": "Content reading and delivery", "group": "G1"}, {"id": "CDL-021", "domain": "CDL", "title": "Search with typeahead", "statement": "The system shall search the full text and metadata of content the user is entitled to see, with typeahead, tolerance for misspelling, filters, sorting, highlighted matches and guidance when nothing is found, and shall show snippets only from content the user may view.", "rationale": "Search is the main way readers find older material, and snippets must not leak paid text.", "acceptance": ["Given a query with one typo, then the intended article appears in the top 5 results.", "Given an unentitled user searches a phrase from a paid article, then the result shows title and public excerpt only.", "Typeahead suggestions appear within 300 ms at the 95th percentile."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Subscriber"], "journeys": ["J-07"], "brd_ref": ["FR-033"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Reading, sharing and access control are what subscribers pay for.", "domain_name": "Content reading and delivery", "group": "G1"}, {"id": "CDL-022", "domain": "CDL", "title": "Hybrid semantic search", "statement": "The system shall combine keyword and meaning-based retrieval, say when meaning-based results are used, offer an exact-match mode, and never retrieve content the user is not entitled to see.", "rationale": "Readers find content by idea, not only by exact words.", "acceptance": ["Given a conceptual query, then at least 3 relevant articles not containing the query words are returned in test sets.", "Given exact-match mode, then only literal matches are returned.", "Entitlement tests show zero unauthorised results across 1,000 sampled queries."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Subscriber"], "journeys": ["J-07"], "brd_ref": ["FR-034"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Valuable but not needed to retire the old systems; a workaround exists in Phase 1.", "domain_name": "Content reading and delivery", "group": "G1"}, {"id": "CDL-023", "domain": "CDL", "title": "Scripture reference search", "statement": "The system shall let users search by book, chapter and verse, and return exact, overlapping and related references using an approved canon and translation mapping.", "rationale": "Scripture-based lookup is central to Catholic reading.", "acceptance": ["Given the query Jn 3:16, then articles citing John 3:16 appear first, then overlapping ranges such as 3:14-17.", "Given a verse number that differs between translations, then the approved mapping returns the correct matches.", "Abbreviation and spelling variants are accepted."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Subscriber"], "journeys": ["J-07"], "brd_ref": ["FR-035"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Valuable but not needed to retire the old systems; a workaround exists in Phase 1.", "domain_name": "Content reading and delivery", "group": "G1"}, {"id": "CDL-024", "domain": "CDL", "title": "Related content", "statement": "The system shall show related articles chosen by editors and, where none are chosen, by an algorithm, with editor selections always shown first and the reason for each suggestion available to staff.", "rationale": "Related reading extends sessions and shows the value of the archive.", "acceptance": ["Given an editor pins three related articles, then those appear before any algorithmic ones.", "Given an algorithmic suggestion, then staff can see why it was suggested.", "Only content the viewer may open, or its public preview, is suggested."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Editor", "Subscriber"], "journeys": ["J-07"], "brd_ref": ["FR-036"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Related content improves with usage data and the content model from Phase 1.", "domain_name": "Content reading and delivery", "group": "G1"}, {"id": "CAT-001", "domain": "CAT", "title": "Product catalogue", "statement": "The system shall hold a catalogue of sellable items (print subscription, digital subscription, bundle, gift, single issue, back issue, book, merchandise, donation fund) with name, description, images, language and availability by country.", "rationale": "One governed catalogue replaces product data currently kept inside the legacy subscription platform.", "acceptance": ["Every product in a published list appears in checkout with the same price and description shown on the product page.", "A product marked unavailable for a country cannot be added to a basket from that country."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Customer service agent", "Marketing"], "journeys": ["J-01"], "brd_ref": ["FR-049"], "source": "RFP draft", "open_items": [], "notes": "", "phase_reason": "Plans and prices must exist before anything can be sold or migrated.", "domain_name": "Catalogue, pricing and offers", "group": "G2"}, {"id": "CAT-002", "domain": "CAT", "title": "Plans and terms", "statement": "The system shall define subscription plans by term (such as 1, 2 or 3 years or monthly), delivery format and price, and shall allow a plan to be retired for new buyers while remaining valid for existing subscribers.", "rationale": "Retiring a price must not break current subscribers.", "acceptance": ["A retired plan is hidden from new purchases and still renews existing subscribers at their stated rate.", "Plan changes are versioned with effective dates."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Marketing"], "journeys": ["J-01"], "brd_ref": ["FR-049"], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Plans and prices must exist before anything can be sold or migrated.", "domain_name": "Catalogue, pricing and offers", "group": "G2"}, {"id": "CAT-003", "domain": "CAT", "title": "Price books by currency and country", "statement": "The system shall hold prices per plan in each configured currency and country, with US dollars at launch and other currencies added through configuration.", "rationale": "The BRD requires international markets without code changes.", "acceptance": ["Adding a currency and price list requires no software release.", "A basket shows prices in one currency only."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Finance", "Marketing"], "journeys": ["J-01"], "brd_ref": ["BR-004", "FR-049"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Should-level with a workaround: US-only at first, so one price book is enough.", "domain_name": "Catalogue, pricing and offers", "group": "G2"}, {"id": "CAT-004", "domain": "CAT", "title": "Offers and promotional codes", "statement": "The system shall support offers (percentage, fixed amount, bonus issues, free trial) and promotional codes with start and end dates, eligibility rules, usage limits and stacking rules.", "rationale": "Campaigns need controlled discounts, and uncontrolled codes erode revenue.", "acceptance": ["A code past its end date or usage limit is refused with a clear message.", "Two non-stackable offers cannot be applied to the same line."], "priority": "Should", "phase": "Phase 1", "type": "Functional", "actors": ["Marketing"], "journeys": ["J-01"], "brd_ref": ["FR-043", "FR-049"], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Plans and prices must exist before anything can be sold or migrated.", "domain_name": "Catalogue, pricing and offers", "group": "G2"}, {"id": "CAT-005", "domain": "CAT", "title": "Free and paid trials", "statement": "The system shall support trial access of configurable length, with the trial end date, price after trial and cancellation method stated before sign-up and in a reminder sent at least 3 days before first charge.", "rationale": "Consumer rules and good practice require clear disclosure before a trial converts to a charge.", "acceptance": ["The checkout screen displays the post-trial price and date before the person confirms.", "A reminder email is sent 3 to 7 days before the first charge."], "priority": "Should", "phase": "Phase 2", "type": "Compliance", "actors": ["Subscriber"], "journeys": ["J-01"], "brd_ref": ["FR-049"], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Should-level with a workaround: Trials are a growth tool, not needed to retire the old system.", "domain_name": "Catalogue, pricing and offers", "group": "G2"}, {"id": "CAT-006", "domain": "CAT", "title": "Renewal pricing rules", "statement": "The system shall apply defined renewal rate rules per plan (same rate, current rate, or loyalty rate) and shall state the renewal price in the order confirmation.", "rationale": "Subscribers must know what they will be charged next.", "acceptance": ["The order confirmation states the renewal price, date and method.", "Changing a renewal rule affects only renewals dated after the change."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Finance", "Marketing"], "journeys": ["J-08"], "brd_ref": ["FR-049"], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Plans and prices must exist before anything can be sold or migrated.", "domain_name": "Catalogue, pricing and offers", "group": "G2"}, {"id": "CAT-007", "domain": "CAT", "title": "Bundle composition", "statement": "The system shall define bundles that combine print and digital entitlements, or several titles, in one purchase at one price, with each component's entitlement and fulfilment tracked separately.", "rationale": "Print plus digital bundles must grant both and ship only the print element.", "acceptance": ["Buying a print plus digital bundle creates one digital entitlement and one print order line.", "Cancelling the bundle ends both components on the same date."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Marketing", "Subscriber"], "journeys": ["J-01"], "brd_ref": ["BR-008"], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Plans and prices must exist before anything can be sold or migrated.", "domain_name": "Catalogue, pricing and offers", "group": "G2"}, {"id": "CAT-008", "domain": "CAT", "title": "Single issues and back issues", "statement": "The system shall sell single current and back issues in print or digital form, subject to stock for print and digitised status for digital.", "rationale": "Back issues are an existing sales line.", "acceptance": ["A digital back issue is delivered to the buyer's library within 5 minutes of payment.", "A print back issue with zero stock shows as unavailable."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Subscriber"], "journeys": ["J-01"], "brd_ref": ["FR-032"], "source": "Transcript 23 Oct", "open_items": ["OI-12"], "notes": "", "phase_reason": "Valuable but not needed to retire the old systems; a workaround exists in Phase 1.", "domain_name": "Catalogue, pricing and offers", "group": "G2"}, {"id": "CAT-009", "domain": "CAT", "title": "Books and merchandise", "statement": "The system shall sell books and merchandise as physical goods with stock, shipping options and returns, and shall keep these separate from subscription entitlements.", "rationale": "Books and merchandise are a separate retail problem from subscriptions.", "acceptance": ["Placing a book order does not create a subscription or entitlement.", "Stock levels update within 5 minutes of an order or return."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Subscriber"], "journeys": ["J-01"], "brd_ref": [], "source": "Transcript 23 Oct", "open_items": [], "notes": "", "phase_reason": "Should-level with a workaround: Books and merchandise are a separate retail stream; the subscription and donation move comes first. Confirm with Liguori.", "domain_name": "Catalogue, pricing and offers", "group": "G2"}, {"id": "CAT-010", "domain": "CAT", "title": "Tax category per product", "statement": "The system shall store a tax category on every product (print subscription, digital subscription, gift, book, merchandise, donation) and pass it to tax calculation.", "rationale": "Taxability differs by product type and state.", "acceptance": ["No product can be published without a tax category.", "Donation items are never assigned a taxable category."], "priority": "Must", "phase": "Phase 1", "type": "Compliance", "actors": ["Finance"], "journeys": ["J-12"], "brd_ref": [], "source": "Review Part 3", "open_items": ["OI-03"], "notes": "", "phase_reason": "Plans and prices must exist before anything can be sold or migrated.", "domain_name": "Catalogue, pricing and offers", "group": "G2"}, {"id": "CAT-011", "domain": "CAT", "title": "Language variants of catalogue content", "statement": "The system shall hold English and Spanish names, descriptions and legal text for each product, and shall show the language that matches the person's preference with a fallback.", "rationale": "The site must serve English and Spanish readers from launch.", "acceptance": ["Switching language changes product copy and price formatting without losing the basket.", "A product missing a Spanish description falls back to English and is flagged to staff."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Marketing"], "journeys": ["J-01"], "brd_ref": ["FR-040"], "source": "Transcript 23 Oct", "open_items": [], "notes": "", "phase_reason": "Plans and prices must exist before anything can be sold or migrated.", "domain_name": "Catalogue, pricing and offers", "group": "G2"}, {"id": "CAT-012", "domain": "CAT", "title": "Catalogue change control", "statement": "The system shall let authorised staff schedule catalogue, price and offer changes, preview them, and roll them back, with every change recorded in an audit log.", "rationale": "Price errors affect revenue immediately and need a safe correction path.", "acceptance": ["A scheduled price change takes effect at the set time to within 1 minute.", "A rollback restores the prior version and logs actor, time and reason."], "priority": "Should", "phase": "Phase 1", "type": "Operational", "actors": ["Finance", "Marketing"], "journeys": ["J-01"], "brd_ref": ["FR-049", "FR-048"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Plans and prices must exist before anything can be sold or migrated.", "domain_name": "Catalogue, pricing and offers", "group": "G2"}, {"id": "CAT-013", "domain": "CAT", "title": "Institutional price tiers", "statement": "The system shall support separate price tiers for institutional and bulk buyers, selectable by account type or negotiated agreement.", "rationale": "Parishes and schools buy at different prices.", "acceptance": ["An institutional account sees its tier price at checkout; an individual does not.", "A negotiated price carries a start and end date."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Institutional administrator", "Marketing"], "journeys": ["J-09"], "brd_ref": ["FR-041"], "source": "Transcript 23 Oct", "open_items": ["OI-11"], "notes": "", "phase_reason": "Should-level with a workaround: Institutional tiers can start from a single institutional price.", "domain_name": "Catalogue, pricing and offers", "group": "G2"}, {"id": "CAT-014", "domain": "CAT", "title": "Catalogue sync with fulfilment and finance", "statement": "The system shall publish product and price changes to fulfilment, finance and CRM systems within 5 minutes, with failures alerting staff and a retry that does not create duplicates.", "rationale": "The old API between the subscription platform and the website was a source of mismatches.", "acceptance": ["A new price appears in all connected systems within 5 minutes in a test.", "A failed push is retried automatically and, after 3 failures, raises a staff alert."], "priority": "Must", "phase": "Phase 1", "type": "Integration", "actors": ["System administrator"], "journeys": ["J-01"], "brd_ref": [], "source": "RFP draft", "open_items": [], "notes": "", "phase_reason": "Plans and prices must exist before anything can be sold or migrated.", "domain_name": "Catalogue, pricing and offers", "group": "G2"}, {"id": "SUB-001", "domain": "SUB", "title": "Subscription purchase", "statement": "The system shall let a visitor buy a print, digital or bundle subscription in a single checkout flow, creating the customer identity, subscription and entitlements on payment success.", "rationale": "The core revenue journey must work end to end without staff intervention.", "acceptance": ["Given a valid card, when the buyer completes checkout, then the subscription is active and the confirmation email arrives within 2 minutes.", "A failed payment creates no active subscription and no entitlement."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Subscriber"], "journeys": ["J-01"], "brd_ref": ["BR-008"], "source": "RFP draft", "open_items": ["OI-14"], "notes": "", "phase_reason": "Subscriptions are the core revenue and the reason the old system is being replaced.", "domain_name": "Subscriptions and entitlements", "group": "G2"}, {"id": "SUB-002", "domain": "SUB", "title": "Unified entitlement ledger", "statement": "The system shall keep one entitlement ledger that records every right to read or receive content (paid web, complimentary, institutional, gift, print, bundle and, later, app-store) with source, start, end and status, and shall be the only source the reader consults.", "rationale": "Without one ledger, access rules scatter across systems and link sharing cannot be stopped.", "acceptance": ["Given a subscriber with a paid digital plan and a gift, when the ledger is queried, then both entitlements appear with distinct sources.", "The reader grants or denies access using the ledger alone, in a test that disables every other system."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Subscriber", "System administrator"], "journeys": ["J-07"], "brd_ref": ["BR-008"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Subscriptions are the core revenue and the reason the old system is being replaced.", "domain_name": "Subscriptions and entitlements", "group": "G2"}, {"id": "SUB-003", "domain": "SUB", "title": "Entitlement check on every content request", "statement": "The system shall check entitlement each time protected content is requested, not only at sign-in, and shall deny forwarded or bookmarked links to people without a current entitlement.", "rationale": "Forwarded edition links currently let non-subscribers read paid material.", "acceptance": ["Given a copied link to a paid issue, when a signed-out person opens it, then a sign-in or subscribe prompt appears and no paid content is returned.", "An entitlement ended in the ledger blocks access within 60 seconds."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Subscriber"], "journeys": ["J-07"], "brd_ref": ["BR-008", "FR-010"], "source": "Transcript 23 Oct", "open_items": [], "notes": "", "phase_reason": "Subscriptions are the core revenue and the reason the old system is being replaced.", "domain_name": "Subscriptions and entitlements", "group": "G2"}, {"id": "SUB-004", "domain": "SUB", "title": "Entitlement activation timing", "statement": "The system shall activate or end entitlements within 60 seconds of a confirmed payment, cancellation effective date or refund.", "rationale": "Delays create support calls and revenue leakage.", "acceptance": ["A confirmed payment grants access within 60 seconds in 99% of test cases.", "An expired entitlement stops access at the stated end time to within 1 minute."], "priority": "Should", "phase": "Phase 1", "type": "Non-functional", "actors": ["Subscriber"], "journeys": ["J-01"], "brd_ref": ["NFR-003"], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Subscriptions are the core revenue and the reason the old system is being replaced.", "domain_name": "Subscriptions and entitlements", "group": "G2"}, {"id": "SUB-005", "domain": "SUB", "title": "Automatic renewal", "statement": "The system shall renew subscriptions automatically at term end where the subscriber has agreed to auto-renew, using the stored payment method and the renewal price stated at purchase.", "rationale": "Auto-renewal is the main retention lever.", "acceptance": ["A subscription with auto-renew consent is charged on its renewal date and the term is extended on success.", "A subscription without consent is not charged and enters manual renewal."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Subscriber"], "journeys": ["J-08"], "brd_ref": [], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Subscriptions are the core revenue and the reason the old system is being replaced.", "domain_name": "Subscriptions and entitlements", "group": "G2"}, {"id": "SUB-006", "domain": "SUB", "title": "Renewal consent and disclosure", "statement": "The system shall obtain and record clear auto-renewal consent at purchase, state the renewal price, date and cancellation method, and send a renewal notice before each charge as required by applicable law.", "rationale": "State automatic-renewal laws require clear terms and advance notice.", "acceptance": ["Checkout records the consent wording version and time.", "A notice is sent at least 15 days and no more than 45 days before an annual renewal charge."], "priority": "Must", "phase": "Phase 1", "type": "Compliance", "actors": ["Subscriber"], "journeys": ["J-08"], "brd_ref": [], "source": "Review Part 3", "open_items": [], "notes": "Notice windows vary by state; the configured windows must be reviewed by counsel.", "phase_reason": "Subscriptions are the core revenue and the reason the old system is being replaced.", "domain_name": "Subscriptions and entitlements", "group": "G2"}, {"id": "SUB-007", "domain": "SUB", "title": "Renewal reminder series", "statement": "The system shall run a configurable reminder series for manual-renew and expiring subscriptions (for example 90, 60, 30 and 7 days before, and 7 days after expiry), by email and postal where the format is print.", "rationale": "Print subscribers often renew from a mailed notice.", "acceptance": ["Reminders send at configured offsets with the correct renewal price and a link that lands on a pre-filled renewal page.", "A subscriber who renews stops receiving reminders within 24 hours."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Subscriber"], "journeys": ["J-08"], "brd_ref": ["FR-011"], "source": "Transcript 23 Oct", "open_items": ["OI-08"], "notes": "", "phase_reason": "Subscriptions are the core revenue and the reason the old system is being replaced.", "domain_name": "Subscriptions and entitlements", "group": "G2"}, {"id": "SUB-008", "domain": "SUB", "title": "Card retry and dunning", "statement": "The system shall retry failed renewal payments on a configurable schedule (default retries on days 1, 3, 5 and 7), send a message at each failure with a link to update the card, and apply a configurable grace period before access ends.", "rationale": "Failed cards cause involuntary loss; the legacy flow recovers few of them.", "acceptance": ["A failed payment triggers the configured retry and message sequence.", "After the final failed retry the subscription moves to lapsed on the configured date and the subscriber is told."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Subscriber"], "journeys": ["J-08"], "brd_ref": [], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Subscriptions are the core revenue and the reason the old system is being replaced.", "domain_name": "Subscriptions and entitlements", "group": "G2"}, {"id": "SUB-009", "domain": "SUB", "title": "Card update without sign-in barrier", "statement": "The system shall let a subscriber fix a failed payment through a secure single-use link that opens the card update page after a lightweight identity check.", "rationale": "Older subscribers abandon when asked to recover a password first.", "acceptance": ["A link from a failure email opens the update page without a password and expires after 7 days.", "The link cannot change the address or any other detail."], "priority": "Should", "phase": "Phase 1", "type": "Functional", "actors": ["Subscriber"], "journeys": ["J-08"], "brd_ref": [], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Subscriptions are the core revenue and the reason the old system is being replaced.", "domain_name": "Subscriptions and entitlements", "group": "G2"}, {"id": "SUB-010", "domain": "SUB", "title": "Automatic card account updates", "statement": "The system shall use available card account updater services so that replaced or re-issued cards are refreshed without subscriber action where the card network supports it.", "rationale": "Reduces involuntary churn from expired cards.", "acceptance": ["The subscriber record shows when a card was refreshed automatically.", "Refreshed cards need no re-entry of the card number by the subscriber."], "priority": "Should", "phase": "Phase 2", "type": "Integration", "actors": ["Subscriber"], "journeys": ["J-08"], "brd_ref": [], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Valuable but not needed to retire the old systems; a workaround exists in Phase 1.", "domain_name": "Subscriptions and entitlements", "group": "G2"}, {"id": "SUB-011", "domain": "SUB", "title": "Pause and hold", "statement": "The system shall let a subscriber or agent pause delivery for a set period (for example a retreat or move), preserving the remaining term, stopping print shipments and optionally digital access, and resuming automatically.", "rationale": "Print subscribers travel and relocate, and holds are a routine request.", "acceptance": ["A hold from 1 June to 31 July extends the term by 61 days and stops print shipping in that period.", "The subscriber can end the hold early online."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Subscriber"], "journeys": ["J-08"], "brd_ref": ["FR-045"], "source": "Transcript 23 Oct", "open_items": [], "notes": "", "phase_reason": "Should-level with a workaround: Customer service can pause by hand at first.", "domain_name": "Subscriptions and entitlements", "group": "G2"}, {"id": "SUB-012", "domain": "SUB", "title": "Cancellation by the subscriber", "statement": "The system shall let a subscriber cancel in no more than three steps online, state the effective date and any refund due, and keep access to the end of the paid term unless a refund is chosen.", "rationale": "Easy cancellation is required by consumer rules and builds trust.", "acceptance": ["A signed-in subscriber can cancel in at most 3 screens and receives a confirmation email.", "Cancellation does not require a phone call."], "priority": "Must", "phase": "Phase 1", "type": "Compliance", "actors": ["Subscriber"], "journeys": ["J-08"], "brd_ref": [], "source": "Review Part 3", "open_items": [], "notes": "", "phase_reason": "Subscriptions are the core revenue and the reason the old system is being replaced.", "domain_name": "Subscriptions and entitlements", "group": "G2"}, {"id": "SUB-013", "domain": "SUB", "title": "Cancellation reason capture and save offers", "statement": "The system shall capture an optional cancellation reason and may present configured save offers before confirming.", "rationale": "Reasons guide retention work; offers must stay optional and honest.", "acceptance": ["Reason codes are stored and reportable.", "The cancellation completes whether or not an offer is shown or accepted."], "priority": "Could", "phase": "Phase 2", "type": "Functional", "actors": ["Subscriber"], "journeys": ["J-08"], "brd_ref": [], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Valuable but not needed to retire the old systems; a workaround exists in Phase 1.", "domain_name": "Subscriptions and entitlements", "group": "G2"}, {"id": "SUB-014", "domain": "SUB", "title": "Plan change and upgrade", "statement": "The system shall let a subscriber change plan or format (for example digital to bundle) with a calculated prorated charge or credit shown before confirmation, and shall adjust entitlements and fulfilment from the effective date.", "rationale": "Subscribers move between formats and the legacy flow required a messy staff fix.", "acceptance": ["The preview shows the charge or credit to the cent before the subscriber confirms.", "On confirmation the new entitlement is active and the old one ends on the stated date."], "priority": "Should", "phase": "Phase 1", "type": "Functional", "actors": ["Subscriber"], "journeys": ["J-08"], "brd_ref": ["FR-045"], "source": "Transcript 23 Oct", "open_items": [], "notes": "", "phase_reason": "Subscriptions are the core revenue and the reason the old system is being replaced.", "domain_name": "Subscriptions and entitlements", "group": "G2"}, {"id": "SUB-015", "domain": "SUB", "title": "Refunds and credits", "statement": "The system shall allow authorised staff to refund in full or part, to the original payment method or as account credit, with a reason code, and shall adjust entitlements and the ledger to match.", "rationale": "Refunds must keep access, finance and the subscriber record in step.", "acceptance": ["A full refund ends the related entitlement on the date set by policy and reverses the financial entry.", "Refunds above a configured amount require a second approver."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Customer service agent", "Finance"], "journeys": ["J-10", "J-12"], "brd_ref": ["FR-045"], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Subscriptions are the core revenue and the reason the old system is being replaced.", "domain_name": "Subscriptions and entitlements", "group": "G2"}, {"id": "SUB-016", "domain": "SUB", "title": "Print and digital entitlement independence", "statement": "The system shall track print delivery status and digital access separately, so that a returned mailing or address problem does not remove digital access and the reverse.", "rationale": "Subscribers on a bundle must not lose one format because of the other.", "acceptance": ["Marking a print copy undeliverable leaves the digital entitlement active.", "The subscriber record shows both statuses side by side."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Subscriber"], "journeys": ["J-08"], "brd_ref": ["BR-008"], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Subscriptions are the core revenue and the reason the old system is being replaced.", "domain_name": "Subscriptions and entitlements", "group": "G2"}, {"id": "SUB-017", "domain": "SUB", "title": "Complimentary and staff-granted access", "statement": "The system shall let authorised staff grant complimentary access with a reason, an end date and a named approver, and record it in the ledger as a distinct source.", "rationale": "Reviews, clergy and sponsors receive free access that must be auditable.", "acceptance": ["A complimentary grant without a reason or end date is refused.", "Complimentary grants appear in a report separate from paid subscriptions."], "priority": "Should", "phase": "Phase 1", "type": "Functional", "actors": ["Customer service agent"], "journeys": ["J-10"], "brd_ref": ["BR-008"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Subscriptions are the core revenue and the reason the old system is being replaced.", "domain_name": "Subscriptions and entitlements", "group": "G2"}, {"id": "SUB-018", "domain": "SUB", "title": "Subscription status model", "statement": "The system shall use a defined set of subscription states (pending, active, paused, grace, lapsed, cancelled, expired, refunded) with allowed transitions and an event recorded for each change.", "rationale": "Clear states make reporting and support reliable.", "acceptance": ["An attempt to make a disallowed transition is refused and logged.", "Every transition records actor, time, reason and prior state."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["System administrator"], "journeys": ["J-08"], "brd_ref": ["FR-048"], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Subscriptions are the core revenue and the reason the old system is being replaced.", "domain_name": "Subscriptions and entitlements", "group": "G2"}, {"id": "SUB-019", "domain": "SUB", "title": "Subscription events to other systems", "statement": "The system shall publish subscription events (created, renewed, failed, paused, cancelled, changed) to CRM, fulfilment, finance and analytics within 5 minutes, with delivery tracked and failures alerted.", "rationale": "Downstream teams need current data, and the legacy one-way sync caused duplicates.", "acceptance": ["A cancellation appears in CRM and fulfilment within 5 minutes in a test.", "A downstream outage does not lose events; they replay in order once the system recovers."], "priority": "Must", "phase": "Phase 1", "type": "Integration", "actors": ["System administrator"], "journeys": ["J-08"], "brd_ref": ["NFR-006"], "source": "Transcript 23 Oct", "open_items": ["OI-07"], "notes": "", "phase_reason": "Subscriptions are the core revenue and the reason the old system is being replaced.", "domain_name": "Subscriptions and entitlements", "group": "G2"}, {"id": "SUB-020", "domain": "SUB", "title": "Idempotent order processing", "statement": "The system shall process each order and payment event once, so that repeated notifications, double-clicks or retries never create duplicate subscriptions, charges or shipments.", "rationale": "Duplicate orders and charges damage trust and create refunds.", "acceptance": ["Replaying the same payment notification 5 times creates one subscription.", "A double-submitted checkout creates one order."], "priority": "Must", "phase": "Phase 1", "type": "Non-functional", "actors": ["System administrator"], "journeys": ["J-01"], "brd_ref": [], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Subscriptions are the core revenue and the reason the old system is being replaced.", "domain_name": "Subscriptions and entitlements", "group": "G2"}, {"id": "SUB-021", "domain": "SUB", "title": "Subscription history and statements", "statement": "The system shall keep a complete history of each subscription (orders, payments, changes, notices, holds) that agents can search and subscribers can view for the last 7 years.", "rationale": "Disputes and audits need a full trail.", "acceptance": ["An agent can see every event for a subscription in date order.", "A subscriber can download a statement of payments as PDF."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Subscriber"], "journeys": ["J-08", "J-10"], "brd_ref": ["FR-048"], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Valuable but not needed to retire the old systems; a workaround exists in Phase 1.", "domain_name": "Subscriptions and entitlements", "group": "G2"}, {"id": "SUB-022", "domain": "SUB", "title": "Out-of-platform sources reconciliation", "statement": "The system shall reconcile entitlements granted through other channels (institutional seats, complimentary, imported legacy, and in Phase 2 app stores) against the ledger and report mismatches daily.", "rationale": "The BRD requires web, app-store, complimentary, institutional, gift, print and bundle access to reconcile.", "acceptance": ["A daily report lists entitlements with no matching source and sources with no entitlement.", "Zero unexplained mismatches are carried past 2 business days."], "priority": "Should", "phase": "Phase 2", "type": "Operational", "actors": ["Finance", "System administrator"], "journeys": ["J-12"], "brd_ref": ["BR-008"], "source": "Amended BRD", "open_items": ["OI-16"], "notes": "", "phase_reason": "Valuable but not needed to retire the old systems; a workaround exists in Phase 1.", "domain_name": "Subscriptions and entitlements", "group": "G2"}, {"id": "SUB-023", "domain": "SUB", "title": "Expiry and lapse handling", "statement": "The system shall move a subscription to expired or lapsed on the set date, remove entitlements, stop print shipping, and offer a win-back path from the account page and email.", "rationale": "Lapsed readers are the warmest renewal audience.", "acceptance": ["On the expiry date the reader shows a renew prompt in place of paid content.", "A returning subscriber who renews within 12 months keeps their saved items and history."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Subscriber"], "journeys": ["J-08"], "brd_ref": [], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Subscriptions are the core revenue and the reason the old system is being replaced.", "domain_name": "Subscriptions and entitlements", "group": "G2"}, {"id": "SUB-024", "domain": "SUB", "title": "Agent-assisted phone and mail orders", "statement": "The system shall let authorised agents take subscription orders by phone or mail using the same catalogue, checkout rules and entitlement ledger as the website, with the payment taken through a secure hosted method so that card numbers are never keyed into staff systems.", "rationale": "Staff create accounts and orders manually every day for callers, faxes and mail, and these must land in the same customer record.", "acceptance": ["An order taken by phone creates the same subscription, entitlement and fulfilment records as an online order.", "An agent cannot see or record a full card number; the payment is completed through a secure payment link or hosted field."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Customer service agent"], "journeys": ["J-10"], "brd_ref": ["FR-045"], "source": "Transcript 23 Oct", "open_items": [], "notes": "", "phase_reason": "Subscriptions are the core revenue and the reason the old system is being replaced.", "domain_name": "Subscriptions and entitlements", "group": "G2"}, {"id": "GFT-001", "domain": "GFT", "title": "Gift purchase flow", "statement": "The system shall let a signed-in or guest purchaser buy a subscription as a gift by choosing the product, term, recipient, start date and optional message in one checkout flow.", "rationale": "Giving subscriptions to family and friends is a routine, seasonal source of new readers.", "acceptance": ["Given a purchaser on a product page, when they choose Give as a gift, then the flow collects recipient, term, start date and message before payment.", "A completed gift order produces one gift line per recipient and one payment.", "A guest purchaser can complete the flow without creating an account."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Gift buyer"], "journeys": ["J-02"], "brd_ref": ["FR-042"], "source": "Transcript 23 Oct", "open_items": [], "notes": "", "phase_reason": "Gifting is in Phase 1 by Liguori's decision, and open gifts have to migrate whichever phase it ships in.", "domain_name": "Gift subscriptions", "group": "G2"}, {"id": "GFT-002", "domain": "GFT", "title": "Multiple gifts in one order", "statement": "The system shall allow one order to contain gift lines for many recipients, each with its own product, term, address, start date and message.", "rationale": "Subscribers routinely buy a dozen gifts at once, especially around the holidays.", "acceptance": ["An order with 12 gift lines for 12 different recipients completes in one payment.", "Each line can be edited or removed before payment without losing the others.", "Totals and tax are recalculated per line and shown before payment."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Gift buyer"], "journeys": ["J-02"], "brd_ref": [], "source": "Transcript 23 Oct", "open_items": [], "notes": "", "phase_reason": "Should-level with a workaround: One gift per order is enough to start; multi-gift orders follow.", "domain_name": "Gift subscriptions", "group": "G2"}, {"id": "GFT-003", "domain": "GFT", "title": "Recipient delivery details", "statement": "The system shall capture a validated postal address for each print gift recipient and a valid email address for each digital gift recipient.", "rationale": "Print gifts cannot ship, and digital gifts cannot be delivered, without correct recipient details.", "acceptance": ["A print gift line cannot be submitted without an address that passes address validation (see FUL requirements).", "A digital gift line cannot be submitted without a syntactically valid email address.", "The purchaser can enter a recipient in English or Spanish characters, including accents."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Gift buyer"], "journeys": ["J-02"], "brd_ref": [], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Gifting is in Phase 1 by Liguori's decision, and open gifts have to migrate whichever phase it ships in.", "domain_name": "Gift subscriptions", "group": "G2"}, {"id": "GFT-004", "domain": "GFT", "title": "Scheduled gift start date", "statement": "The system shall let the purchaser choose a gift start date up to 12 months ahead and shall not start access or fulfilment before that date.", "rationale": "Purchasers time gifts for birthdays, Advent and Christmas.", "acceptance": ["A gift with a start date 90 days ahead creates no entitlement until that date.", "The first print issue is queued for the first mailing cutoff on or after the start date.", "The purchaser sees the chosen start date on the confirmation and in the dashboard."], "priority": "Should", "phase": "Phase 1", "type": "Functional", "actors": ["Gift buyer"], "journeys": ["J-02"], "brd_ref": ["FR-042"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Gifting is in Phase 1 by Liguori's decision, and open gifts have to migrate whichever phase it ships in.", "domain_name": "Gift subscriptions", "group": "G2"}, {"id": "GFT-005", "domain": "GFT", "title": "Personal gift message", "statement": "The system shall let the purchaser add a personal message of up to 300 characters, in any supported language, that is shown to the recipient with the gift notification and, for print gifts, on a gift card where the fulfilment partner supports it.", "rationale": "A message turns a subscription into a gift.", "acceptance": ["A 300 character message with accented characters is stored and shown unchanged.", "Messages over 300 characters are rejected with an inline explanation.", "Message content is escaped so it cannot inject markup into emails or pages."], "priority": "Should", "phase": "Phase 1", "type": "Functional", "actors": ["Gift buyer"], "journeys": ["J-02"], "brd_ref": ["FR-042"], "source": "Amended BRD", "open_items": ["OI-08"], "notes": "Gift card printing depends on the mail house.", "phase_reason": "Gifting is in Phase 1 by Liguori's decision, and open gifts have to migrate whichever phase it ships in.", "domain_name": "Gift subscriptions", "group": "G2"}, {"id": "GFT-006", "domain": "GFT", "title": "Gift purchase confirmation", "statement": "The system shall email the purchaser a confirmation within 5 minutes of payment listing each recipient, product, term, start date, amount paid and tax, and shall store it in the dashboard.", "rationale": "Buyers of several gifts need a record of who gets what.", "acceptance": ["The email is sent within 5 minutes of successful payment in 95% of orders.", "The confirmation lists every gift line and the order total.", "The same record is retrievable in the Gifts tab of the dashboard."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Gift buyer"], "journeys": ["J-02"], "brd_ref": ["FR-042"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Gifting is in Phase 1 by Liguori's decision, and open gifts have to migrate whichever phase it ships in.", "domain_name": "Gift subscriptions", "group": "G2"}, {"id": "GFT-007", "domain": "GFT", "title": "Gift activation by recipient", "statement": "The system shall notify the recipient by email on the start date with a one-use activation link and shall let the recipient activate access without ever seeing or entering the purchaser's payment details.", "rationale": "Recipients must be able to start reading easily, and purchaser payment data must stay private.", "acceptance": ["The activation page shows no payment data, card digits or billing address of the purchaser.", "A recipient with no account can create one during activation; one with an account can attach the gift to it.", "Activation grants the entitlement for the purchased term within 60 seconds."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Gift recipient"], "journeys": ["J-03"], "brd_ref": ["FR-042"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Gifting is in Phase 1 by Liguori's decision, and open gifts have to migrate whichever phase it ships in.", "domain_name": "Gift subscriptions", "group": "G2"}, {"id": "GFT-008", "domain": "GFT", "title": "Fixed-term gift without auto-renewal", "statement": "The system shall deliver a gift for exactly the purchased term and shall end access at term end without charging the recipient or the purchaser again.", "rationale": "Auto-renewing a gift on a recipient who did not agree to pay creates complaints and chargebacks.", "acceptance": ["No payment attempt is created for a gift subscription at term end.", "Access ends on the term end date and the reader sees a clear expiry message.", "The purchaser is not billed unless they place a new order."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Gift buyer", "Gift recipient"], "journeys": ["J-02", "J-03"], "brd_ref": [], "source": "New (this BRS)", "open_items": [], "notes": "Client decision: fixed term, no auto-renew.", "phase_reason": "Gifting is in Phase 1 by Liguori's decision, and open gifts have to migrate whichever phase it ships in.", "domain_name": "Gift subscriptions", "group": "G2"}, {"id": "GFT-009", "domain": "GFT", "title": "Refund before redemption", "statement": "The system shall let the purchaser, or an authorised agent on their behalf, cancel and fully refund a gift line that has not been redeemed, and shall invalidate its activation code immediately.", "rationale": "A mistake or change of mind before the gift is used should cost the buyer nothing.", "acceptance": ["A refund on an unredeemed gift returns the full line amount to the original payment method.", "After a refund the activation link fails with a clear message.", "Redeemed gifts show no self-service refund option and route to a service case."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Customer service agent", "Gift buyer"], "journeys": ["J-02"], "brd_ref": [], "source": "New (this BRS)", "open_items": [], "notes": "Client decision: refundable before redemption.", "phase_reason": "Gifting is in Phase 1 by Liguori's decision, and open gifts have to migrate whichever phase it ships in.", "domain_name": "Gift subscriptions", "group": "G2"}, {"id": "GFT-010", "domain": "GFT", "title": "Gift activation code security", "statement": "The system shall issue each gift an unguessable single-use code of at least 128 bits of entropy, rate-limit redemption attempts, and expire unredeemed codes only after a published period of at least 12 months from the start date.", "rationale": "Gift codes are a fraud target and must not be guessable or reusable.", "acceptance": ["A code can be redeemed once; a second attempt fails and is logged.", "More than 5 failed redemption attempts from one address in 15 minutes triggers a block and an alert.", "Codes appear in logs only in masked form."], "priority": "Must", "phase": "Phase 1", "type": "Compliance", "actors": ["Gift recipient", "System administrator"], "journeys": ["J-03"], "brd_ref": [], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Gifting is in Phase 1 by Liguori's decision, and open gifts have to migrate whichever phase it ships in.", "domain_name": "Gift subscriptions", "group": "G2"}, {"id": "GFT-011", "domain": "GFT", "title": "Gift status for purchaser", "statement": "The system shall show the purchaser each gift's status (purchased, scheduled, activated, expired, refunded) and shall let them resend the notification or change the recipient email before activation.", "rationale": "Purchasers often ask whether a gift arrived.", "acceptance": ["Status changes appear in the Gifts tab within 60 seconds of the event.", "Resending the notification is limited to 3 sends per gift per day.", "Changing the recipient email before activation voids the earlier link."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Gift buyer"], "journeys": ["J-02"], "brd_ref": [], "source": "Transcript 23 Oct", "open_items": [], "notes": "", "phase_reason": "Refinements to gifting once the first gifts have been redeemed.", "domain_name": "Gift subscriptions", "group": "G2"}, {"id": "GFT-012", "domain": "GFT", "title": "Offer to continue after gift ends", "statement": "The system shall offer the recipient an option to subscribe in their own name before the gift ends, using their own payment method and with no change to the gift term.", "rationale": "A gift is the best acquisition channel for a lasting reader.", "acceptance": ["A message is sent 30 days before gift end with a subscribe link and any approved offer.", "A recipient who subscribes keeps the gift access until its term ends, with no overlap charge.", "Opt-out of these messages is honoured and recorded."], "priority": "Could", "phase": "Phase 2", "type": "Functional", "actors": ["Gift recipient", "Marketing"], "journeys": ["J-03"], "brd_ref": [], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Refinements to gifting once the first gifts have been redeemed.", "domain_name": "Gift subscriptions", "group": "G2"}, {"id": "BLK-001", "domain": "BLK", "title": "Institutional account model", "statement": "The system shall represent an institution (parish, school, community) as one organisation account with one or more administrators, one or more ship-to addresses and many members or seats.", "rationale": "Most buyers of digital products and bulk print are parishes and organisations, not individuals.", "acceptance": ["An organisation account can have 3 administrators and 10 ship-to addresses.", "Orders, invoices and entitlements attach to the organisation, not only to a person.", "An individual's personal subscription stays separate from the organisation's."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Institutional administrator"], "journeys": ["J-09"], "brd_ref": ["FR-041"], "source": "Transcript 23 Oct", "open_items": ["OI-11"], "notes": "", "phase_reason": "Parish and school accounts already exist on the old system and would be stranded if left behind.", "domain_name": "Institutional and bulk orders", "group": "G2"}, {"id": "BLK-002", "domain": "BLK", "title": "Duplicate organisation detection", "statement": "The system shall detect probable duplicate organisation and person records at account creation and order entry, by name, address, email and phone, and shall prompt the user or agent to use the existing record.", "rationale": "The old systems hold many duplicate parish accounts because data flows one way between them.", "acceptance": ["Creating St. Mary's Parish at an address already on file prompts a match before a new record is made.", "An agent can merge two records; the merge keeps order history and is reversible within 30 days.", "Merge actions are written to the audit log."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Customer service agent", "Institutional administrator"], "journeys": ["J-09", "J-10"], "brd_ref": [], "source": "Transcript 23 Oct", "open_items": ["OI-09"], "notes": "", "phase_reason": "Should-level with a workaround: Duplicates can be cleaned manually while institutional volume is low.", "domain_name": "Institutional and bulk orders", "group": "G2"}, {"id": "BLK-003", "domain": "BLK", "title": "Bulk print copy orders", "statement": "The system shall let an institution order a quantity of print copies of a product for each issue or period, with the quantity changeable up to a published cutoff before each print run.", "rationale": "Parishes order several to thousands of copies and adjust quantities between issues.", "acceptance": ["An administrator can set a quantity from 1 to 10,000 per ship-to address.", "A change made before the cutoff applies to the next issue; a change after applies to the following one.", "The cutoff date is shown beside the quantity field."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Institutional administrator"], "journeys": ["J-09"], "brd_ref": [], "source": "Transcript 23 Oct", "open_items": ["OI-08", "OI-11"], "notes": "", "phase_reason": "Parish and school accounts already exist on the old system and would be stranded if left behind.", "domain_name": "Institutional and bulk orders", "group": "G2"}, {"id": "BLK-004", "domain": "BLK", "title": "Seat and access allocation", "statement": "The system shall let an authorised institutional administrator allocate digital seats or access ranges, invite members by email, and remove access at any time.", "rationale": "Parishes share digital products with staff and volunteers.", "acceptance": ["An administrator can invite 100 members by pasting or uploading email addresses.", "Removing a member ends their access within 5 minutes.", "Seat counts never exceed the purchased quantity without an explicit upgrade."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Institutional administrator"], "journeys": ["J-09"], "brd_ref": ["FR-041"], "source": "Amended BRD", "open_items": ["OI-11"], "notes": "BRD marks this Phase 2; the 23 Oct transcript shows most digital customers are organisations.", "phase_reason": "Parish and school accounts already exist on the old system and would be stranded if left behind.", "domain_name": "Institutional and bulk orders", "group": "G2"}, {"id": "BLK-005", "domain": "BLK", "title": "Group-use digital content licence", "statement": "The system shall support products licensed for group use, such as parish bulletins and faith-formation resources, including display on a screen and distribution within the licensed organisation, and shall record the licence terms shown to the buyer.", "rationale": "Digital parish products are bought to be displayed, shared and used with groups.", "acceptance": ["The product page states what the licence permits before purchase.", "A licensed administrator can download or display permitted files without per-member sign-in.", "Files outside the licensed use are not offered."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Institutional administrator"], "journeys": ["J-09", "J-07"], "brd_ref": [], "source": "Transcript 23 Oct", "open_items": ["OI-12"], "notes": "", "phase_reason": "Parish and school accounts already exist on the old system and would be stranded if left behind.", "domain_name": "Institutional and bulk orders", "group": "G2"}, {"id": "BLK-006", "domain": "BLK", "title": "Pay by invoice and purchase order", "statement": "The system shall let an approved institution place an order on invoice with a purchase order number, issue an invoice with stated payment terms, and record payment against it.", "rationale": "Parishes and schools often pay by cheque after approval.", "acceptance": ["An approved institution can check out without a card and receive a numbered invoice.", "Unpaid invoices past the stated terms trigger reminders and, after a configured period, a hold on new orders.", "Recording a payment closes the invoice and updates the ledger export."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Finance", "Institutional administrator"], "journeys": ["J-09", "J-12"], "brd_ref": [], "source": "New (this BRS)", "open_items": ["OI-11", "OI-01"], "notes": "", "phase_reason": "Parish and school accounts already exist on the old system and would be stranded if left behind.", "domain_name": "Institutional and bulk orders", "group": "G2"}, {"id": "BLK-007", "domain": "BLK", "title": "Institutional pricing and discounts", "statement": "The system shall support quantity-break and account-specific prices for institutions, with effective dates and an audit record of who set each price.", "rationale": "Bulk buyers receive different rates from individuals.", "acceptance": ["A price break of 25 copies applies automatically to an order of 30 copies.", "An account-specific price overrides the list price only within its effective dates.", "Every price change records user, time and reason."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Finance", "Institutional administrator"], "journeys": ["J-09"], "brd_ref": [], "source": "New (this BRS)", "open_items": ["OI-11"], "notes": "", "phase_reason": "Should-level with a workaround: Institutional discounts can be applied by staff at first.", "domain_name": "Institutional and bulk orders", "group": "G2"}, {"id": "BLK-008", "domain": "BLK", "title": "Multiple ship-to addresses", "statement": "The system shall let an institution keep several named ship-to addresses and direct specific quantities of an order to each.", "rationale": "One parish may mail to a church, a school and a rectory.", "acceptance": ["An order can split 40 copies across 3 addresses.", "Each address is validated before the order is accepted.", "The invoice shows quantities by address."], "priority": "Should", "phase": "Phase 1", "type": "Functional", "actors": ["Institutional administrator"], "journeys": ["J-09"], "brd_ref": [], "source": "New (this BRS)", "open_items": ["OI-08"], "notes": "", "phase_reason": "Parish and school accounts already exist on the old system and would be stranded if left behind.", "domain_name": "Institutional and bulk orders", "group": "G2"}, {"id": "BLK-009", "domain": "BLK", "title": "Aggregate usage reporting", "statement": "The system shall show institutional administrators aggregate usage of their licensed digital products and shall not show any individual member's reading history unless the member and institution have lawfully and explicitly agreed.", "rationale": "Administrators need to see value from the licence while member privacy is protected.", "acceptance": ["The report shows counts by product and month and contains no member names.", "Individual-level data is hidden by default and appears only after recorded consent.", "Report exports contain no personal reading history."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Institutional administrator"], "journeys": ["J-09"], "brd_ref": ["FR-041"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Valuable but not needed to retire the old systems; a workaround exists in Phase 1.", "domain_name": "Institutional and bulk orders", "group": "G2"}, {"id": "BLK-010", "domain": "BLK", "title": "Renewal reminders to administrators", "statement": "The system shall send renewal and low-quantity reminders to institutional administrators at 60, 30 and 7 days before expiry, with a one-step renewal link.", "rationale": "Parish renewals lapse when the one administrator who handles them is busy or has left.", "acceptance": ["Reminders go to every administrator on the account at the three intervals.", "The link opens a pre-filled renewal that needs only confirmation.", "Reminders stop once the renewal is paid or invoiced."], "priority": "Should", "phase": "Phase 1", "type": "Functional", "actors": ["Institutional administrator", "Marketing"], "journeys": ["J-09", "J-08"], "brd_ref": [], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Parish and school accounts already exist on the old system and would be stranded if left behind.", "domain_name": "Institutional and bulk orders", "group": "G2"}, {"id": "BLK-011", "domain": "BLK", "title": "Bulk seat import", "statement": "The system shall let an administrator import members from a CSV file with a preview of errors, duplicate flags and a confirm step before any invitation is sent.", "rationale": "Large parishes and schools need to onboard many people quickly.", "acceptance": ["A 500-row file is validated and previewed in under 60 seconds.", "Rows with errors are listed and skipped; valid rows can still be confirmed.", "No email is sent before confirmation."], "priority": "Could", "phase": "Phase 2", "type": "Functional", "actors": ["Institutional administrator"], "journeys": ["J-09"], "brd_ref": ["FR-046"], "source": "Amended BRD", "open_items": [], "notes": "", "phase_reason": "Valuable but not needed to retire the old systems; a workaround exists in Phase 1.", "domain_name": "Institutional and bulk orders", "group": "G2"}, {"id": "BLK-012", "domain": "BLK", "title": "Administrator change and succession", "statement": "The system shall let a current administrator add or remove administrators, and shall let a Liguori agent transfer administration after verifying the institution.", "rationale": "Parish staff change often and the account must not be orphaned.", "acceptance": ["Removing the last administrator is blocked unless an agent completes a verified transfer.", "Every administrator change is logged with actor and time.", "A removed administrator loses access to the organisation immediately."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Customer service agent", "Institutional administrator"], "journeys": ["J-09", "J-10"], "brd_ref": [], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Valuable but not needed to retire the old systems; a workaround exists in Phase 1.", "domain_name": "Institutional and bulk orders", "group": "G2"}, {"id": "PAY-001", "domain": "PAY", "title": "Guest and signed-in checkout", "statement": "The system shall offer both guest checkout and signed-in checkout, shall let a guest create an account after purchase, and shall link the order to the account on creation.", "rationale": "Many first-time buyers will not register before paying, but need an account to read.", "acceptance": ["A guest can complete a purchase with only email, delivery details and payment.", "After purchase the guest is offered account creation with the order attached.", "A purchase made with an email that already has an account asks the buyer to sign in or continue as guest."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Donor", "Gift buyer", "Subscriber"], "journeys": ["J-01", "J-04"], "brd_ref": [], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "The suspended payment gateway is the urgent risk; checkout has to move first.", "domain_name": "Checkout and payments", "group": "G2"}, {"id": "PAY-002", "domain": "PAY", "title": "Hosted card capture", "statement": "The system shall capture card numbers only through fields hosted by the payment service provider so that card data never passes through or is stored on Liguori or vendor systems.", "rationale": "This keeps the platform in the smallest PCI scope and removes the risk of storing card data.", "acceptance": ["Network and server logs show no full card number or security code at any tier.", "Page scripts on payment pages are limited to an approved list with integrity checks.", "The architecture supports completing PCI DSS SAQ A."], "priority": "Must", "phase": "Phase 1", "type": "Compliance", "actors": ["System administrator"], "journeys": ["J-01"], "brd_ref": [], "source": "Assessment", "open_items": [], "notes": "", "phase_reason": "The suspended payment gateway is the urgent risk; checkout has to move first.", "domain_name": "Checkout and payments", "group": "G2"}, {"id": "PAY-003", "domain": "PAY", "title": "PCI DSS SAQ A evidence", "statement": "The system shall be operated so that Liguori can attest PCI DSS SAQ A annually, and the vendor shall supply the supporting evidence including a script inventory for payment pages.", "rationale": "A compliant attestation is a condition of card acceptance.", "acceptance": ["The vendor supplies the evidence pack before go-live and each year.", "Any change to scripts on a payment page is reviewed and recorded before release.", "Quarterly external vulnerability scans pass or are remediated within the scan window."], "priority": "Must", "phase": "Phase 1", "type": "Compliance", "actors": ["Finance", "System administrator"], "journeys": [], "brd_ref": ["NFR-011"], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "The suspended payment gateway is the urgent risk; checkout has to move first.", "domain_name": "Checkout and payments", "group": "G2"}, {"id": "PAY-004", "domain": "PAY", "title": "Digital wallets", "statement": "The system shall offer wallet payments (Apple Pay and Google Pay equivalents) where the buyer's device and browser support them.", "rationale": "Wallets cut checkout time and reduce card entry errors on phones.", "acceptance": ["On a supported phone the wallet button appears on checkout and donation forms.", "A wallet payment produces the same order, receipt and entitlement as a card payment.", "Where unsupported, the button is not shown and the card form is."], "priority": "Should", "phase": "Phase 2", "type": "Functional", "actors": ["Donor", "Subscriber"], "journeys": ["J-01", "J-04"], "brd_ref": [], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Valuable but not needed to retire the old systems; a workaround exists in Phase 1.", "domain_name": "Checkout and payments", "group": "G2"}, {"id": "PAY-005", "domain": "PAY", "title": "Bank debit for large and recurring payments", "statement": "The system shall support US bank debit (ACH) for institutional orders, large donations and recurring donations, with mandate capture, pending status and failure handling.", "rationale": "Bank debit has lower fees on large gifts and suits parishes.", "acceptance": ["A buyer can authorise a bank debit and sees a clear pending status.", "A failed debit reverses the entitlement or donation record and notifies the buyer.", "The mandate text is stored with timestamp and buyer identity."], "priority": "Could", "phase": "Phase 2", "type": "Functional", "actors": ["Donor", "Institutional administrator"], "journeys": ["J-05", "J-09"], "brd_ref": [], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "Valuable but not needed to retire the old systems; a workaround exists in Phase 1.", "domain_name": "Checkout and payments", "group": "G2"}, {"id": "PAY-006", "domain": "PAY", "title": "Saved payment methods", "statement": "The system shall let a signed-in user add, replace and delete saved payment methods, shall show only the brand and last four digits, and shall never show a full number.", "rationale": "Customers need to keep renewals running and to remove cards they no longer use.", "acceptance": ["Deleting a card removes it from future charges within 1 minute.", "The user cannot delete the only method on an active auto-renewing subscription without choosing another.", "Only brand, last four and expiry appear anywhere in the interface."], "priority": "Should", "phase": "Phase 1", "type": "Functional", "actors": ["Donor", "Subscriber"], "journeys": ["J-08"], "brd_ref": [], "source": "RFP draft", "open_items": [], "notes": "", "phase_reason": "The suspended payment gateway is the urgent risk; checkout has to move first.", "domain_name": "Checkout and payments", "group": "G2"}, {"id": "PAY-007", "domain": "PAY", "title": "Card-testing rate limits", "statement": "The system shall limit payment attempts and account creations by address, device, email and card fingerprint, and shall block and alert when limits are exceeded.", "rationale": "Online payments had to be switched off after attackers ran thousands of stolen card numbers through fake accounts.", "acceptance": ["More than 5 failed payment attempts from one address in 10 minutes blocks that address for 1 hour.", "More than 3 different cards tried on one account in 24 hours locks payment for that account.", "Each block raises an alert to the operations owner."], "priority": "Must", "phase": "Phase 1", "type": "Compliance", "actors": ["System administrator"], "journeys": ["J-01", "J-04"], "brd_ref": [], "source": "Assessment", "open_items": [], "notes": "", "phase_reason": "The suspended payment gateway is the urgent risk; checkout has to move first.", "domain_name": "Checkout and payments", "group": "G2"}, {"id": "PAY-008", "domain": "PAY", "title": "Server-checked bot challenge", "statement": "The system shall verify a bot challenge score on the server for registration, login, checkout, gift redemption and donation, and shall reject or step up low scores.", "rationale": "The old site loaded a scoring challenge but the server never acted on the score, so it stopped nothing.", "acceptance": ["A request with a failing score is rejected by the server even if the browser skips the challenge.", "Step-up challenge is shown at borderline scores and recorded.", "The challenge works with screen readers and keyboard only."], "priority": "Must", "phase": "Phase 1", "type": "Compliance", "actors": ["System administrator"], "journeys": ["J-01", "J-04"], "brd_ref": ["NFR-006"], "source": "Assessment", "open_items": [], "notes": "", "phase_reason": "The suspended payment gateway is the urgent risk; checkout has to move first.", "domain_name": "Checkout and payments", "group": "G2"}, {"id": "PAY-009", "domain": "PAY", "title": "Fraud screening and velocity rules", "statement": "The system shall apply fraud screening rules at payment, including address and security-code checks, small-amount repeat patterns and disposable email detection, with rules changeable by authorised staff without a release.", "rationale": "Card testers use small repeated charges and throwaway accounts.", "acceptance": ["Rules can be changed and take effect in under 15 minutes without a code deployment.", "Orders blocked by a rule are listed with the reason for review.", "Repeated charges of $5 or less across new accounts in one hour are flagged."], "priority": "Must", "phase": "Phase 1", "type": "Compliance", "actors": ["Finance", "System administrator"], "journeys": ["J-01"], "brd_ref": [], "source": "Assessment", "open_items": [], "notes": "", "phase_reason": "The suspended payment gateway is the urgent risk; checkout has to move first.", "domain_name": "Checkout and payments", "group": "G2"}, {"id": "PAY-010", "domain": "PAY", "title": "Email verification before payment", "statement": "The system shall require a verified email address before a new account can complete a first payment or redeem a gift.", "rationale": "Verified email slows the creation of fake accounts for card testing.", "acceptance": ["A new account cannot complete a payment until the emailed link is used.", "Guest checkout sends a verification link to the order email before shipping or activation.", "Verification links expire after 24 hours."], "priority": "Should", "phase": "Phase 1", "type": "Compliance", "actors": ["Donor", "Subscriber"], "journeys": ["J-01"], "brd_ref": [], "source": "Assessment", "open_items": [], "notes": "Guest checkout may verify after payment if fraud rules allow.", "phase_reason": "The suspended payment gateway is the urgent risk; checkout has to move first.", "domain_name": "Checkout and payments", "group": "G2"}, {"id": "PAY-011", "domain": "PAY", "title": "Strong customer authentication", "statement": "The system shall start issuer step-up authentication (3-D Secure) whenever the card issuer or regulation requires it and shall resume the order on success.", "rationale": "Issuer authentication shifts liability and is mandatory in some markets.", "acceptance": ["A card that requires authentication presents the issuer challenge in the same session.", "A successful challenge completes the order without re-entering details.", "A failed or abandoned challenge leaves no entitlement and no duplicate charge."], "priority": "Must", "phase": "Phase 1", "type": "Functional", "actors": ["Donor", "Subscriber"], "journeys": ["J-01", "J-04"], "brd_ref": ["BR-004"], "source": "New (this BRS)", "open_items": [], "notes": "", "phase_reason": "The suspended payment gateway is the urgent risk; checkout has to move first.", "domain_name": "Checkout and payments", "group": "G2"}, {"id": "PAY-012", "domain": "PAY", "title": "Failed payment handling at checkout", "statement": "The system shall show a specific, plain-language reason when a payment fails, keep the basket, and let the buyer retry or change method without re-entering other details.", "rationale": "Vague errors cause abandoned orders and calls to the service line.", "acceptance": ["Declines, expired cards and authentication failures each show a different message in English or Spanish.", "The basket and form entries survive a failed attempt.", "Three consecutive failures show the support contact and block furthe
