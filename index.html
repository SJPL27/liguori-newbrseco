<title>Liguori BRS Viewer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700;800&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Six Jars palette: plum #6b153f, deep plum #3A0D27, gold #efb83c, cream #f4efe7. Layout: deep-plum header, theme bar, view tabs; category-coloured sections. */
:root{
  --bg:#fbf8f3; --surface:#ffffff; --fg:#24141c; --muted:#6b5a63; --line:#e6ddd2; --soft:#f4efe7;
  --brand:#6b153f; --deep:#3A0D27; --gold:#efb83c; --on-gold:#2a1a00; --link:#6b153f;
  --must:#9b1c2c; --must-bg:#fbe6e8; --should:#7a5200; --should-bg:#fdf0cf; --could:#1d6b3a; --could-bg:#e1f3e8; --info:#274c9c; --info-bg:#e5ecfa; --q:#5b4b8a; --q-bg:#ece7f8;
  --g1:#6b153f; --g2:#a3235e; --g3:#1f6f6b; --g4:#8a5d00; --g5:#3b4a8f; --g6:#4b5563; --g7:#3A0D27; --g8:#b4491f;
  --font:'Manrope',system-ui,sans-serif; --serif:'Cormorant Garamond',Georgia,serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#150a11; --surface:#211019; --fg:#f4efe7; --muted:#b7a5ae; --line:#3d2432; --soft:#2c1822; --brand:#e8a3c3; --deep:#2a0f1d; --link:#f2b8d2;
  --must:#ff9aa4; --must-bg:#42191f; --should:#f0c25e; --should-bg:#3b2d10; --could:#7fd49b; --could-bg:#173325; --info:#9db8f5; --info-bg:#1b2745; --q:#c2b3f0; --q-bg:#2a2245;
  --g1:#e58fb4; --g2:#f08ab8; --g3:#5cc4bd; --g4:#efb83c; --g5:#9fb0f0; --g6:#aab4c3; --g7:#d9b6c8; --g8:#f09a6e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#150a11; --surface:#211019; --fg:#f4efe7; --muted:#b7a5ae; --line:#3d2432; --soft:#2c1822; --brand:#e8a3c3; --deep:#2a0f1d; --link:#f2b8d2;
  --must:#ff9aa4; --must-bg:#42191f; --should:#f0c25e; --should-bg:#3b2d10; --could:#7fd49b; --could-bg:#173325; --info:#9db8f5; --info-bg:#1b2745; --q:#c2b3f0; --q-bg:#2a2245;
  --g1:#e58fb4; --g2:#f08ab8; --g3:#5cc4bd; --g4:#efb83c; --g5:#9fb0f0; --g6:#aab4c3; --g7:#d9b6c8; --g8:#f09a6e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:12;background:#3A0D27}
.wrap{max-width:1200px;margin-inline:auto;overflow-x:clip}
a{color:var(--link)} a:hover{text-decoration-thickness:2px}
.g1,.G1{--gc:var(--g1)}.g2,.G2{--gc:var(--g2)}.g3,.G3{--gc:var(--g3)}.g4,.G4{--gc:var(--g4)}.g5,.G5{--gc:var(--g5)}.g6,.G6{--gc:var(--g6)}.g7,.G7{--gc:var(--g7)}.g8,.G8{--gc:var(--g8)}
/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:#3A0D27;color:#f4efe7;border-bottom:3px solid #efb83c;
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.top-in{max-width:1200px;margin-inline:auto}
.toprow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.kick{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
header .kick{color:#efb83c}
h1{font-family:var(--serif);font-weight:800;font-size:26px;line-height:1.1;margin:2px 0 8px;color:#fff}
.themebar{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:#d9c3cf}
.seg{display:inline-flex;border:1px solid #8a4a68;border-radius:99px;overflow:hidden;background:#2a0f1d}
.seg button{font:inherit;font-size:12px;background:none;border:0;color:#e9d6e0;padding:4px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:#efb83c;color:#2a1a00;font-weight:700}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
nav.tabs button{font:inherit;background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;color:#d9c3cf;cursor:pointer;white-space:nowrap;margin-bottom:-3px}
nav.tabs button[aria-selected="true"]{color:#fff;border-color:#efb83c;font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid #efb83c;outline-offset:2px}
main{padding-top:20px}
.panel[hidden]{display:none}
h2{font-family:var(--serif);font-size:26px;font-weight:700;margin:0 0 8px;color:var(--fg);line-height:1.15}
h3{font-family:var(--serif);font-size:20px;margin:0 0 4px;font-weight:700}
.lede{max-width:72ch;color:var(--muted);margin:0 0 14px}
/* category banners (delimiters) */
.banner{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:center;margin:26px 0 10px;padding:12px 14px;border:1px solid var(--line);border-left:8px solid var(--gc);border-radius:8px;
  background:color-mix(in srgb,var(--gc) 10%,var(--surface))}
.banner:first-child{margin-top:0}
.banner .num{font-family:var(--serif);font-size:34px;font-weight:800;color:var(--gc);line-height:1}
.banner .nm{font-family:var(--serif);font-size:22px;font-weight:700;line-height:1.1}
.banner .ds{grid-column:2;color:var(--muted);font-size:13px}
.banner .ct{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
.sub{display:flex;gap:10px;align-items:baseline;margin:16px 0 8px;padding-bottom:4px;border-bottom:2px solid color-mix(in srgb,var(--gc) 55%,transparent)}
.sub b{font-family:var(--mono);font-size:12px;color:var(--gc);letter-spacing:.06em}
.sub span{font-weight:700}.sub i{margin-left:auto;font-style:normal;font-family:var(--mono);font-size:11px;color:var(--muted)}
@media(max-width:560px){.banner{grid-template-columns:auto minmax(0,1fr)}.banner .ct{grid-column:2;text-align:left}}
/* category tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:20px}
.tile{font:inherit;text-align:left;cursor:pointer;color:var(--fg);background:color-mix(in srgb,var(--gc) 9%,var(--surface));border:1px solid var(--line);border-top:6px solid var(--gc);border-radius:8px;padding:10px 12px;min-width:0}
.tile:hover{border-color:var(--gc)}
.tile .t1{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.1}
.tile .t2{font-size:12px;color:var(--muted);margin-top:3px}
.tile .t3{font-family:var(--mono);font-size:12px;color:var(--gc);margin-top:6px;font-weight:500}
/* layout */
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}}
aside.side{position:sticky;top:112px;max-height:calc(100vh - 130px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px}
@media(max-width:860px){aside.side{position:static;max-height:260px}}
.gh{display:flex;justify-content:space-between;gap:8px;width:100%;font:inherit;font-weight:700;text-align:left;background:color-mix(in srgb,var(--gc) 12%,var(--surface));border:0;border-left:5px solid var(--gc);border-radius:4px;padding:6px 8px;color:var(--fg);cursor:pointer;margin-top:6px}
.gh[aria-pressed="true"]{outline:2px solid var(--gc)}
.dom{display:flex;justify-content:space-between;gap:8px;width:100%;font:inherit;text-align:left;background:none;border:0;border-radius:6px;padding:4px 8px 4px 16px;color:var(--fg);cursor:pointer}
.dom .n,.gh .n{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400}
.dom[aria-pressed="true"]{background:var(--soft);font-weight:700;box-shadow:inset 3px 0 0 var(--gc)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.filters input[type=search]{flex:1 1 220px;min-width:0}
input,select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;max-width:100%}
.meta-row{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
.link{font:inherit;background:none;border:0;color:var(--link);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
/* requirement rows */
details.req{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--gc);border-radius:8px;margin-bottom:8px}
details.req>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 12px}
details.req>summary::-webkit-details-marker{display:none}
.rid{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--gc);padding-top:1px}
.rtitle{font-weight:700}.rsnip{color:var(--muted);font-size:13px;margin-top:2px}
details.req[open] .rsnip{display:none}
.badges{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pill{font-family:var(--mono);font-size:11px;padding:1px 8px;border-radius:99px;white-space:nowrap;display:inline-block}
.Must{background:var(--must-bg);color:var(--must)}.Should{background:var(--should-bg);color:var(--should)}.Could{background:var(--could-bg);color:var(--could)}
.ph{border:1px solid var(--line);color:var(--fg);background:var(--soft)}
.s-ok{background:var(--could-bg);color:var(--could)}.s-warn{background:var(--should-bg);color:var(--should)}.s-bad{background:var(--must-bg);color:var(--must)}.s-info{background:var(--info-bg);color:var(--info)}.s-mute{background:var(--soft);color:var(--muted)}
.body{padding:0 12px 12px 100px;display:grid;gap:10px}
@media(max-width:640px){.body{padding-left:12px}details.req>summary{grid-template-columns:minmax(0,1fr)}.badges{justify-content:flex-start}}
.body h4,.cd h4{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 2px;font-weight:500}
.body ol{margin:0;padding-left:20px}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 16px;font-size:13px}
.chip{display:inline-block;border:1px solid var(--line);border-radius:5px;padding:0 6px;margin:0 4px 3px 0;font-size:12px;background:none;color:var(--fg);font-family:var(--mono);cursor:pointer}
.chip:hover{border-color:var(--gc,var(--brand));color:var(--gc,var(--brand))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.cd{border-left:5px solid var(--gc);display:grid;gap:8px}
.cd .hd{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.cd .why{font-size:13px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:0 0 10px;flex-wrap:wrap}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:minmax(120px,250px) minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:13px}
.bar .track{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--line)}
.bar .track{height:20px;background:transparent;border:1px solid color-mix(in srgb,var(--gc) 35%,transparent)}
.bar .track i{display:flex;align-items:center;justify-content:center;height:100%;background:var(--gc);font-style:normal;font-family:var(--mono);font-size:10px;color:var(--bg);overflow:hidden}
.bar .track i.p2{background:color-mix(in srgb,var(--gc) 55%,var(--bg))}
.bar .track i.p3{background:color-mix(in srgb,var(--gc) 28%,var(--bg));color:var(--fg)}
.sw{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.bar .num{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
th,td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--soft)}
tr:last-child td{border-bottom:0}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}
.oi h3{font-size:17px}.oi p{margin:2px 0;font-size:13px}.k{color:var(--muted)}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px;align-items:start}
.ph-card{background:var(--surface);border:1px solid var(--line);border-top:8px solid var(--gc);border-radius:8px;padding:14px;display:grid;gap:10px;min-width:0}
.ph-card h4{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 3px;font-weight:500}.ph-card ul{margin:0;padding-left:18px}.ph-card li{margin-bottom:3px}
.big{font-family:var(--serif);font-size:44px;font-weight:800;line-height:1;color:var(--gc)}
.note{border-left:5px solid var(--gold);background:var(--soft);padding:10px 14px;border-radius:0 8px 8px 0;margin:0 0 16px}
.note b{font-weight:700}
.logo{display:block;height:58px;width:58px;background:#fff;border-radius:10px;padding:3px;object-fit:contain;flex:none;border:2px solid #efb83c}
.brandrow{display:flex;gap:12px;align-items:center;min-width:0}
.gantt{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.gt{display:grid;min-width:1040px}
.gt .h{font-family:var(--mono);font-size:10px;color:var(--muted);text-align:center;padding:4px 0;border-bottom:1px solid var(--line);background:var(--soft)}
.gt .l{padding:6px 10px;border-bottom:1px solid var(--line);font-size:12px;line-height:1.3;position:sticky;left:0;background:var(--surface);z-index:1;border-right:1px solid var(--line)}
.gt .l b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--gc)}
.gt .c{border-bottom:1px solid var(--line);border-left:1px solid color-mix(in srgb,var(--line) 50%,transparent);min-height:34px;position:relative}
.gt .bar1,.gt .bar2{position:absolute;left:0;right:0;height:9px;border-radius:2px}
.gt .bar1{top:7px;background:var(--gc)}
.gt .bar2{top:19px;background:color-mix(in srgb,var(--gc) 28%,var(--surface));border:1px solid var(--gc)}
.fixrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}

/* stack cost model */
.sc-calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;align-items:start;margin:0 0 18px}
@media(max-width:820px){.sc-calc{grid-template-columns:minmax(0,1fr)}}
.sc-p{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;border-top:5px solid var(--g7)}
.sc-p{min-width:0}.sc-p h3{color:var(--brand)}.sc-p table{table-layout:auto;min-width:0}.sc-p td:first-child{white-space:normal;overflow-wrap:anywhere}
.scf{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;align-items:center;margin:9px 0}
.scf small{grid-column:1/-1;color:var(--muted);font-size:11px}
.scf input,.scf select{font:inherit;font-size:13px;width:130px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);text-align:right}
.scf select{text-align:left;width:200px;max-width:100%}
.sc-big{font-family:var(--serif);font-weight:800;font-size:36px;line-height:1.05;color:var(--brand)}
.sc-big small{font-family:var(--font);font-size:13px;font-weight:500;color:var(--muted)}
.sc-bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--soft);margin:8px 0}.sc-bar i{display:block;height:100%}
.sc-p table{border-collapse:collapse;width:100%;font-size:13px}.sc-p th,.sc-p td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
.sc-p th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.sc-p .n{text-align:right;white-space:nowrap}
.sc-leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.sc-leg s{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;text-decoration:none}
.sctiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:0 0 14px}
.sctile{font:inherit;text-align:left;cursor:pointer;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--tc);border-radius:8px;padding:8px 10px}
.sctile b{display:block;font-family:var(--serif);font-size:28px;line-height:1;color:var(--tc)}.sctile span{font-size:12px;color:var(--muted)}
.sctile[aria-pressed="true"]{outline:2px solid var(--tc);outline-offset:1px}
.scline{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.scline b{white-space:nowrap}
.sc-free{border-left:3px solid var(--gold);padding-left:8px}

/* issues and rework */
.sev{font-family:var(--mono);font-size:11px;font-weight:700;padding:1px 9px;border-radius:99px;white-space:nowrap;display:inline-block}
.sev.Critical{background:var(--must-bg);color:var(--must)}.sev.High{background:var(--should-bg);color:var(--should)}.sev.Medium{background:var(--could-bg);color:var(--could)}
.iss{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--ic);border-radius:8px;margin:8px 0}
.iss>button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:4px 12px;align-items:center;width:100%;padding:10px 14px;cursor:pointer}
.iss>button:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.iss .ib{padding:2px 16px 14px;border-top:1px dashed var(--line);display:none}
.iss.open .ib{display:block}
.iss .it{font-weight:600;overflow-wrap:anywhere}
.iss .ip{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.iss dl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 14px;margin:10px 0 0}
@media(max-width:620px){.iss dl{grid-template-columns:minmax(0,1fr)}.iss>button{grid-template-columns:auto minmax(0,1fr)}.iss .ip{grid-column:1/-1}}
.iss dt{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.iss dd{margin:0;overflow-wrap:anywhere}
.myread{border-left:3px solid var(--gold);padding-left:9px;background:var(--soft);padding:6px 9px;border-radius:0 6px 6px 0}
.ph2{background:var(--surface);border:1px solid var(--line);border-top:7px solid var(--gc);border-radius:9px;padding:14px;margin:10px 0;min-width:0}
.ph2 h3{font-family:var(--serif);font-size:21px;color:var(--gc);margin:0 0 2px}
.ph2 .win{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:8px}
.ph2 ul{margin:4px 0 10px;padding-left:18px}.ph2 li{margin-bottom:3px}
.ph2 h4{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 2px}
.cmp td:first-child{font-weight:600}
</style>

<script>
const DATA={"registers": {"control": {"title": "Liguori Digital Ecosystem", "subtitle": "Business Requirements Specification", "version": "0.2 (draft for review)", "date": "2026-10-26", "status": "Draft", "prepared_by": "Six Jars Global (SJPL), programme management", "client": "Liguori Publications", "classification": "Confidential", "basis": "Amended Global Digital Platform BRD; 2026 Subscription Website RFP draft; Subscription Center Assessment; 23 October 2026 working session; AI Strategy document; stack review and Part 3 of the programme brief", "approach": "Vendor-neutral. Requirements state what the system must do and how it is tested, not which product delivers it. Open decisions carry a stated default so work is not blocked."}, "domains": [["IDN", "Identity and customer accounts", "Sign-up, sign-in, passkeys, social login, account recovery, linked accounts and customer roles."], ["DSH", "Customer dashboard", "Self-service account area for subscriptions, orders, donations, gifts and content library."], ["LOC", "Multilingual and localisation", "English and Spanish at launch, other locales by configuration, translation workflow."], ["CDL", "Content reading and delivery", "Reader, archive, search, offline, downloads, audio and video, sharing and notifications."], ["CAT", "Catalogue, pricing and offers", "Products, plans, prices, trials, discounts, bundles, currencies and offer eligibility."], ["SUB", "Subscriptions and entitlements", "Purchase, renewal, dunning, pause, cancel, plan change and the unified entitlement ledger."], ["GFT", "Gift subscriptions", "Buying a gift, scheduling, delivery of the gift code, redemption, expiry and refunds."], ["BLK", "Institutional and bulk orders", "Parish, school and bulk buyers: seats, copies, invoicing and administrator tools."], ["PAY", "Checkout and payments", "Payment methods, fraud and card-testing defence, refunds, chargebacks and PCI scope."], ["DON", "Donations and tribute gifts", "One-off, recurring and in-honour-of giving, donor records and stewardship hooks."], ["EDW", "Editorial workflow and authoring", "Ideas, assignments, contributors, authoring, review, issue planning and publishing."], ["DAM", "Media, rights and metadata", "Digital assets, renditions, rights, taxonomy and author pages."], ["MKT", "Marketing, campaigns and communications", "Campaign pages, consent, email, testing, QR links, social and stewardship messaging."], ["AIX", "AI-assisted features", "Phase 3: grounded answers, assisted translation and governance of AI output."], ["FUL", "Print fulfilment and mailing", "Mailing lists, cut-offs, address quality, holds, returns and replacement copies."], ["FIN", "Tax, accounting and receipts", "Sales tax, deferred revenue, ledger export, reconciliation and donor receipts."], ["BKO", "Back office, service and administration", "Agent console, role permissions, bulk operations, audit and configuration."], ["RPT", "Reporting and analytics", "Operational and management reports, definitions, refresh and exports."], ["MIG", "Data migration and cutover", "Moving customers, entitlements, gifts, donors, content and credentials from legacy systems."], ["HST", "Hosting, servers and databases", "Environments, regions, compute, databases, backups, recovery, network protection, capacity, monitoring and exit."], ["NFR", "Non-functional requirements", "Performance, availability, recovery, security, accessibility, privacy and compatibility."], ["INT", "Integration and operations ownership", "Integration register, ownership, failure handling, change control and vendor exit."]], "objectives": [["BO-01", "Replace the unsupported subscription site", "Retire the legacy site, whose source code Liguori never held, with a maintained and secure service.", "Legacy site and legacy login store decommissioned; no critical or high vulnerability open at launch."], ["BO-02", "Make buying and renewing easy", "Customers can find a product, subscribe or renew and pay without staff help.", "Checkout completion rate and renewal rate baselined in the first 90 days, then tracked against a target set by Liguori."], ["BO-03", "Protect paid content", "Only entitled readers open paid content; forwarded links do not bypass the paywall.", "100% of tested forwarded-link and expired-entitlement cases are denied; shared article links show a preview and a subscribe path."], ["BO-04", "Grow giving", "Donors give once, give monthly, or give in honour of someone, with correct receipts.", "Donation completion rate and recurring-donor share baselined, then tracked; 100% of eligible gifts receive a correct acknowledgment."], ["BO-05", "Enable gifting", "Readers buy subscriptions for other people and recipients redeem without friction.", "Gift redemption rate and time to redeem reported monthly."], ["BO-06", "Serve Spanish-speaking readers from day one", "Every customer journey, email and receipt works in English and Spanish.", "All launch journeys pass review in both languages; no hard-coded user-facing strings."], ["BO-07", "Reduce manual staff work", "Staff fix common issues without a developer and with a full audit trail.", "Named agent actions (address, refund, resend, entitlement fix) completed in the agent console without engineering help."], ["BO-08", "Own the data and avoid lock-in", "Liguori can export all its content, customer, entitlement, donor and audit data in documented formats.", "Full export producible and tested before launch and after each year of operation."], ["BO-09", "Be reliable and recoverable", "Reader and subscription services stay up and recover quickly.", "99.9% monthly availability; recovery within RPO 15 minutes and RTO 4 hours, proven by a restore test."], ["BO-10", "Keep print running", "The change does not disrupt issue production, proofing or mailing cut-offs.", "Zero missed mailing cut-offs attributable to the new platform during cutover and the first three issues."], ["BO-11", "Be compliant and trustworthy", "Card data, personal data, tax and receipts follow US rules.", "PCI DSS SAQ A scope confirmed; privacy requests answered within statutory time; tax and receipt reports reconcile to the ledger."], ["BO-12", "Run one publishing operation", "Structured content is the single source for web, PWA and print outputs.", "One authoritative content record per article; no silent replacement by Word, PDF or layout files."]], "stakeholders": [["Liguori Publications leadership", "Sets policy (for example content sharing), approves scope, budget and sign-off.", "Decision maker", "Accountable"], ["Wendy Barnes, Liguori", "Owns the subscription website and is the RFP contact; role to confirm.", "Business owner", "Responsible"], ["Chuck Healy, Liguori", "Operates THINK and fulfilment day to day; role to confirm.", "Operations lead", "Responsible"], ["Customer service team", "Resolves subscriber issues; uses the agent console.", "User", "Consulted"], ["Editorial team (editors, managing editor)", "Plans issues, edits, reviews and publishes.", "User", "Consulted"], ["Finance and accounting", "Month-end close, tax filings, donor receipts and reconciliation.", "User", "Consulted"], ["Development and mission staff", "Donor stewardship, tribute gifts and campaigns.", "User", "Consulted"], ["Six Jars Global (SJPL)", "Programme management, requirements, vendor selection and acceptance support.", "Programme manager", "Responsible"], ["Build vendor (to be selected)", "Designs, builds, migrates and, if contracted, runs integrations for 12 months.", "Supplier", "Responsible"], ["Subscription platform vendor (to be selected)", "Provides billing, entitlement and paywall capability, subject to OI-14.", "Supplier", "Consulted"], ["Payment service provider", "Processes cards and other payment methods.", "Supplier", "Informed"], ["Print and mail house", "Prints and mails issues from the mailing list.", "Supplier", "Consulted"], ["THINK / MPS (outgoing)", "Provides data export and transition support under the current contract (OI-09).", "Outgoing supplier", "Consulted"], ["Classic Informatics (current vendor)", "Holds knowledge of the current sites; transition of knowledge.", "Outgoing supplier", "Consulted"], ["Subscribers and readers", "Buy, renew, read, download and share.", "End user", "Informed"], ["Donors and honourees", "Give, and receive notice of a tribute gift.", "End user", "Informed"], ["Gift buyers and recipients", "Buy and redeem gift subscriptions.", "End user", "Informed"], ["Parish and school administrators", "Manage bulk subscriptions and seats.", "End user", "Consulted"], ["Contributors and authors", "Submit manuscripts and track status.", "End user", "Informed"]], "journeys": [["J-01", "Discover and subscribe", "Subscriber (new)", "Find product; compare print, digital and bundle; choose plan; create account or sign in; enter address and payment; see tax and total; confirm; receive confirmation and access.", "Active entitlement and, for print, a mailing record, created within one session."], ["J-02", "Buy a gift subscription", "Gift buyer", "Choose gift product and term; enter recipient name and email; pick start date; add message; pay; receive confirmation and gift code record.", "Gift paid and scheduled; recipient notified on the start date."], ["J-03", "Redeem a gift", "Gift recipient", "Open gift email; follow link; create account or sign in; confirm print address if needed; see start and end dates.", "Entitlement active for the fixed term with no payment from the recipient."], ["J-04", "Donate once", "Donor", "Choose amount and fund; enter details; pay; see confirmation; receive receipt.", "Donation recorded and receipt sent."], ["J-05", "Give monthly and manage the gift", "Donor", "Choose monthly giving; pay; later change amount, pause, update card or cancel from the dashboard.", "Recurring gift runs; failed payments retried; annual statement available."], ["J-06", "Donate in honour of someone", "Donor, honouree", "Choose tribute option; enter honouree name and contact; add message and send date; pay; honouree is notified without amount; donor receives receipt.", "Honouree notified; donor receipt names honouree if the donor chose it."], ["J-07", "Read, save, download and share content", "Subscriber, visitor", "Search or browse; open article; hit paywall or read; save, listen, download issue, share link; non-subscriber follows shared link and sees preview.", "Entitled reader accesses content on any device; shared links convert, not leak."], ["J-08", "Manage account, address, payment and renewal", "Subscriber", "Sign in; view subscriptions; change address with validation; update card; renew early; hold delivery; cancel.", "Change applied and confirmed; audit entry written."], ["J-09", "Institutional administrator manages seats or copies", "Institutional administrator", "Sign in; view allocation; invite or remove members; change copy count; download invoice.", "Seats and copies reflect the contract; usage visible in aggregate."], ["J-10", "Agent resolves a service case", "Customer service agent", "Find customer; see subscription and payment context; fix address, resend access, refund within limit; record reason.", "Issue closed with an audit trail and customer notice."], ["J-11", "Editor takes an article from idea to publication", "Editor, managing editor", "Capture idea; assign; draft in visual editor or import Word; review rounds; place in issue; check readiness; schedule; publish.", "Article published to chosen channels, languages and entitlements."], ["J-12", "Finance closes the month and issues receipts", "Finance", "Run reconciliation; review tax and refunds; export journal; produce donor statements.", "Ledger balances to payments; receipts and statements issued."], ["J-13", "Development staff stewards donors", "Development staff", "Find donor; see giving history; send thank-you; run campaign; record tribute handling.", "Donor record current; communications respect consent."], ["J-14", "Migrate and cut over", "Programme, vendor, Liguori", "Extract legacy data; load and reconcile; two dry runs; parallel run; cut over; monitor; decommission.", "All active customers keep access; counts reconcile; rollback not needed."], ["J-15", "Contributor submits a manuscript", "Contributor", "Create account; read terms; upload manuscript and files; track status.", "Submission received and visible to editors with status updates."], ["J-16", "Ask Liguorian (Phase 3)", "Subscriber", "Ask a question; receive an answer grounded in approved content with citations and scope limits.", "Answer cites sources; out-of-scope questions are declined."]], "open_items": [["OI-01", "Which accounting system does Liguori use, and who approves the chart of accounts?", "Platform exports a journal file in an agreed format to whichever ledger is chosen.", "Ledger export format cannot be finalised; month-end close design waits.", "Liguori finance", "Before build of FIN"], ["OI-02", "Which legal entity issues donor receipts, and is it a US tax-exempt charity?", "Receipts issued as a US charity with IRS-style acknowledgment wording; legal review before launch.", "Receipt text and annual statement cannot be approved.", "Liguori finance, with tax adviser", "Before build of DON and FIN"], ["OI-03", "In which states does Liguori owe sales tax, and which products are taxable where?", "Tax engine configured per state and product; print subscriptions, digital subscriptions, books and donations coded separately.", "Tax setup and registration cannot be completed.", "Liguori finance, with tax adviser", "Before launch readiness"], ["OI-04", "Which eight reports does Liguori read, in order of use?", "The eight reports listed in the RPT domain.", "Reporting scope may be wrong; dashboard design waits.", "Liguori leadership", "Before reporting build"], ["OI-05", "Can stored card tokens at the current processor move to the new one?", "Assume not; customers re-enter a card at next renewal; renewal reminders carry the prompt.", "If not, some renewals will lapse; communications plan needed.", "Programme, current and new processors", "Before migration plan freeze"], ["OI-06", "What are the recovery targets?", "RPO 15 minutes and RTO 4 hours (amended BRD NFR-007).", "Disaster recovery design waits.", "Liguori leadership", "Before NFR sign-off"], ["OI-07", "Who is the single named owner of every integration after go-live?", "Build vendor under a 12-month managed service; SJPL holds acceptance authority; one named Liguori approver.", "Integration failures have no accountable party.", "Liguori leadership, SJPL", "Before vendor contract"], ["OI-08", "Who is the print and mail house, and who runs address change updates?", "Mail house runs batch change-of-address before each print cycle; platform validates addresses at entry.", "Fulfilment file format and schedule cannot be fixed.", "Liguori operations", "Before FUL build"], ["OI-09", "What are the exit terms and export format for THINK and MPS?", "Full export of customers, subscriptions, entitlements, orders and history in documented CSV or JSON.", "Migration plan and date cannot be committed.", "Liguori leadership, legal", "Before migration plan freeze"], ["OI-10", "What are the exact rules for tribute gifts?", "Honouree notified by email; optional printed card is Phase 2; amount never disclosed to honouree; donor chooses whether receipt names honouree.", "Notification templates and receipt wording cannot be finalised.", "Development staff", "Before DON build"], ["OI-11", "What is the institutional pricing model and invoicing terms?", "Price per seat or per copy bands with invoice and payment on account; terms Net 30.", "Bulk checkout and invoicing design waits.", "Liguori leadership", "Before BLK build"], ["OI-12", "What rights apply to digitised back issues and archive articles?", "Archive published only where rights are recorded; unknown rights stay unpublished.", "Archive launch scope uncertain.", "Editorial, legal", "Before archive migration"], ["OI-13", "Is audited circulation (AAM or BPA) required?", "Not required; circulation counts reported but not audited.", "Fulfilment and reporting scope could grow.", "Liguori leadership", "Before RPT build"], ["OI-14", "Which subscription approach: a publisher subscription platform, or a billing engine plus custom entitlement?", "Decided by live demo of two shortlisted platforms against this BRS.", "Core platform architecture and vendor scope cannot be fixed.", "Liguori leadership, SJPL", "Before vendor contract"], ["OI-15", "How is the Managing Scrupulosity content migrated?", "Treated as a content migration item with its own owner and rights check.", "Content scope and rights may be incomplete.", "Editorial", "Before content migration"], ["OI-16", "When do native iOS and Android apps start, and how is app-store billing handled?", "Phase 3 of the build; PWA only in Phases 1 and 2; entitlement ledger designed to accept app-store receipts later.", "App scope, cost and store rules stay open.", "Liguori leadership", "Before Phase 3 planning"], ["OI-17", "Is the three-phase split accepted, in particular gifting, donations and institutional accounts in Phase 1, editorial workflow in Phase 2, and AI and native apps in Phase 3?", "Split as published in section 8 and the Build Phases sheet.", "Phase scope, vendor pricing and cutover plan stay provisional.", "Liguori leadership", "Before vendor briefing"], ["OI-18", "In whose name are the cloud, payment, search and content accounts opened, and who holds the top-level administrator access?", "Liguori owns every account; suppliers receive delegated access (HST-003).", "Vendor exit and data ownership cannot be proved.", "Liguori leadership", "Before contract"]], "assumptions": [["A-01", "Launch market is the United States; English and Spanish are live on day one."], ["A-02", "Other BRD markets (India, Philippines, Italy, Spain, Malaysia) are designed in through configuration and are not live at launch."], ["A-03", "The PWA is the only client in Phases 1 and 2; native apps are Phase 3."], ["A-04", "Liguori has no internal technology staff after go-live; operations are fully managed by suppliers."], ["A-05", "Subscriber volume is between 5,000 and 25,000 and the design must scale 5x without redesign."], ["A-06", "THINK/MPS can be replaced and will provide a data export (OI-09)."], ["A-07", "Card data is collected only by the payment service provider's hosted fields, keeping Liguori in PCI DSS SAQ A scope."], ["A-08", "Existing Liguori.org public pages are out of scope except for links to and from the new platform."], ["A-09", "Print production by the mail house continues on the existing monthly or issue cycle."], ["A-10", "Source content for back issues exists in a form that can be imported; gaps are logged, not blocked."], ["A-11", "Each open item (OI-01 to OI-18) is assumed at its default until a decision is recorded."], ["A-12", "Targets marked proposed are starting values to be baselined in the first 90 days."]], "constraints": [["C-01", "No vendor lock-in: all content, customer, entitlement, donor, analytics, configuration and audit data are exportable in documented formats (BR-010, NFR-015)."], ["C-02", "Card numbers must never be stored or processed on Liguori-controlled systems."], ["C-03", "Accessibility must meet WCAG 2.2 AA for core reader and staff journeys."], ["C-04", "Publication and theological decisions remain with accountable humans; AI output is never published without human approval (BR-006)."], ["C-05", "Issue planning, proofing, publisher approval, print-ready PDF production and mailing cut-offs must not be disrupted (BR-009)."], ["C-06", "No public comments, direct messaging or reader profiles in the first release (FR-055)."], ["C-07", "The system must not embed country, language, currency, tax, privacy or fulfilment rules in application code (BR-004)."], ["C-08", "Source code and configuration of all custom work are owned by Liguori and delivered in a repository Liguori controls."]], "dependencies": [["D-01", "Decisions OI-01 to OI-18 as scheduled in the open items register."], ["D-02", "THINK/MPS data export and transition support."], ["D-03", "Payment service provider onboarding and, if possible, token migration."], ["D-04", "Mail house file specification and schedule."], ["D-05", "Tax adviser confirmation of nexus states and product taxability."], ["D-06", "Editorial availability for usability testing (NFR-017) and Word import testing with real manuscripts."], ["D-07", "Rights review for archive content."], ["D-08", "Selection of build vendor and subscription platform approach (OI-14)."]], "out_of_scope": ["Public comments, direct messaging and reader-to-reader profiles (BRD FR-055).", "Native iOS and Android apps and app-store billing (Phase 3, OI-16).", "Markets other than the United States on launch day (configuration only).", "Redesign of the public Liguori.org marketing site beyond links and shared navigation.", "Physical printing and mailing operations (supplied by the mail house).", "Accounting software selection and configuration (OI-01).", "Audited circulation reporting unless OI-13 changes.", "Operation of a data warehouse beyond the eight priority reports until a need is proven."], "risks": [["R-01", "Card tokens cannot be migrated and renewals lapse.", "High", "OI-05 default: renewal prompts; communication plan; measure lapse rate."], ["R-02", "Too many vendors with no accountable owner for integrations.", "High", "OI-07: single named owner; integration register (INT domain)."], ["R-03", "Platform choice made on marketing claims, not Liguori rules.", "High", "OI-14: live demo scripted from this BRS."], ["R-04", "Tax or receipt errors create legal exposure.", "High", "OI-02, OI-03: adviser review before launch; reconciliation reports."], ["R-05", "Editorial users reject the authoring tool.", "Medium", "NFR-017 usability gate with representative users before acceptance."], ["R-06", "Legacy data is dirty or duplicated.", "Medium", "MIG domain: two dry runs, reconciliation counts, data quality sign-off."], ["R-07", "Forwarded links or shared accounts leak paid content.", "Medium", "CDL entitlement check on every request; sharing by article link with preview."], ["R-08", "Mailing cut-off missed during cutover.", "High", "MIG and FUL: cutover outside cut-off window; parallel run; rollback."], ["R-09", "Scope grows because the BRD is broader than commerce.", "Medium", "Phase tags; change control; Phase 2 and 3 items marked."]], "glossary": [["Entitlement", "The right of a person or organisation to open a piece of content or receive a print copy, derived from a subscription, gift, bundle or institutional contract."], ["Entitlement ledger", "The single record that reconciles every source of access: web purchase, gift, print, bundle, institutional, complimentary and (later) app store."], ["Paywall", "A rule that shows a preview and a subscribe path instead of full content when the reader lacks entitlement."], ["Dunning", "The sequence of retries and reminders sent when a recurring payment fails."], ["Deferred revenue", "Cash received for service not yet delivered, recognised over the subscription term."], ["Tribute gift", "A donation made in honour or memory of another person, who is notified without the amount."], ["Honouree", "The person in whose honour a tribute donation is made."], ["Gift code", "A one-time code or link that lets a recipient claim a gift subscription."], ["Institutional account", "A parish, school or other organisation holding seats or copies under one contract."], ["PWA", "Progressive Web App: a website that installs on a device, works offline for chosen content and sends notifications."], ["PCI DSS SAQ A", "The lightest card-security self-assessment, available when card data is handled only by the payment provider's hosted fields."], ["CASS", "USPS certification standard for address standardisation."], ["NCOA", "National Change of Address service that updates mailing addresses for people who moved."], ["Nexus", "A connection to a state that creates a duty to register for, collect and remit sales tax."], ["Deferred revenue schedule", "The month-by-month release of prepaid subscription revenue into earned revenue."], ["RPO", "Recovery point objective: the most recent data a restore may lose."], ["RTO", "Recovery time objective: how long recovery may take."], ["WCAG 2.2 AA", "Web Content Accessibility Guidelines version 2.2, conformance level AA."], ["CCPA / CPRA", "California privacy laws giving residents rights over their personal data."], ["CAN-SPAM", "US law setting rules for commercial email, including unsubscribe."], ["MoSCoW", "Priority scale: Must, Should, Could (Won't is recorded under out of scope)."], ["Phase 1 / Phase 2 / Phase 3", "Build phases: replace and secure (retire the legacy systems); publish and grow (editorial operating model and growth tools); extend and automate (AI, native apps, further markets)."], ["Structured content", "Articles stored as typed blocks and metadata, not as a flat document, so one source feeds web, PWA and print."], ["Readiness check", "A computed set of mandatory conditions an article or issue must meet before publication."], ["THINK / MPS / Highwire", "The current proprietary subscription management system and its supplier names."], ["Acumen", "Current internal customer and fulfilment system for print."], ["Idempotent", "Safe to repeat: receiving the same payment or webhook event twice does not create a duplicate record."], ["Passkey", "A phishing-resistant sign-in credential stored on the user's device."], ["BR / FR / NFR", "Business, functional and non-functional requirement identifiers from the amended BRD."]], "references": [["Amended Global Digital Platform BRD", "BR-001 to BR-012, FR-001 to FR-060, NFR-001 to NFR-018"], ["2026 Subscription Website RFP draft", "Subscription site objectives and constraints"], ["Liguori Subscription Center Assessment", "Technical assessment of the current subscription site"], ["Subscriptions Website Development, 23 October 2026", "Working session transcript"], ["Liguori Business Systems Map V2", "Current systems and integrations"], ["AI Strategy, Governance and Knowledge Architecture", "AI features and governance"], ["Content Publishing Review Notes", "Editorial gap analysis"], ["Programme brief, Parts 1 to 3", "Sequencing, greenfield architecture and operational gaps"], ["Stack review page", "Layout, market comparison and corrections to the first design"]], "signoff": [["Liguori Publications leadership", "Business approval of scope and priorities"], ["Business owner (subscriptions)", "Approval of customer and operations requirements"], ["Editorial lead", "Approval of editorial and content requirements"], ["Finance lead", "Approval of tax, accounting and receipt requirements"], ["Six Jars Global programme manager", "Confirmation requirements are complete and testable"]]}, "stack": [{"id": "TS-01", "layer": "Experience", "name": "Web and PWA framework", "role": "The code that draws every page a reader, donor or buyer sees, and lets the site install on a phone and work offline.", "pick": "Next.js (React, TypeScript)", "url": "https://nextjs.org", "alts": [{"name": "Remix", "url": "https://remix.run"}, {"name": "SvelteKit", "url": "https://svelte.dev"}], "why": "Largest hiring pool and ecosystem of the three, so a replacement supplier is easy to find. Server rendering gives fast first load and good search ranking for articles.", "config": "One codebase for public site, reader and dashboard. Server-rendered public pages; client-side reader. Language routing for English and Spanish.", "cost": "Free to use; cost is build effort.", "risk": "Framework upgrades need regular maintenance; mitigate with a managed support contract.", "covers": ["CDL", "DSH", "LOC", "NFR"], "phase": "Phase 1", "status": "Recommended", "conf": "[Likely]", "tier": "free", "free": "Open source. Nothing to subscribe to.", "fconf": "Certain"}, {"id": "TS-02", "layer": "Experience", "name": "Front-end hosting", "role": "The service that serves the website to browsers and rebuilds it when code changes.", "pick": "Vercel", "url": "https://vercel.com", "alts": [{"name": "AWS Amplify", "url": "https://aws.amazon.com/amplify/"}, {"name": "Netlify", "url": "https://www.netlify.com"}, {"name": "Cloudflare Pages", "url": "https://pages.cloudflare.com"}], "why": "Best fit for Next.js, with preview builds for each change and instant rollback. Keeps the front end separate from the data tier so each can be replaced alone.", "config": "Production, staging and preview projects. Liguori-owned team account. Custom domain with automatic certificates.", "cost": "Pro plan is per seat, with usage on top; confirm current price before budgeting.", "risk": "Vendor dependence for the front end. Mitigation: the app also runs on any Node host, and HST-024 requires the exit route to be shown.", "covers": ["HST", "NFR"], "phase": "Phase 1", "status": "Recommended", "conf": "[Likely]", "tier": "must", "free": "Hobby plan is \"for personal, non-commercial use\", so it is barred. Pro is $20 per seat per month with $20 of usage credit.", "fconf": "Certain"}, {"id": "TS-03", "layer": "Experience", "name": "Offline and install layer", "role": "The part that lets readers save issues and articles and open them without a connection.", "pick": "Service worker built with Workbox", "url": "https://developer.chrome.com/docs/workbox", "alts": [{"name": "Hand-written service worker", "url": "https://developer.mozilla.org/docs/Web/API/Service_Worker_API"}], "why": "Standard tooling for caching rules. Offline files must still respect access, so the cache stores only what the signed-in person is entitled to.", "config": "Cache the app shell in Phase 1. Offline articles and issues in Phase 2 (CDL-006, CDL-007).", "cost": "Free to use.", "risk": "iOS limits storage for web apps; test on real devices.", "covers": ["CDL", "NFR"], "phase": "Phase 2", "status": "Recommended", "conf": "[Likely]", "tier": "free", "free": "Open source library.", "fconf": "Certain"}, {"id": "TS-04", "layer": "Experience", "name": "Accessible component kit", "role": "Buttons, forms and dialogs that already work with keyboards and screen readers.", "pick": "Radix UI primitives with an automated accessibility test (axe)", "url": "https://www.radix-ui.com", "alts": [{"name": "React Aria", "url": "https://react-spectrum.adobe.com/react-aria/"}, {"name": "Headless UI", "url": "https://headlessui.com"}], "why": "WCAG 2.2 AA is a requirement. Starting from components built for accessibility is cheaper than repairing a custom set.", "config": "Liguori design tokens applied on top; automated checks in the release pipeline plus a manual audit before launch.", "cost": "Free to use.", "risk": "Automated tools catch only part of the issues; an expert audit is still needed.", "covers": ["NFR", "DSH"], "phase": "Phase 1", "status": "Recommended", "conf": "[Likely]", "tier": "free", "free": "Open source libraries.", "fconf": "Certain"}, {"id": "TS-05", "layer": "Experience", "name": "Language and translation tooling", "role": "Holds every piece of text in English and Spanish and routes it to translators.", "pick": "next-intl for the app; a translation management service for staff", "url": "https://next-intl.dev", "alts": [{"name": "Phrase", "url": "https://phrase.com"}, {"name": "Lokalise", "url": "https://lokalise.com"}, {"name": "Crowdin", "url": "https://crowdin.com"}], "why": "No text is hard-coded (LOC-003). A translation service gives translators context, memory and approval steps, so Spanish does not lag English.", "config": "Locale in the web address. Message files versioned with code. Translation service connected in Phase 2 for content.", "cost": "Per seat or per word, depending on service; get quotes.", "risk": "Machine translation quality for liturgical and scriptural text; keep human approval (LOC-006).", "covers": ["LOC"], "phase": "Phase 1", "status": "Recommended", "conf": "[Likely]", "tier": "quote", "free": "Translation management tools usually have a free or trial plan for small teams, but I did not verify any. Get quotes.", "fconf": "Guessing"}, {"id": "TS-06", "layer": "Application services", "name": "API layer", "role": "One controlled front door between the web app and every back-end service.", "pick": "GraphQL API (Apollo Server)", "url": "https://www.apollographql.com", "alts": [{"name": "REST with OpenAPI", "url": "https://www.openapis.org"}, {"name": "tRPC", "url": "https://trpc.io"}], "why": "The reader, dashboard and staff console need different slices of the same data. A single typed API reduces duplicated logic and is documented for future suppliers (INT-009).", "config": "Authenticated at the edge; entitlement checked on every content call; rate limits on sensitive actions.", "cost": "Free to use; hosted option available.", "risk": "Over-fetching and cost control need discipline; limit query depth.", "covers": ["INT", "CDL", "DSH"], "phase": "Phase 1", "status": "Recommended", "conf": "[Likely]", "tier": "free", "free": "Open source server. You pay for the compute it runs on (TS-07).", "fconf": "Likely"}, {"id": "TS-07", "layer": "Application services", "name": "Application compute", "role": "The servers that run Liguori's own logic: orders, gifts, entitlement, receipts.", "pick": "AWS Lambda (TypeScript) for requests; AWS Fargate containers for long jobs", "url": "https://aws.amazon.com/lambda/", "alts": [{"name": "Google Cloud Run", "url": "https://cloud.google.com/run"}, {"name": "Azure Functions", "url": "https://azure.microsoft.com/products/functions"}, {"name": "Containers on Fly.io", "url": "https://fly.io"}], "why": "No servers to patch, scales to the seasonal peaks in HST-017, and cost follows use. Liguori has no internal technology staff, so fewer machines to manage is the point.", "config": "Separate functions per service; reserved capacity for sign-in and checkout; Fargate for imports, exports and the mail-house file build.", "cost": "Pay per use; typically small at 5,000 to 25,000 subscribers. Verify against a load model.", "risk": "Cold starts and runtime limits; mitigate with provisioned concurrency on checkout.", "covers": ["HST", "NFR", "SUB", "GFT", "DON"], "phase": "Phase 1", "status": "Recommended", "conf": "[Likely]", "tier": "usage", "free": "AWS free allowances help during the build. Production is pay per use, and small at this scale.", "fconf": "Likely"}, {"id": "TS-08", "layer": "Application services", "name": "Entitlement service", "role": "Answers one question on every request: may this person open this item. The hinge between money and content.", "pick": "Built by the delivery vendor on the transactional database, cached in Redis", "url": "", "alts": [], "why": "No off-the-shelf product knows Liguori's mix of subscriptions, gifts, institutional seats and complimentary access. Making it a small owned service keeps the rule in one place.", "config": "Reads the entitlement ledger (SUB). Caches decisions for seconds, not minutes. Returns a reason with every denial for support.", "cost": "Build effort; small run cost.", "risk": "If wrong, either paid content leaks or paying readers are blocked. Test exhaustively (CDL-012 to CDL-014).", "covers": ["SUB", "CDL", "GFT", "BLK"], "phase": "Phase 1", "status": "Build", "conf": "[Certain]", "tier": "build", "free": "Code written by the delivery vendor. Cost is build effort, not a subscription.", "fconf": "Certain"}, {"id": "TS-09", "layer": "Application services", "name": "Events, queues and scheduled jobs", "role": "Carries things that should happen after a purchase or on a date: receipts, gift delivery, renewal notices, mail-house files.", "pick": "Amazon SQS, EventBridge and Step Functions", "url": "https://aws.amazon.com/eventbridge/", "alts": [{"name": "Inngest", "url": "https://www.inngest.com"}, {"name": "Temporal", "url": "https://temporal.io"}], "why": "A failed email or webhook must retry, not vanish. Queues and a replay log meet PAY-020 and INT failure-handling requirements.", "config": "Dead-letter queues with alerts; idempotent handlers so a retry never double-charges or double-mails.", "cost": "Pay per use, low at this scale.", "risk": "Silent failures; mitigate with alarms on queue age.", "covers": ["INT", "PAY", "FUL", "MKT"], "phase": "Phase 1", "status": "Recommended", "conf": "[Likely]", "tier": "usage", "free": "Pay per use. Low at this scale.", "fconf": "Likely"}, {"id": "TS-10", "layer": "Content", "name": "Content management system", "role": "Where editors write, review and publish articles, issues and pages as structured content.", "pick": "Sanity", "url": "https://www.sanity.io", "alts": [{"name": "Payload CMS", "url": "https://payloadcms.com"}, {"name": "Contentful", "url": "https://www.contentful.com"}, {"name": "Storyblok", "url": "https://www.storyblok.com"}], "why": "Structured content (not pages) is the single source for web, app and print (BO-12). Sanity's editor can be shaped to Liguori's workflow, and content exports cleanly.", "config": "Schemas for article, issue, column, author, scripture reference. Roles for editor, reviewer, publisher. Phase 1 publishes simply; full workflow in Phase 2.", "cost": "Free tier then per seat or usage; confirm tier for the editorial team size.", "risk": "Hosted vendor dependence. Mitigation: export of all content in open format tested before launch (HST-024). Payload is the self-hostable fallback.", "covers": ["EDW", "CDL", "DAM", "LOC"], "phase": "Phase 1", "status": "Decide by demo", "conf": "[Likely]", "tier": "catch", "free": "Free: 20 seats, 250K API requests a month, 100GB bandwidth, 2 public datasets. Editors fit. The request cap does not fit if readers call the API directly, so serve content through the CDN. The pricing page does not say whether Free allows commercial use; read the terms first. Growth is $15 per seat per month.", "fconf": "Certain"}, {"id": "TS-11", "layer": "Content", "name": "Search", "role": "Finds articles, issues and archive items as the reader types.", "pick": "Meilisearch Cloud (Typesense as alternative)", "url": "https://www.meilisearch.com", "alts": [{"name": "Typesense Cloud", "url": "https://typesense.org"}, {"name": "Algolia", "url": "https://www.algolia.com"}, {"name": "Elastic Cloud", "url": "https://www.elastic.co"}], "why": "Typo tolerant, fast, and cheap at Liguori's size. Index is rebuildable from the CMS, so no data is lost if the service changes.", "config": "Entitlement-aware: results show titles to all, bodies only to entitled readers. Spanish and English indexes. Semantic search added later.", "cost": "Entry plans from tens of dollars a month (vendor-reported; confirm).", "risk": "Weaker scripture-reference handling than a tuned engine; test with CDL-023 cases.", "covers": ["CDL", "NFR"], "phase": "Phase 1", "status": "Recommended", "conf": "[Likely]", "tier": "must", "free": "Cloud starts at $20 a month; a usage plan is $30 for 100K documents and 50K searches. Self-hosting is free but someone must run it.", "fconf": "Certain"}, {"id": "TS-12", "layer": "Content", "name": "Media renditions and library", "role": "Stores images, resizes them and holds rights notes, captions and credits.", "pick": "CMS asset store with Cloudinary for renditions", "url": "https://cloudinary.com", "alts": [{"name": "Imgix", "url": "https://imgix.com"}, {"name": "Sanity image pipeline", "url": "https://www.sanity.io/docs/image-urls"}, {"name": "Self-run image proxy", "url": "https://imgproxy.net"}], "why": "Resizing and focal-point cropping for web, app and print is a solved problem. The rights record is held in the CMS so it travels with the image.", "config": "Originals kept in object storage; renditions generated on request and cached at the edge.", "cost": "Credit-based; get a quote.", "risk": "Rights data must be exportable if the service changes.", "covers": ["DAM"], "phase": "Phase 1", "status": "Provisional", "conf": f": "Likely"}, {"id": "TS-15", "layer": "Customers and money", "name": "Customer identity", "role": "Sign-up, sign-in, passkeys, recovery and linked accounts.", "pick": "Clerk (Auth0 as alternative)", "url": "https://clerk.com", "alts": [{"name": "Auth0", "url": "https://auth0.com"}, {"name": "Amazon Cognito", "url": "https://aws.amazon.com/cognito/"}, {"name": "Stytch", "url": "https://stytch.com"}], "why": "A finished identity product handles passkeys, recovery and attacks better than anything Liguori could run. Self-hosted identity was ruled out because Liguori has no technical staff to maintain it.", "config": "One identity for subscriptions, gifts and donations. Import of legacy accounts with forced reset where hashes cannot be moved (MIG).", "cost": "Per monthly active user; get a quote for 25,000.", "risk": "Migration of old Magento credentials is the hard part, not the product.", "covers": ["IDN", "MIG"], "phase": "Phase 1", "status": "Decide by demo", "conf": "[Likely]", "tier": "catch", "free": "Hobby plan: 50,000 retained users, but a fixed 7-day session, forced Clerk branding, no MFA and no passkeys. Staff with finance access without MFA fails your own security requirements. Pro is $20 a month annual or $25 monthly and still includes 50,000 users.", "fconf": "Certain"}, {"id": "TS-16", "layer": "Customers and money", "name": "Payment provider", "role": "Takes cards and wallets, holds card data so Liguori does not, and runs recurring charges.", "pick": "Stripe", "url": "https://stripe.com", "alts": [{"name": "Adyen", "url": "https://www.adyen.com"}, {"name": "Braintree", "url": "https://www.braintreepayments.com"}, {"name": "Authorize.Net", "url": "https://www.authorize.net"}], "why": "Hosted card fields keep Liguori at PCI SAQ A. Strong card-testing defences answer the suspended gateway. Recurring and wallet support is mature.", "config": "Hosted payment fields; fraud rules on; webhooks into the event layer; separate test and live accounts owned by Liguori.", "cost": "Per-transaction fee; nonprofit pricing may be available, ask.", "risk": "Account holds or reviews; keep a second provider documented as a fallback.", "covers": ["PAY", "DON", "SUB", "FIN"], "phase": "Phase 1", "status": "Recommended", "conf": "[Likely]", "tier": "usage", "free": "No subscription. Per-transaction fee. Nonprofit pricing needs 80% of volume from tax-deductible donations, which subscription revenue will not meet.", "fconf": "Certain"}, {"id": "TS-17", "layer": "Customers and money", "name": "Subscription billing platform", "role": "Plans, renewals, failed-payment recovery and publisher-specific tools such as delivery and issues.", "pick": "Not chosen. Decide by live demo between a publisher platform (Pelcro) and a general billing platform (Recurly) with custom build", "url": "https://www.pelcro.com", "alts": [{"name": "Recurly", "url": "https://recurly.com"}, {"name": "Chargebee", "url": "https://www.chargebee.com"}, {"name": "Zuora", "url": "https://www.zuora.com"}, {"name": "Self-built on Lago", "url": "https://www.getlago.com"}], "why": "This is the one decision where the market is genuinely split. A publisher platform covers print and gifts but narrows control; a general platform needs more custom build. Open item OI-14.", "config": "Both candidates are scored on the same scripts: gifts, bulk seats, mid-term changes, migration of THINK data.", "cost": "Recurly Starter is $249 a month plus 0.9% above $40,000 of monthly billings; Pelcro vendor-reported $450 to $800 a month for 2,000 to 5,000 customers. Confirm both.", "risk": "Wrong choice is expensive to reverse. Mitigation: entitlement stays in Liguori's own service so billing is replaceable.", "covers": ["SUB", "GFT", "BLK", "CAT", "PAY"], "phase": "Phase 1", "status": "Open (OI-14)", "conf": "[Guessing]", "tier": "must", "free": "No free tier on either option. Recurly Starter $249 a month plus 0.9% above $40,000 monthly billings (earlier research). Pelcro $450 to $800 a month (vendor-reported). Neither verified today.", "fconf": "Likely"}, {"id": "TS-18", "layer": "Customers and money", "name": "Sales tax engine", "role": "Works out the correct sales tax per address and files the reports.", "pick": "Stripe Tax (Avalara as alternative)", "url": "https://stripe.com/tax", "alts": [{"name": "Avalara", "url": "https://www.avalara.com"}, {"name": "TaxJar", "url": "https://www.taxjar.com"}, {"name": "Vertex", "url": "https://www.vertexinc.com"}], "why": "Print and digital are taxed differently by state and change often. Not building this is the right call.", "config": "Product tax codes set in the catalogue; filing reports to finance.", "cost": "Stripe Tax from $90 a month or 0.5% (verify).", "risk": "Rules for digital and print differ by state; confirm with the tax adviser.", "covers": ["FIN", "CAT"], "phase": "Phase 1", "status": "Recommended", "conf": "[Likely]", "tier": "must", "free": "Paid from about $90 a month (earlier research, not re-verified).", "fconf": "Likely"}, {"id": "TS-19", "layer": "Customers and money", "name": "Address validation", "role": "Checks print addresses before an issue is mailed so copies are not returned.", "pick": "Smarty (Lob or Melissa as alternatives)", "url": "https://www.smarty.com", "alts": [{"name": "Lob", "url": "https://www.lob.com"}, {"name": "Melissa", "url": "https://www.melissa.com"}, {"name": "Google Address Validation", "url": "https://developers.google.com/maps/documentation/address-validation"}], "why": "Returned mail is a direct cost. Validation at the point of entry is cheaper than cleaning later.", "config": "Called at checkout and in staff edits; batch clean of migrated addresses.", "cost": "Per lookup, tiered.", "risk": "International coverage differs; check before Phase 3 markets.", "covers": ["FUL", "MIG"], "phase": "Phase 1", "status": "Recommended", "conf": "[Likely]", "tier": "usage", "free": "Not verified. Per lookup, tiered.", "fconf": "Guessing"}, {"id": "TS-20", "layer": "Customers and money", "name": "CRM and marketing email", "role": "Contact records for stewardship, campaigns, consent and newsletters.", "pick": "HubSpot (marketing email and CRM only)", "url": "https://www.hubspot.com", "alts": [{"name": "Salesforce Nonprofit", "url": "https://www.salesforce.com/nonprofit/"}, {"name": "Mailchimp", "url": "https://mailchimp.com"}, {"name": "Brevo", "url": "https://www.brevo.com"}], "why": "Used for communications, not as the customer system of record. The platform keeps the master record, avoiding a second source of truth.", "config": "One-way sync of consent and segments from the platform; unsubscribe flows back.", "cost": "Per contact tier; confirm nonprofit discount.", "risk": "Two copies of consent; one-way sync with reconciliation.", "covers": ["MKT", "DON"], "phase": "Phase 2", "status": "Recommended", "conf": "[Likely]", "tier": "quote", "free": "Not verified, including any nonprofit discount. Phase 2.", "fconf": "Guessing"}, {"id": "TS-21", "layer": "Customers and money", "name": "Transactional email", "role": "Sends receipts, gift codes, password resets and renewal notices that must arrive.", "pick": "Postmark", "url": "https://postmarkapp.com", "alts": [{"name": "Amazon SES", "url": "https://aws.amazon.com/ses/"}, {"name": "SendGrid", "url": "https://sendgrid.com"}, {"name": "Resend", "url": "https://resend.com"}], "why": "Kept apart from marketing email (MKT-006) so a bulk campaign cannot damage receipt delivery.", "config": "Separate sending domain; bounce and complaint handling into the event layer.", "cost": "Per thousand messages.", "risk": "Domain authentication must be set up correctly (SPF, DKIM, DMARC).", "covers": ["MKT", "FIN", "GFT"], "phase": "Phase 1", "status": "Recommended", "conf": "[Likely]", "tier": "must", "free": "Free plan is 100 emails a month with no overage, so it is unusable. Basic is $15 for 10,000 emails, then $1.80 per 1,000.", "fconf": "Certain"}, {"id": "TS-22", "layer": "Data and hosting", "name": "Primary database", "role": "The record of customers, orders, subscriptions, entitlements, donations and gifts. The one store that must never lose data.", "pick": "Amazon Aurora PostgreSQL (Serverless v2), multi-zone", "url": "https://aws.amazon.com/rds/aurora/", "alts": [{"name": "Google Cloud SQL for PostgreSQL", "url": "https://cloud.google.com/sql"}, {"name": "Neon", "url": "https://neon.tech"}, {"name": "Self-managed PostgreSQL", "url": "https://www.postgresql.org"}], "why": "PostgreSQL is open and portable, so exit is possible. Aurora gives multi-zone failover, continuous backup and point-in-time recovery out of the box (HST-007 to HST-009).", "config": "Writer plus a standby in another zone; encrypted; private network only; separate schemas for identity-linked, commerce and donations.", "cost": "Capacity-unit billing; budget a range after the load model.", "risk": "Vendor-specific features; stay on standard PostgreSQL to keep exit open.", "covers": ["HST", "NFR"], "phase": "Phase 1", "status": "Recommended", "conf": "[Likely]", "tier": "usage", "free": "No production free tier. A new AWS account gets a 6-month plan with $200 in credits, which is a trial. Multi-zone database cost starts on day one.", "fconf": "Likely"}, {"id": "TS-23", "layer": "Data and hosting", "name": "Reporting copy and warehouse", "role": "A copy of the data for reports so finance exports never slow checkout.", "pick": "Aurora read replica to start; a warehouse added only if needed", "url": "https://aws.amazon.com/rds/aurora/", "alts": [{"name": "Google BigQuery", "url": "https://cloud.google.com/bigquery"}, {"name": "Snowflake", "url": "https://www.snowflake.com"}, {"name": "Postgres replica plus dbt", "url": "https://www.getdbt.com"}], "why": "A warehouse is overkill at 25,000 subscribers. A replica meets HST-011 at the lowest cost and can be upgraded when reporting grows.", "config": "Read-only credentials; nightly marts for finance and circulation; event log for engagement.", "cost": "Replica cost is a fraction of the primary.", "risk": "Report logic scattered across tools; keep the KPI dictionary (RPT-001) as the single definition.", "covers": ["RPT", "HST"], "phase": "Phase 1", "status": "Recommended", "conf": "[Likely]", "tier": "usage", "free": "Billed as a second database instance.", "fconf": "Likely"}, {"id": "TS-24", "layer": "Data and hosting", "name": "Cache and sessions", "role": "Very fast short-term memory for sign-in sessions and entitlement answers.", "pick": "Amazon ElastiCache (Redis or Valkey)", "url": "https://aws.amazon.com/elasticache/", "alts": [{"name": "Upstash Redis", "url": "https://upstash.com"}, {"name": "Redis Cloud", "url": "https://redis.io/cloud/"}], "why": "Entitlement is checked on every request; the cache keeps that fast. It holds nothing that cannot be rebuilt.", "config": "Short lifetimes; flush on entitlement change; private network only.", "cost": "Small instance is enough at launch.", "risk": "Stale answers after a refund; flush on change events.", "covers": ["CDL", "HST"], "phase": "Phase 1", "status": "Recommended", "conf": "[Likely]", "tier": "usage", "free": "Small instance at launch.", "fconf": "Likely"}, {"id": "TS-25", "layer": "Data and hosting", "name": "Object storage", "role": "Durable storage for PDFs, images, audio, video, exports and backups.", "pick": "Amazon S3 with versioning", "url": "https://aws.amazon.com/s3/", "alts": [{"name": "Google Cloud Storage", "url": "https://cloud.google.com/storage"}, {"name": "Cloudflare R2", "url": "https://www.cloudflare.com/developer-platform/r2/"}, {"name": "Backblaze B2", "url": "https://www.backblaze.com/cloud-storage"}], "why": "Cheap, extremely durable and universal. Private by default with short-lived access links.", "config": "Versioning on; lifecycle rules; second-region copy; access only through the platform.", "cost": "Per gigabyte stored and transferred; low relative to the rest.", "risk": "Public-bucket mistakes; policy-as-code blocks them.", "covers": ["HST", "CDL", "DAM"], "phase": "Phase 1", "status": "Recommended", "conf": "[Certain]", "tier": "usage", "free": "Per gigabyte stored and transferred. Small next to the rest.", "fconf": "Likely"}, {"id": "TS-26", "layer": "Data and hosting", "name": "Content delivery network", "role": "Delivers pages and media from locations close to the reader.", "pick": "Amazon CloudFront (plus the front-end host's own edge)", "url": "https://aws.amazon.com/cloudfront/", "alts": [{"name": "Cloudflare", "url": "https://www.cloudflare.com"}, {"name": "Fastly", "url": "https://www.fastly.com"}, {"name": "Akamai", "url": "https://www.akamai.com"}], "why": "Needed for speed. The critical rule is that entitled content is never cached for anyone else (HST-013).", "config": "Cache keys include entitlement for private paths; public paths cached long.", "cost": "Per gigabyte out.", "risk": "Cache misconfiguration is the main leak risk; test with non-subscriber requests.", "covers": ["HST", "CDL", "NFR"], "phase": "Phase 1", "status": "Recommended", "conf": "[Likely]", "tier": "usage", "free": "Per gigabyte out.", "fconf": "Likely"}, {"id": "TS-27", "layer": "Data and hosting", "name": "Cloud account and network", "role": "The Liguori-owned accounts, private networks and permissions everything runs inside.", "pick": "AWS organisation owned by Liguori, multi-account (production, staging, development, security)", "url": "https://aws.amazon.com/organizations/", "alts": [{"name": "Google Cloud", "url": "https://cloud.google.com"}, {"name": "Microsoft Azure", "url": "https://azure.microsoft.com"}], "why": "Separate accounts per environment make HST-001 enforceable by design. Ownership by Liguori is the control that prevents a repeat of the lost-source-code situation.", "config": "Organisation-level guardrails; single sign-on for staff; root access held by Liguori with hardware keys.", "cost": "Accounts are free; spend is usage.", "risk": "Delegated access must be reviewed quarterly.", "covers": ["HST", "INT"], "phase": "Phase 1", "status": "Recommended", "conf": "[Likely]", "tier": "free", "free": "Accounts are free. Spend is the usage inside them.", "fconf": "Certain"}, {"id": "TS-28", "layer": "Security and reliability", "name": "Edge protection", "role": "Blocks bad traffic and card-testing attempts before they reach the checkout.", "pick": "AWS WAF and Shield Standard, with rate rules", "url": "https://aws.amazon.com/waf/", "alts": [{"name": "Cloudflare WAF", "url": "https://www.cloudflare.com/application-services/products/waf/"}, {"name": "Vercel Firewall", "url": "https://vercel.com/docs/security/vercel-firewall"}], "why": "The suspended gateway is the reason this exists. Rate limits on checkout and sign-in are the first defence.", "config": "Managed rule sets plus custom rules for checkout velocity; bot challenge on suspicious sessions.", "cost": "Per rule and per request.", "risk": "Over-blocking real donors; monitor false positives.", "covers": ["HST", "PAY", "NFR"], "phase": "Phase 1", "status": "Recommended", "conf": "[Likely]", "tier": "usage", "free": "Per rule and per request.", "fconf": "Likely"}, {"id": "TS-29", "layer": "Security and reliability", "name": "Secrets and keys", "role": "Stores passwords, API keys and encryption keys safely.", "pick": "AWS Secrets Manager and KMS", "url": "https://aws.amazon.com/secrets-manager/", "alts": [{"name": "HashiCorp Vault", "url": "https://www.vaultproject.io"}, {"name": "Doppler", "url": "https://www.doppler.com"}], "why": "Keeps secrets out of code (HST-016) with rotation and audit.", "config": "Per-environment keys; rotation schedule; access logged.", "cost": "Per secret per month.", "risk": "Key loss; recovery procedure documented.", "covers": ["HST", "NFR"], "phase": "Phase 1", "status": "Recommended", "conf": "[Certain]", "tier": "usage", "free": "Per secret and per key per month.", "fconf": "Likely"}, {"id": "TS-30", "layer": "Security and reliability", "name": "Backup and recovery", "role": "Keeps backups, copies them to a second region and proves they restore.", "pick": "AWS Backup with cross-region copy and locked vault", "url": "https://aws.amazon.com/backup/", "alts": [{"name": "Provider-native snapshots", "url": "https://aws.amazon.com/rds/features/backup/"}, {"name": "Veeam", "url": "https://www.veeam.com"}], "why": "Meets HST-009, HST-010 and HST-021 with one policy tool, and a locked vault stops a compromised admin from deleting copies.", "config": "35-day point-in-time; daily snapshots; cross-region copy; quarterly restore test.", "cost": "Storage-based.", "risk": "An untested restore. The quarterly rehearsal is the control.", "covers": ["HST", "NFR"], "phase": "Phase 1", "status": "Recommended", "conf": "[Likely]", "tier": "usage", "free": "Storage-based, including the cross-region copy.", "fconf": "Likely"}, {"id": "TS-31", "layer": "Security and reliability", "name": "Infrastructure as code and release pipeline", "role": "Builds environments from written definitions and releases code through automatic checks.", "pick": "OpenTofu (or Terraform) with GitHub Actions", "url": "https://opentofu.org", "alts": [{"name": "Terraform", "url": "https://www.terraform.io"}, {"name": "Pulumi", "url": "https://www.pulumi.com"}, {"name": "GitLab CI", "url": "https://about.gitlab.com"}], "why": "Meets HST-004 and HST-005, and gives any successor supplier the full picture. The code repository sits in a Liguori-owned organisation.", "config": "Plan-and-approve for changes; automated tests and security scans block release; one-click rollback.", "cost": "Free to modest.", "risk": "Drift when someone changes things by hand; block console changes in production.", "covers": ["HST", "INT"], "phase": "Phase 1", "status": "Recommended", "conf": "[Likely]", "tier": "free", "free": "OpenTofu is open source. GitHub Actions has free minutes; a private team may need a paid plan.", "fconf": "Likely"}, {"id": "TS-32", "layer": "Security and reliability", "name": "Monitoring and incident alerts", "role": "Shows what is broken, tells the on-call person and keeps the record.", "pick": "Sentry for errors; CloudWatch for infrastructure; an uptime and status page service", "url": "https://sentry.io", "alts": [{"name": "Datadog", "url": "https://www.datadoghq.com"}, {"name": "Better Stack", "url": "https://betterstack.com"}, {"name": "Grafana Cloud", "url": "https://grafana.com"}], "why": "With no internal technology staff, detection must be designed. A public status page also reduces call volume during incidents (NFR-014).", "config": "Alerts on payment failure rate, sign-in errors, queue age and database health; on-call rota owned by the managed-service vendor.", "cost": "Per event or host; modest.", "risk": "Alert fatigue; tune thresholds in the first month.", "covers": ["HST", "NFR"], "phase": "Phase 1", "status": "Recommended", "conf": "[Likely]", "tier": "catch", "free": "Sentry free: one user, 5,000 errors, 30-day lookback. A managed vendor team needs more than one login. Team is $26 to $29 a month with 50K errors. CloudWatch is usage-based.", "fconf": "Certain"}, {"id": "TS-33", "layer": "Operations and finance", "name": "Accounting ledger", "role": "The books: revenue, deferred revenue, donations and tax liabilities.", "pick": "Not chosen (OI-01). Platform produces a journal file for whichever ledger Liguori uses", "url": "", "alts": [{"name": "QuickBooks Online", "url": "https://quickbooks.intuit.com"}, {"name": "Sage Intacct", "url": "https://www.sage.com/en-us/sage-business-cloud/intacct/"}, {"name": "NetSuite", "url": "https://www.netsuite.com"}], "why": "Liguori already has accounting. The right design is a stable export, not a new ledger.", "config": "Daily journal export; reconciliation report to the payment provider payouts (FIN, RPT-009).", "cost": "Existing licence.", "risk": "Chart of accounts not agreed; export format waits (OI-01).", "covers": ["FIN", "RPT"], "phase": "Phase 1", "status": "Open (OI-01)", "conf": "[Gues
